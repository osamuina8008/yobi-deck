isionNote": "", "statement": "〔第１問〕（配点：２）\n暴行罪及び傷害罪に関する次のアからオまでの各記述を判例の立場に従って検討した場合、誤っているものの個数を後記１から５までの中から選びなさい。\nア．相手方の眼前に抜き身の日本刀を突き付けたとしても、その刃が同人に接触しない限り、暴行罪が成立することはない。\nイ．相手方の意思に反して、その耳元で楽器を大音量で鳴らし続けた場合には、人の身体に対して不法な攻撃を加えたものとして暴行罪が成立し得る。\nウ．ひそかに相手方に睡眠薬を摂取させ、２時間にわたり意識を失わせるとともに筋弛緩作用を伴う急性薬物中毒の症状を生じさせたとしても、覚醒後の健康状態に支障がない場合には、傷害罪が成立することはない。\nエ．性病を有する者が、性行為を行えば相手方に感染させる危険性があると認識しながら、情を秘して同人と性行為を行い、同人に性病を感染させたとしても、同人が性行為に同意している場合には、傷害罪が成立することはない。\nオ．相手方に暴行を加えて負傷させた者が、傷害結果が発生することについて認識を欠いている場合には、傷害罪が成立することはない。\n１．１個\n２．２個\n３．３個\n４．４個\n５．５個", "source": "https://www.moj.go.jp/content/001399906.pdf", "answerSource": "https://www.moj.go.jp/content/001400884.pdf"}, {"id": "R5-keiho-2", "year": "R5", "yearLabel": "令和5年", "subject": "刑法", "qno": 2, "haiten": 3, "type": "multi", "options": 5, "answer": [1, 5], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第２問〕（配点：３）\n次の【判旨】に関する後記１から５までの各【記述】のうち、誤っているものを２個選びなさい。\n【判旨】 共謀共同正犯が成立するには、二人以上の者が、特定の犯罪を行うため、共同意思の下に一体となって互いに他人の行為を利用し、各自の意思を実行に移すことを内容とする謀議をなし、よって犯罪を実行した事実が認められなければならない。したがって、このような関係において共謀に参加した事実が認められる以上、直接実行行為に関与しない者でも、他人の行為をいわば自己の手段として犯罪を行ったという意味において、その間刑責の成立に差異を生ずると解すべき理由はない。さればこの関係において実行行為に直接関与したかどうか、その分担又は役割のいかんは、共犯の刑責自体の成立を左右するものではないと解する。\n【記述】\n１．【判旨】を前提にすると、殺意を有する者と傷害の故意にとどまる者との間で共謀共同正犯が成立する余地はない。\n２．【判旨】は、共同正犯の成立には、実行行為の一部を分担することは必要ないとの立場に立っている。\n３．【判旨】は、共謀共同正犯の成立には、単に関与者の内心における意思の合致があるだけでは十分でなく、客観的な謀議行為が必要であるとする考えと矛盾しない。\n４．【判旨】に対しては、共同正犯を教唆及び幇助と区別することが困難になるとの批判がある。\n５．【判旨】を前提にすると、共謀共同正犯の成立には、実行行為を行わない者が実行行為者に対して指揮命令をすることが必要である。", "source": "https://www.moj.go.jp/content/001399906.pdf", "answerSource": "https://www.moj.go.jp/content/001400884.pdf"}, {"id": "R5-keiho-3", "year": "R5", "yearLabel": "令和5年", "subject": "刑法", "qno": 3, "haiten": 2, "type": "choice", "options": 5, "answer": [3], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第３問〕（配点：２）\n学生Ａ及びＢは、次の【事例】における甲の罪責について、後記【会話】のとおり議論している。\n【会話】中の①から⑤までの（ ）内から適切な語句を選んだ場合、正しいものの組合せは、後記 １から５までのうちどれか。\n【事例】 甲は、Ｘ県から代金１億円で請け負った土木工事を完成させ、同工事で生じた汚泥５トンを搬出して適法に処理した。上記工事に関する請負契約では、甲が工事で生じた汚泥を全て搬出することが義務付けられていたが、請負代金はその搬出量にかかわらず定額とされ、汚泥の処理方法についての定めもなかった。もっとも、上記契約締結の際、Ｘ県が汚泥搬出量は５０トンを下らないと予測していたため、甲は、実際の搬出量を報告すれば、Ｘ県が行う工事完成検査の際に不法投棄を疑われ、その調査のために請負代金の支払が延期されると懸念し、Ｘ県に対し、汚泥５ ０トンを搬出して適法に処理したと虚偽の報告をし、Ｘ県職員をその旨誤信させ、請負代金１億円の支払を受けた。なお、甲が虚偽の報告をしなければ、Ｘ県が不法投棄について調査を行い、請負代金の支払時期が遅れたことは確実であった。\n【会話】 学生Ａ．詐欺罪の成否を問題とした場合、財産上の損害をどう考えますか。学生Ｂ．詐欺罪における財産上の損害の有無は、①（\n  ａ．財物の占有・支配の喪失それ自体によって・\n  ｂ．被害者の取引目的達成の有無も考慮して）判断すべきです。本事例では、請負契約の目的である工事が完成し、かつ、その請負代金は定額なので、Ｘ県に財産上の損害はないと考えます。学生Ａ．Ｂさんのように、財産上の損害を実質的に把握するとしても、本事例では、②（\n  ｃ．Ｘ 県の代金支払時期を早めた・\n  ｄ．Ｘ県の代金減額請求権を侵害した）という点で、財産上の損害を認め得ると思います。学生Ｂ．Ａさんの見解では、③（\n  ｅ．一日でも支払時期を早めれば詐欺罪が成立する・\n  ｆ．未成年であることを秘して成人向け雑誌を購入した者にまで詐欺罪が成立する）ことになりかねず、妥当でないと考えます。学生Ａ．いや、私は、判例と同様に、④（\n  ｇ．全体財産の減少が認められる・\n  ｈ．社会通念上別個の支払に当たるといい得る程度の期間、支払時期を早めた）場合に限って財産上の損害を認めますので、その批判は当たりません。ところで、Ｂさんは、本事例において、詐欺未遂罪の成立も否定しますか。学生Ｂ．甲の虚偽報告の有無にかかわらずＸ県は代金を支払わざるを得ませんので、そもそも、 ⑤（\n  ｉ．欺罔行為がない・\n  ｊ．財物の交付行為がない）と考えます。したがって、詐欺未遂罪も成立しません。\n１．①ａ ③ｅ ⑤ｉ\n２．①ｂ ②ｃ ④ｇ\n３．①ｂ ④ｈ ⑤ｉ\n４．②ｃ ③ｆ ④ｇ\n５．②ｄ ③ｅ ⑤ｊ", "source": "https://www.moj.go.jp/content/001399906.pdf", "answerSource": "https://www.moj.go.jp/content/001400884.pdf"}, {"id": "R5-keiho-4", "year": "R5", "yearLabel": "令和5年", "subject": "刑法", "qno": 4, "haiten": 2, "type": "choice", "options": 5, "answer": [2], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第４問〕（配点：２）\n強盗の罪に関する次の１から５までの各記述を判例の立場に従って検討した場合、誤っているものはどれか。\n１．甲は、違法な麻薬の購入資金としてＡから預かった金銭の返還を免れるために、殺意をもって、Ａを殺害し、その返還を免れた。この場合、甲に強盗殺人罪が成立する。\n２．甲は、強盗目的でＡ宅に侵入し、殺意をもって、Ａを殺害して金品を奪うとともに、Ａの傍らで熟睡していた幼児Ｂも、殺意をもって、殺害した。この場合、Ａの殺害についてのみ、甲に強盗殺人罪が成立する。\n３．甲は、タクシーに乗車して目的地に到着した後、運賃を請求された際、運賃の支払を免れるために、タクシー運転手Ａにナイフを突き付けた上、「殺すぞ。」と言って脅し、Ａが恐怖で動けないうちに逃走し、その支払を免れた。この場合、甲に強盗罪が成立する。\n４．甲は、財物奪取目的でＡに包丁を突き付けて「金を出さなければ殺す。」と言って脅したところ、Ａに包丁をつかまれたため、Ａが負傷することを分かりながら包丁を引き、Ａは両手を負傷した。この場合、甲に強盗傷人罪が成立する。\n５．甲は、財物奪取目的でＡを脅迫してその反抗を抑圧し、その際、Ａが気付かないうちに、Ａ が持つかばんから財布を抜き取った。この場合、甲に強盗罪が成立する。", "source": "https://www.moj.go.jp/content/001399906.pdf", "answerSource": "https://www.moj.go.jp/content/001400884.pdf"}, {"id": "R5-keiho-5", "year": "R5", "yearLabel": "令和5年", "subject": "刑法", "qno": 5, "haiten": 2, "type": "choice", "options": 5, "answer": [3], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第５問〕（配点：２）\n緊急避難に関する次のアからオまでの各記述を判例の立場に従って検討した場合、正しいものの組合せは、後記１から５までのうちどれか。\nア．緊急避難は、自己又は他人の生命、身体、自由又は財産という個人的法益に対する現在の危難を避けるためにした行為に成立するものであるから、国家的法益に対する危難を避けるためにした行為に緊急避難が成立することはない。\nイ．避難行為により避けようとした害の程度が生じた害の程度を上回る場合だけでなく、両者が同程度の場合にも、緊急避難は成立し得る。\nウ．緊急避難における現在の危難は、危難が現に存在している場合のみならず、間近に押し迫っている場合も含む。\nエ．過剰避難が成立する場合、情状によって、その刑を減軽することはできるが免除することはできない。\nオ．緊急避難におけるやむを得ずにした行為とは、正当防衛におけるのと同様に、手段として必要最小限度のものであること、すなわち相当性を有するものであれば足りる。\n１．アエ\n２．アオ\n３．イウ\n４．イエ\n５．ウオ", "source": "https://www.moj.go.jp/content/001399906.pdf", "answerSource": "https://www.moj.go.jp/content/001400884.pdf"}, {"id": "R5-keiho-6", "year": "R5", "yearLabel": "令和5年", "subject": "刑法", "qno": 6, "haiten": 3, "type": "multi", "options": 5, "answer": [3, 4], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第６問〕（配点：３）\n放火の罪に関する次の１から５までの各記述を判例の立場に従って検討した場合、正しいものを ２個選びなさい。\n１．人が居住する木造建物Ａと人が居住していない木造建物Ｂは、木造の渡り廊下で接合され、渡り廊下を通じて人の行き来のある構造となっていた。甲は、これらの事実を認識した上で、その当時誰もいなかった建物Ｂに放火して建物Ｂを焼損した。この場合、建物Ａに延焼しなければ、甲に現住建造物等放火既遂罪が成立することはない。\n２．甲は、Ｖがその家族と共に居住する木造家屋に放火してこれを焼損した。この場合、Ｖとその家族が１泊２日の旅行中で不在であり、甲がそのことを認識して放火したのであれば、甲に現住建造物等放火既遂罪が成立することはない。\n３．甲は、妻と二人で居住する木造家屋を燃やそうと考え、壁に掛けられたカレンダーに火をつけた。この場合、上記カレンダーが焼損した時点で、これに気付いた妻に火を消し止められ、他に燃え移らなかったのであれば、甲に現住建造物等放火既遂罪が成立することはない。\n４．甲は、火災保険金を詐取する目的で、自己が単独で居住し、かつ、誰も現在しない木造家屋に放火してこれを焼損した。この場合、刑法第１０８条の「現に人が住居に使用し又は現に人がいる」の「人」に犯人は含まれないから、甲に現住建造物等放火既遂罪が成立することはない。\n５．甲は、Ｖが居住する木造家屋の押し入れの床にガソリンをまいて火をつけたところ、同押し入れの床板が独立して燃焼するに至ったが、他に燃え移る前に消し止められた。この場合、上記家屋の効用を失うに至っていなければ、甲に現住建造物等放火既遂罪が成立することはない。", "source": "https://www.moj.go.jp/content/001399906.pdf", "answerSource": "https://www.moj.go.jp/content/001400884.pdf"}, {"id": "R5-keiho-7", "year": "R5", "yearLabel": "令和5年", "subject": "刑法", "qno": 7, "haiten": 2, "type": "choice", "options": 5, "answer": [5], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第７問〕（配点：２）\n共犯の要素従属性に関して、学生Ａ及びＢが次の【会話】のとおり議論している。\n【会話】中の ①から⑥までの（ ）内に後記【語句群】から適切な語句を入れた場合、正しいものの組合せは、後記１から５までのうちどれか。なお、①から⑥までの（ ）内にはそれぞれ異なる語句が入る。\n【会話】 学生Ａ．（①）ことからも、共犯を処罰するためには、正犯が（②）を備える必要があると考えます。学生Ｂ．Ａさんの見解によれば、甲が乙に指示して構成要件に該当する行為を実行させたが、（③）において、甲に責任を問うことができなくなり、不当ではありませんか。学生Ａ．その場合、甲に（④）を幅広く認めることで妥当な結論を得られます。学生Ｂ．でも、乙が刑事未成年者ながら是非弁別能力があり、その意思が抑圧されていない場合にまで（④）を認めることは無理がありますね。他方で、適法な行為を援助する行為を処罰の対象とするのは妥当ではありません。私は、（⑤）べきと考えるので、共犯を処罰するためには、正犯が（⑥）を備えることが必要であり、それで足りることになります。\n【語句群】\n  ａ．違法は連帯的に作用するが、責任は個別的に作用する\n  ｂ．教唆犯については刑法第６１条が「犯罪」という文言を使っている\n  ｃ．違法性阻却事由については、行為者ごとの違法の相対性も認められる\n  ｄ．構成要件該当性\n  ｅ．構成要件該当性及び違法性\n  ｆ．構成要件該当性、違法性及び有責性\n  ｇ．乙の行為に違法性阻却事由が認められる事案\n  ｈ．乙の行為に責任阻却事由が認められる事案\n  ｉ．間接正犯\n  ｊ．幇助犯\n１．①ａ ③ｇ ⑤ｃ\n２．①ｂ ③ｈ ⑤ｃ\n３．①ｃ ④ｉ ⑤ａ\n４．②ｄ ④ｊ ⑥ｆ\n５．②ｆ ④ｉ ⑥ｅ", "source": "https://www.moj.go.jp/content/001399906.pdf", "answerSource": "https://www.moj.go.jp/content/001400884.pdf"}, {"id": "R5-keiho-8", "year": "R5", "yearLabel": "令和5年", "subject": "刑法", "qno": 8, "haiten": 2, "type": "choice", "options": 5, "answer": [3], "figure": false, "revision": true, "revisionNote": "拘禁刑の創設（令和7年6月1日施行）：『懲役・禁錮』は『拘禁刑』に一本化。用語や量刑の記述が現行と異なる場合があります。", "statement": "〔第８問〕（配点：２）\n賭博の罪に関する次の１から５までの各記述を判例の立場に従って検討した場合、正しいものはどれか。\n１．賭博罪が成立するためには、賭博行為が開始されるだけでなく、勝敗が決し、金品の授受がなされなければならない。\n２．あるスポーツの勝敗に関し、あらかじめ勝敗の結果を知った上、その結果を知らない者との間で金銭を賭けて利益を得た場合、当事者全員に賭博罪が成立する。\n３．一般多数人をして、スポーツの勝敗に関し、賭博をさせて利益を得るため、賭博の主催者が、参加者を特定の場所に集めることなく、事務所の固定電話を利用して参加者と連絡を取り合って賭博をさせた場合であっても、賭博場開張図利罪が成立する。\n４．それまで賭博行為をしたことがなかった甲が、長期間営業を継続する意思で多額の資金を投下して多数の賭博遊技機を設置した遊技場の営業を開始し、来場した多数の遊技者と賭博行為をしたとしても、数日間営業を行ったにすぎない場合には、甲に常習賭博罪が成立することはない。\n５．賭博常習者の賭博行為を常習性のない者が幇助した場合、常習性のない者には常習賭博罪の幇助犯が成立する。（参照条文）刑法第１８５条賭博をした者は、５０万円以下の罰金又は科料に処する。ただし、一時の娯楽に供とする物を賭けたにとどまるときは、この限りでない。か第１８６条常習として賭博をした者は、３年以下の懲役に処する。 ２賭博場を開張し、又は博徒を結合して利益を図った者は、３月以上５年以下の懲役に処する。", "source": "https://www.moj.go.jp/content/001399906.pdf", "answerSource": "https://www.moj.go.jp/content/001400884.pdf"}, {"id": "R5-keiho-9", "year": "R5", "yearLabel": "令和5年", "subject": "刑法", "qno": 9, "haiten": 2, "type": "choice", "options": 5, "answer": [2], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第９問〕（配点：２）\n学生Ａ及びＢは、次の【事例】における甲の罪責について、後記【会話】のとおり議論している。\n【会話】中の①から⑤までの（ ）内に後記【語句群】から適切な語句を入れた場合、正しいものの組合せは、後記１から５までのうちどれか。なお、①から⑤までの（ ）内にはそれぞれ異なる語句が入る。\n【事例】 甲は、殺意をもって、Ｘの腕の静脈内に蒸留水と空気を注射したが、当該空気量が疾病のない健常人に対する致死量未満であったためＸは死ななかった。また、甲は、当該空気量が上記致死量未満とは知らなかった。なお、当該空気量であっても被注射者の身体的条件等によっては死亡する危険はあった。\n【会話】 学生Ａ．未遂犯と不能犯の区別に関してはいろいろな考え方がありますが、行為の時点において一般人が認識し得た事情と行為者が特に知っていた事情を基礎とし、一般人が結果発生の危険を感じる場合には可罰的未遂を肯定する考え方に立ち、本事例では一般人が結果発生の危険を感じるとすれば、甲に殺人未遂罪が（①）ことになりますね。学生Ｂ．この考え方に対しては、（②）ことになるという批判がありますね。では、結果発生の危険性を事後的客観的に判断する考え方に立った場合、甲の罪責をどう考えますか。学生Ａ．（③）という考え方によれば、身体的条件等によっては死亡の危険があったので、甲に殺人未遂罪が成立します。一方で、結果発生の危険性を事後的客観的に判断する考え方を徹底すれば、（④）ことになりませんか。学生Ｂ．そうとは限りませんよ。結果が発生しなかった原因究明と同時に、いかなる事情があれば結果発生があり得たかを明らかにし、（⑤）可能性を判断すれば妥当な結論を導けます。\n【語句群】\n  ａ．成立する\n  ｂ．成立しない\n  ｃ．迷信犯に未遂犯を認める\n  ｄ．印象で未遂犯処罰を決める\n  ｅ．行為者の認識内容が客観的真実に合致するか否かによって区別する\n  ｆ．結果発生の絶対的不能・相対的不能によって区別する\n  ｇ．行為者の誤信が相当と認められる\n  ｈ．結果発生をもたらす仮定的事実が存在し得た\n  ｉ．結果不発生の原因を解明できた場合、すべて不能犯となる\n１．①ａ ②ｃ ③ｅ ④ｇ ⑤ｈ\n２．①ａ ②ｄ ③ｆ ④ｉ ⑤ｈ\n３．①ａ ②ｅ ③ｆ ④ｃ ⑤ｇ\n４．①ｂ ②ｄ ③ｅ ④ｉ ⑤ｇ\n５．①ｂ ②ｉ ③ｆ ④ｃ ⑤ｇ", "source": "https://www.moj.go.jp/content/001399906.pdf", "answerSource": "https://www.moj.go.jp/content/001400884.pdf"}, {"id": "R5-keiho-10", "year": "R5", "yearLabel": "令和5年", "subject": "刑法", "qno": 10, "haiten": 2, "type": "choice", "options": 5, "answer": [5], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第10問〕（配点：２）\n次の１から５までの各事例における甲の罪責について判例の立場に従って検討した場合、甲に窃盗罪が成立しないものはどれか。\n１．甲は、Ｖ宅内において、Ｖが所在を見失っていたＶ所有の指輪を発見し、これを自己のものにしようと考えて無断で持ち去った。\n２．甲は、Ｖが海中に取り落としたＶ所有の金塊について、Ｖからおおよその落下場所を教えてもらった上で回収を依頼され、Ｖの眼前で同所に潜り、同金塊を同所付近で発見したものの、これを自己のものにしようと考えて無断で持ち去った。\n３．甲は、看守者のいない仏堂に所有者Ｖが据え置いてまつっていた仏像を、自己のものにしようと考えて無断で持ち去った。\n４．甲は、Ⅴが乙から窃取した乙所有の腕時計を、これが盗品であることを知りながら自己のものにしようと考えて、Ⅴ宅に忍び込んで無断で持ち去った。\n５．甲は、満員電車内において、乗客Ｖが網棚にかばんを置き忘れたままＡ駅で下車したのを目撃し、Ｂ駅で下車する際、同かばんを自己のものにしようと考えて無断で持ち去った。", "source": "https://www.moj.go.jp/content/001399906.pdf", "answerSource": "https://www.moj.go.jp/content/001400884.pdf"}, {"id": "R5-keiho-11", "year": "R5", "yearLabel": "令和5年", "subject": "刑法", "qno": 11, "haiten": 2, "type": "choice", "options": 5, "answer": [4], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第11問〕（配点：２）\n次のアからオまでの各記述を判例の立場に従って検討した場合、正しいものの組合せは、後記１から５までのうちどれか。\nア．甲は、Ａが居住するＡ所有の家屋に放火し、同家屋を全焼させた上、同家屋に隣接するＢが居住するＢ所有の家屋にも火を燃え移らせて同家屋を全焼させた。この場合、甲には２個の現住建造物等放火罪が成立し、これらは観念的競合となる。\nイ．甲は、行使の目的で１万円札を偽造し、Ａが経営する商店において、事情を知らないＡに対し、１万円の商品の購入を申し込み、その代金として偽造の１万円札をＡに手渡して同商品の交付を受けた。この場合、甲には通貨偽造罪、偽造通貨行使罪及び詐欺罪が成立し、これらは牽連犯となる。\nウ．暴力団員甲及び乙は、対立する暴力団員Ａ及びＢを襲撃して殺害することを共謀し、路上を連れ立って歩いていたＡ及びＢを待ち構えた上で、甲がＡを、乙がＢを、それぞれ殺害した。この場合、甲及び乙を共同正犯とする２個の殺人罪が成立し、これらは併合罪となる。\nエ．甲は、酒に酔った状態で、自動車を無免許で運転した。この場合、甲には酒酔い運転の罪と無免許運転の罪が成立し、これらは観念的競合となる。\nオ．甲は、恐喝目的でＡを監禁し、監禁のための暴行等により畏怖しているＡを更に脅迫して現金を喝取した。この場合、監禁罪と恐喝罪が成立し、これらは牽連犯となる。\n１．アイ\n２．アウ\n３．イオ\n４．ウエ\n５．エオ", "source": "https://www.moj.go.jp/content/001399906.pdf", "answerSource": "https://www.moj.go.jp/content/001400884.pdf"}, {"id": "R5-keiho-12", "year": "R5", "yearLabel": "令和5年", "subject": "刑法", "qno": 12, "haiten": 2, "type": "choice", "options": 5, "answer": [5], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第12問〕（配点：２）\n偽証罪に関する次の１から５までの各記述を判例の立場に従って検討した場合、正しいものはどれか。\n１．自己が被告人となっている窃盗被告事件につき、知人を教唆して偽証行為を行わせた場合、他人の行為を利用して自ら虚偽を述べたに等しく、被告人が自己の刑事事件につき虚偽を述べても罪にならないから、偽証罪の教唆犯は成立しない。\n２．証人が殊更記憶に反する陳述をした場合、その他の証拠からその陳述内容が真実と認められるのであれば、国の審判作用は害されないから、偽証罪は成立しない。\n３．共犯者が被告人となっている詐欺被告事件に証人として出廷し、証言拒絶権を行使せずに宣誓して自己の犯罪事実に関して虚偽の陳述をした場合、同証人には自己負罪拒否特権があるから、偽証罪は成立しない。\n４．証人がした虚偽の陳述が裁判の結果に影響しなかった場合、国の審判作用に対する具体的な危険が発生しなかったといえるから、偽証罪は成立しない。\n５．「宣誓の趣旨を理解することができない者」（刑事訴訟法第１５５条第１項）に誤って証人として宣誓させた上、その者が虚偽の陳述をした場合、偽証罪の「宣誓」は適法になされなければならないから、同罪は成立しない。（参照条文）刑事訴訟法第１５５条宣誓の趣旨を理解することができない者は、宣誓をさせないで、これを尋問しなければならない。 ２（略）", "source": "https://www.moj.go.jp/content/001399906.pdf", "answerSource": "https://www.moj.go.jp/content/001400884.pdf"}, {"id": "R5-keiho-13", "year": "R5", "yearLabel": "令和5年", "subject": "刑法", "qno": 13, "haiten": 4, "type": "series", "options": 2, "answer": [2, 2, 2, 1, 2], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第13問〕（配点：４）\n次の【事例】に関する後記アからオまでの各【記述】を判例の立場に従って検討し、正しい場合には１を、誤っている場合には２を選びなさい。\n【事例】 甲は、高齢女性Ａから同人名義のキャッシュカード（以下「カード」という。）を不正に入手するため、甲が警察官を装いＡに電話をかけ、これからＡ方を訪れる警察官の確認を受けながらカードを封筒に入れ、同封筒をＡ方において保管する必要があるとうそを言い、警察官に成り済ました乙（２５歳、男性）がＡ方を訪れ、隙を見て同封筒を別の封筒とすり替えて持ち去り、カードを丙に渡して甲に届けさせる計画（以下「本件計画」という。）を考え、乙に本件計画の実行を指示し、乙はこれを承諾した。某日午前９時頃、本件計画に基づき、甲がＡに電話をかけて上記うそを言い、乙は、同日午前９時１５分頃、Ａ方を訪ね、Ａにカードを封筒に入れるよう求めた。しかし、乙の態度を不審に思ったＡが、乙に身分証の提示を求めたので、乙は、逮捕を免れるとともに本件計画どおりにカードを手に入れるため、Ａを手拳で多数回殴り、恐怖で抵抗できないＡからカードを奪って持ち去った。同日午前９時２０分頃、乙は、甲に電話で、本件計画どおりカードを入手したと伝えた。同日午前９時３０分頃、甲は、丙に電話をかけ、本件計画の内容を初めて説明し、乙からカードを受け取って甲に届けるよう依頼し、丙はこれを承諾した。丙は、同日午前１１時頃、乙と合流し、カードを受け取って乙と別れ、自動車でＡ方から約５０キロメートル離れた甲方に向かったが、同日午後０時３０分頃、甲方付近で降車した際、制服警察官ＢからＡ方での事件とは関係なく職務質問を受けた。その際、丙は、Ｂを殴り、Ｂに全治２週間を要する打撲傷を負わせ、その隙に上記自動車で逃走し、同日午後１時頃、甲と合流して甲にカードを届けた。その後、丙の交際相手丁は、丙が上記一連の犯行を行い、警察から捜査されていることを認識しつつ、丙を丁の自宅にかくまった。\n【記述】\nア．乙がＡからカードを奪った行為は、窃盗罪の実行に着手した後、Ａに暴行を加えてこれを奪取したことになるから、乙に事後強盗既遂罪が成立する。\nイ．甲が乙のＡに対する暴行・脅迫を認識も予見もしていなかった場合、乙がＡからカードを奪取した行為について、甲に窃盗未遂罪の共同正犯が成立するにとどまる。\nウ．甲は、当初から丙にカードを運搬させる計画であり、その運搬は重要な役割であるから、丙には盗品等運搬罪ではなく窃盗罪の共同正犯が成立する。\nエ．丙がＢを殴って負傷させた行為には、公務執行妨害罪と傷害罪が成立し、これらは観念的競合となる。\nオ．丙のいずれの行為についても、証拠上、犯罪の嫌疑が不十分として不起訴となった場合、丁が丙をかくまった行為について犯人蔵匿罪は成立しない。 ［刑事訴訟法］", "source": "https://www.moj.go.jp/content/001399906.pdf", "answerSource": "https://www.moj.go.jp/content/001400884.pdf"}, {"id": "R5-keiso-14", "year": "R5", "yearLabel": "令和5年", "subject": "刑事訴訟法", "qno": 14, "haiten": 2, "type": "choice", "options": 5, "answer": [1], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第14問〕（配点：２）\n捜査の端緒に関する次のアからオまでの各記述のうち、誤っているものの組合せは、後記１から ５までのうちどれか。ただし、判例がある場合には、それに照らして考えるものとする。\nア．被害者の法定代理人は、被害者の意思に反して告訴をすることはできない。\nイ．検視においては、死因の確認のために必要があるときには、死体の腹部を切開することができる。\nウ．親告罪の告訴期間の起算点である「犯人を知った」とは、告訴権者において犯人が誰であるかを知ることをいい、犯人の住所氏名などの詳細を知る必要はない。\nエ．司法警察員は、口頭による告発を受けたときは調書を作らなければならない。\nオ．司法警察員は、自首を受けたときは、速やかにこれに関する書類及び証拠物を検察官に送付しなければならない。\n１．アイ\n２．アオ\n３．イウ\n４．ウエ\n５．エオ", "source": "https://www.moj.go.jp/content/001399906.pdf", "answerSource": "https://www.moj.go.jp/content/001400884.pdf"}, {"id": "R5-keiso-15", "year": "R5", "yearLabel": "令和5年", "subject": "刑事訴訟法", "qno": 15, "haiten": 3, "type": "choice", "options": 6, "answer": [4], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第15問〕（配点：３）\n次のアからオまでの各記述のうち、正しいものは幾つあるか。後記１から６までのうちから選びなさい。ただし、判例がある場合には、それに照らして考えるものとする。\nア．強盗殺人事件の捜査に関し、公道上を歩いている被疑者の容ぼう等を撮影することは、防犯ビデオに写っていた犯人の容ぼう等と被疑者の容ぼう等との同一性の有無という犯人を特定するための重要な判断に必要な証拠資料を入手するためであっても、被疑者の同意がある場合か、裁判官の令状がある場合以外には許容されない。\nイ．強制手段とは、有形力の行使を伴う手段を意味するものではなく、個人の意思を制圧し、身体、住居、財産等に制約を加えて強制的に捜査目的を実現する行為など、特別の根拠規定がなければ許容することが相当でない手段を意味するものであって、この程度に至らない有形力の行使は、任意捜査においても許容される場合がある。\nウ．車両に使用者らの承諾なく秘かにＧＰＳ端末を取り付け、情報機器でその位置情報を検索し、画面表示を読み取って当該車両の所在と移動状況を把握する捜査手法は、個人のプライバシーの侵害を可能とする機器をその所持品に秘かに装着することによって、合理的に推認される個人の意思に反してその私的領域に侵入するものであり、刑事訴訟法上、特別の根拠規定がなければ許容されない強制処分に当たる。\nエ．荷送人や荷受人の承諾を得ることなく、宅配便業者の運送過程下にある荷物について、外部からエックス線を照射して内容物の射影を観察する捜査手法は、その射影によって荷物の内容物の形状や材質をうかがい知ることができるだけでなく、その品目等を相当程度具体的に特定することも可能である場合には、荷送人や荷受人の内容物に対するプライバシー等を大きく侵害するものであるから、検証としての性質を有する強制処分に当たる。\nオ．警察官が、覚醒剤の使用ないし所持の容疑がかなり濃厚に認められる者に対する職務質問中に、その者の承諾がないのに、その上衣の内ポケットに手を差し入れて所持品を取り出したうえ検査する行為は、職務質問に附随する所持品検査において許容される限度を超えるとの評価を受けることはない。\n１．０個\n２．１個\n３．２個\n４．３個\n５．４個\n６．５個", "source": "https://www.moj.go.jp/content/001399906.pdf", "answerSource": "https://www.moj.go.jp/content/001400884.pdf"}, {"id": "R5-keiso-16", "year": "R5", "yearLabel": "令和5年", "subject": "刑事訴訟法", "qno": 16, "haiten": 2, "type": "choice", "options": 5, "answer": [3], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第16問〕（配点：２）\n後記【事例】に関する次のアからオまでの【記述】のうち、【見解】に示す考え方からの帰結として正しいものの組合せは、後記１から５までのうちどれか。ただし、判例がある場合には、それに照らして考えるものとする。\n【事例】 甲には、乙宅において、乙に対して暴行を加え、その反抗を抑圧して、乙所有の財布を強取したという強盗の事実の嫌疑が認められる。\n【見解】 Ⅰ．逮捕に引き続く勾留の理由となる被疑事実は、先行する逮捕の理由とされた被疑事実と同一のものでなければならない。 Ⅱ．実体法上一罪の関係にある被疑事実を理由とする身体拘束は、一回に限り認められる。 Ⅲ．身体拘束に関する処分は、明示的に身体拘束の理由とされている被疑事実について行われるもので、それ以外の事実のみに基づいて行われてはならない。\n【記述】\nア．【見解】Ⅰによれば、検察官は、甲が【事例】中の強盗の被疑事実について逮捕された場合に、逮捕中の捜査の結果を踏まえて恐喝に評価を改め、その逮捕に引き続き、乙に対する恐喝の被疑事実を理由として甲の勾留を請求することはできない。\nイ．【見解】Ⅰによれば、検察官は、甲が【事例】中の強盗の被疑事実について逮捕された場合に、これに引き続いて、別に判明した、甲の丙に対する強盗の被疑事実のみを理由として甲の勾留を請求することはできない。\nウ．【見解】Ⅱによれば、司法警察員は、【事例】中の強盗の被疑事実を乙に対する暴行の被疑事実と乙に対する窃盗の被疑事実に分割し、甲が暴行の被疑事実で逮捕、勾留された後に、改めて、窃盗の被疑事実で逮捕状を請求することはできない。\nエ．【見解】Ⅱによれば、司法警察員は、甲が【事例】中の強盗の被疑事実について逮捕された後、これに引き続く勾留請求が却下された場合に、甲が【事例】中の強盗を行うための手段として乙宅に侵入した旨の住居侵入の被疑事実（【事例】中の強盗の被疑事実と牽連犯の関係に立つものとする）を理由として、甲の逮捕状を請求することができる。\nオ．【見解】Ⅲによれば、検察官は、【事例】中の強盗の被疑事実を理由とする勾留の延長を請求するに当たり、並行して実施している別の被疑事実の捜査から判明した事情は、前記強盗の被疑事実に関連するとしても、これを示すことはできない。\n１．アイ\n２．アオ\n３．イウ\n４．ウエ\n５．エオ", "source": "https://www.moj.go.jp/content/001399906.pdf", "answerSource": "https://www.moj.go.jp/content/001400884.pdf"}, {"id": "R5-keiso-17", "year": "R5", "yearLabel": "令和5年", "subject": "刑事訴訟法", "qno": 17, "haiten": 3, "type": "choice", "options": 5, "answer": [1], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第17問〕（配点：３）\n次のⅠ及びⅡの【見解】は、刑事訴訟法第２２０条第１項第２号及び同条第３項が、被疑者を逮捕する場合において必要があるときは、「逮捕の現場」で令状を必要とせずに捜索差押えをすることができるとしている根拠に関する考え方を述べたものである。これらの【見解】に関する後記アからオまでの【記述】のうち、正しいものの組合せは、後記１から５までのうちどれか。\n【見解】 Ⅰ．逮捕の現場には証拠の存在する蓋然性が一般的に高いため、裁判官による事前の令状審査を行う必要性がないことを根拠とする見解 Ⅱ．逮捕の際には被逮捕者により証拠が隠滅されるおそれが高いため、これを防止して証拠を保全する緊急の必要性があることを根拠とする見解 【記述】\nア．Ⅰの見解に立っても、Ⅱの見解に立っても、捜索差押えの対象となる証拠は、逮捕の理由とされた被疑事実と関連する物に限られる。\nイ．Ⅰの見解に立つと、捜索差押えをすることができるのは、証拠が存在する蓋然性が一般的に高いと認められる場所においてであると考えることになるため、逮捕が被疑者の隣人方でなされた場合、当該隣人方のほか、被疑者方でも捜索差押えを実施することができる。\nウ．Ⅰの見解に立っても、逮捕が被疑者ではない第三者の住居でなされた場合、逮捕の理由とされた被疑事実に関する証拠の存在を認めるに足りる状況がなければ、当該住居で捜索差押えを実施することは違法であり、許されない。\nエ．Ⅱの見解に立つと、捜索差押えをすることができるのは、逮捕の際に被疑者が証拠を隠滅することが可能な場所においてであると考えることになるため、逮捕が被疑者方の一室でなされた場合に、捜索差押えができるのは、逮捕がなされた時点で被疑者の手が届く場所に限られ、当該一室全体において実施することができるとは考えられない。\nオ．Ⅱの見解に立つと、捜索差押えの要件として、被逮捕者が証拠を隠滅する具体的な危険が認められることが要求されることになる。\n１．アウ\n２．アエ\n３．イウ\n４．イオ\n５．エオ", "source": "https://www.moj.go.jp/content/001399906.pdf", "answerSource": "https://www.moj.go.jp/content/001400884.pdf"}, {"id": "R5-keiso-18", "year": "R5", "yearLabel": "令和5年", "subject": "刑事訴訟法", "qno": 18, "haiten": 3, "type": "series", "options": 2, "answer": [1, 2, 2, 2, 1], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第18問〕（配点：３）\n身体検査等に関する次のアからオまでの各記述のうち、正しいものには１を、誤っているものには２を選びなさい。ただし、判例がある場合には、それに照らして考えるものとする。\nア．裁判所が女子の身体を検査する場合でも、捜査機関が身体検査令状により女子の身体を検査する場合と同じく、医師又は成年の女子をこれに立ち会わせる必要がある。\nイ．身体の拘束を受けている被疑者を写真撮影する場合、必ず身体検査令状によらなければならない。\nウ．捜査機関が人の着用しているズボンのポケットの中を捜索して物を差し押さえるためには、捜索差押許可状のほかに、身体検査令状の発付を受ける必要がある。\nエ．捜査機関から鑑定の嘱託を受けた者は、鑑定処分許可状に基づき行う身体検査を拒否する者に対して、直接強制として身体検査を行うことができる。\nオ．強制採尿のための捜索差押許可状には、強制採尿は医師をして医学的に相当と認められる方法により行わせなければならない旨の条件の記載が不可欠である。", "source": "https://www.moj.go.jp/content/001399906.pdf", "answerSource": "https://www.moj.go.jp/content/001400884.pdf"}, {"id": "R5-keiso-19", "year": "R5", "yearLabel": "令和5年", "subject": "刑事訴訟法", "qno": 19, "haiten": 2, "type": "choice", "options": 5, "answer": [2], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第19問〕（配点：２）\n弁護人の活動に関する次のアからオまでの各記述のうち、正しいものの組合せは、後記１から５までのうちどれか。ただし、判例がある場合には、それに照らして考えるものとする。\nア．弁護人は、検察官のした接見の日時を指定する処分に不服がある場合、裁判所にその処分の取消し又は変更を請求することができる。\nイ．弁護人は、司法警察職員が捜索差押許可状に基づき被疑者方を捜索する場合、当該捜索差押許可状の執行に立ち会う権利がある。\nウ．弁護人は、あらかじめ証拠を保全しておかなければその証拠を使用することが困難な事情があるときは、起訴前であっても、裁判官に証人の尋問を請求することができる。\nエ．勾留されている被疑者の弁護人は、裁判官に保釈の請求をすることができる。\nオ．国選弁護人は、自己を国選弁護人に選任した裁判所又は裁判官に辞任を申し出ることにより、自らその地位を離れることができる。\n１．アイ\n２．アウ\n３．イオ\n４．ウエ\n５．エオ", "source": "https://www.moj.go.jp/content/001399906.pdf", "answerSource": "https://www.moj.go.jp/content/001400884.pdf"}, {"id": "R5-keiso-20", "year": "R5", "yearLabel": "令和5年", "subject": "刑事訴訟法", "qno": 20, "haiten": 3, "type": "series", "options": 2, "answer": [2, 1, 1, 2, 2], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第20問〕（配点：３）\n公判手続に関する次のアからオまでの各記述のうち、正しいものには１を、誤っているものには ２を選びなさい。ただし、判例がある場合には、それに照らして考えるものとする。\nア．検察官は、刑事事件の通常の第一審公判手続における冒頭手続において、冒頭陳述を行う。\nイ．裁判長は、刑事事件の通常の第一審公判手続における冒頭手続において、検察官の起訴状の朗読に先立ち、人定質問を行う。\nウ．必要的弁護事件において、裁判所が弁護人出頭確保のための方策を尽くしたにもかかわらず、被告人が、弁護人の公判期日への出頭を妨げるなど、弁護人が在廷しての公判審理ができない状態を生じさせ、かつ、その事態を解消することが極めて困難な場合には、公判期日に弁護人が出頭しなくとも、開廷することができる。\nエ．検察官は、証拠調べが終わった後の事実及び法律の適用についての意見の陳述において、量刑についての意見を述べることはできるが、無罪である旨の意見を述べることはできない。\nオ．被告人又は弁護人は、公判前整理手続に付されていない事件について、証拠により証明すべき事実があるときは、裁判所の許可がなくとも、検察官が冒頭陳述をした後、冒頭陳述をすることができる。", "source": "https://www.moj.go.jp/content/001399906.pdf", "answerSource": "https://www.moj.go.jp/content/001400884.pdf"}, {"id": "R5-keiso-21", "year": "R5", "yearLabel": "令和5年", "subject": "刑事訴訟法", "qno": 21, "haiten": 2, "type": "choice", "options": 5, "answer": [1], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第21問〕（配点：２）\n訴因変更に関する次のアからオまでの各記述のうち、誤っているものの組合せは、後記１から５までのうちどれか。ただし、判例がある場合には、それに照らして考えるものとする。\nア．「Ａを脅迫して現金を強取した」という強盗の訴因で起訴された甲について、「Ａに暴行を加えて現金を交付させた」という恐喝の事実を認定するには、訴因変更の手続を要しない。\nイ．「乙と共謀の上、Ｖに対し、殺意をもって、甲が、Ｖの頸部を絞め付け、窒息死させて殺害した」という殺人の共同正犯の訴因で起訴された甲について、「乙と共謀の上、Ｖに対し、殺意をもって、甲又は乙あるいはその両名において、Ｖの頸部を絞め付け、窒息死させて殺害した」という事実を認定するには、公判で、殺害行為を行ったのが甲と乙のいずれなのかが争点となっていたとしても、訴因変更の手続を要する。\nウ．「ブレーキペダルと間違えてアクセルペダルを踏んだ過失により、自車を前方のＡ運転の自動車に追突させ、Ａに傷害を負わせた」という過失運転致傷の訴因で起訴された甲について、「Ａ車の後ろに進行接近する際、ブレーキをかけるのが遅れた過失」を認定するには、訴因変更の手続を要する。\nエ．日時、場所、方法を特定した覚醒剤使用の訴因を、別の日時、場所、方法の覚醒剤使用の訴因に変更することは、いずれの訴因も被告人の尿中から検出された同一の覚醒剤の使用行為に関するものである場合には、公訴事実の同一性に欠けることはなく、許される。\nオ．「Ａ方に侵入し、現金１０万円を窃取した」という住居侵入・窃盗の訴因を、別の日時に「Ｂ方に侵入し、現金１５万円を窃取した」という住居侵入・窃盗の訴因に変更することは、両訴因の事実が、実体法上は常習特殊窃盗罪を構成する場合であっても、公訴事実の同一性を欠くため、許されない。\n１．アイ\n２．アオ\n３．イウ\n４．ウエ\n５．エオ", "source": "https://www.moj.go.jp/content/001399906.pdf", "answerSource": "https://www.moj.go.jp/content/001400884.pdf"}, {"id": "R5-keiso-22", "year": "R5", "yearLabel": "令和5年", "subject": "刑事訴訟法", "qno": 22, "haiten": 2, "type": "choice", "options": 5, "answer": [4], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第22問〕（配点：２）\n次の【事例】における【乙の証人尋問】中の⑴から⑷までの下線部分に関する後記アからオまでの【記述】のうち、誤っているものの組合せは、後記１から５までのうちどれか。ただし、判例がある場合には、それに照らして考えるものとする。\n【事例】 乙は、暴力団の構成員である甲と共謀の上、対立する暴力団の構成員が多数在室していた事務所の外壁にガソリンをまいて着火し、同事務所を全焼させたとの現住建造物等放火の事実で逮捕された。乙は、捜査段階で検察官に対し、「私の運転する車で事務所に赴き、甲が同所で降車してガソリンをまいて着火した。甲とは、私の兄である丙の紹介で知り合い、本件で使用した車やガソリンは丙が準備したものである。」などと甲との共謀や丙の関与を認める供述をし、その内容の検察官面前調書が作成された。その後、乙は、甲との共同被告人として起訴された。第１回公判期日では、甲は、公訴事実について、「乙と共謀をしたことはなく、実行行為をしたこともない。」旨を述べて否認し、甲の弁護人は検察官が取調べを請求した前記乙の検察官面前調書について不同意である旨の意見を述べた。一方、乙は、公訴事実を認め、甲と乙の公判は分離された。その後、乙は、甲の公判期日に証人として呼ばれた。\n【乙の証人尋問】 裁判長宣誓をしてください。乙 ⑴宣誓（以下省略）検察官 ⑵あなたは現住建造物等放火罪で起訴されていますね。乙はい。検察官 ⑶その事件を誰と一緒に行ったのですか。乙甲さんと一緒にやりました。検察官今回の事件についてあなたが関わることになったきっかけや、あなたの役割について教えてください。乙 ⑷答えたくありません。\n【記述】\nア．乙は、自らも同一の事件で公訴提起されていることを理由に、下線部⑴の宣誓を拒むことはできない。\nイ．下線部⑵、⑶の尋問方法は、いずれも誘導尋問であり、主尋問では許されない。\nウ．下線部⑷において、答えたくない理由が、「自己が刑事訴追を受け、又は有罪判決を受けるおそれのある」ことであったとしても、乙が証言を拒むことができない場合もある。\nエ．下線部⑷において、乙は、兄である丙が「刑事訴追を受け、又は有罪判決を受けるおそれのある」ことを理由に、丙に関する事項についての証言を拒むことができる。\nオ．下線部⑷において、乙は、真実の証言をしたとしても、その内容が検察官面前調書の内容と齟齬したときには偽証罪の訴追を受けるおそれがあることを理由に、証言を拒むことができる。\n１．アエ\n２．アオ\n３．イウ\n４．イオ\n５．ウエ", "source": "https://www.moj.go.jp/content/001399906.pdf", "answerSource": "https://www.moj.go.jp/content/001400884.pdf"}, {"id": "R5-keiso-23", "year": "R5", "yearLabel": "令和5年", "subject": "刑事訴訟法", "qno": 23, "haiten": 2, "type": "choice", "options": 5, "answer": [5], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第23問〕（配点：２）\n次のアからオまでの各記述は、取調べに際して任意の供述をした者が、公判期日においては前にした供述と異なる供述をするおそれがあり、かつ、その者の供述が犯罪の証明に欠くことができないと認められるため、検察官が刑事訴訟法第２２７条に基づき証人尋問を請求する場合に関する記述である。各記述のうち、誤っているものの組合せは、後記１から５までのうちどれか。\nア．被疑者の共犯者についても、証人尋問を請求することができる。\nイ．第１回公判期日後には証人尋問を請求することができない。\nウ．「異なる供述」とは、供述が、被疑者、被告人に有利に変更される場合だけでなく、不利に変更される場合も含む。\nエ．弁護人は、証人尋問が行われる際、その尋問に立ち会う権利を有する。\nオ．公訴提起後に証人尋問を請求する場合は、請求先は裁判官ではなく裁判所である。\n１．アイ\n２．アオ\n３．イウ\n４．ウエ\n５．エオ", "source": "https://www.moj.go.jp/content/001399906.pdf", "answerSource": "https://www.moj.go.jp/content/001400884.pdf"}, {"id": "R5-keiso-24", "year": "R5", "yearLabel": "令和5年", "subject": "刑事訴訟法", "qno": 24, "haiten": 2, "type": "choice", "options": 5, "answer": [2], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第24問〕（配点：２）\n伝聞証拠に関する次のアからオまでの各記述のうち、誤っているものの組合せは、後記１から５までのうちどれか。ただし、判例がある場合には、それに照らして考えるものとする。\nア．証人が公判期日において、前に裁判官の面前でした供述と異なった供述をした場合、前にした供述を録取した書面で供述者の署名又は押印のあるものは、公判期日における供述よりも前にした供述を信用すべき特別の情況の存するときに限り、これを証拠とすることができる。\nイ．火災原因の調査、判定に関し特別の学識経験を有する私人が、弁護人の依頼を受けて燃焼実験を行ってその考察の結果を報告した書面は、裁判所から鑑定を命じられた者が作成した鑑定の経過及び結果を記載した書面と同じ要件のもとでこれを証拠とすることができる。\nウ．刑事訴訟法第３２３条第２号によれば、「業務の通常の過程において作成された書面」は、その作成者が公判期日において証人として尋問を受け、その真正に作成されたものであることを供述したときに限り、これを証拠とすることができる。\nエ．甲の検察官に対する供述調書中に、被告人乙が甲に対してした「Ｖ方に放火してきた。」旨の供述が含まれているときは、刑事訴訟法第３２１条第１項第２号及び同法第３２４条により、これを乙の現住建造物等放火被告事件において証拠とすることができる。\nオ．刑事訴訟法第３２５条による書面に記載された供述が任意にされたものかどうかの調査は、必ずしもその証拠調べの前にされなければならないものではない。\n１．アイ\n２．アウ\n３．イオ\n４．ウエ\n５．エオ", "source": "https://www.moj.go.jp/content/001399906.pdf", "answerSource": "https://www.moj.go.jp/content/001400884.pdf"}, {"id": "R5-keiso-25", "year": "R5", "yearLabel": "令和5年", "subject": "刑事訴訟法", "qno": 25, "haiten": 2, "type": "choice", "options": 5, "answer": [2], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第25問〕（配点：２）\n次の【事例】について述べた後記アからオまでの【記述】のうち、誤っているものの組合せは、後記１から５までのうちどれか。\n【事例】 甲は、強盗致傷の被疑事実で勾留され、国選弁護人としてＡが選任された。甲は、被疑事実と同一の事実により、Ｈ地方裁判所に起訴された。本件強盗致傷事件は、公判前整理手続に付されたところ、第１回の公判前整理手続期日に先立ち、検察官は証明予定事実記載書を提出し、また、証明予定事実を証明するために用いる証拠の取調べを請求し、それらを①起訴後においても国選弁護人であるＡに開示した。その中には、本件強盗致傷事件の犯人の容ぼうが甲によく似ていると供述する目撃者乙の検察官に対する供述調書が含まれていた。②その後、第１回の公判前整理手続期日が指定され、同期日に甲が出頭した。第１回の公判前整理手続期日の後、Ａは、検察官に対し、③刑事訴訟法第３１６条の１５に基づき、乙の供述調書の証明力を判断するために重要な証拠として、乙の他の供述録取書等の開示を請求し、同条の要件を満たす乙の供述録取書等は全てＡに開示された。 Ａは、その後、裁判所及び検察官に対し、甲は本件強盗致傷事件の発生した日時に、事件現場から遠く離れたＩ市にいたのであって、本件強盗致傷事件に関与していない旨のアリバイ主張を記載した予定主張記載書面を提出するとともに、本件犯行日時にＩ市において甲と一緒にいたという甲の友人である丙の証人尋問を請求した。④裁判所はこれに対し、検察官の意見を聞いた上で、丙の証人尋問を決定した。その後、公判前整理手続が終了して公判期日が開かれ、公判期日において丙の証人尋問が行われた。⑤丙は、その証人尋問において、本件犯行日時にＩ市において丙のスマートフォンで撮影した写真に偶然、甲が写っているものがある旨の証言をした。なお、Ａ及び甲は、同証人尋問前に丙から同写真の存在を知らされておらず、公判前整理手続において、同写真の証拠調べ請求はされていない。\n【記述】\nア．下線部①で起訴後もＡが国選弁護人の地位にあるためには、改めて第一審の国選弁護人として選任される必要がある。\nイ．甲に対しては、第１回公判期日の冒頭手続において黙秘権の告知が行われるが、下線部②の甲が出頭した最初の公判前整理手続期日においても、裁判長は甲に対し、黙秘権の告知をしなければならない。\nウ．弁護人は、検察官が取調べを請求した乙の供述調書について、公判前整理手続中に刑事訴訟法第３２６条の同意をするかどうか、又はその取調べの請求に関し異議がないかどうかの意見を明らかにしなければならないが、その時期は、下線部③の開示がされた後でよく、それよりも前に意見を明らかにする必要はない。\nエ．下線部④の丙の証人尋問のほかにもアリバイ主張に関連してＡが証拠調べを請求した証拠があったとしても、裁判所はそれらについて証拠調べをする決定又は証拠調べの請求を却下する決定をしないまま公判前整理手続を終え、丙の証人尋問を実施した後、それらの証拠の取調べをするか否かを決定してもよい。\nオ．下線部⑤の写真について、公判前整理手続の中で証拠調べ請求がされることなく同手続が終了した以上、Ａが丙の証人尋問終了後にその証拠調べを請求する余地はない。\n１．アイ\n２．アオ\n３．イウ\n４．ウエ\n５．エオ", "source": "https://www.moj.go.jp/content/001399906.pdf", "answerSource": "https://www.moj.go.jp/content/001400884.pdf"}, {"id": "R5-keiso-26", "year": "R5", "yearLabel": "令和5年", "subject": "刑事訴訟法", "qno": 26, "haiten": 2, "type": "choice", "options": 5, "answer": [5], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第26問〕（配点：２）\n裁判の効力に関する次のアからオまでの各記述のうち、誤っているものの組合せは、後記１から ５までのうちどれか。ただし、判例がある場合には、それに照らして考えるものとする。\nア．被告人Ａが甲を殺害した旨の訴因について有罪判決が確定した後、検察官は、ＢがＡと共謀の上で甲を殺害した旨の事実でＢを起訴することができる。\nイ．有罪の確定判決について、再審開始の決定が確定したとしても、再審の判決が確定するまでは、再審の請求の対象となった確定判決は、その効力を失わない。\nウ．殺人被告事件で勾留中の被告人につき無罪判決が宣告された場合、その判決宣告の時点で、被告人に対する勾留状はその効力を失う。\nエ．殺人罪の訴因について無罪判決が確定した後、検察官が被告人の有罪を立証するに十分な新たな証拠が発見されたとして、再度、同事件の被告人を同一事実で起訴した場合、裁判所は、改めて審理し、有罪の判決をすることができる。\nオ．告訴がないまま起訴された器物損壊事件において、公訴棄却の判決が確定した場合、検察官は、その後に被害者から告訴を得たとしても、再度、同事件の被告人を同一事実で起訴することはできない。\n１．アイ\n２．アウ\n３．イエ\n４．ウオ\n５．エオ", "source": "https://www.moj.go.jp/content/001399906.pdf", "answerSource": "https://www.moj.go.jp/content/001400884.pdf"}, {"id": "R6-kenpo-1", "year": "R6", "yearLabel": "令和6年", "subject": "憲法", "qno": 1, "haiten": 3, "type": "series", "options": 2, "answer": [2, 1, 2], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第１問〕（配点：３）\n次の対話は、刑事収容施設被収容者に対する人権の制約に関する教授と学生の対話である。教授の各質問に対する次のアからウまでの学生の各回答について、それぞれ正しい場合には１を、誤っている場合には２を選びなさい。教授．まず、刑事収容施設内における被収容者の喫煙の自由が認められるか否かについて伺います。最高裁判所は、未決勾留による被拘禁者の喫煙を制限することの合憲性が争われた事件の判決（最高裁判所昭和４５年９月１６日大法廷判決、民集２４巻１０号１４１０頁）において、どのような判断をしていますか。\nア．たばこは単なる嗜好品であることからも、喫煙の自由が憲法第１３条の保障する基本的人権に含まれるものではないことを明示し、施設内における喫煙制限の措置は、そもそも憲法上の権利を制約するものではないとしています。教授．次に、新聞紙等の閲読について伺います。最高裁判所は、未決勾留による被拘禁者の新聞紙の閲読を制限することの合憲性が争われた事件の判決（最高裁判所昭和５８年６月２２日大法廷判決、民集３７巻５号７９３頁）において、新聞紙等を閲読する自由の制限が認められるか否かを審査するに当たり、いかなる判断枠組みを示していますか。\nイ．被拘禁者の新聞紙や図書等を閲読する自由の制限が許されるためには、その閲読を許すことにより施設内の規律及び秩序を維持する上で放置できない程度の障害が生じる相当の蓋然性があると認められることが必要であるとしています。教授．では、信書の発信をめぐってはどうでしょうか。最高裁判所は、受刑者による親族以外への信書の発信を不許可としたことの合憲性が争われた事件の判決（最高裁判所平成１８年３月２３日第一小法廷判決、集民２１９号９４７頁）において、いかなる結論を出しているのかについて説明してください。\nウ．受刑者による親族でない者との間の信書の発受は、受刑者の身柄の確保、受刑者の改善、更生の点において障害が生じる一般的、抽象的おそれがあることから、刑務所長が信書の発信を不許可としたことは違憲ではないとしています。", "source": "https://www.moj.go.jp/content/001421751.pdf", "answerSource": "https://www.moj.go.jp/content/001422569.pdf"}, {"id": "R6-kenpo-2", "year": "R6", "yearLabel": "令和6年", "subject": "憲法", "qno": 2, "haiten": 3, "type": "series", "options": 2, "answer": [1, 2, 2], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第２問〕（配点：３）\n憲法第１９条に関する次のアからウまでの各記述について、最高裁判所の判例の趣旨に照らして、それぞれ正しい場合には１を、誤っている場合には２を選びなさい。\nア．政治的活動が直ちに労働組合の目的の範囲外であるとすることはできないが、選挙においてどの政党又はどの候補者を支持するかは、投票の自由と表裏をなすものとして、組合員各人が自主的に決定すべき事柄であるから、労働組合が組合員に対して、組合出身の立候補者の選挙運動の応援のために臨時組合費の負担を強制することは許されない。\nイ．職務上の命令に従って、卒業式等の式典において国歌斉唱の際に起立斉唱する行為は、特定の思想又はこれに反する思想の表明として外部から認識されるものと評価すべきであり、個人の歴史観ないし世界観に由来する行動と異なる外部的行為を求められることになるから、公立高校の教諭に対して卒業式の際に国旗に向かって起立し国歌を斉唱することを命ずる校長の職務命令は、思想及び良心の自由を間接的に制約するものである。\nウ．税理士会が強制加入団体であり、その会員には、様々の思想・信条及び主義・主張を有する者が存在することが当然に予定されているから、税理士会の活動の範囲にも、税理士会の活動への会員の協力義務にも、限界があり、政党など政治資金規正法上の政治団体に対する金員の寄付は、その寄付が税理士に係る法令の制定改廃に関する要求を実現するためであった場合を除き、税理士会の目的の範囲外の行為といわざるを得ない。", "source": "https://www.moj.go.jp/content/001421751.pdf", "answerSource": "https://www.moj.go.jp/content/001422569.pdf"}, {"id": "R6-kenpo-3", "year": "R6", "yearLabel": "令和6年", "subject": "憲法", "qno": 3, "haiten": 2, "type": "choice", "options": 8, "answer": [8], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第３問〕（配点：２）\n憲法第２０条に関する次のアからウまでの各記述について、最高裁判所の判例の趣旨に照らして、正しいものには○、誤っているものには×を付した場合の組合せを、後記１から８までの中から選びなさい。\nア．公立学校において、学生の信仰について調査やせん索を行い、宗教を序列化して別段の取扱いをすることは許されない。したがって、公立学校の学生が信仰上の理由により剣道実技の履修を拒否する場合、その理由の当否を判断するために、学校が宗教上の信条と履修拒否との合理的関連性が認められるかどうかを確認するための調査をすることは、公教育の宗教的中立性に反する。\nイ．憲法第２０条第１項前段、同条第２項の趣旨に照らせば、宗教上の人格権の一内容として、静謐な環境の下で信仰生活を送る利益が保障される。私的団体が殉職した自衛官を遺族の意思に反して神社に合祀申請した行為は、遺族の信仰生活の静謐を害するが、その侵害の態様や程度が社会的に許容し得る限度を超えておらず、遺族の法的利益が侵害されたとはいえない。\nウ．国公有地が無償で宗教的施設の敷地としての用に供されている状態が、政教分離原則に反するか否かを判断するに当たっては、当該宗教的施設の性格、当該土地が無償で当該施設の敷地としての用に供されるに至った経緯、当該無償提供の態様等の客観的な事情を総合的に考慮して判断すべきであるが、これらに対する一般人の評価等の主観的な事情については、判断の基礎とすべきでない。\n１．ア○ イ○ ウ○\n２．ア○ イ○ ウ×\n３．ア○ イ× ウ○\n４．ア○ イ× ウ×\n５．ア× イ○ ウ○\n６．ア× イ○ ウ×\n７．ア× イ× ウ○\n８．ア× イ× ウ×", "source": "https://www.moj.go.jp/content/001421751.pdf", "answerSource": "https://www.moj.go.jp/content/001422569.pdf"}, {"id": "R6-kenpo-4", "year": "R6", "yearLabel": "令和6年", "subject": "憲法", "qno": 4, "haiten": 2, "type": "choice", "options": 8, "answer": [7], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第４問〕（配点：２）\n報道の自由や取材の自由に関する次のアからウまでの各記述について、最高裁判所の判例の趣旨に照らして、正しいものには○、誤っているものには×を付した場合の組合せを、後記１から８までの中から選びなさい。\nア．報道機関の報道は、民主主義社会において、国民が国政に関与するにつき、重要な判断の資料を提供し、国民の知る権利に奉仕するものであるから、事実の報道の自由は、思想の表明の自由と並んで、表現の自由を規定した憲法第２１条の保障の下にあり、このような報道機関の報道が正しい内容を持つためには、報道のための取材の自由も、憲法第２１条によって報道の自由と同程度に保障される。\nイ．報道機関の取材結果に対する裁判所の提出命令の可否は、刑事手続の対象犯罪の性質、態様、軽重及び取材結果の証拠としての価値、ひいては、公正な刑事裁判を実現するに当たっての必要性の有無と、取材結果の提出によって報道機関の取材の自由が妨げられる程度及びこれが報道の自由に及ぼす影響の度合その他諸般の事情を比較衡量して決するが、捜査機関が主体となって行う取材結果に対する差押の可否は、捜査機関と裁判所との性格の違いから、より慎重な検討が求められるため、このような比較衡量で決することはできない。\nウ．報道機関の関係者は、民事訴訟において取材源に係る証言を求められた場合、当該報道が公共の利益に関するものであって、その取材の手段、方法が一般の刑罰法令に触れるとか、取材源となった者が取材源の秘密の開示を承諾しているなどの事情がなく、しかも、当該民事事件が社会的意義や影響のある重大な事件であるため、当該取材源の秘密の社会的価値を考慮してもなお公正な裁判を実現すべき必要性が高く、そのために当該証言を得ることが必要不可欠であるといった事情が認められないのであれば、原則として、当該証言を拒絶できる。\n１．ア○ イ○ ウ○\n２．ア○ イ○ ウ×\n３．ア○ イ× ウ○\n４．ア○ イ× ウ×\n５．ア× イ○ ウ○\n６．ア× イ○ ウ×\n７．ア× イ× ウ○\n８．ア× イ× ウ×", "source": "https://www.moj.go.jp/content/001421751.pdf", "answerSource": "https://www.moj.go.jp/content/001422569.pdf"}, {"id": "R6-kenpo-5", "year": "R6", "yearLabel": "令和6年", "subject": "憲法", "qno": 5, "haiten": 3, "type": "series", "options": 2, "answer": [1, 2, 1], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第５問〕（配点：３）\n教育を受ける権利に関する次のアからウまでの各記述について、ｂの見解がａの見解の根拠となっている場合には１を、そうでない場合には２を選びなさい。\nア．\n  ａ．教育行政機関は、法律の授権に基づいて、公教育における教育の内容及び方法について決定権能を有する。\n  ｂ．国民全体の教育意思は、憲法の採用する議会制民主主義の下においては、国会の法律制定を通じて具体化されるべきものである。\nイ．\n  ａ．高等学校における教育の目的を達成するためには、高等学校の教師に教育の具体的内容及び方法についての裁量を広く認めるべきである。\n  ｂ．高等学校において、生徒の側には、教師の教育内容を批判する十分な能力は備わっておらず、国が教育の一定水準を維持する必要がある。\nウ．\n  ａ．憲法第２６条第２項後段は、義務教育は無償とするとしているところ、当然に国が一切の費用を負担しなければならないとはいえないから、その無償の範囲は授業料であると解される。\n  ｂ．義務教育は単なる国家的要請ではなく、親が本来有している子女を教育すべき義務を全うさせようとする趣旨によるものである。", "source": "https://www.moj.go.jp/content/001421751.pdf", "answerSource": "https://www.moj.go.jp/content/001422569.pdf"}, {"id": "R6-kenpo-6", "year": "R6", "yearLabel": "令和6年", "subject": "憲法", "qno": 6, "haiten": 2, "type": "choice", "options": 8, "answer": [1], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第６問〕（配点：２）\n刑事補償請求権に関する次のアからウまでの各記述について、正しいものには○、誤っているものには×を付した場合の組合せを、後記１から８までの中から選びなさい。\nア．刑事補償請求制度は、憲法第３１条以下の刑事手続に関する諸権利の保障によってもなお生じる国民の不利益に対する補償を定めたものであって、公務員の違法行為や故意・過失の有無に関わりなく、結果に対する補償請求を認めており、抑留又は拘禁された後、結果として無罪の裁判を受けた者に対し、相応の補償をすることによって、公平の要請を満たそうとするものである。\nイ．最高裁判所は、緊急逮捕され少年鑑別所に収容された後、非行事実が認められないという理由で不処分決定を受けた少年が行った刑事補償請求につき、不処分決定は刑事訴訟法上の手続とは性質を異にする少年審判の手続における決定であることなどを理由として刑事補償の対象となる「無罪の裁判」には当たらないと判示した。\nウ．最高裁判所は、抑留又は拘禁された後、起訴されずに釈放された者は刑事補償の対象とならないが、不起訴となった事実に基づく抑留又は拘禁であっても、そのうちに実質上は無罪となった事実についての抑留又は拘禁であると認められるものがあるときは、その部分の抑留及び拘禁は刑事補償の対象となると解している。\n１．ア○ イ○ ウ○\n２．ア○ イ○ ウ×\n３．ア○ イ× ウ○\n４．ア○ イ× ウ×\n５．ア× イ○ ウ○\n６．ア× イ○ ウ×\n７．ア× イ× ウ○\n８．ア× イ× ウ×", "source": "https://www.moj.go.jp/content/001421751.pdf", "answerSource": "https://www.moj.go.jp/content/001422569.pdf"}, {"id": "R6-kenpo-7", "year": "R6", "yearLabel": "令和6年", "subject": "憲法", "qno": 7, "haiten": 3, "type": "series", "options": 2, "answer": [2, 1, 2], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第７問〕（配点：３）\n法の支配に関する次のアからウまでの各記述について、ｂの見解がａの見解の根拠となっている場合には１を、そうでない場合には２を選びなさい。\nア．\n  ａ．イギリスで２０世紀までに成立した法の支配は、制定法とコモン・ローを中心とした「正規の法」による支配を意味しており、裁判所による法の適用を保障することを要求している。\n  ｂ．イギリスでは、１７世紀の国会と国王との抗争を経て、国会が主権を有するという観念が確立された。\nイ．\n  ａ．１９世紀後半のドイツにおいて採用されていた法治国家概念は、今日では、形式的法治国家論であると批判されている。\n  ｂ．１９世紀後半のドイツにおいては、法律の留保の下、行政権が国民の権利を制限し、又は義務を課すには法律の根拠が必要とされたが、法律がどのような内容を伴っているかは問題とされなかった。\nウ．\n  ａ．現在の立憲主義国家の多くは、統治原理として法治主義を掲げる場合であっても、その内実は、法の支配原理とほぼ同じ意味を持つようになっている。\n  ｂ．現在の立憲主義国家の多くは、国民主権原理を採用している。", "source": "https://www.moj.go.jp/content/001421751.pdf", "answerSource": "https://www.moj.go.jp/content/001422569.pdf"}, {"id": "R6-kenpo-8", "year": "R6", "yearLabel": "令和6年", "subject": "憲法", "qno": 8, "haiten": 2, "type": "choice", "options": 8, "answer": [7], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第８問〕（配点：２）\n憲法第９条に関する次のアからウまでの各記述について、正しいものには○、誤っているものには×を付した場合の組合せを、後記１から８までの中から選びなさい。\nア．憲法第９条第１項について、国際紛争を解決するための戦争を放棄したものであり、自衛戦争を放棄したものではないとの考え方に立った場合、同条第２項後段について、交戦権は否認されていると解することはできない。\nイ．判例によれば、憲法第９条は、私法上の行為の効力を直接規律することを目的とした規定ではないため、国の私法上の行為については、実質的にみて公権力の発動たる行為と何ら変わりがないといえるような特段の事情があったとしても、同条が直接適用されることはない。\nウ．アメリカ合衆国軍隊の駐留を合憲と解する考え方として、憲法第９条第２項の「戦力」とは、日本が指揮権、管理権を行使し得る戦力を意味し、外国の軍隊はこれに当たらないとするものがあり、最高裁判所は、この考え方を採用している。\n１．ア○ イ○ ウ○\n２．ア○ イ○ ウ×\n３．ア○ イ× ウ○\n４．ア○ イ× ウ×\n５．ア× イ○ ウ○\n６．ア× イ○ ウ×\n７．ア× イ× ウ○\n８．ア× イ× ウ×", "source": "https://www.moj.go.jp/content/001421751.pdf", "answerSource": "https://www.moj.go.jp/content/001422569.pdf"}, {"id": "R6-kenpo-9", "year": "R6", "yearLabel": "令和6年", "subject": "憲法", "qno": 9, "haiten": 3, "type": "series", "options": 2, "answer": [2, 2, 1], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第９問〕（配点：３）\n国会の運営に関する次のアからウまでの各記述について、それぞれ正しい場合には１を、誤っている場合には２を選びなさい。\nア．衆議院が可決し参議院に送付された議案について、参議院が審議中に衆議院が解散した場合、その議案は参議院で継続審査に付されることにより廃案とならず、次の会期において参議院で可決されれば成立する。\nイ．両議院の会議は公開が原則であるが、出席議員の３分の２以上の多数で議決したときは秘密会を開くことができる。秘密会では傍聴及び報道が制限され、会議の記録も公表されることはない。\nウ．内閣は、国会閉会後に緊急の必要が生じた場合、臨時会を召集することができる。また、いずれかの議院の総議員の４分の１以上の要求があれば、内閣は、臨時会の召集を決定しなければならない。", "source": "https://www.moj.go.jp/content/001421751.pdf", "answerSource": "https://www.moj.go.jp/content/001422569.pdf"}, {"id": "R6-kenpo-10", "year": "R6", "yearLabel": "令和6年", "subject": "憲法", "qno": 10, "haiten": 2, "type": "choice", "options": 8, "answer": [6], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第10問〕（配点：２）\n違憲審査に関する次のアからウまでの各記述について、正しいものには○、誤っているものには ×を付した場合の組合せを、後記１から８までの中から選びなさい。\nア．憲法第８１条は、立法及び行政行為に対する違憲審査権を、最高裁判所を終審とする司法裁判所に与えたものであって、同条の「処分」とは行政処分を意味し、裁判所による判決や決定は含まれない。\nイ．最高裁判所は、立法不作為により在外国民が選挙権を行使することができない場合に、立法不作為の違憲を理由とする国家賠償請求を認めるほか、次回の選挙において選挙権を行使する権利を有することの確認を求める訴えについても、公法上の法律関係に関する確認の訴えとして適法であるとして、これを認めている。\nウ．憲法と条約の効力関係につき憲法優位説を採った場合は、条約が憲法第８１条に列挙されていないこと、条約は外国との合意によって成立するという特殊性があることなどを踏まえても、条約を違憲審査の対象から除外する立場は採り得ない。\n１．ア○ イ○ ウ○\n２．ア○ イ○ ウ×\n３．ア○ イ× ウ○\n４．ア○ イ× ウ×\n５．ア× イ○ ウ○\n６．ア× イ○ ウ×\n７．ア× イ× ウ○\n８．ア× イ× ウ×", "source": "https://www.moj.go.jp/content/001421751.pdf", "answerSource": "https://www.moj.go.jp/content/001422569.pdf"}, {"id": "R6-kenpo-11", "year": "R6", "yearLabel": "令和6年", "subject": "憲法", "qno": 11, "haiten": 3, "type": "series", "options": 2, "answer": [1, 2, 2], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第11問〕（配点：３）\n次の対話は、地方自治に関する教授と学生の対話である。教授の各質問に対する次のアからウまでの学生の各回答について、それぞれ正しい場合には１を、誤っている場合には２を選びなさい。教授．地方公共団体が、住民に関係する施策に対する賛否を問う住民投票を実施した場合において、その地方公共団体の長がその投票の結果を尊重するものとする旨を定める条例が設けられていた場合、その地方公共団体の長は、その住民投票の結果に従うべき法的な義務を負うでしょうか。\nア．条例による住民投票の結果に法的拘束力を肯定すると、間接民主制によって地方政治を行おうとする現行法の制度原理と整合しない結果を招来することになりかねないため、その地方公共団体の長は、その結果に従うべき法的な義務を負うものではありません。教授．条例によって罰則を設けることは、罪刑法定主義との関係で問題はないでしょうか。また、条例によって罰則を設けることができるとした場合、その罰則には、法律上、何らかの制限は課されているでしょうか。\nイ．条例は、住民の代表機関である地方公共団体の議会の議決によって成立する民主的な立法であり、実質的には法律に準ずるものといえますから、条例によって罰則を設けることはできますし、その罰則には、法律上、特段の制限は課されていません。教授．最高裁判所の判例の趣旨に照らすと、ある地域団体が憲法第９３条第２項の「地方公共団体」に該当するには、法律で地方公共団体として取り扱われていれば足りるでしょうか。また、もしそれでは足りないとすれば、他にどのような要件を満たす必要があるでしょうか。\nウ．その地域団体が法律で地方公共団体として取り扱われていることに加え、事実上住民が経済的文化的に密接な共同生活を営み、共同体意識を持っているという社会的基盤が存在するとの要件を満たせば、「地方公共団体」に該当し、その他の要件までは必要ありません。", "source": "https://www.moj.go.jp/content/001421751.pdf", "answerSource": "https://www.moj.go.jp/content/001422569.pdf"}, {"id": "R6-kenpo-12", "year": "R6", "yearLabel": "令和6年", "subject": "憲法", "qno": 12, "haiten": 2, "type": "choice", "options": 8, "answer": [4], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第12問〕（配点：２）\n日本国憲法の改正に関する次のアからウまでの各記述について、正しいものには○、誤っているものには×を付した場合の組合せを、後記１から８までの中から選びなさい。\nア．憲法改正の手続は国会の発議により始まるが、国会法によれば、憲法改正原案の発議は、衆議院においては議員１００人以上、参議院においては議員５０人以上の賛成を要することとされ、法律案を発議する場合よりも、賛成議員数が加重されている。\nイ．憲法改正には、特別の国民投票又は国会の定める選挙の際行われる投票による国民の承認が必要とされており、その重要性に鑑み、国民投票に関し異議がある投票人は、最高裁判所にのみ訴訟を提起することができる。\nウ．国民投票において、投票率が５０パーセントに満たなかった場合には、投票総数の２分の１を超える賛成があったとしても、主権者たる国民の承認があったとは認め難いことから、その国民投票は成立せず、国民の承認を得られなかったものとなることが法律上規定されている。\n１．ア○ イ○ ウ○\n２．ア○ イ○ ウ×\n３．ア○ イ× ウ○\n４．ア○ イ× ウ×\n５．ア× イ○ ウ○\n６．ア× イ○ ウ×\n７．ア× イ× ウ○\n８．ア× イ× ウ× ［行政法］", "source": "https://www.moj.go.jp/content/001421751.pdf", "answerSource": "https://www.moj.go.jp/content/001422569.pdf"}, {"id": "R6-gyosei-13", "year": "R6", "yearLabel": "令和6年", "subject": "行政法", "qno": 13, "haiten": 2, "type": "choice", "options": 8, "answer": [6], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第13問〕（配点：２）\n行政上の法律関係に関する教員と学生による以下の対話中の次のアからウまでの【 】内の各記述について、最高裁判所の判例に照らし、正しいものに○、誤っているものに×を付した場合の組合せを、後記１から８までの中から選びなさい。教員：行政上の法律関係については、民事法の規定がどこまで適用されるかが問題となりますね。学生：例えば、（ア）【国税滞納処分による差押えについては、国家が権力的手段をもって強制的に行うもので、対等な私人間の経済取引とはその本質を異にするため、私経済上の取引の安全を保障する規定である民法第１７７条は適用されません。】 教員：公営住宅の使用関係についても議論がありますね。学生：（イ）【公営住宅の使用関係については、基本的に私人間の家屋賃貸借関係と異なるところはないため、公営住宅法及びこれに基づく条例に特別の定めがない限り、原則として民法及び借地借家法が適用されます。】 教員：会計法第３０条については、国を当事者とする公法上の金銭債権に限って適用されるとの見解もありますが、判例はどう言っていますか。学生：（ウ）【会計法第３０条は、国の権利義務を早期に決済する必要があるなど主として行政上の便宜を考慮した規定であるとして、国の安全配慮義務違反を理由とする国家公務員の国に対する損害賠償請求権についても同条所定の消滅時効期間の適用を認めました。】 （参照条文）会計法第３０条金銭の給付を目的とする国の権利で、時効に関し他の法律に規定がないものは、これを行使することができる時から５年間行使しないときは、時効によつて消滅する。国に対する権利で、金銭の給付を目的とするものについても、また同様とする。\n１．ア○ イ○ ウ○\n２．ア○ イ○ ウ×\n３．ア○ イ× ウ○\n４．ア○ イ× ウ×\n５．ア× イ○ ウ○\n６．ア× イ○ ウ×\n７．ア× イ× ウ○\n８．ア× イ× ウ×", "source": "https://www.moj.go.jp/content/001421751.pdf", "answerSource": "https://www.moj.go.jp/content/001422569.pdf"}, {"id": "R6-gyosei-14", "year": "R6", "yearLabel": "令和6年", "subject": "行政法", "qno": 14, "haiten": 2, "type": "choice", "options": 8, "answer": [8], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第14問〕（配点：２）\n行政処分に関する次のアからウまでの各記述について、最高裁判所の判例に照らし、正しいものに○、誤っているものに×を付した場合の組合せを、後記１から８までの中から選びなさい。\nア．母がした子の住民票作成の申出に対し、市町村長が住民票を作成しない旨の応答をすることは、母又は子の権利義務ないし法律上の地位に直接影響を及ぼすものであるから、行政事件訴訟法第３条第２項にいう「行政庁の処分その他公権力の行使に当たる行為」に当たる。\nイ．国土交通大臣が一級建築士免許取消処分をする場合、建築士に対する懲戒に係る処分基準が公表されているのであれば、当該処分の通知書において、同処分基準の適用関係を全く示さなかったとしても、行政手続法上の理由の提示として不足することはない。\nウ．母体保護法に基づき人工妊娠中絶手術を行うことができる医師に指定する処分を受けた開業医が、当該処分後に虚偽の出生証明書を作成して罰金刑を受けたとしても、処分の撤回について法令に直接明文の規定がない限り、当該処分が撤回されることはない。\n１．ア○ イ○ ウ○\n２．ア○ イ○ ウ×\n３．ア○ イ× ウ○\n４．ア○ イ× ウ×\n５．ア× イ○ ウ○\n６．ア× イ○ ウ×\n７．ア× イ× ウ○\n８．ア× イ× ウ×", "source": "https://www.moj.go.jp/content/001421751.pdf", "answerSource": "https://www.moj.go.jp/content/001422569.pdf"}, {"id": "R6-gyosei-15", "year": "R6", "yearLabel": "令和6年", "subject": "行政法", "qno": 15, "haiten": 3, "type": "series", "options": 2, "answer": [2, 1, 1, 2], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第15問〕（配点：３）\n不利益処分の手続に関する次のアからエまでの各記述について、行政手続法に照らし、それぞれ正しい場合には１を、誤っている場合には２を選びなさい。\nア．不利益処分がされた場合に利益を受けることとなる参加人は、聴聞の通知があった時から聴聞が終結する時までの間、行政庁に対し、当該不利益処分の原因となる事実を証する資料の閲覧を求めることができる。\nイ．行政庁は、金銭の給付決定を取り消す不利益処分をしようとする場合には、意見陳述のための手続を執る必要はない。\nウ．聴聞の通知を受けた当事者は、聴聞の期日への出頭に代えて、主宰者に対し、聴聞の期日までに陳述書を提出することができる。\nエ．法令上必要とされる資格がなかったことが判明した場合に必ずすることとされている不利益処分をする行政庁は、当該処分の名あて人の求めがあったときに、当該処分の理由を示せば足りる。", "source": "https://www.moj.go.jp/content/001421751.pdf", "answerSource": "https://www.moj.go.jp/content/001422569.pdf"}, {"id": "R6-gyosei-16", "year": "R6", "yearLabel": "令和6年", "subject": "行政法", "qno": 16, "haiten": 3, "type": "series", "options": 2, "answer": [1, 2, 2, 1], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第16問〕（配点：３）\n行政裁量に関する次のアからエまでの各記述について、最高裁判所の判例に照らし、それぞれ正しい場合には１を、誤っている場合には２を選びなさい。\nア．厚生労働大臣が、生活保護法に基づいて定める保護の基準中の老齢加算に係る部分の改定に際し、最低限度の生活を維持する上で老齢であることに起因する特別な需要が存在するといえるか否かを判断するに当たっては、同大臣に専門技術的かつ政策的な見地からの裁量権が認められる。\nイ．収用委員会には、土地収用法に基づく権利取得裁決において損失補償について裁決するに際し、補償の範囲及びその額の決定に当たって専門技術的かつ政策的な見地からの裁量権が認められる。\nウ．公有水面埋立法第４条第１項第１号が定める要件に適合するとした都道府県知事の判断に違法があるか否かに関する裁判所の審査は、専門技術的な知見に基づいてされた当該知事の判断に不合理な点があるか否かという観点から行われる。\nエ．公有水面埋立法第４条第１項第２号が定める要件に適合するとした都道府県知事の判断に違法があるか否かに関する裁判所の審査は、専門技術的な知見に基づいてされた当該知事の判断に不合理な点があるか否かという観点から行われる。（参照条文）公有水面埋立法第４条都道府県知事ハ埋立ノ免許ノ出願左ノ各号ニ適合スト認ムル場合ヲ除クノ外埋立ノ免許ヲ為スコトヲ得ズ一国土利用上適正且合理的ナルコト二其ノ埋立ガ環境保全及災害防止ニ付十分配慮セラレタルモノナルコト三～六（略） ２、３（略）", "source": "https://www.moj.go.jp/content/001421751.pdf", "answerSource": "https://www.moj.go.jp/content/001422569.pdf"}, {"id": "R6-gyosei-17", "year": "R6", "yearLabel": "令和6年", "subject": "行政法", "qno": 17, "haiten": 3, "type": "series", "options": 2, "answer": [2, 1, 2, 2], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第17問〕（配点：３）\n行政指導に関する次のアからエまでの各記述について、行政手続法に照らし、それぞれ正しい場合には１を、誤っている場合には２を選びなさい。\nア．行政機関は、文書による行政指導に従わなかった相手方に対し、再度、口頭で同一内容の行政指導をした場合において、当該相手方から、確認のために、当該口頭による行政指導の趣旨及び内容並びに責任者を記載した書面の交付を求められたときは、原則として、当該書面を交付しなければならない。\nイ．国の行政機関が地方公共団体に対して行う行政指導には、行政手続法の規定は適用されない。\nウ．何人も、法令に違反する事実があり、その是正のためにされるべき行政指導がされていないと思料するときは、当該行政指導の根拠となる規定が法律に置かれていないとしても、当該行政指導をする権限を有する行政機関に対し、当該行政指導をすることを求めることができる。\nエ．行政指導指針を定めるに当たっては、その公表がされるか否かにかかわらず、原則として、行政手続法所定の意見公募手続を経なければならない。", "source": "https://www.moj.go.jp/content/001421751.pdf", "answerSource": "https://www.moj.go.jp/content/001422569.pdf"}, {"id": "R6-gyosei-18", "year": "R6", "yearLabel": "令和6年", "subject": "行政法", "qno": 18, "haiten": 2, "type": "choice", "options": 8, "answer": [7], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第18問〕（配点：２）\n行政契約に関する次のアからウまでの各記述について、法令又は最高裁判所の判例に照らし、正しいものに〇、誤っているものに×を付した場合の組合せを、後記１から８までの中から選びなさい。\nア．地方公共団体が債務を負担する契約を締結する場合、予算が議会で議決されていれば足り、契約の締結自体について議会の議決が必要とされることはない。\nイ．産業廃棄物の処分業者が、公害防止協定において、協定の相手方である町に対し、その事業や処理施設を将来廃止する旨を約束することは、廃棄物の処理及び清掃に関する法律に基づく都道府県知事の許可に期限を付するに等しいため、同法の趣旨に反する。\nウ．給水契約の申込みが適正かつ合理的な供給計画によっては対応することができないものである場合には、水道事業者は、水道法第１５条第１項にいう「正当の理由」があるものとして、これを拒むことが許される。（参照条文）水道法第１５条水道事業者は、事業計画に定める給水区域内の需要者から給水契約の申込みを受けたときは、正当の理由がなければ、これを拒んではならない。 ２、３（略）\n１．ア○ イ○ ウ○\n２．ア○ イ○ ウ×\n３．ア○ イ× ウ○\n４．ア○ イ× ウ×\n５．ア× イ○ ウ○\n６．ア× イ○ ウ×\n７．ア× イ× ウ○\n８．ア× イ× ウ×", "source": "https://www.moj.go.jp/content/001421751.pdf", "answerSource": "https://www.moj.go.jp/content/001422569.pdf"}, {"id": "R6-gyosei-19", "year": "R6", "yearLabel": "令和6年", "subject": "行政法", "qno": 19, "haiten": 2, "type": "choice", "options": 8, "answer": [8], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第19問〕（配点：２）\n訴えの利益に関する次のアからウまでの各記述について、最高裁判所の判例に照らし、正しいものに○、誤っているものに×を付した場合の組合せを、後記１から８までの中から選びなさい。\nア．市街化区域内にある土地を開発区域として都市計画法第２９条による開発許可を受けた開発行為に関する工事が完了し、当該工事の検査済証の交付がされた後においても、予定建築物についていまだ建築確認がされていないときは、当該許可の取消しを求める訴えの利益は失われない。\nイ．保安林指定解除処分の取消訴訟係属中に代替施設の設置によって洪水や渇水の危険が解消され、その防止上からは保安林の存続の必要性がなくなったとしても、そのような事情は、事情判決に関する規定の適用に際して考慮されるべき事柄であって、当該解除処分の取消しを求める訴えの利益を消滅させるものではない。\nウ．自動車等運転免許証の有効期間の更新に当たり、一般運転者として扱われ、優良運転者である旨の記載のない免許証を交付されて更新処分を受けた者は、上記記載の有無により免許証の有効期間に差異がないことから、自己が優良運転者に当たる旨主張して当該更新処分の取消しを求める訴えの利益を有しない。\n１．ア○ イ○ ウ○\n２．ア○ イ○ ウ×\n３．ア○ イ× ウ○\n４．ア○ イ× ウ×\n５．ア× イ○ ウ○\n６．ア× イ○ ウ×\n７．ア× イ× ウ○\n８．ア× イ× ウ×", "source": "https://www.moj.go.jp/content/001421751.pdf", "answerSource": "https://www.moj.go.jp/content/001422569.pdf"}, {"id": "R6-gyosei-20", "year": "R6", "yearLabel": "令和6年", "subject": "行政法", "qno": 20, "haiten": 3, "type": "series", "options": 2, "answer": [2, 1, 2, 1], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第20問〕（配点：３）\n取消訴訟の審理に関する次のアからエまでの各記述について、行政事件訴訟法に照らし、それぞれ正しい場合には１を、誤っている場合には２を選びなさい。\nア．処分の取消訴訟と当該処分についての審査請求を棄却した裁決の取消訴訟とを提起することができる場合であっても、原告は、当該裁決の取消訴訟において、当該処分の違法を主張することが許される。\nイ．処分についての審査請求を棄却した裁決の取消訴訟を提起した後であっても、原告は、法令に特別の定めがある場合を除き、当該訴訟の口頭弁論の終結に至るまで、当該訴訟に併合して、当該処分の取消訴訟を適法に提起することができる。\nウ．裁判所は、取消訴訟において、必要があると認めるときは、当事者が主張していない事実を職権で認定することができる。\nエ．裁判所は、取消訴訟において、必要があると認めるときは、当事者の申出を待たずに証拠調べをすることができるが、その証拠調べの結果について、当事者の意見をきかなければならない。", "source": "https://www.moj.go.jp/content/001421751.pdf", "answerSource": "https://www.moj.go.jp/content/001422569.pdf"}, {"id": "R6-gyosei-21", "year": "R6", "yearLabel": "令和6年", "subject": "行政法", "qno": 21, "haiten": 3, "type": "series", "options": 2, "answer": [1, 2, 2, 2], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第21問〕（配点：３）\n無効等確認の訴えに関する次のアからエまでの各記述について、法令又は最高裁判所の判例に照らし、それぞれ正しい場合には１を、誤っている場合には２を選びなさい。\nア．原子炉の周辺に居住する住民は、同原子炉の設置者に対しその建設又は運転の差止めを求める民事訴訟を提起していたとしても、同原子炉の設置許可処分の無効確認を求める訴えを適法に提起することができる。\nイ．処分の無効確認を求める訴えにおいては、被告において当該処分が適法かつ有効なものであることを具体的事実に基づき主張する必要があり、原告は、当該処分の無効原因の主張として、抽象的に当該処分に重大かつ明白な瑕疵があると主張すれば足りる。\nウ．行政事件訴訟法においては、裁判所は、処分の無効確認を求める訴えにおいて、当該処分が違法かつ無効なものであるものの、これを無効とすることにより公の利益に著しい障害を生ずる場合であって、処分を無効とすることが公共の福祉に適合しないと認めるときは、請求を棄却することができる旨条文上規定されている。\nエ．土地改良事業の施行に伴い土地改良区から所有地の換地処分を受けた者は、同処分に基づく登記等の手続が全て終了したときは、用途、地積等を総合的に勘案して当該換地が従前の土地に照応したものでなければならない旨のいわゆる照応の原則違反を理由とする同処分の無効確認を求める訴えを適法に提起することができない。", "source": "https://www.moj.go.jp/content/001421751.pdf", "answerSource": "https://www.moj.go.jp/content/001422569.pdf"}, {"id": "R6-gyosei-22", "year": "R6", "yearLabel": "令和6年", "subject": "行政法", "qno": 22, "haiten": 3, "type": "series", "options": 2, "answer": [2, 2, 2, 1], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第22問〕（配点：３）\n行政事件訴訟法上の仮の救済に関する次のアからエまでの各記述について、同法に照らし、それぞれ正しい場合には１を、誤っている場合には２を選びなさい。\nア．処分の執行停止の申立人は、当該執行停止が公共の福祉に重大な影響を及ぼすおそれのないことを疎明する責任を負う。\nイ．処分の執行停止の決定は、口頭弁論を経ないでしなければならない。\nウ．処分の執行又は手続の続行の停止は、処分の効力の停止によって目的を達することができる場合には、することができない。\nエ．処分の仮の差止めを命ずる決定は、第三者に対しては効力を有しない。", "source": "https://www.moj.go.jp/content/001421751.pdf", "answerSource": "https://www.moj.go.jp/content/001422569.pdf"}, {"id": "R6-gyosei-23", "year": "R6", "yearLabel": "令和6年", "subject": "行政法", "qno": 23, "haiten": 2, "type": "choice", "options": 8, "answer": [7], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第23問〕（配点：２）\n損失補償に関する次のアからウまでの各記述について、最高裁判所の判例に照らし、正しいものに○、誤っているものに×を付した場合の組合せを、後記１から８までの中から選びなさい。\nア．都市計画法第５３条により、同条の施行区域内の土地に対し長期間にわたって建築制限が課されてきた場合、当該建築制限による損失は、その内容や程度にかかわらず、特別の犠牲として補償の対象となる。（参照条文）都市計画法第５３条都市計画施設の区域又は市街地開発事業の施行区域内において建築物の建築をしようとする者は、国土交通省令で定めるところにより、都道府県知事等の許可を受けなければならない。ただし、次に掲げる行為については、この限りでない。一～五（略） ２、３（略）\nイ．旅館Ａで火災が発生し、消防団長が消火活動に当たり、旅館Ａに隣接する建物Ｂを破壊した際、建物Ｂへの延焼のおそれはなかったものの、付近の建物への延焼防止のため建物Ｂを破壊する緊急の必要性があった場合、建物Ｂの損失は補償の対象とならない。\nウ．Ｘ社が自己所有地の地下にガソリンタンクを適法に設置したところ、その後、国が地下道を新設したため、上記ガソリンタンクの設置状況が消防法違反の状態となりその移転を余儀なくされた場合でも、Ｘ社の支出した移転費用は道路法第７０条の規定する補償の対象とならない。（参照条文）道路法第７０条土地収用法第９３条第１項の規定による場合の外、道路を新設し、又は改築したことに因り、当該道路に面する土地について、通路、みぞ、かき、さくその他の工作物を新築し、増築し、修繕し、若しくは移転し、又は切土若しくは盛土をするやむを得ない必要があると認められる場合においては、道路管理者は、これらの工事をすることを必要とする者（中略）の請求により、これに要する費用の全部又は一部を補償しなければならない。（以下略） ２～４（略）\n１．ア○ イ○ ウ○\n２．ア○ イ○ ウ×\n３．ア○ イ× ウ○\n４．ア○ イ× ウ×\n５．ア× イ○ ウ○\n６．ア× イ○ ウ×\n７．ア× イ× ウ○\n８．ア× イ× ウ×", "source": "https://www.moj.go.jp/content/001421751.pdf", "answerSource": "https://www.moj.go.jp/content/001422569.pdf"}, {"id": "R6-gyosei-24", "year": "R6", "yearLabel": "令和6年", "subject": "行政法", "qno": 24, "haiten": 2, "type": "choice", "options": 8, "answer": [6], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第24問〕（配点：２）\n行政組織に関する次のアからウまでの各記述について、法令又は最高裁判所の判例に照らし、正しいものに○、誤っているものに×を付した場合の組合せを、後記１から８までの中から選びなさい。\nア．内閣法第１０条は権限の代理に関する規定ではなく、権限の委任に関する規定であるから、同条に基づき内閣総理大臣により指定された国務大臣が行った処分は、当該国務大臣の処分として法的効力を生じる。（参照条文）内閣法第１０条主任の国務大臣に事故のあるとき、又は主任の国務大臣が欠けたときは、内閣総理大臣又はその指定する国務大臣が、臨時に、その主任の国務大臣の職務を行う。\nイ．内閣府は、内閣の事務を助けることを任務とする行政機関であるが、内閣府の長である内閣総理大臣は、各省大臣と同様に内閣の統轄の下で行政事務を分担管理する。\nウ．地方の実情に適応した教育を行わせることを旨とする教育に関する地方自治の原則によれば、国の行政機関は、地方公共団体で設置される教育委員会が有する教育に関する固有の権限に対して介入することができない。\n１．ア○ イ○ ウ○\n２．ア○ イ○ ウ×\n３．ア○ イ× ウ○\n４．ア○ イ× ウ×\n５．ア× イ○ ウ○\n６．ア× イ○ ウ×\n７．ア× イ× ウ○\n８．ア× イ× ウ×", "source": "https://www.moj.go.jp/content/001421751.pdf", "answerSource": "https://www.moj.go.jp/content/001422569.pdf"}, {"id": "R6-minpo-1", "year": "R6", "yearLabel": "令和6年", "subject": "民法", "qno": 1, "haiten": 2, "type": "choice", "options": 5, "answer": [5], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第１問〕（配点：２）\n法人に関する次のアからオまでの各記述のうち、判例の趣旨に照らし誤っているものを組み合わせたものは、後記１から５までのうちどれか。\nア．法人は、保佐人になることができる。\nイ．法人は、民法上の組合の組合員になることができる。\nウ．法人は、遺言執行者になることができない。\nエ．会社は、定款に明示された目的を遂行する上で間接的に必要となるに過ぎない行為をしたときであっても、その行為により権利を有し、義務を負う。\nオ．法人は、名誉毀損によって受けた無形の損害について、その賠償を請求することができない。\n１．アエ\n２．アオ\n３．イウ\n４．イエ\n５．ウオ", "source": "https://www.moj.go.jp/content/001421752.pdf", "answerSource": "https://www.moj.go.jp/content/001422570.pdf"}, {"id": "R6-minpo-2", "year": "R6", "yearLabel": "令和6年", "subject": "民法", "qno": 2, "haiten": 2, "type": "choice", "options": 5, "answer": [1], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第２問〕（配点：２）\n時効取得に関する次のアからオまでの各記述のうち、判例の趣旨に照らし誤っているものを組み合わせたものは、後記１から５までのうちどれか。\nア．土地の占有者が所有者からの明渡請求を拒否して占有を継続してきたときは、取得時効の要件である平穏な占有があるとはいえない。\nイ．所有権の取得時効期間の計算においては、占有の開始の時が午前零時でなかったときであっても、占有開始の日が算入される。\nウ．土地の賃借権の取得時効が成立するためには、土地の継続的用益が賃借の意思に基づくことが客観的に表現されていることが必要である。\nエ．所有権の取得時効は、占有者が他人によって物の占有を奪われたときであっても、占有回収の訴えにより現実にその物の占有を回復したときは、中断しない。\nオ．所有権以外の財産権を、自己のためにする意思をもって、平穏に、かつ、公然と行使する者は、法定の期間を経過した後、その権利を時効によって取得する。\n１．アイ\n２．アオ\n３．イウ\n４．ウエ\n５．エオ", "source": "https://www.moj.go.jp/content/001421752.pdf", "answerSource": "https://www.moj.go.jp/content/001422570.pdf"}, {"id": "R6-minpo-3", "year": "R6", "yearLabel": "令和6年", "subject": "民法", "qno": 3, "haiten": 2, "type": "choice", "options": 5, "answer": [4], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第３問〕（配点：２）\n不動産の物権変動に関する次のアからオまでの各記述のうち、判例の趣旨に照らし正しいものを組み合わせたものは、後記１から５までのうちどれか。\nア．ＡがＡ所有の甲土地をＢに売却した後、Ａが甲土地をＣにも売却した。ＡからＢへの所有権移転登記も、ＡからＣへの所有権移転登記もされていない。この場合、Ｂは、甲土地の所有権の取得を第三者Ｃに対抗することができる。\nイ．Ａ所有の甲土地について、Ｂが、Ａに無断で、Ｂを所有権の登記名義人とする登記を備えた。 Ｂと善意無過失のＣとの間で甲土地の売買がされ、ＢからＣへの所有権移転登記がされたときは、Ｃは、甲土地の所有権を取得する。\nウ．ＡがＡ所有の甲土地をＢに売却し、ＡからＢへの所有権移転登記がされた後、Ａは、詐欺を理由に甲土地の売買契約を取り消した。Ｂは、その取消し後に甲土地をＣに売却した。この場合、Ａは、甲土地の所有権がＡに復帰した旨の登記を備えなければ、そのことを第三者Ｃに対抗することができない。\nエ．ＡとＢが共有する土地について、ＡがＡの共有持分を放棄し、その共有持分をＢが取得した場合において、その旨の登記がされる前に、Ａの債権者ＣがＡの共有持分を差し押さえたときは、Ｂは、Ａの共有持分の取得を第三者Ｃに対抗することができない。\nオ．ＡがＡ所有の甲土地をＢに売却した後、ＡからＢへの所有権移転登記がされないままＡが死亡した。ＣがＡの唯一の相続人である場合において、Ｃが相続により甲土地の所有権を取得した旨の登記がされたときは、Ｂは、甲土地の所有権の取得をＣに対抗することができない。\n１．アイ\n２．アウ\n３．イオ\n４．ウエ\n５．エオ", "source": "https://www.moj.go.jp/content/001421752.pdf", "answerSource": "https://www.moj.go.jp/content/001422570.pdf"}, {"id": "R6-minpo-4", "year": "R6", "yearLabel": "令和6年", "subject": "民法", "qno": 4, "haiten": 2, "type": "choice", "options": 5, "answer": [2], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第４問〕（配点：２）\n即時取得に関する次のアからオまでの各記述のうち、判例の趣旨に照らし誤っているものを組み合わせたものは、後記１から５までのうちどれか。\nア．ＡがＢから預かっているＢ所有の種子甲を自らの所有物であると偽って、Ｃに対し、消費貸借の目的として貸し、現実の引渡しをした場合には、Ａが甲の所有者であるとＣが過失なく信じたときであっても、Ｃは、甲の所有権を即時取得しない。\nイ．Ａは、代理権を有していないにもかかわらず、Ｂの代理人と称して、Ｂ所有のパソコン甲を、 Ｂが甲の所有者であることを知るとともに、ＡがＢの代理人であると過失なく信じたＣに売り、甲を現実に引き渡した。この場合は、Ｃは、甲の所有権を即時取得しない。\nウ．Ａは、Ａ所有のパソコン甲をＢに売り、現実の引渡しをした後、錯誤を理由にＡＢ間の売買契約を取り消した。Ｂが甲の現実の引渡しを受けた時に、Ａの意思表示に錯誤がないと過失なく信じていたときであっても、Ｂは、甲の所有権を即時取得しない。\nエ．Ａは、Ｂから預かっているＢ所有のパソコン甲を自らの所有物であると偽ってＣに売り、Ｃ との間で、以後ＡがＣのために甲を占有する旨の合意をした。この合意の時に、Ａが甲の所有者であるとＣが過失なく信じていたときは、Ｃは、甲の所有権を即時取得する。\nオ．Ａは、ＢからＢ所有のパソコン甲を預かっていた。Ａが死亡し、Ａの唯一の相続人Ｃが甲の占有を始めた場合には、Ａが甲の所有者であるとＣが過失なく信じていたときであっても、Ｃ は、甲の所有権を即時取得しない。\n１．アウ\n２．アエ\n３．イウ\n４．イオ\n５．エオ", "source": "https://www.moj.go.jp/content/001421752.pdf", "answerSource": "https://www.moj.go.jp/content/001422570.pdf"}, {"id": "R6-minpo-5", "year": "R6", "yearLabel": "令和6年", "subject": "民法", "qno": 5, "haiten": 2, "type": "choice", "options": 5, "answer": [5], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第５問〕（配点：２）\n地役権に関する次のアからオまでの各記述のうち、判例の趣旨に照らし誤っているものを組み合わせたものは、後記１から５までのうちどれか。\nア．地役権者による承役地の使用は、地役権の目的を達成するのに必要であり、かつ、承役地の所有者のために損害が最も少ない範囲に限られる。\nイ．地役権は、設定行為に別段の定めがあるときを除き、要役地について存する地上権の目的となる。\nウ．承役地の所有者が設定行為により自己の費用で地役権の行使のために工作物を設ける義務を負担したときは、承役地の所有者の特定承継人も、その義務を負担する。\nエ．要役地が数人の共有に属するときは、共有者全員について消滅時効の更新事由がなければ、時効の更新は、その効力を生じない。\nオ．通行地役権は、承役地となる土地の所有者によってその土地の上に通路が開設されたときでなければ、時効によって取得することができない。\n１．アイ\n２．アウ\n３．イオ\n４．ウエ\n５．エオ", "source": "https://www.moj.go.jp/content/001421752.pdf", "answerSource": "https://www.moj.go.jp/content/001422570.pdf"}, {"id": "R6-minpo-6", "year": "R6", "yearLabel": "令和6年", "subject": "民法", "qno": 6, "haiten": 2, "type": "choice", "options": 5, "answer": [1], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第６問〕（配点：２）\n留置権に関する次のアからオまでの各記述のうち、判例の趣旨に照らし誤っているものを組み合わせたものは、後記１から５までのうちどれか。\nア．ＡがＡ所有の甲土地をＢに売却し引き渡した後、Ａが甲土地をＣに売却してＡからＣへの所有権移転登記がされたときは、Ｂは、Ｃからの所有権に基づく明渡請求に対し、売買契約に基づく所有権移転義務の履行不能を理由とするＡに対する損害賠償請求権を被担保債権として、留置権を行使することができる。\nイ．甲建物の賃借人でありその引渡しを受けたＡが、その所有者であり賃貸人であるＢに対する有益費償還請求権を被担保債権として甲建物につき留置権を行使するときは、Ｂに対し、留置権を行使している間の建物の使用の対価を支払うことを要しない。\nウ．ＡがＢ所有の時計をＣに売り、引き渡したものの、Ｃに即時取得が成立しないときは、Ｃは、 Ｂからの所有権に基づく返還請求に対し、売買契約に基づく所有権移転義務の履行不能を理由とするＡに対する損害賠償請求権を被担保債権として、留置権を行使することができない。\nエ．Ａ所有の甲土地を建物所有目的で賃借し、その引渡しを受けていたＢが甲土地上に存するＢ 所有の建物につき建物買取請求権を行使したときは、Ｂは、Ａからの甲土地の明渡請求に対し、その建物の代金債権を被担保債権として、留置権を行使することができる。\nオ．Ａ所有の時計を留置権に基づいて留置しているＢが、その時計をＡの承諾を得ずにＣに賃貸したときは、Ａは、留置権の消滅を請求することができる。\n１．アイ\n２．アオ\n３．イウ\n４．ウエ\n５．エオ", "source": "https://www.moj.go.jp/content/001421752.pdf", "answerSource": "https://www.moj.go.jp/content/001422570.pdf"}, {"id": "R6-minpo-7", "year": "R6", "yearLabel": "令和6年", "subject": "民法", "qno": 7, "haiten": 2, "type": "choice", "options": 5, "answer": [2], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第７問〕（配点：２）\n質権に関する次のアからオまでの各記述のうち、誤っているものを組み合わせたものは、後記１から５までのうちどれか。\nア．質権者は、質権設定者の承諾を得なければ、質物について、自己の債務を被担保債権として質権を設定することができない。\nイ．動産質権者は、質物から生ずる果実を収取し、他の債権者に先立って、これを自己の債権の弁済に充当することができる。\nウ．動産質権者は、質権設定者の承諾を得なくても、質物の保存に必要な使用をすることができる。\nエ．不動産質権の目的である不動産の管理の費用は、設定行為に別段の定めがないときは、不動産質権者が負担する。\nオ．質権は、設定行為に別段の定めがないときは、質物の隠れた瑕疵によって生じた損害の賠償を担保しない。\n１．アエ\n２．アオ\n３．イウ\n４．イオ\n５．ウエ", "source": "https://www.moj.go.jp/content/001421752.pdf", "answerSource": "https://www.moj.go.jp/content/001422570.pdf"}, {"id": "R6-minpo-8", "year": "R6", "yearLabel": "令和6年", "subject": "民法", "qno": 8, "haiten": 2, "type": "choice", "options": 5, "answer": [2], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第８問〕（配点：２）\n債権の目的に関する次のアからオまでの各記述のうち、判例の趣旨に照らし誤っているものを組み合わせたものは、後記１から５までのうちどれか。\nア．債権者は、外国の通貨で債権額が指定された金銭債権について、債務者に対し、日本の通貨による履行を請求することができない。\nイ．債権の目的が２個の給付の中から選択によって定まる場合において、一方の給付が、選択権を有する者の過失によらず不能となったときは、債権の目的は、他方の給付に特定しない。\nウ．選択債権における選択権は、別段の意思表示がないときは、債務者に属する。\nエ．支分権としての利息債権は、既に発生したものであっても、元本債権から分離して譲渡することができない。\nオ．債務者による利息の支払が１年分以上延滞した場合において、債権者が催告をしても、債務者がその利息を支払わないときは、債権者は、延滞した利息を元本に組み入れることができる。\n１．アイ\n２．アエ\n３．イウ\n４．ウオ\n５．エオ", "source": "https://www.moj.go.jp/content/001421752.pdf", "answerSource": "https://www.moj.go.jp/content/001422570.pdf"}, {"id": "R6-minpo-9", "year": "R6", "yearLabel": "令和6年", "subject": "民法", "qno": 9, "haiten": 2, "type": "choice", "options": 5, "answer": [5], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第９問〕（配点：２）\n弁済に関する次のアからオまでの各記述のうち、判例の趣旨に照らし誤っているものを組み合わせたものは、後記１から５までのうちどれか。\nア．種類債務の債務者が他人の物を弁済として引き渡し、債権者がその物の所有権を取得することができない場合であっても、債権者がその物を善意で消費したときは、その弁済は、有効である。\nイ．債務者が１個の債務について元本のほか利息及び費用を支払うべき場合において、債務者がその債務の全部を消滅させるのに足りない給付をしたときは、当事者間の別段の合意がない限り、これを順次に費用、利息及び元本に充当しなければならない。\nウ．真正なキャッシュカードを盗取した者が、機械払の方法により当該キャッシュカードに係る預金の払戻しを受けたときは、当該払戻しが受領権者としての外観を有する者に対する弁済として有効となることはない。\nエ．債務者が、債権者との間で、その負担した給付に代えて他の給付をすることにより債務を消滅させる旨の契約をしたときであっても、債務者は、当初負担した給付をして債務を消滅させることができる。\nオ．後順位抵当権者は、先順位抵当権者の意思に反して先順位抵当権の被担保債権の弁済をすることができない。\n１．アウ\n２．アエ\n３．イエ\n４．イオ\n５．ウオ", "source": "https://www.moj.go.jp/content/001421752.pdf", "answerSource": "https://www.moj.go.jp/content/001422570.pdf"}, {"id": "R6-minpo-10", "year": "R6", "yearLabel": "令和6年", "subject": "民法", "qno": 10, "haiten": 2, "type": "choice", "options": 5, "answer": [4], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第10問〕（配点：２）\n特定物甲の売主Ａが買主Ｂから代金の支払を受けるまでに、甲は、ＡＢいずれの責めにも帰することができない事由によって滅失又は損傷した。この事例に関する次のアからオまでの各記述のうち、誤っているものを組み合わせたものは、後記１から５までのうちどれか。\nア．甲の滅失がＢへの引渡し前に生じた場合において、ＡがＢに対し代金の支払を求めて訴えを提起したときは、Ｂの危険負担の抗弁は、ＢがＡに対し代金の支払を拒絶することを主張して行使しなければならない。\nイ．甲の滅失がＢへの引渡し前に生じた場合において、ＡがＢに対し代金の支払を求めて訴えを提起し、Ｂの危険負担の抗弁の主張が認められるときは、請求棄却の判決がされる。\nウ．甲の損傷がＢへの引渡し前に生じた場合には、過分の費用を要することなく甲を契約の内容に適合した状態に修復して引き渡すことができるときであっても、Ｂは、危険負担の抗弁を主張して、代金の一部の支払を拒むことができる。\nエ．ＡＢ間の売買契約に甲の所有権は代金完済時に移転する旨の特約が付されていた場合において、甲の滅失がＢへの引渡し後であったときは、Ｂは、危険負担の抗弁を主張して代金の支払を拒むことができる。\nオ．ＡがＢに甲を引き渡そうとしたところ、その品質が契約の内容に適合しないものであったためにＢがその受領を拒んだときは、その後に甲の滅失が生じたとしても、Ｂは、危険負担の抗弁を主張して代金の支払を拒むことができる。\n１．アイ\n２．アオ\n３．イエ\n４．ウエ\n５．ウオ", "source": "https://www.moj.go.jp/content/001421752.pdf", "answerSource": "https://www.moj.go.jp/content/001422570.pdf"}, {"id": "R6-minpo-11", "year": "R6", "yearLabel": "令和6年", "subject": "民法", "qno": 11, "haiten": 2, "type": "choice", "options": 5, "answer": [3], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第11問〕（配点：２）\n使用貸借契約に基づいて貸主Ａが借主Ｂにその目的物である甲建物を引き渡した場合に関する次のアからオまでの各記述のうち、誤っているものを組み合わせたものは、後記１から５までのうちどれか。\nア．Ｂが甲建物について通常の必要費を支出したときは、Ｂは、その償還をＡに請求することができない。\nイ．Ｂが甲建物の引渡しを受けた後に乙動産を甲建物に附属させ、これを分離するのに過分の費用を要する場合であっても、Ｂは、使用貸借が終了したときは、乙動産を収去する義務を負う。\nウ．ＡＢ間の使用貸借は、Ａの死亡によって終了する。\nエ．使用貸借の期間並びに使用及び収益の目的が定められていなかったときは、Ａは、いつでも契約の解除をすることができる。\nオ．Ｂが契約の本旨に反する使用をしたことによって生じた損害の賠償請求権については、Ａが甲建物の返還を受けた時から１年を経過するまでの間は、時効は、完成しない。\n１．アイ\n２．アオ\n３．イウ\n４．ウエ\n５．エオ", "source": "https://www.moj.go.jp/content/001421752.pdf", "answerSource": "https://www.moj.go.jp/content/001422570.pdf"}, {"id": "R6-minpo-12", "year": "R6", "yearLabel": "令和6年", "subject": "民法", "qno": 12, "haiten": 2, "type": "choice", "options": 5, "answer": [4], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第12問〕（配点：２）\n寄託に関する次のアからオまでの各記述のうち、正しいものを組み合わせたものは、後記１から ５までのうちどれか。\nア．無報酬の受寄者は、寄託が書面によってされたときであっても、寄託物を受け取るまで、寄託契約の解除をすることができる。\nイ．受寄者は、報酬の有無にかかわらず、自己の財産に対するのと同一の注意をもって寄託物を保管する義務を負う。\nウ．寄託物の性質によって受寄者に損害が生じた場合は、寄託者が過失なくその性質を知らなかったとき、又は受寄者がこれを知っていたときを除き、寄託者は、その損害を受寄者に賠償しなければならない。\nエ．受寄者は、寄託物を保管するのに必要と認められる債務を負担した場合は、無報酬のときに限り、寄託者に対し、自己に代わってその弁済をすることを請求することができる。\nオ．預金契約による金銭の受寄者は、返還の時期の定めの有無にかかわらず、寄託者に対し、いつでも寄託された金銭の返還をすることができる。\n１．アイ\n２．アウ\n３．イエ\n４．ウオ\n５．エオ", "source": "https://www.moj.go.jp/content/001421752.pdf", "answerSource": "https://www.moj.go.jp/content/001422570.pdf"}, {"id": "R6-minpo-13", "year": "R6", "yearLabel": "令和6年", "subject": "民法", "qno": 13, "haiten": 2, "type": "choice", "options": 5, "answer": [4], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第13問〕（配点：２）\n事務管理に関する次のアからオまでの各記述のうち、誤っているものを組み合わせたものは、後記１から５までのうちどれか。\nア．管理者が他人の事務の管理を始めた時にそれが本人の意思に反することが明らかであったときは、事務管理は、成立しない。\nイ．管理者は、本人の意思を推知することができるときは、その意思に従って事務管理をしなければならない。\nウ．事務管理をするについて費用を要するときは、本人は、管理者の請求により、その前払をしなければならない。\nエ．管理者が本人の身体に対する急迫の危害を免れさせるために事務管理をした場合において、管理者に故意又は過失があったときは、管理者は、これによって生じた損害を賠償する責任を負う。\nオ．管理者は、本人に引き渡すべき金額を自己のために消費したときは、その消費した日以後の利息を支払わなければならない。\n１．アイ\n２．アオ\n３．イウ\n４．ウエ\n５．エオ", "source": "https://www.moj.go.jp/content/001421752.pdf", "answerSource": "https://www.moj.go.jp/content/001422570.pdf"}, {"id": "R6-minpo-14", "year": "R6", "yearLabel": "令和6年", "subject": "民法", "qno": 14, "haiten": 2, "type": "choice", "options": 5, "answer": [2], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第14問〕（配点：２）\n婚姻及び離婚に関する次のアからオまでの各記述のうち、判例の趣旨に照らし正しいものを組み合わせたものは、後記１から５までのうちどれか。\nア．父と母が、子に嫡出子の地位を得させるための便法としてすることを合意して婚姻の届出をしたものの、父母の双方に真に社会観念上夫婦であると認められる関係の設定を欲する効果意思がなかったときは、婚姻は、無効である。\nイ．夫婦としての実質的生活関係が存続している男女が婚姻意思に基づいて婚姻届を作成したものの、婚姻届の提出の時にその一方が昏睡状態に陥っていたときは、婚姻は、無効である。\nウ．夫婦としての実質的生活関係が存在している男女の一方が他方の意思に基づかずに婚姻届を作成し、これを提出したものの、後に他方が当該届出の事実を知ってこれを追認したときは、婚姻は、その追認の時から有効となる。\nエ．夫婦が、法律上の婚姻関係を解消する意思の合致に基づいて離婚の届出をしたものの、その届出が生活保護費の受給を継続するための方便としてのものであり、その後も夫婦としての実質的生活関係を継続したときは、離婚は、無効である。\nオ．夫婦が、離婚意思に基づいて離婚届を作成し、夫婦の一方がいったん保管した後にこれを提出したものの、他方が届出時までに翻意していたことが明確であったときは、離婚は、無効である。\n１．アエ\n２．アオ\n３．イウ\n４．イエ\n５．ウオ", "source": "https://www.moj.go.jp/content/001421752.pdf", "answerSource": "https://www.moj.go.jp/content/001422570.pdf"}, {"id": "R6-minpo-15", "year": "R6", "yearLabel": "令和6年", "subject": "民法", "qno": 15, "haiten": 2, "type": "choice", "options": 5, "answer": [4], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第15問〕（配点：２）\n遺留分に関する次のアからオまでの各記述のうち、正しいものを組み合わせたものは、後記１から５までのうちどれか。\nア．代襲相続人は、遺留分を有しない。\nイ．被相続人の兄弟姉妹は、遺留分を有しない。\nウ．Ａが死亡し、その子Ｂ及びＣがＡの相続人となるべき場合は、Ｂが相続の放棄をしたときでも、Ｃが遺留分として受ける額は、変わらない。\nエ．相続の開始前における遺留分の放棄は、家庭裁判所の許可を受けたときに限り、効力を生ずる。\nオ．遺留分侵害額の請求は、訴えによってしなければならない。\n１．アウ\n２．アオ\n３．イウ\n４．イエ\n５．エオ ［商法］", "source": "https://www.moj.go.jp/content/001421752.pdf", "answerSource": "https://www.moj.go.jp/content/001422570.pdf"}, {"id": "R6-shoho-16", "year": "R6", "yearLabel": "令和6年", "subject": "商法", "qno": 16, "haiten": 2, "type": "choice", "options": 5, "answer": [1], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第16問〕（配点：２）\n取締役会設置会社（指名委員会等設置会社を除く。）の発起設立に関する次のアからオまでの各記述のうち、正しいものを組み合わせたものは、後記１から５までのうちどれか。\nア．発起人は、設立時取締役になるか否かにかかわらず、設立時発行株式を１株以上引き受けなければならない。\nイ．発起人は、設立時代表取締役を選定しなければならない。\nウ．株式会社の成立により発起人が受ける報酬についての定めは、株式会社を設立する際の定款に記載し、又は記録しなければ、その効力を生じない。\nエ．発起人がその引き受けた設立時発行株式の払込金額の払込みを仮装した場合には、当該発起人から当該設立時発行株式を譲り受けた者は、善意でかつ重大な過失がないときであっても、当該設立時発行株式についての株主の権利を行使することができない。\nオ．発起人は、株式会社の成立の前に、創立総会を招集しなければならない。\n１．アウ\n２．アオ\n３．イウ\n４．イエ\n５．エオ", "source": "https://www.moj.go.jp/content/001421752.pdf", "answerSource": "https://www.moj.go.jp/content/001422570.pdf"}, {"id": "R6-shoho-17", "year": "R6", "yearLabel": "令和6年", "subject": "商法", "qno": 17, "haiten": 2, "type": "choice", "options": 5, "answer": [3], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第17問〕（配点：２）\n会社法上の公開会社の株式に関する次のアからオまでの各記述のうち、正しいものを組み合わせたものは、後記１から５までのうちどれか。\nア．株式会社は、ある種類の株式の株主が当該種類の株式１株につき複数個の議決権を有することを内容とする種類の株式を発行することができる。\nイ．株式会社は、定款を変更して発行可能株式総数についての定めを廃止することができない。\nウ．株式会社は、定款を変更して発行可能株式総数を減少する場合には、変更後の発行可能株式総数を当該定款の変更が効力を生じた時における発行済株式の総数未満とすることができる。\nエ．株式会社は、定款を変更して発行可能株式総数を増加する場合には、変更後の発行可能株式総数を当該定款の変更が効力を生じた時における発行済株式の総数の４倍以下としなければならない。\nオ．株券発行会社は、単元未満株式に係る株券を発行しないことができる旨を定款で定めることができない。\n１．アイ\n２．アウ\n３．イエ\n４．ウオ\n５．エオ", "source": "https://www.moj.go.jp/content/001421752.pdf", "answerSource": "https://www.moj.go.jp/content/001422570.pdf"}, {"id": "R6-shoho-18", "year": "R6", "yearLabel": "令和6年", "subject": "商法", "qno": 18, "haiten": 2, "type": "choice", "options": 5, "answer": [4], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第18問〕（配点：２）\n株式の併合に関する次のアからオまでの各記述のうち、正しいものを組み合わせたものは、後記 １から５までのうちどれか。なお、各記述に係る株式会社の定款には、単元株式数の定めがないものとする。\nア．株式買取請求をした反対株主は、会社法上所定の期間内に株式会社との間で株式の価格の決定についての協議が調った後であっても、当該株式会社の承諾を得ることなく株式買取請求を撤回することができる。\nイ．株式会社が株式の併合をしようとするときは、株主総会の決議によって、当該株式の併合の効力発生日のほか、当該株式の併合の基準日を定めなければならない。\nウ．株式の併合が法令に違反する場合において、株主が不利益を受けるおそれがあるときは、株主は、株式会社に対し、当該株式の併合をやめることを請求することができる。\nエ．株式の併合をした株式会社は、株主総会で決議された当該株式の併合の効力発生日における発行可能株式総数についての定めに従い、当該効力発生日に、当該発行可能株式総数に係る定款の変更をしたものとみなされる。\nオ．会社法上の公開会社である株券発行会社は、株式の併合をしたときは、併合した株式に係る株券を発行することを要しない。\n１．アイ\n２．アウ\n３．イオ\n４．ウエ\n５．エオ", "source": "https://www.moj.go.jp/content/001421752.pdf", "answerSource": "https://www.moj.go.jp/content/001422570.pdf"}, {"id": "R6-shoho-19", "year": "R6", "yearLabel": "令和6年", "subject": "商法", "qno": 19, "haiten": 2, "type": "choice", "options": 5, "answer": [3], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第19問〕（配点：２）\n新株予約権に関する次のアからオまでの各記述のうち、正しいものを組み合わせたものは、後記 １から５までのうちどれか。\nア．新株予約権付社債に付された新株予約権を行使することができる期間の終期は、当該新株予約権付社債の償還の期限と一致するように定めなければならない。\nイ．募集新株予約権の引受けの申込みをした者は、割当日に、株式会社が割り当てた募集新株予約権の新株予約権者となる。\nウ．株式会社は、株主に対して新たに払込みをさせないで当該株式会社の新株予約権の割当てをすることができる。\nエ．株式会社は、譲渡による譲渡制限新株予約権の取得を承認しない旨の決定をしたときは、当該譲渡制限新株予約権を買い取る者を指定し、又は当該譲渡制限新株予約権を買い取らなければならない。\nオ．株式会社は、取得条項付新株予約権の内容に基づき当該取得条項付新株予約権を取得するのと引換えに、当該取得条項付新株予約権の新株予約権者に対して分配可能額を超える額の金銭を交付することができない。\n１．アイ\n２．アエ\n３．イウ\n４．ウオ\n５．エオ", "source": "https://www.moj.go.jp/content/001421752.pdf", "answerSource": "https://www.moj.go.jp/content/001422570.pdf"}, {"id": "R6-shoho-20", "year": "R6", "yearLabel": "令和6年", "subject": "商法", "qno": 20, "haiten": 2, "type": "choice", "options": 5, "answer": [5], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第20問〕（配点：２）\n取締役会設置会社でない株式会社に関する次の１から５までの各記述のうち、誤っているものはどれか。\n１．取締役会設置会社でない株式会社は、定款の定めに基づく取締役の互選によって、取締役の中から代表取締役を定めることができる。\n２．取締役会設置会社でない株式会社は、監査役を置くことができる。\n３．取締役会設置会社でない株式会社は、監査役会を置くことができない。\n４．取締役会設置会社でない株式会社の株主は、株主総会の日の前に当該株式会社に対して通知をすることなく、その有する議決権を統一しないで行使することができる。\n５．取締役会設置会社でない株式会社において、取締役が２名以上ある場合において、代表取締役その他当該株式会社を代表する者を定めていないときは、取締役は、定款に別段の定めがある場合を除き、委任を受けていなくても、各自が当該株式会社の業務を決定することができる。", "source": "https://www.moj.go.jp/content/001421752.pdf", "answerSource": "https://www.moj.go.jp/content/001422570.pdf"}, {"id": "R6-shoho-21", "year": "R6", "yearLabel": "令和6年", "subject": "商法", "qno": 21, "haiten": 2, "type": "choice", "options": 5, "answer": [3], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第21問〕（配点：２）\n株主総会又は取締役会の決議に関する次のアからオまでの各記述のうち、判例の趣旨に照らし正しいものを組み合わせたものは、後記１から５までのうちどれか。\nア．取締役会設置会社において、利益相反取引をすることについて取締役会の承認を受けたときは、当該取引をした取締役は、当該取引によって生じた当該取締役会設置会社の損害を賠償する責任を負わない。\nイ．代表取締役の解職に関する取締役会の決議について、その代表取締役は、議決に加わることができない。\nウ．代表取締役が取締役会の決議を経てすることを要する対外的な個々的取引行為を取締役会の決議を経ないでした場合には、当該取引行為は、内部的意思決定を欠くため、原則として無効である。\nエ．定款の定めも株主総会の決議もなく支払われた取締役の報酬について事後に株主総会の決議を経たときは、特段の事情がない限り、当該報酬の支払は有効である。\nオ．会社法上の公開会社において、代表取締役が、株主総会の特別決議を経ることなく、株主以外の者に対して特に有利な払込金額で新株を発行した場合には、当該新株発行には無効原因がある。\n１．アイ\n２．アウ\n３．イエ\n４．ウオ\n５．エオ", "source": "https://www.moj.go.jp/content/001421752.pdf", "answerSource": "https://www.moj.go.jp/content/001422570.pdf"}, {"id": "R6-shoho-22", "year": "R6", "yearLabel": "令和6年", "subject": "商法", "qno": 22, "haiten": 2, "type": "choice", "options": 5, "answer": [5], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第22問〕（配点：２）\n株式会社（特例有限会社を除く。）の監査役に関する次のアからオまでの各記述のうち、正しいものを組み合わせたものは、後記１から５までのうちどれか。\nア．株式会社の親会社の取締役は、当該株式会社の監査役を兼ねることができない。\nイ．取締役会設置会社の監査役が自己又は第三者のために当該取締役会設置会社の事業の部類に属する取引をしようとするときは、取締役会の承認を受けなければならない。\nウ．成年被後見人は、監査役となることができない。\nエ．監査役会設置会社でない株式会社の監査役は、会計監査人が職務上の義務に違反し、又は職務を怠った場合には、監査役の全員の同意によって当該会計監査人を解任することができる。\nオ．会社法上の公開会社でない株式会社は、監査役の任期を選任後１０年以内に終了する事業年度のうち最終のものに関する定時株主総会の終結の時までとする旨を定款で定めることができる。\n１．アイ\n２．アウ\n３．イオ\n４．ウエ\n５．エオ", "source": "https://www.moj.go.jp/content/001421752.pdf", "answerSource": "https://www.moj.go.jp/content/001422570.pdf"}, {"id": "R6-shoho-23", "year": "R6", "yearLabel": "令和6年", "subject": "商法", "qno": 23, "haiten": 2, "type": "choice", "options": 5, "answer": [5], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第23問〕（配点：２）\n甲株式会社（以下「甲社」という。）が乙株式会社（以下「乙社」という。）に対してその事業の一部を吸収分割又は事業譲渡の方法により承継させる場合に関する次のアからオまでの各記述のうち、正しいものを組み合わせたものは、後記１から５までのうちどれか。\nア．吸収分割及び事業譲渡のいずれの方法による場合であっても、乙社が、甲社に対して当該承継の対価として乙社の株式を交付するには、裁判所に対して検査役の選任の申立てをしなければならない。\nイ．乙社の反対株主の乙社に対する株式買取請求権についての会社法の規定があるのは、事業譲渡の方法による場合のみである。\nウ．乙社が、甲社との合意により、当該承継に際して甲社の新株予約権の新株予約権者に対して当該新株予約権に代わる乙社の新株予約権を交付することができるのは、吸収分割の方法による場合のみである。\nエ．甲社がその債務を乙社に免責的に承継させようとする場合に当該債務に係る債権者の個別の同意を得る必要があるのは、吸収分割の方法による場合のみである。\nオ．甲社及び乙社が、効力発生日後遅滞なく、共同して当該承継に関する会社法所定の書面又は電磁的記録を作成しなければならないのは、吸収分割の方法による場合のみである。\n１．アイ\n２．アオ\n３．イエ\n４．ウエ\n５．ウオ", "source": "https://www.moj.go.jp/content/001421752.pdf", "answerSource": "https://www.moj.go.jp/content/001422570.pdf"}, {"id": "R6-shoho-24", "year": "R6", "yearLabel": "令和6年", "subject": "商法", "qno": 24, "haiten": 2, "type": "choice", "options": 5, "answer": [2], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第24問〕（配点：２）\n株主総会の決議の取消しの訴えに関する次の１から５までの各記述のうち、判例の趣旨に照らし正しいものはどれか。\n１．取締役の選任についての株主総会の決議の取消しの訴えは、株式会社及び選任された取締役を被告としなければならない。\n２．株主総会の決議の取消しの訴えを提起した株主が出訴期間の経過後に当初の主張とは異なる取消事由を新たに追加して主張することは、許されない。\n３．株主は、他の株主に対する株主総会の招集手続の瑕疵を理由として株主総会の決議の取消しの訴えを提起することができない。\n４．ある事業年度に係る計算書類の承認についての株主総会の決議の取消しの訴えに係る訴訟が係属している間に、その次の事業年度に係る計算書類が株主総会において承認された場合には、特別の事情がない限り、当該決議の取消しを求める訴えの利益が失われることとなる。\n５．取締役の解任を目的とする株主総会において、取締役の解任の議案が否決された場合には、当該議案に賛成した株主は、当該株主総会の決議の取消しの訴えを提起することができる。", "source": "https://www.moj.go.jp/content/001421752.pdf", "answerSource": "https://www.moj.go.jp/content/001422570.pdf"}, {"id": "R6-shoho-25", "year": "R6", "yearLabel": "令和6年", "subject": "商法", "qno": 25, "haiten": 2, "type": "choice", "options": 5, "answer": [4], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第25問〕（配点：２）\n定款の変更に関する次のアからオまでの各記述のうち、誤っているものを組み合わせたものは、後記１から５までのうちどれか。\nア．持分会社の社員が死亡した場合に当該社員の相続人が当該社員の持分を承継する旨の定款の定めがあるときは、当該持分会社は、当該相続人が当該持分を承継した時に、当該相続人に係る定款の変更をしたものとみなされる。\nイ．合資会社の無限責任社員が退社したことにより当該合資会社の社員が有限責任社員のみとなった場合には、当該合資会社は、合同会社となる定款の変更をしたものとみなされる。\nウ．株式会社は、定款を変更して、その発行する全部の株式の内容として、譲渡による当該株式の取得について当該株式会社の承認を要する旨の定款の定めを設けようとする場合には、株主全員の同意を得なければならない。\nエ．株式会社の成立後に定款を変更する場合には、当該定款の変更は、公証人の認証を受けなければ、その効力を生じない。\nオ．種類株式発行会社は、ある種類の株式の発行後に定款を変更して、当該種類の株式の内容として、当該種類株式発行会社が一定の事由が生じたことを条件としてこれを取得することができる旨の定款の定めを設けようとする場合には、当該種類の株式を有する株主全員の同意を得なければならない。\n１．アイ\n２．アオ\n３．イエ\n４．ウエ\n５．ウオ", "source": "https://www.moj.go.jp/content/001421752.pdf", "answerSource": "https://www.moj.go.jp/content/001422570.pdf"}, {"id": "R6-shoho-26", "year": "R6", "yearLabel": "令和6年", "subject": "商法", "qno": 26, "haiten": 2, "type": "choice", "options": 5, "answer": [2], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第26問〕（配点：２）\n会社に関する次のアからオまでの各事項のうち、登記することを要しないものを組み合わせたものは、後記１から５までのうちどれか。\nア．株式会社において剰余金の配当の基準日についての定款の定めがある場合におけるその基準日\nイ．株式会社において単元株式数についての定款の定めがある場合におけるその単元株式数\nウ．指名委員会等設置会社の代表執行役の氏名及び住所\nエ．社債管理者を定めた場合におけるその氏名又は名称\nオ．合名会社の社員の氏名又は名称及び住所\n１．アイ\n２．アエ\n３．イウ\n４．ウオ\n５．エオ", "source": "https://www.moj.go.jp/content/001421752.pdf", "answerSource": "https://www.moj.go.jp/content/001422570.pdf"}, {"id": "R6-shoho-27", "year": "R6", "yearLabel": "令和6年", "subject": "商法", "qno": 27, "haiten": 2, "type": "choice", "options": 5, "answer": [5], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第27問〕（配点：２）\n個人商人（小商人に当たる者を除く。）の商号に関する次のアからオまでの各記述のうち、正しいものを組み合わせたものは、後記１から５までのうちどれか。\nア．商号の譲渡は、営業とともにする場合には、登記をしなくても、第三者に対抗することができる。\nイ．自己の商号を使用して営業を行うことを他人に許諾した商人は、当該他人と取引をした者において当該商人が当該営業を行うものと誤認したか否かにかかわらず、当該取引によって生じた債務を弁済する責任を負う。\nウ．商人は、その商号を登記しなければならない。\nエ．営業を譲り受けた商人（以下「譲受人」という。）が営業を譲渡した商人（以下「譲渡人」という。）の商号を引き続き使用しない場合であっても、譲渡人の営業によって生じた債務を引き受ける旨の広告をしたときは、当該債務の引受けがされたと信じた譲渡人の債権者は、当該広告を見たか否かにかかわらず、譲受人に対して弁済の請求をすることができる。\nオ．判例の趣旨によれば、商人は、数種の独立した営業を行い、又は数個の営業所を有する場合には、その各営業又は営業所につき別異の商号を有することができる。\n１．アイ\n２．アエ\n３．イウ\n４．ウオ\n５．エオ", "source": "https://www.moj.go.jp/content/001421752.pdf", "answerSource": "https://www.moj.go.jp/content/001422570.pdf"}, {"id": "R6-shoho-28", "year": "R6", "yearLabel": "令和6年", "subject": "商法", "qno": 28, "haiten": 2, "type": "choice", "options": 5, "answer": [4], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第28問〕（配点：２）\n甲株式会社（以下「甲社」という。）を買主、乙株式会社（以下「乙社」という。）を売主とする売買に関する次のアからオまでの各記述のうち、正しいものを組み合わせたものは、後記１から ５までのうちどれか。\nア．甲社の従業員が、乙社との間で売買契約を締結する代理権を甲社から授与された場合において、甲社のためにすることを示さないで乙社との間で売買契約を締結したときは、乙社は、甲社に対し、その履行を請求することができない。\nイ．甲社が乙社から買った目的物の代金をその弁済期になっても支払わない場合には、別段の意思表示がない限り、乙社は、甲社から修理のために預かっていた別の動産であって甲社が所有するものの返還を拒むことができる。\nウ．甲社は、これまでに取引関係になかった乙社から売買の申込みを受けるとともにその目的物の引渡しを受けた場合において、その目的物と同種の目的物を第三者から継続的に買っており、乙社との間で売買契約を締結する意思がないときは、乙社から引渡しを受けた目的物の価額にかかわらず、直ちにその目的物を廃棄することができる。\nエ．判例の趣旨によれば、乙社が品質に関して契約の内容に適合しない目的物をそのことを知らずに甲社に引き渡した場合において、その不適合が直ちに発見することができないものであるときは、受領後１年を経過した後にその不適合を発見した甲社は、直ちに乙社に対してその旨の通知を発すれば、乙社に対し、品質に関して契約の内容に適合する目的物の引渡しを請求することができる。\nオ．売買の性質上、特定の日時に目的物を引き渡さなければ契約をした目的を達することができない場合において、乙社がその日時に当該目的物を甲社に引き渡さなかったときは、甲社が直ちにその履行の請求をした場合を除き、契約の解除をしたものとみなされる。\n１．アウ\n２．アエ\n３．イウ\n４．イオ\n５．エオ", "source": "https://www.moj.go.jp/content/001421752.pdf", "answerSource": "https://www.moj.go.jp/content/001422570.pdf"}, {"id": "R6-shoho-29", "year": "R6", "yearLabel": "令和6年", "subject": "商法", "qno": 29, "haiten": 2, "type": "choice", "options": 5, "answer": [3], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第29問〕（配点：２）\n匿名組合に関する次のアからオまでの各記述のうち、正しいものを組み合わせたものは、後記 １から５までのうちどれか。\nア．匿名組合員が出資した財産は、匿名組合員の共有に属する。\nイ．匿名組合員は、金銭その他の財産のみをその出資の目的とすることができる。\nウ．匿名組合員は、営業者の業務を執行することができない。\nエ．匿名組合契約は、匿名組合員の死亡により当然に終了する。\nオ．匿名組合員は、営業者の行為によって生じた債務について、営業者に代わって弁済する責任を負う。\n１．アウ\n２．アエ\n３．イウ\n４．イオ\n５．エオ", "source": "https://www.moj.go.jp/content/001421752.pdf", "answerSource": "https://www.moj.go.jp/content/001422570.pdf"}, {"id": "R6-shoho-30", "year": "R6", "yearLabel": "令和6年", "subject": "商法", "qno": 30, "haiten": 2, "type": "choice", "options": 5, "answer": [1], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第30問〕（配点：２）\n約束手形に関する次のアからオまでの各記述のうち、判例の趣旨に照らし正しいものを組み合わせたものは、後記１から５までのうちどれか。\nア．自己を表示する名称として他人の氏名を振出人欄に記載して約束手形を振り出した者は、振出人としてその手形金の支払義務を負う。\nイ．裏書人欄に会社の名称が記載され、社印が押捺されている場合には、当該会社の代表者の自署又は記名捺印がないときであっても、その裏書は、無効とはならない。\nウ．手形金の一部のみを譲渡する裏書は、無効である。\nエ．白地手形について、その支払呈示期間内に手形要件を補充しないまま支払のための呈示がされた場合であっても、後日手形要件が補充されたときは、当該呈示は、遡って支払のための呈示としての効力を有する。\nオ．白地手形を取得した所持人が振出人と受取人との間であらかじめされた白地の補充に関する合意と異なる白地の補充をした場合には、当該所持人が善意でかつ重大な過失がないときであっても、当該振出人は、その白地の補充に関する合意に反することをもって当該所持人に対抗することができる。\n１．アウ\n２．アオ\n３．イウ\n４．イエ\n５．エオ ［民事訴訟法］", "source": "https://www.moj.go.jp/content/001421752.pdf", "answerSource": "https://www.moj.go.jp/content/001422570.pdf"}, {"id": "R6-minso-31", "year": "R6", "yearLabel": "令和6年", "subject": "民事訴訟法", "qno": 31, "haiten": 2, "type": "choice", "options": 5, "answer": [1], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第31問〕（配点：２）\n訴訟代理人に関する次のアからオまでの各記述のうち、判例の趣旨に照らし正しいものを組み合わせたものは、後記１から５までのうちどれか。\nア．訴訟代理人が数人あるときは、送達は、その一人にすれば足りる。\nイ．訴訟係属後に当事者である法人が合併により消滅したときは、その当事者から委任を受けた訴訟代理人の訴訟代理権は消滅する。\nウ．弁護士法第２５条第１号の規定に違反することを理由として訴訟行為を排除する旨の決定に対しては、自らの訴訟代理人の訴訟行為を排除するものとされた当事者は、即時抗告をすることができる。\nエ．訴訟代理人は、委任を受けた事件について移送の申立てをするときは、特別の委任を受けなければならない。\nオ．当事者から委任を受けた訴訟代理人が復代理人を選任した場合において、その訴訟代理人が死亡したときは、復代理人の代理権は消滅する。\n１．アウ\n２．アオ\n３．イエ\n４．イオ\n５．ウエ（参照条文）弁護士法（職務を行い得ない事件）第２５条弁護士は、次に掲げる事件については、その職務を行つてはならない。ただし、第３号及び第９号に掲げる事件については、受任している事件の依頼者が同意した場合は、この限りでない。一相手方の協議を受けて賛助し、又はその依頼を承諾した事件二～九（略）", "source": "https://www.moj.go.jp/content/001421752.pdf", "answerSource": "https://www.moj.go.jp/content/001422570.pdf"}, {"id": "R6-minso-32", "year": "R6", "yearLabel": "令和6年", "subject": "民事訴訟法", "qno": 32, "haiten": 2, "type": "multi", "options": 5, "answer": [3, 5], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第32問〕（配点：２）\n独立当事者参加に関する次の１から５までの各記述のうち、判例の趣旨に照らし誤っているものを２個選びなさい。\n１．他人間の訴訟の結果によって権利が害されることを主張して訴訟に参加することができる第三者は、当該訴訟の判決が直接に効力を及ぼし、これに服さざるを得ない者に限定されず、広く当該訴訟の結果により間接に自己の権利が侵害されるおそれのある者も含まれる。\n２．独立当事者参加の申出は、参加人が参加を申し出た訴訟において裁判を受けるべき請求を提出しなければならず、単に当事者の一方の請求に対して訴え却下又は請求棄却の判決を求めるのみの参加の申出は許されない。\n３．裁判所は、原告、被告及び参加人の一部のみを名宛人とする終局判決をすることができる。\n４．原告の主張する事実について被告が自白をしたとしても、参加人が争う限り、自白としての効力は生じない。\n５．終局判決に対して原告、被告及び参加人のうち一人のみから適法な上訴がされた場合には、当該終局判決のうち、その一人が当事者となっている部分は確定することなく移審し、その余の部分は確定する。", "source": "https://www.moj.go.jp/content/001421752.pdf", "answerSource": "https://www.moj.go.jp/content/001422570.pdf"}, {"id": "R6-minso-33", "year": "R6", "yearLabel": "令和6年", "subject": "民事訴訟法", "qno": 33, "haiten": 2, "type": "choice", "options": 5, "answer": [4], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第33問〕（配点：２）\n訴訟上の和解に関する次のアからオまでの各記述のうち、判例の趣旨に照らし誤っているものを組み合わせたものは、後記１から５までのうちどれか。\nア．被保佐人が相手方の提起した訴えについて訴訟上の和解をするには、保佐人による特別の授権が必要である。\nイ．貸金請求事件において訴訟上の和解の権限を授与された被告の訴訟代理人は、和解の条項として、貸金債務の弁済期日を延期し、かつ分割払いとする代わりに、その担保として、被告所有の不動産について原告のために抵当権を設定することが含まれている場合には、その抵当権設定契約をする権限を有する。\nウ．補助参加に係る訴訟では、被参加人は、補助参加人が不出頭の期日において、相手方との間で訴訟上の和解を成立させることはできない。\nエ．当事者は、３００万円の売買代金債務の存否に関する争いについて、相手方の普通裁判籍の所在地を管轄する地方裁判所に、訴え提起前の和解の申立てをすることができる。\nオ．建物明渡請求事件において、建物を明け渡すことを内容とする訴訟上の和解が調書に記載されたときは、その記載の効力は、和解をした当事者のみならず、和解成立後に当事者から当該建物の占有を承継した者にも及ぶ。\n１．アイ\n２．アエ\n３．イオ\n４．ウエ\n５．ウオ", "source": "https://www.moj.go.jp/content/001421752.pdf", "answerSource": "https://www.moj.go.jp/content/001422570.pdf"}, {"id": "R6-minso-34", "year": "R6", "yearLabel": "令和6年", "subject": "民事訴訟法", "qno": 34, "haiten": 2, "type": "multi", "options": 5, "answer": [2, 4], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第34問〕（配点：２）\n申立事項と判決事項に関する次の１から５までの各記述のうち、判例の趣旨に照らし誤っているものを２個選びなさい。\n１．訴訟上の和解が成立したことによって訴訟が終了した後、被告が当該和解の無効を主張して既に終了した訴訟手続の続行を求めて期日指定の申立てをした場合において、いずれの当事者も当該和解が無効であることの確認を求めていないときは、裁判所は、主文において、当該和解が無効であることを確認する判決をすることはできない。\n２．不法行為による損害賠償請求権に基づいて損害の総額１０００万円から２割の過失相殺をした８００万円の支払を求めることが明示された訴訟において、裁判所は、総額１０００万円の損害が認められ、５割の過失相殺をすべきときは、請求額８００万円から５割の過失相殺をした４００万円の支払を命ずる判決をしなければならない。\n３．給付訴訟において、その給付請求権について被告が主張する不執行の合意の事実が認められるときは、裁判所は、その請求権について強制執行をすることができないことを主文において明示しなければならない。\n４．裁判所は、１００万円の債務のうち５０万円を超える部分の不存在の確認を求める訴訟において、債務の額が２０万円であると認めたときは、１００万円の債務のうち２０万円を超える部分が不存在であることを確認する判決をすることができる。\n５．裁判所は、当事者が申立てをしない場合でも、判決において、訴訟費用の負担の裁判をしなければならない。", "source": "https://www.moj.go.jp/content/001421752.pdf", "answerSource": "https://www.moj.go.jp/content/001422570.pdf"}, {"id": "R6-minso-35", "year": "R6", "yearLabel": "令和6年", "subject": "民事訴訟法", "qno": 35, "haiten": 2, "type": "choice", "options": 5, "answer": [1], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第35問〕（配点：２）\n準備書面に関する次のアからオまでの各記述のうち、正しいものを組み合わせたものは、後記１から５までのうちどれか。\nア．準備書面において相手方の主張する事実を否認する場合には、その理由を記載しなければならない。\nイ．当事者が準備書面に記載した事項は、その準備書面が裁判所に提出されただけでは、判決の基礎とすることはできない。\nウ．準備書面は、裁判所を通じて相手方に送付しなければならない。\nエ．文書を準備書面に引用した当事者は、裁判所又は相手方の求めがなくとも、その写しを提出しなければならない。\nオ．口頭弁論は、簡易裁判所においても、書面で準備しなければならない。\n１．アイ\n２．アエ\n３．イウ\n４．ウオ\n５．エオ", "source": "https://www.moj.go.jp/content/001421752.pdf", "answerSource": "https://www.moj.go.jp/content/001422570.pdf"}, {"id": "R6-minso-36", "year": "R6", "yearLabel": "令和6年", "subject": "民事訴訟法", "qno": 36, "haiten": 2, "type": "multi", "options": 5, "answer": [1, 3], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第36問〕（配点：２）\n訴訟手続の中断及び受継に関する次の１から５までの各記述のうち、判例の趣旨に照らし誤っているものを２
