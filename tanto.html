<!doctype html>
<html lang="ja">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta charset="utf-8">
<title>短答デッキ 自作版</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
  :root{
    --paper:#ECEEF0;--surface:#FCFCFB;--surface-2:#F2F4F6;
    --ink:#1B2027;--ink-soft:#586070;--ink-faint:#8992A0;
    --line:#D8DCE2;--line-soft:#E6E9EE;
    --ai:#2F5D8C;--ai-deep:#234867;--ai-tint:#E4ECF4;
    --ok:#3B6E52;--ok-tint:#E3EDE6;--warn:#B5820F;--warn-tint:#F6ECD4;--ng:#B44A3B;--ng-tint:#F6E3DE;
    --shadow:0 1px 2px rgba(27,32,39,.05),0 8px 24px rgba(27,32,39,.06);--shadow-soft:0 1px 2px rgba(27,32,39,.05);
  }
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
    --paper:#12151A;--surface:#1B1F26;--surface-2:#161A20;
    --ink:#EAEDF1;--ink-soft:#9AA3B2;--ink-faint:#6E7784;
    --line:#2A3039;--line-soft:#222831;
    --ai:#6FA3D6;--ai-deep:#4E82B8;--ai-tint:#1C2836;
    --ok:#7FB89A;--ok-tint:#1E2A24;--warn:#D8B65C;--warn-tint:#2E2716;--ng:#DE8677;--ng-tint:#2E1D19;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);--shadow-soft:0 1px 2px rgba(0,0,0,.3);
  }}
  :root[data-theme="dark"]{
    --paper:#12151A;--surface:#1B1F26;--surface-2:#161A20;--ink:#EAEDF1;--ink-soft:#9AA3B2;--ink-faint:#6E7784;
    --line:#2A3039;--line-soft:#222831;--ai:#6FA3D6;--ai-deep:#4E82B8;--ai-tint:#1C2836;
    --ok:#7FB89A;--ok-tint:#1E2A24;--warn:#D8B65C;--warn-tint:#2E2716;--ng:#DE8677;--ng-tint:#2E1D19;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);--shadow-soft:0 1px 2px rgba(0,0,0,.3);
  }
  *{box-sizing:border-box} html,body{height:100%}
  body{margin:0;background:var(--paper);color:var(--ink);
    font-family:"Zen Kaku Gothic New",-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif;
    font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;overflow:hidden}
  h1,h2,h3{font-family:"Shippori Mincho",serif;font-weight:600;margin:0;text-wrap:balance}
  button{font-family:inherit;cursor:pointer}
  ::selection{background:var(--ai-tint)}
  :focus-visible{outline:2px solid var(--ai);outline-offset:2px;border-radius:4px}
  .eyebrow{font-family:"Shippori Mincho",serif;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-faint);font-weight:600}

  header{display:flex;align-items:center;gap:12px;padding:9px 16px;background:var(--surface);border-bottom:1px solid var(--line);flex:none;z-index:20;box-shadow:var(--shadow-soft);flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:9px;min-width:max-content}
  .seal{font-family:"Shippori Mincho",serif;font-weight:700;font-size:14px;color:#fff;background:var(--ai);width:30px;height:30px;border-radius:6px;display:grid;place-items:center;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
  .brand h1{font-size:16px;font-weight:600}
  .brand small{font-size:10.5px;color:var(--ink-faint);display:block;line-height:1;margin-top:2px}
  .navq{display:flex;align-items:center;gap:6px;flex:1;min-width:220px}
  .navq .cur{flex:1;min-width:0;text-align:left;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:6px 12px;display:flex;flex-direction:column;gap:1px;overflow:hidden}
  .navq .cur:hover{border-color:var(--ink-faint)}
  .navq .cur .k{font-size:10px;color:var(--ai);font-weight:700;font-family:"Shippori Mincho",serif}
  .navq .cur .n{font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .arrow{border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);border-radius:9px;width:32px;height:34px;font-size:15px;flex:none}
  .arrow:hover{border-color:var(--ink-faint);color:var(--ink)}
  .iconbtn{border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);border-radius:9px;height:34px;min-width:34px;padding:0 11px;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
  .iconbtn:hover{border-color:var(--ink-faint);color:var(--ink)}
  .iconbtn.accent{color:var(--ai);border-color:var(--ai)}
  .btnrow{display:flex;gap:6px;flex-wrap:wrap}

  main{flex:1;display:grid;grid-template-columns:54fr 46fr;min-height:0}
  .col{min-height:0;display:flex;flex-direction:column;overflow:hidden}
  .col.question{order:1;border-right:1px solid var(--line)}  /* 左=問題 */
  .col.answer{order:2}                                        /* 右=解答・解説 */
  .panelhead{display:flex;align-items:center;gap:10px;padding:12px 18px 8px;flex:none}
  .panelhead .eyebrow{flex:1}
  .tag{font-size:11px;color:var(--ai);font-weight:700;background:var(--ai-tint);padding:2px 9px;border-radius:20px}
  .scroll{flex:1;overflow-y:auto;padding:4px 18px 26px;scrollbar-width:thin}

  /* question pane */
  .q-meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
  .chip{font-size:11.5px;color:var(--ink-soft);background:var(--surface-2);border:1px solid var(--line);padding:2px 10px;border-radius:20px;font-weight:500}
  .chip.subj{color:var(--ink);font-weight:700}
  .chip.year{color:var(--ai);font-weight:700}
  .chip.pt{color:var(--ink-soft)}
  .q-no{font-size:18px;margin:0 0 10px}
  .figwarn{font-size:12px;color:var(--warn);background:var(--warn-tint);border-radius:9px;padding:8px 12px;margin-bottom:12px;line-height:1.6}
  .figwarn a{color:var(--ai)}
  .statement{font-family:"Shippori Mincho",serif;font-size:15px;line-height:1.95;white-space:pre-wrap;color:var(--ink)}
  .srcline{margin-top:16px;font-size:11.5px}
  .srcline a{color:var(--ai);text-decoration:none}
  .srcline a:hover{text-decoration:underline}

  /* answer pane */
  .a-block{margin-bottom:20px}
  .a-block > .lab{font-size:12px;font-weight:700;color:var(--ink-soft);margin-bottom:8px;display:flex;align-items:center;gap:8px}
  .a-block > .lab .hint{font-weight:400;color:var(--ink-faint);font-size:11px}
  .choices{display:flex;flex-wrap:wrap;gap:8px}
  .choice{width:44px;height:44px;border:1.5px solid var(--line);background:var(--surface);border-radius:11px;font-size:16px;font-weight:700;color:var(--ink-soft);font-variant-numeric:tabular-nums}
  .choice:hover{border-color:var(--ai);color:var(--ink)}
  .choice.picked{border-color:var(--ai);background:var(--ai-tint);color:var(--ai-deep)}
  .choice.correct{border-color:var(--ok);background:var(--ok-tint);color:var(--ok)}
  .choice.wrong{border-color:var(--ng);background:var(--ng-tint);color:var(--ng)}
  .revealbtn{margin-top:12px;border:1px solid var(--ai);background:var(--ai);color:#fff;border-radius:10px;padding:10px 18px;font-size:14px;font-weight:600;width:100%}
  .revealbtn:hover{background:var(--ai-deep)}
  .result{border-radius:12px;padding:13px 15px;margin-top:12px;border:1px solid var(--line);background:var(--surface-2)}
  .result .verdict{font-size:15px;font-weight:700;font-family:"Shippori Mincho",serif;display:flex;align-items:center;gap:8px;margin-bottom:6px}
  .result .verdict.ok{color:var(--ok)} .result .verdict.ng{color:var(--ng)}
  .result .ansline{font-size:14px}
  .result .ansline b{color:var(--ai-deep);font-size:17px;font-variant-numeric:tabular-nums}
  .series{display:flex;flex-wrap:wrap;gap:7px;margin-top:6px}
  .series .s{display:flex;align-items:center;gap:5px;font-size:12.5px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:3px 9px}
  .series .s b{font-family:"Shippori Mincho",serif}
  .series .s .v.correct{color:var(--ok);font-weight:700} .series .s .v.wrong{color:var(--ng);font-weight:700}
  textarea{width:100%;font-family:inherit;font-size:14px;line-height:1.8;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;resize:vertical;min-height:96px}
  textarea:focus{outline:none;border-color:var(--ai);background:var(--surface)}
  textarea::placeholder{color:var(--ink-faint)}
  .statusrow{display:flex;gap:8px;flex-wrap:wrap}
  .statusbtn{flex:1;min-width:88px;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:9px 10px;font-size:13px;font-weight:600;color:var(--ink-soft);display:flex;align-items:center;justify-content:center;gap:6px}
  .statusbtn .dot{width:9px;height:9px;border-radius:50%}
  .statusbtn[data-s="ok"] .dot{background:var(--ok)} .statusbtn[data-s="vague"] .dot{background:var(--warn)} .statusbtn[data-s="ng"] .dot{background:var(--ng)}
  .statusbtn.on[data-s="ok"]{border-color:var(--ok);background:var(--ok-tint);color:var(--ok)}
  .statusbtn.on[data-s="vague"]{border-color:var(--warn);background:var(--warn-tint);color:var(--warn)}
  .statusbtn.on[data-s="ng"]{border-color:var(--ng);background:var(--ng-tint);color:var(--ng)}
  .saved{font-size:11px;color:var(--ink-faint);margin-top:10px}
  .saved b{color:var(--ok);font-weight:700}
  .hintcard{font-size:11.5px;color:var(--ink-faint);line-height:1.7;background:var(--surface-2);border-left:2.5px solid var(--ai);border-radius:0 8px 8px 0;padding:9px 13px;margin-bottom:16px}

  dialog{border:none;border-radius:16px;padding:0;background:var(--surface);color:var(--ink);box-shadow:var(--shadow);max-width:900px;width:calc(100vw - 32px)}
  dialog::backdrop{background:rgba(18,21,26,.5);backdrop-filter:blur(2px)}
  .modal-h{display:flex;align-items:center;gap:10px;padding:16px 22px 8px}
  .modal-h h2{font-size:18px;flex:1}
  .modal-b{padding:6px 22px 18px;max-height:76vh;overflow-y:auto}
  .ghost{border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);border-radius:9px;padding:9px 16px;font-size:13px}
  .ghost:hover{color:var(--ink);border-color:var(--ink-faint)}
  .filterbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:2px 0 14px;position:sticky;top:0;background:var(--surface);padding-bottom:10px;z-index:2}
  select,input[type=text]{font-family:inherit;font-size:13px;padding:8px 11px;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:9px}
  select:focus,input:focus{outline:none;border-color:var(--ai)}
  .filterbar input.q{flex:1;min-width:140px}
  .filterbar .count{font-size:12px;color:var(--ink-faint);margin-left:auto;white-space:nowrap}
  .cardgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
  .qcard{border:1px solid var(--line);border-radius:12px;background:var(--surface-2);padding:11px 12px;text-align:left;display:flex;flex-direction:column;gap:5px;position:relative}
  .qcard:hover{border-color:var(--ai);transform:translateY(-1px);box-shadow:var(--shadow-soft)}
  .qcard.cur{border-color:var(--ai);box-shadow:0 0 0 1px var(--ai)}
  .qcard .ct{display:flex;align-items:center;gap:6px}
  .qcard .cy{font-size:10.5px;color:var(--ai);font-weight:700;font-family:"Shippori Mincho",serif}
  .qcard .cs{font-size:12.5px;font-weight:700}
  .qcard .cno{font-size:11px;color:var(--ink-faint);margin-left:auto}
  .qcard .cv{font-size:11px;color:var(--ink-soft);line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .stat{position:absolute;top:9px;right:9px;width:8px;height:8px;border-radius:50%}
  .stat.ok{background:var(--ok)} .stat.vague{background:var(--warn)} .stat.ng{background:var(--ng)}
  .pilltype{font-size:10px;padding:1px 7px;border-radius:10px;border:1px solid var(--line);color:var(--ink-faint)}

  .trend h3{font-size:15px;margin:18px 0 8px;display:flex;align-items:center;gap:8px}
  .trend h3::before{content:"";width:16px;height:2px;background:var(--ai)}
  .trend p{font-size:13.5px;line-height:1.8;margin:0 0 10px;color:var(--ink-soft)}
  .trend .lead{font-size:14px;color:var(--ink)}
  .bars{display:flex;flex-direction:column;gap:7px;margin:6px 0 14px}
  .bar{display:grid;grid-template-columns:120px 1fr 40px;align-items:center;gap:10px;font-size:12.5px}
  .bar .track{height:16px;background:var(--surface-2);border-radius:5px;overflow:hidden;border:1px solid var(--line-soft)}
  .bar .track i{display:block;height:100%;background:var(--ai)}
  .bar .num{text-align:right;color:var(--ink-soft);font-variant-numeric:tabular-nums}

  .footnote{font-size:11px;color:var(--ink-faint);padding:7px 18px;text-align:center;border-top:1px solid var(--line-soft);background:var(--surface);flex:none;line-height:1.6}
  .footnote b{color:var(--ink-soft);font-weight:700}
  @media (max-width:820px){
    body{overflow:auto}
    main{grid-template-columns:1fr;overflow:visible}
    .col{overflow:visible}
    .col.question{order:1;border-right:none;border-bottom:1px solid var(--line)}  /* 狭い時も問題を上に */
    .col.answer{order:2}
    .scroll{overflow:visible}
    .navq{order:5;flex-basis:100%}
  }
</style>
</head>
<body>


<header>
  <div class="brand"><span class="seal">短</span><div><h1>短答デッキ</h1><small>自作版・隙間時間の令和短答</small></div></div>
  <div class="navq">
    <button class="arrow" id="prevBtn" title="前の問題">◀</button>
    <button class="cur" id="curBtn" title="問題一覧"><span class="k" id="curK"></span><span class="n" id="curN"></span></button>
    <button class="arrow" id="nextBtn" title="次の問題">▶</button>
  </div>
  <div class="btnrow">
    <button class="iconbtn accent" id="listBtn">☰ 一覧</button>
    <button class="iconbtn" id="trendBtn">📈 傾向</button>
    <button class="iconbtn" id="dataBtn" title="バックアップ">⇅</button>
    <button class="iconbtn" id="themeBtn" title="表示モード">◐</button>
  </div>
</header>

<main>
  <!-- 左: 回答・解説 -->
  <section class="col answer">
    <div class="panelhead"><span class="eyebrow">解答・解説 ｜ Answer</span><span class="tag" id="aStatus">未着手</span></div>
    <div class="scroll" id="answerPane"></div>
  </section>
  <!-- 右: 問題 -->
  <section class="col question">
    <div class="panelhead"><span class="eyebrow">問題 ｜ Question</span><span class="tag" id="qTag"></span></div>
    <div class="scroll">
      <div class="q-meta" id="qMeta"></div>
      <h2 class="q-no" id="qNo"></h2>
      <div class="figwarn" id="figWarn" style="display:none"></div>
      <div class="statement" id="qStatement"></div>
      <div class="srcline" id="qSrc"></div>
    </div>
  </section>
</main>

<div class="footnote">令和7年 予備試験 短答式（法律7科目・全<b id="qCount"></b>問）を収録。正解・配点は法務省公表データ準拠。演習状態は<b>この端末のブラウザ内のみ</b>に保存。</div>

<dialog id="listDialog">
  <div class="modal-h"><span class="seal" style="width:26px;height:26px;font-size:12px">選</span><h2>問題一覧</h2><button class="ghost" onclick="this.closest('dialog').close()">閉じる</button></div>
  <div class="modal-b">
    <div class="filterbar">
      <select id="fltSubject"></select>
      <select id="fltStatus"></select>
      <input type="text" class="q" id="fltQ" placeholder="🔍 キーワード（論点・条文・事実）">
      <span class="count" id="fltCount"></span>
    </div>
    <div class="cardgrid" id="cardGrid"></div>
  </div>
</dialog>

<dialog id="trendDialog">
  <div class="modal-h"><span class="seal" style="width:26px;height:26px;font-size:12px">傾</span><h2>短答の型と傾向（令和7年）</h2><button class="ghost" onclick="this.closest('dialog').close()">閉じる</button></div>
  <div class="modal-b trend" id="trendBody"></div>
</dialog>

<dialog id="dataDialog"><form method="dialog">
  <div class="modal-h"><span class="seal" style="width:26px;height:26px;font-size:12px">⇅</span><h2>バックアップ</h2></div>
  <div class="modal-b">
    <p style="font-size:12px;color:var(--ink-faint);line-height:1.7">演習状態（解答・メモ・定着度）をJSONで保存/復元。読み込むと現在の状態に<b>上書き</b>されます。</p>
    <textarea id="dataArea" style="min-height:180px;font-family:ui-monospace,Menlo,monospace;font-size:12px;line-height:1.5" spellcheck="false"></textarea>
    <div style="display:flex;gap:9px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap">
      <button type="button" class="ghost" id="copyDataBtn" style="margin-right:auto">コピー</button>
      <button type="submit" value="cancel" class="ghost">閉じる</button>
      <button type="button" class="iconbtn" id="importBtn" style="height:auto;padding:9px 16px">↥ 読み込む</button>
      <button type="button" class="iconbtn accent" id="downloadBtn" style="height:auto;padding:9px 16px">↧ ファイル保存</button>
    </div>
  </div>
</form></dialog>

<script>
const TANTO_SEED = [{"id": "R7-kenpo-1", "year": "R7", "yearLabel": "令和7年", "subject": "憲法", "qno": 1, "haiten": 3, "type": "series", "options": 2, "answer": [1, 2, 1], "figure": false, "statement": "〔第１問〕（配点：３）\n「公共の福祉」に関する次のアからウまでの各記述について、ｂの見解がａの見解の批判となっている場合には１を、そうでない場合には２を選びなさい。\nア．\n  ａ．憲法第１２条・第１３条の「公共の福祉」は、人権の外にあって、それを制約することのできる一般的な原理であり、憲法第２２条・第２９条が「公共の福祉」を掲げたことに特別な意味はない。\n  ｂ．「公共の福祉」を「公益」や「公共の安寧秩序」と言い換えたところで、極めて抽象的な概念であることは変わらないので、結果として、「公共の福祉」が明治憲法下の法律の留保のような機能を実質的に果たすおそれがある。\nイ．\n  ａ．憲法第２２条・第２９条の「公共の福祉」は経済的・社会的な政策的人権制約の根拠となるが、憲法第１２条・第１３条の「公共の福祉」はそのような制約の根拠とはならず、人権の内在的制約のみを意味する。\n  ｂ．憲法第１２条・第１３条を倫理的・訓示的規定として解釈すると、新しい人権を基礎付ける包括的な人権条項として憲法第１３条を活用することができなくなる。\nウ．\n  ａ．「公共の福祉」とは人権相互の矛盾・衝突を調整するための実質的公平の原理であり、この意味での「公共の福祉」は、憲法規定にかかわらず全ての人権に論理必然的に内在している。\n  ｂ．人権に対する制約を全て人権の内在的制約として説明する考え方は、論理的に殺人の自由や強盗の自由をも一旦憲法の保障する人権に含めた上で、その制約の可否を議論することになるので、人権に関する一般的な理解や説明と整合しない。", "source": "https://www.moj.go.jp/content/001443616.pdf", "answerSource": "https://www.moj.go.jp/content/001444173.pdf"}, {"id": "R7-kenpo-2", "year": "R7", "yearLabel": "令和7年", "subject": "憲法", "qno": 2, "haiten": 2, "type": "choice", "options": 8, "answer": [8], "figure": false, "statement": "〔第２問〕（配点：２）\n法の下の平等に関する次のアからウまでの各記述について、最高裁判所の判例の趣旨に照らして、正しいものには○、誤っているものには×を付した場合の組合せを、後記１から８までの中から選びなさい。\nア．本邦に在留する外国人で、在留期間の更新又は変更を受けないで在留期間を経過して本邦に残留する者（不法残留者）を生活保護法による保護の対象としないことは、外国人を日本人と区別して取り扱うもので、憲法第１４条第１項に違反する。\nイ．女性についてのみ前婚の解消又は取消しの日から一定期間、再婚を禁止することは、再婚をする際の要件に関し男性と女性とを区別するものであるから、女性についてのみ再婚禁止期間を設けること自体が、憲法第１４条第１項に違反する。\nウ．尊属に対する尊重報恩は、旧家族制度的倫理観に基づくもので合理的とはいえないから、子が親を殺害した殺人事件において、被害者が尊属であることを犯情の一つとして具体的事件の量刑上重視することは、憲法第１４条第１項に違反する。\n１．ア○ イ○ ウ○\n２．ア○ イ○ ウ×\n３．ア○ イ× ウ○\n４．ア○ イ× ウ×\n５．ア× イ○ ウ○\n６．ア× イ○ ウ×\n７．ア× イ× ウ○\n８．ア× イ× ウ×", "source": "https://www.moj.go.jp/content/001443616.pdf", "answerSource": "https://www.moj.go.jp/content/001444173.pdf"}, {"id": "R7-kenpo-3", "year": "R7", "yearLabel": "令和7年", "subject": "憲法", "qno": 3, "haiten": 2, "type": "choice", "options": 8, "answer": [4], "figure": false, "statement": "〔第３問〕（配点：２）\n次の対話は、政教分離に関する教授と学生の対話である。教授の各質問に対する次のアからウまでの学生の各回答について、正しいものには○、誤っているものには×を付した場合の組合せを、後記１から８までの中から選びなさい。教授．憲法第２０条第１項の「宗教団体」、憲法第８９条前段の「宗教上の組織若しくは団体」の意味について、最高裁判所はどう解していますか。\nア．これらは同義であり、特定の宗教の信仰、礼拝又は普及等の宗教的活動を行うことを本来の目的とする組織ないし団体と解しています。教授．では、神社に対する玉串料としての県による公金支出が問題となった事案では、最高裁判所は、これが憲法第２０条第３項の「宗教的活動」に当たるか否かについて、どのような判断をしましたか。\nイ．靖国神社及び護国神社が挙行した例大祭等への玉串料等の奉納は、県が特定の宗教団体の挙行する重要な宗教上の祭祀に関わり合いを持ったことは否定できないが、遺族援護行政の一環として、戦没者の慰霊及び遺族の慰謝という世俗的な目的で行われた社会的儀礼にすぎないものであるから、宗教的活動には当たらないと判断しました。教授．市が市有地を無償で宗教的施設の敷地としての利用に供している行為について、憲法第８ ９条違反が問題となった事案では、最高裁判所はどのような判断をしましたか。\nウ．宗教的施設への市有地の利用提供行為は、市が特定の宗教上の組織との間にのみ意識的に特別の関わり合いを持つものであり、一般人に対し市が特定の宗教に特別の便宜を与えているとの印象をもたらすものであるから、その行為の目的及び効果に鑑み、憲法第８９条に違反すると判断しました。\n１．ア○ イ○ ウ○\n２．ア○ イ○ ウ×\n３．ア○ イ× ウ○\n４．ア○ イ× ウ×\n５．ア× イ○ ウ○\n６．ア× イ○ ウ×\n７．ア× イ× ウ○\n８．ア× イ× ウ×", "source": "https://www.moj.go.jp/content/001443616.pdf", "answerSource": "https://www.moj.go.jp/content/001444173.pdf"}, {"id": "R7-kenpo-4", "year": "R7", "yearLabel": "令和7年", "subject": "憲法", "qno": 4, "haiten": 3, "type": "series", "options": 2, "answer": [2, 1, 2], "figure": false, "statement": "〔第４問〕（配点：３）\n表現の自由に関する次のアからウまでの各記述について、最高裁判所の判例の趣旨に照らして、それぞれ正しい場合には１を、誤っている場合には２を選びなさい。\nア．憲法第２１条第２項前段にいう「検閲」とは、公権力が主体となって、思想内容等の表現物を対象とし、その全部又は一部の発表の禁止を目的として、対象とされる一定の表現物につき網羅的一般的に、発表前にその内容を審査した上、不適当と認めるものの発表を禁止することを、その特質として備えるものを指す。\nイ．表現物に対する税関検査は、表現の事前規制たる側面を有するものの、検査対象となる表現物は、一般に、国外においては既に発表済みで、輸入が禁止されるだけで、発表の機会が全面的に奪われてしまうものでもなく、また、税関は特に思想内容等を対象として規制することを独自の使命とするものではないから、憲法第２１条第２項前段にいう「検閲」には当たらない。\nウ．公立図書館において、図書館資料の選択は職員の専門的な判断に委ねられており、職員が閲覧に供されている図書を著作者の思想や信条を理由に廃棄したとしても、当該著作者はその思想、意見等をその著作物によって公衆に伝達する機会を完全に奪われたわけではないから、その廃棄行為は国家賠償法上違法とはならない。", "source": "https://www.moj.go.jp/content/001443616.pdf", "answerSource": "https://www.moj.go.jp/content/001444173.pdf"}, {"id": "R7-kenpo-5", "year": "R7", "yearLabel": "令和7年", "subject": "憲法", "qno": 5, "haiten": 2, "type": "choice", "options": 8, "answer": [7], "figure": false, "statement": "〔第５問〕（配点：２）\n旭川学力テスト事件判決（最高裁判所昭和５１年５月２１日大法廷判決、刑集３０巻５号６１５頁）に関する次のアからウまでの各記述について、当該判決の趣旨に照らして、正しいものには○、誤っているものには×を付した場合の組合せを、後記１から８までの中から選びなさい。\nア．親は、子どもに対する自然的関係により、子どもの教育に対する一定の支配権を有すると認められるが、このような親の教育の自由は、主として家庭教育等、学校外の教育において現れるものの、そこに学校選択の自由は含まれない。\nイ．普通教育における教師は、子どもの教育が教師と子どもとの間の直接の人格的接触を通じ、その個性に応じて行われなければならないという本質的要請に照らし、教授の具体的内容及び方法について完全に自由な裁量を有する。\nウ．国は、国政の一部として広く適切な教育政策を樹立、実施し得る者として、憲法上、子ども自身の利益の擁護等のため、必要かつ相当と認められる範囲において、教育内容につき決定する権能を有する。\n１．ア○ イ○ ウ○\n２．ア○ イ○ ウ×\n３．ア○ イ× ウ○\n４．ア○ イ× ウ×\n５．ア× イ○ ウ○\n６．ア× イ○ ウ×\n７．ア× イ× ウ○\n８．ア× イ× ウ×", "source": "https://www.moj.go.jp/content/001443616.pdf", "answerSource": "https://www.moj.go.jp/content/001444173.pdf"}, {"id": "R7-kenpo-6", "year": "R7", "yearLabel": "令和7年", "subject": "憲法", "qno": 6, "haiten": 3, "type": "series", "options": 2, "answer": [2, 2, 1], "figure": false, "statement": "〔第６問〕（配点：３）\n労働基本権に関する次のアからウまでの各記述について、それぞれ正しい場合には１を、誤っている場合には２を選びなさい。\nア．憲法第２８条に規定される労働基本権は、憲法第２５条の生存権の保障を基本理念として、勤労者に対して人間に値する生存を保障すべきものとする見地に立ち、憲法第２７条の定める勤労の権利及び勤労条件に関する基準の法定の保障とあいまって、勤労者の経済的地位の向上のための手段として、団結権、団体交渉権、争議権等を保障しようとするものであって、社会権的性質を有する権利であり、自由権としての側面はない。\nイ．基本的人権の規定は、公権力との関係で国民の権利・自由を保護するものであると考えられており、労働基本権も、国家との関係での権利保障が本質であって、使用者対労働者という関係においては、私法の一般規定に憲法第２８条の趣旨を取り込んで解釈・適用することによって間接的に適用され、その結果、正当な争議行為に対する損害賠償からの民事免責が認められる。\nウ．全農林警職法事件判決（最高裁判所昭和４８年４月２５日大法廷判決、刑集２７巻４号５４ ７頁）は、争議行為を禁止し、そのあおり行為を処罰の対象としていた国家公務員法に関し、公務員が行う争議行為を違法性の有無及び強弱によって区別し、違法性の強い争議行為を、違法性の強い又は社会的許容性のない行為によりあおるなどした場合に限って刑事制裁を科すべき趣旨であると解釈することについて、犯罪構成要件の明確性を要請する憲法第３１条に違反する疑いがあることなどを理由として、否定している。", "source": "https://www.moj.go.jp/content/001443616.pdf", "answerSource": "https://www.moj.go.jp/content/001444173.pdf"}, {"id": "R7-kenpo-7", "year": "R7", "yearLabel": "令和7年", "subject": "憲法", "qno": 7, "haiten": 3, "type": "series", "options": 2, "answer": [2, 2, 1], "figure": false, "statement": "〔第７問〕（配点：３）\n憲法の意味や分類に関する次のアからウまでの各記述について、ｂの見解がａの見解の根拠とな ［No.っている場合には１を、そうでない場合には２を選びなさい。\nア．\n  ａ．日本国憲法は、形式的意味での憲法に該当する。\n  ｂ．日本国憲法は、権力分立や権利保障に関する諸規定を有している。\nイ．\n  ａ．日本国憲法は、立憲的意味の憲法あるいは近代的意味の憲法に該当する。\n  ｂ．日本国憲法の下には、国会が制定する皇室典範、国会法、内閣法、公職選挙法といった憲法附属法が存在している。\nウ．\n  ａ．日本国憲法は、硬性憲法に該当する。\n  ｂ．日本国憲法第９６条第１項前段は、「この憲法の改正は、各議院の総議員の三分の二以上の賛成で、国会が、これを発議し、国民に提案してその承認を経なければならない。」と規定する。", "source": "https://www.moj.go.jp/content/001443616.pdf", "answerSource": "https://www.moj.go.jp/content/001444173.pdf"}, {"id": "R7-kenpo-8", "year": "R7", "yearLabel": "令和7年", "subject": "憲法", "qno": 8, "haiten": 3, "type": "series", "options": 2, "answer": [2, 1, 2], "figure": false, "statement": "〔第８問〕（配点：３）\n主権に関する次のアからウまでの各記述について、ｂの見解がａの見解の批判となっている場合 ［No.には１を、そうでない場合には２を選びなさい。\nア．\n  ａ．国民主権に基づく憲法において、独裁制を規定することは可能である。\n  ｂ．国民主権とは、国家権力の正当性の根拠は国民にあるとする原理である。\nイ．\n  ａ．国民主権原理にいう「国民」とは、観念的抽象的に想定される全国民という統一体のことである。\n  ｂ．国民主権原理は、代表民主制の下でも、直接民主制的制度をできる限り求める原理と捉えるべきである。\nウ．\n  ａ．日本国憲法制定に先立ち、日本によるポツダム宣言の受諾により主権の所在が天皇から国民へと変更され、法的意味での革命があったとみることができる。\n  ｂ．憲法改正には限界があり、主権の所在等の基本原理は憲法改正手続では変更できないと解釈すべきである。", "source": "https://www.moj.go.jp/content/001443616.pdf", "answerSource": "https://www.moj.go.jp/content/001444173.pdf"}, {"id": "R7-kenpo-9", "year": "R7", "yearLabel": "令和7年", "subject": "憲法", "qno": 9, "haiten": 3, "type": "series", "options": 2, "answer": [1, 2, 2], "figure": false, "statement": "〔第９問〕（配点：３）\n皇室の財産に関する次のアからウまでの各記述について、それぞれ正しい場合には１を、誤っている場合には２を選びなさい。\nア．皇室の財産授受は国会の議決に基づかなければならないと定めている憲法第８条の趣旨に照らすと、外国交際のための儀礼上の贈答に係る授受については、その度ごとに国会の議決を経る必要はない。\nイ．憲法第８８条前段は、全て皇室財産は国に属すると規定しており、この「皇室財産」とは天皇及び皇族の財産を意味しているため、天皇及び皇族が私有財産を保有することは認められない。\nウ．憲法第８８条後段では、全て皇室の費用は国会の議決を経なければならないと規定されているが、その議決の方法については規定されていないため、参議院が、衆議院よりも先に、皇室の費用について審議することも許される。", "source": "https://www.moj.go.jp/content/001443616.pdf", "answerSource": "https://www.moj.go.jp/content/001444173.pdf"}, {"id": "R7-kenpo-10", "year": "R7", "yearLabel": "令和7年", "subject": "憲法", "qno": 10, "haiten": 2, "type": "choice", "options": 8, "answer": [3], "figure": false, "statement": "〔第10問〕（配点：２）\n選挙権及び選挙制度に関する次のアからウまでの各記述について、正しいものには○、誤ってい ［No.るものには×を付した場合の組合せを、後記１から８までの中から選びなさい。\nア．最高裁判所は、国民の選挙権行使の制限は原則として許されず、国には、国民が選挙権を行使できない場合、そのような制限なしには選挙の公正の確保に留意しつつ選挙権行使を認めることが事実上不可能ないし著しく困難でない限り、選挙権行使を可能にするための所要の措置を執るべき責務があるというべきであり、このことは、精神的原因によって投票所に行くことが困難な有権者の選挙権についても当てはまるとした。\nイ．最高裁判所は、政見放送は民主政治の根幹をなす政治上の表現の自由に基づくものであり、いかなる政見放送であってもそのまま放送されるべきであるから、放送事業者が政見放送において用いられた差別的言動を削除したことは、当然に不法行為法上、法的利益の侵害に当たるとした。\nウ．最高裁判所は、１人別枠方式の意義は、衆議院議員選挙制度の変更に伴い、国政における安定性、連続性の確保を図るための暫定的な措置であるということにあると解されるから、その合理性には時間的な限界があり、新しい選挙制度である小選挙区比例代表並立制が定着し、安定した運用がされるようになった段階ではその合理性が失われるとした。\n１．ア○ イ○ ウ○\n２．ア○ イ○ ウ×\n３．ア○ イ× ウ○\n４．ア○ イ× ウ×\n５．ア× イ○ ウ○\n６．ア× イ○ ウ×\n７．ア× イ× ウ○\n８．ア× イ× ウ×", "source": "https://www.moj.go.jp/content/001443616.pdf", "answerSource": "https://www.moj.go.jp/content/001444173.pdf"}, {"id": "R7-kenpo-11", "year": "R7", "yearLabel": "令和7年", "subject": "憲法", "qno": 11, "haiten": 2, "type": "choice", "options": 8, "answer": [2], "figure": false, "statement": "〔第11問〕（配点：２）\n衆議院の解散に関する次のアからウまでの各記述について、正しいものには○、誤っているものには×を付した場合の組合せを、後記１から８までの中から選びなさい。\nア．衆議院が解散決議をして自律的に解散することはできないとする見解は、自律的解散を認めると、衆議院の多数派の意思によって少数派の議員たる地位を奪うことが可能になることや、自律的解散について憲法に明文の規定がないことをその根拠としている。\nイ．衆議院の解散に係る天皇の国事行為を定める憲法第７条第３号に、内閣の衆議院解散権の根拠を求める見解に対しては、最初から形式的行為にすぎない天皇の国事行為に対する内閣の助言と承認を、衆議院解散の実質的決定権の根拠とすることはできないとの批判がある。\nウ．最高裁判所は、衆議院の解散は憲法第８１条にいう「処分」であって、裁判所の違憲審査の対象となるが、極めて政治性の高い国家統治の基本に関する行為であるから、その法律上の有効無効を審査することは裁判所の権限の外にあるものとした。\n１．ア○ イ○ ウ○\n２．ア○ イ○ ウ×\n３．ア○ イ× ウ○\n４．ア○ イ× ウ×\n５．ア× イ○ ウ○\n６．ア× イ○ ウ×\n７．ア× イ× ウ○\n８．ア× イ× ウ×", "source": "https://www.moj.go.jp/content/001443616.pdf", "answerSource": "https://www.moj.go.jp/content/001444173.pdf"}, {"id": "R7-kenpo-12", "year": "R7", "yearLabel": "令和7年", "subject": "憲法", "qno": 12, "haiten": 2, "type": "choice", "options": 8, "answer": [3], "figure": false, "statement": "〔第12問〕（配点：２）\n次の対話は、地方自治に関する教授と学生の対話である。教授の各質問に対する次のアからウまでの学生の各回答について、正しいものには○、誤っているものには×を付した場合の組合せを、後記１から８までの中から選びなさい。教授．憲法は、国会が国権の最高機関であることを定めるとともに、内閣総理大臣は国会議員の中から選出され、国務大臣の過半数は国会議員の中から選ばなければならないと定めていますが、地方公共団体における議会と首長の関係はどのようなものですか。\nア．地方公共団体においては、議会の議員だけでなく、首長も住民による直接選挙によって選出され、法律上、議会の議員と首長との兼職が禁止されています。また、国会が国権の最高機関であるのと異なり、地方公共団体においては、議会が自治権の最高機関たる地位にあるものではありません。教授．同じく国会と内閣の関係に関し、憲法は、内閣が衆議院を解散できると定めていますが、この点につき、地方公共団体における議会と首長の関係ではどうですか。\nイ．法律上、地方公共団体では、首長も住民による直接選挙によって選出され、議会と首長は独立対等の関係とされていますので、首長に議会の解散権は認められていません。教授．議員の地位に関し、国会議員には、憲法上、発言・表決に対する免責特権と会期中の不逮捕特権が保障されており、その地位が厚く保護されていますが、この点につき、地方公共団体の議会の議員はどうですか。\nウ．地方公共団体の議会の議員は、憲法上、免責特権も不逮捕特権も保障されておらず、法律上、住民による解職請求が認められています。\n１．ア○ イ○ ウ○\n２．ア○ イ○ ウ×\n３．ア○ イ× ウ○\n４．ア○ イ× ウ×\n５．ア× イ○ ウ○\n６．ア× イ○ ウ×\n７．ア× イ× ウ○\n８．ア× イ× ウ× ［行政法］", "source": "https://www.moj.go.jp/content/001443616.pdf", "answerSource": "https://www.moj.go.jp/content/001444173.pdf"}, {"id": "R7-gyosei-13", "year": "R7", "yearLabel": "令和7年", "subject": "行政法", "qno": 13, "haiten": 3, "type": "series", "options": 2, "answer": [2, 2, 1, 2], "figure": false, "statement": "〔第13問〕（配点：３）\n行政行為に関する次のアからエまでの各記述について、法令又は最高裁判所の判例に照らし、それぞれ正しい場合には１を、誤っている場合には２を選びなさい。\nア．行政行為は、その要件が充足され、行政庁が意思決定をして、これを表示することによって成立し、同時にその効力が発生する。\nイ．授益的な行政行為の職権取消しは、私人が既に有している権利や法的地位を変動させる行政行為であるから、これを行う場合には、取消しを認める旨の法律上の明文の規定が必要である。\nウ．行政行為の附款は、法律で規定された事項以外の内容を付加して、行政行為の効果を制限したり、特別な義務を課したりするものであるが、附款を付し得ることが法律に明記されていない場合であっても、法律が当該行政行為について裁量を認めている場合には、その範囲内で附款を付すことができる。\nエ．行政庁は、行政行為が当初から不当であっても、違法ではない場合には、職権取消しを適法に行うことはできない。", "source": "https://www.moj.go.jp/content/001443616.pdf", "answerSource": "https://www.moj.go.jp/content/001444173.pdf"}, {"id": "R7-gyosei-14", "year": "R7", "yearLabel": "令和7年", "subject": "行政法", "qno": 14, "haiten": 2, "type": "choice", "options": 8, "answer": [4], "figure": false, "statement": "〔第14問〕（配点：２）\n行政手続法上の不利益処分に関する次のアからウまでの各記述について、正しいものに〇、誤っているものに×を付した場合の組合せを、後記１から８までの中から選びなさい。\nア．申請により求められた許認可等を拒否する処分は、行政手続法上の不利益処分には当たらない。\nイ．原子炉設置許可により原子炉が設置されると、原子炉事故が起こったときに原子炉施設の周辺住民はその生命、身体等に直接的かつ重大な被害を受けるものと想定されるから、原子炉設置許可は行政手続法上の不利益処分に当たる。\nウ．単一の許認可等を複数の者が申請するいわゆる競願関係においては、競願者Ａに対する許可処分は、他の競願者Ｂとの関係では行政手続法上の不利益処分に当たる。\n１．ア○ イ○ ウ○\n２．ア○ イ○ ウ×\n３．ア○ イ× ウ○\n４．ア○ イ× ウ×\n５．ア× イ○ ウ○\n６．ア× イ○ ウ×\n７．ア× イ× ウ○\n８．ア× イ× ウ×", "source": "https://www.moj.go.jp/content/001443616.pdf", "answerSource": "https://www.moj.go.jp/content/001444173.pdf"}, {"id": "R7-gyosei-15", "year": "R7", "yearLabel": "令和7年", "subject": "行政法", "qno": 15, "haiten": 3, "type": "series", "options": 2, "answer": [2, 1, 1, 1], "figure": false, "statement": "〔第15問〕（配点：３）\n行政裁量に関する教員と学生による以下の対話中の次のアからエまでの【 】内の各記述について、法令又は最高裁判所の判例に照らし、それぞれ正しい場合には１を、誤っている場合には２を選びなさい。教員：行政裁量とは何ですか。学生：立法者が行政機関に対して認めた判断の余地のことです。教員：行政庁の裁量処分について、行政内部で裁量権行使の基準、つまり裁量基準を設けることがありますが、そのことに関し、行政手続法にはどのような定めがありますか。学生：（ア）【申請に対する処分については、審査基準の設定及び公表が努力義務とされ、不利益処分については、処分基準の設定及び公表が義務付けられています。】 教員：では、処分が裁量基準に違背してされた場合、その処分は違法となりますか。学生：裁量基準は、飽くまで行政の内部基準にすぎず、法規としての性質を有しないことから、（イ）【処分が裁量基準に違背してされたとしても、当然に違法となるものではありません。】 教員：逆に、裁量基準に従ってされた処分が違法と判断されることはありますか。学生：例えば、（ウ）【個別の事情を考慮することなく、裁量基準を機械的に適用して処分がされた場合には、その処分は違法と判断されることがあります。】 教員：ところで、行政事件訴訟と行政不服審査とで、裁量処分の審査の在り方に違いはありますか。学生：行政事件訴訟と異なり、（エ）【行政不服審査においては、裁量権の範囲内の当不当の問題についても審査することができます。】", "source": "https://www.moj.go.jp/content/001443616.pdf", "answerSource": "https://www.moj.go.jp/content/001444173.pdf"}, {"id": "R7-gyosei-16", "year": "R7", "yearLabel": "令和7年", "subject": "行政法", "qno": 16, "haiten": 2, "type": "choice", "options": 8, "answer": [3], "figure": false, "statement": "〔第16問〕（配点：２）\n行政指導に関する次のアからウまでの各記述について、行政手続法に照らし、正しいものに○、誤っているものに×を付した場合の組合せを、後記１から８までの中から選びなさい。\nア．地方公共団体は、行政指導に関する手続について、行政手続法の規定の趣旨にのっとり、行政運営における公正の確保と透明性の向上を図るため必要な措置を講ずるよう努めなければならない。\nイ．行政指導が口頭でされた場合において、その相手方以外の利害関係人から、当該行政指導の趣旨及び内容並びに責任者を記載した書面の交付を求められたときは、当該行政指導に携わる者は、行政上特別の支障がない限り、これを交付しなければならない。\nウ．行政手続法第３２条第２項は、行政指導に携わる者は、その相手方が行政指導に従わなかったことを理由として、不利益な取扱いをしてはならないと定めているが、法律上、相手方が行政指導に協力しないときに氏名等の公表を行うことができる旨の規定が存在する場合に、行政指導に協力しなかった相手方の氏名等の公表を行ったとしても、同項違反の問題は生じない。\n１．ア○ イ○ ウ○\n２．ア○ イ○ ウ×\n３．ア○ イ× ウ○\n４．ア○ イ× ウ×\n５．ア× イ○ ウ○\n６．ア× イ○ ウ×\n７．ア× イ× ウ○\n８．ア× イ× ウ×", "source": "https://www.moj.go.jp/content/001443616.pdf", "answerSource": "https://www.moj.go.jp/content/001444173.pdf"}, {"id": "R7-gyosei-17", "year": "R7", "yearLabel": "令和7年", "subject": "行政法", "qno": 17, "haiten": 3, "type": "series", "options": 2, "answer": [1, 2, 2, 2], "figure": false, "statement": "〔第17問〕（配点：３）\n行政機関の保有する情報の公開に関する法律（以下「情報公開法」という。）及びその適用に関する次のアからエまでの各記述について、同法又は最高裁判所の判例に照らし、それぞれ正しい場 ［№合には１を、誤っている場合には２を選びなさい。\nア．情報公開法第５条第１号が不開示情報として規定する「個人に関する情報（事業を営む個人の当該事業に関する情報を除く。）であって、当該情報に含まれる氏名、生年月日その他の記述等（中略）により特定の個人を識別することができるもの」には、開示請求者自身を識別することができる情報も含まれる。\nイ．行政機関の長は、国、独立行政法人等、地方公共団体、地方独立行政法人及び開示請求者以外の者（以下「第三者」という。）に関する情報が記録されている行政文書を情報公開法第７条の規定により開示しようとするときは、その裁量により、所在の判明している第三者に対し、意見書を提出する機会を与えることができる。\nウ．行政機関の長は、開示請求に係る行政文書が存在しているか否かを答えるだけで、不開示情報を開示することとなる場合であっても、開示請求に係る行政文書の一部に不開示情報が記録されており、不開示情報が記録されている部分を容易に区分して除くことができるときは、当該部分を除いた部分につき開示しなければならない。\nエ．開示請求の対象とされた行政文書を行政機関が保有していないことを理由とする不開示決定の取消訴訟においては、被告が、当該不開示決定時に当該行政機関が当該行政文書を保有していなかったことについて主張立証責任を負う。（参照条文）情報公開法第７条行政機関の長は、開示請求に係る行政文書に不開示情報（第５条第１号の２に掲げる情報を除く。）が記録されている場合であっても、公益上特に必要があると認めるときは、開示請求者に対し、当該行政文書を開示することができる。", "source": "https://www.moj.go.jp/content/001443616.pdf", "answerSource": "https://www.moj.go.jp/content/001444173.pdf"}, {"id": "R7-gyosei-18", "year": "R7", "yearLabel": "令和7年", "subject": "行政法", "qno": 18, "haiten": 2, "type": "choice", "options": 8, "answer": [3], "figure": false, "statement": "〔第18問〕（配点：２）\n処分性に関する次のアからウまでの各記述について、最高裁判所の判例に照らし、正しいものに ○、誤っているものに×を付した場合の組合せを、後記１から８までの中から選びなさい。（解答欄は、 ）\nア．出生した子につき住民票の記載を求める親からの申出に対し市町村長がした当該記載をしない旨の応答には、処分性が認められない。\nイ．出入国管理及び難民認定法に基づく在留期間の更新申請に対し法務大臣がした当該申請を拒否する旨の応答には、処分性が認められない。\nウ．私的独占の禁止及び公正取引の確保に関する法律第４５条第１項に基づく措置要求に対し公正取引委員会がした当該要求に応じない旨の応答には、処分性が認められない。（参照条文）私的独占の禁止及び公正取引の確保に関する法律第４５条何人も、この法律の規定に違反する事実があると思料するときは、公正取引委員会に対し、その事実を報告し、適当な措置をとるべきことを求めることができる。 ２前項に規定する報告があつたときは、公正取引委員会は、事件について必要な調査をしなければならない。 ３第１項の規定による報告が、公正取引委員会規則で定めるところにより、書面で具体的な事実を摘示してされた場合において、当該報告に係る事件について、適当な措置をとり、又は措置をとらないこととしたときは、公正取引委員会は、速やかに、その旨を当該報告をした者に通知しなければならない。 ４（略）\n１．ア○ イ○ ウ○\n２．ア○ イ○ ウ×\n３．ア○ イ× ウ○\n４．ア○ イ× ウ×\n５．ア× イ○ ウ○\n６．ア× イ○ ウ×\n７．ア× イ× ウ○\n８．ア× イ× ウ×", "source": "https://www.moj.go.jp/content/001443616.pdf", "answerSource": "https://www.moj.go.jp/content/001444173.pdf"}, {"id": "R7-gyosei-19", "year": "R7", "yearLabel": "令和7年", "subject": "行政法", "qno": 19, "haiten": 2, "type": "choice", "options": 8, "answer": [4], "figure": false, "statement": "〔第19問〕（配点：２）\n原告適格に関する次のアからウまでの各記述について、最高裁判所の判例に照らし、正しいものに○、誤っているものに×を付した場合の組合せを、後記１から８までの中から選びなさい。（解答欄は、 ）\nア．医療法（平成１８年法律第８４号による改正前のもの）に基づく病院の開設許可処分について、当該開設許可処分によって都道府県における医療を提供する体制の確保に関する計画が定める基準病床数を超過する結果となったとしても、当該病院の開設地の付近において医療施設を開設する医療法人には、当該開設許可処分の取消しを求める原告適格は認められない。\nイ．里道の用途廃止処分について、里道は近隣住民に個別具体的な利益をもたらすものではないから、その用途廃止により当該住民の生活に著しい支障が生じるとしても、当該住民には当該廃止処分の取消しを求める原告適格は認められない。\nウ．滞納者と他の者との共有に係る不動産につき滞納者の持分が国税徴収法に基づいて差押えを受けた場合、当該不動産の他の共有者には、当該差押処分の法的効果による権利の制限を受けるとしても、当該差押処分の取消しを求める原告適格は認められない。\n１．ア○ イ○ ウ○\n２．ア○ イ○ ウ×\n３．ア○ イ× ウ○\n４．ア○ イ× ウ×\n５．ア× イ○ ウ○\n６．ア× イ○ ウ×\n７．ア× イ× ウ○\n８．ア× イ× ウ×", "source": "https://www.moj.go.jp/content/001443616.pdf", "answerSource": "https://www.moj.go.jp/content/001444173.pdf"}, {"id": "R7-gyosei-20", "year": "R7", "yearLabel": "令和7年", "subject": "行政法", "qno": 20, "haiten": 3, "type": "series", "options": 2, "answer": [1, 2, 1, 2], "figure": false, "statement": "〔第20問〕（配点：３）\n抗告訴訟における判決に関する次のアからエまでの各記述について、行政事件訴訟法に照らし、それぞれ正しい場合には１を、誤っている場合には２を選びなさい。\nア．処分の取消しの訴えといわゆる申請型義務付けの訴えに係る弁論及び裁判は、分離しないでしなければならないが、裁判所は、審理の状況その他の事情を考慮して、処分の取消しの訴えについてのみ終局判決をすることがより迅速な争訟の解決に資すると認めるときは、処分の取消しの訴えについてのみ終局判決をすることができる。\nイ．申請を認容した処分につき第三者が取消しを求める訴えを提起し、同処分が判決により手続に違法があることを理由として取り消されたときは、その処分をした行政庁は、判決の趣旨に従い、違法とされた手続を改めて履践した上で、申請を認容する処分をしなければならない。\nウ．処分の取消しの訴えにおいて、処分が違法ではあるが、これを取り消すことにより公の利益に著しい障害を生ずる場合において、原告の受ける損害の程度、その損害の賠償又は防止の程度及び方法その他一切の事情を考慮した上、処分を取り消すことが公共の福祉に適合しないと認められるとして、裁判所が、処分が違法であることを宣言し、請求を棄却する旨の判決をしたときは、原告及び被告のいずれも控訴することができる。\nエ．処分の取消しの訴えにおいて、請求を棄却する判決が確定した場合、当該判決は、第三者に対しても効力を有する。", "source": "https://www.moj.go.jp/content/001443616.pdf", "answerSource": "https://www.moj.go.jp/content/001444173.pdf"}, {"id": "R7-gyosei-21", "year": "R7", "yearLabel": "令和7年", "subject": "行政法", "qno": 21, "haiten": 3, "type": "series", "options": 2, "answer": [1, 2, 2, 1], "figure": false, "statement": "〔第21問〕（配点：３）\n抗告訴訟に関する次のアからエまでの各記述について、行政事件訴訟法（以下「法」という。）又は最高裁判所の判例に照らし、それぞれ正しい場合には１を、誤っている場合には２を選びなさい。\nア．法第３条第６項第１号の義務付けの訴え（いわゆる非申請型義務付けの訴え）は、行政庁が一定の処分をすべき旨を命ずることを求めるにつき法律上の利益を有する者に限り、適法に提起することができる。\nイ．法第３条第６項第２号の義務付けの訴え（いわゆる申請型義務付けの訴え）は、一定の処分がされないことにより重大な損害を生ずるおそれがあり、かつ、その損害を避けるため他に適当な方法がないときに限り、適法に提起することができる。\nウ．自衛隊機の運航の差止めを求める訴えについては、法第３条第７項の差止めの訴えの対象となる「一定の処分」を観念することができないから、無名抗告訴訟として適法とされる余地があるかどうかはともかく、同項の差止めの訴えとしては不適法である。\nエ．将来の不利益処分の予防を目的として当該処分の前提となる公的義務の不存在確認を求める無名抗告訴訟は、法第３条第７項の差止めの訴えの訴訟要件である「行政庁によって一定の処分がされる蓋然性があること」を満たさない場合には、不適法である。", "source": "https://www.moj.go.jp/content/001443616.pdf", "answerSource": "https://www.moj.go.jp/content/001444173.pdf"}, {"id": "R7-gyosei-22", "year": "R7", "yearLabel": "令和7年", "subject": "行政法", "qno": 22, "haiten": 2, "type": "choice", "options": 8, "answer": [7], "figure": false, "statement": "〔第22問〕（配点：２）\n行政事件訴訟法上の仮の救済に関する次のアからウまでの各記述について、同法に照らし、正しいものに○、誤っているものに×を付した場合の組合せを、後記１から８までの中から選びなさい。\nア．仮の義務付けの決定が、当該決定に対する即時抗告についての裁判により取り消されたときは、行政庁が当該決定に基づいてした処分は、当然にその効力を失うから、当該行政庁は、当該処分を取り消す必要はない。\nイ．裁判所は、仮の差止めの決定前に仮の差止めの申立人の意見を聴いているから、事情変更による仮の差止めの決定の取消決定をする場合、仮の差止めの申立人の意見を改めて聴く必要はない。\nウ．裁判所は、本案について理由があるとみえるときでなければ、仮の義務付けの決定をすることができない。\n１．ア○ イ○ ウ○\n２．ア○ イ○ ウ×\n３．ア○ イ× ウ○\n４．ア○ イ× ウ×\n５．ア× イ○ ウ○\n６．ア× イ○ ウ×\n７．ア× イ× ウ○\n８．ア× イ× ウ×", "source": "https://www.moj.go.jp/content/001443616.pdf", "answerSource": "https://www.moj.go.jp/content/001444173.pdf"}, {"id": "R7-gyosei-23", "year": "R7", "yearLabel": "令和7年", "subject": "行政法", "qno": 23, "haiten": 3, "type": "series", "options": 2, "answer": [2, 2, 2, 1], "figure": false, "statement": "〔第23問〕（配点：３）\n国家賠償に関する次のアからエまでの各記述について、法令又は最高裁判所の判例に照らし、それぞれ正しい場合には１を、誤っている場合には２を選びなさい。\nア．市区町村長が弁護士法第２３条の２に基づく照会に応じて前科及び犯罪経歴を報告することは、国家賠償法第１条第１項にいう「公権力の行使」に該当しない。\nイ．国又は公共団体の公権力の行使に当たる公務員が、その職務を行うについて、故意又は重大な過失によって違法に他人に損害を加えたときは、その公務員も損害を被った者に対する直接の賠償責任を負う。\nウ．行政処分が違法であることを理由として国家賠償請求をするには、あらかじめ当該処分について取消し又は無効等確認の判決を得るか、当該処分の取消しの訴え又は無効等確認の訴えを併合して提起することを要する。\nエ．市議会議員が議会内における一般質問の際に行った発言は、その発言内容にかかわらず、国家賠償法第１条第１項にいう「その職務を行うについて」されたものに該当する。", "source": "https://www.moj.go.jp/content/001443616.pdf", "answerSource": "https://www.moj.go.jp/content/001444173.pdf"}, {"id": "R7-gyosei-24", "year": "R7", "yearLabel": "令和7年", "subject": "行政法", "qno": 24, "haiten": 2, "type": "choice", "options": 8, "answer": [8], "figure": false, "statement": "〔第24問〕（配点：２）\n行政不服審査法に関する次のアからウまでの各記述について、同法に照らし、正しいものに〇、誤っているものに×を付した場合の組合せを、後記１から８までの中から選びなさい。\nア．行政庁の処分につき、法律に再調査の請求をすることができる旨の定めがある場合には、当該処分に不服がある者は、原則として、審査請求をする前に、再調査の請求をしなければならない。\nイ．処分についての審査請求書に審査請求の趣旨が記載されていない場合であっても、審査庁は、不備を補正すべきことを命じる義務を負わない。\nウ．事実上の行為は審査請求の対象となる処分から除外されているので、事実上の行為についての審査請求は不適法である。\n１．ア○ イ○ ウ○\n２．ア○ イ○ ウ×\n３．ア○ イ× ウ○\n４．ア○ イ× ウ×\n５．ア× イ○ ウ○\n６．ア× イ○ ウ×\n７．ア× イ× ウ○\n８．ア× イ× ウ×", "source": "https://www.moj.go.jp/content/001443616.pdf", "answerSource": "https://www.moj.go.jp/content/001444173.pdf"}, {"id": "R7-minpo-1", "year": "R7", "yearLabel": "令和7年", "subject": "民法", "qno": 1, "haiten": 2, "type": "choice", "options": 5, "answer": [1], "figure": false, "statement": "〔第１問〕（配点：２）\n意思表示等に関する次のアからオまでの各記述のうち、判例の趣旨に照らし正しいものを組み合わせたものは、後記１から５までのうちどれか。\nア．意思表示の相手方が意思表示を受けた時点において保佐開始の審判を受けていたときであっても、表意者は、その意思表示をもってその相手方に対抗することができる。\nイ．意思表示の相手方が意思表示を受けた時点において未成年者であったときでも、その法定代理人がその意思表示を知った後は、表意者は、その意思表示をもってその相手方に対抗することができる。\nウ．債権譲渡通知は、債権の譲渡人が債務者の所在を知ることができないときであっても、公示の方法によってすることができない。\nエ．解除の意思表示を含む内容証明郵便が、その意思表示の相手方である受取人が不在のため一定期間郵便局に留置された後に差出人に返送された場合において、その受取人がその内容証明郵便の内容を十分に推知することができなかったとしても、留置期間内に容易にそれを受領することができたときは、その意思表示は、到達したものと認められる。\nオ．意思表示の相手方が正当な理由なくその意思表示の通知が到達することを妨げたときは、その通知は、相手方がその到達を妨げた時に到達したものとみなされる。\n１．アイ\n２．アエ\n３．イウ\n４．ウオ\n５．エオ", "source": "https://www.moj.go.jp/content/001443617.pdf", "answerSource": "https://www.moj.go.jp/content/001444174.pdf"}, {"id": "R7-minpo-2", "year": "R7", "yearLabel": "令和7年", "subject": "民法", "qno": 2, "haiten": 2, "type": "choice", "options": 5, "answer": [2], "figure": false, "statement": "〔第２問〕（配点：２）\nＡは、自己に代理権がないことを知りながら、Ｂの代理人としてＣと契約を締結した。Ｃは、契約当時、Ａに代理権がないことを知らなかった。この事例に関する次のアからオまでの各記述のうち、判例の趣旨に照らし正しいものを組み合わせたものは、後記１から５までのうちどれか。（解答欄は、 ）\nア．Ａがした契約をＢが追認しない間は、Ｃは、その契約を取り消すことができる。\nイ．ＣがＢに対し、相当の期間を定めて、その期間内にＡがした契約を追認するかどうかを確答すべき旨の催告をした場合において、Ｂがその期間内に確答をしないときは、その契約を追認したものとみなされる。\nウ．ＣがＡに代理権がなかったことを過失によって知らなかったときは、Ａは、Ｃに対して無権代理人の責任を負わない。\nエ．ＢがＡのした契約について追認を拒絶したときは、その後ＡがＢを相続したとしても、その契約が有効になるものではない。\nオ．Ｃから無権代理人の責任として契約の履行を求められたＡは、その履行に代えて、損害の賠償をすることができる。\n１．アウ\n２．アエ\n３．イウ\n４．イオ\n５．エオ", "source": "https://www.moj.go.jp/content/001443617.pdf", "answerSource": "https://www.moj.go.jp/content/001444174.pdf"}, {"id": "R7-minpo-3", "year": "R7", "yearLabel": "令和7年", "subject": "民法", "qno": 3, "haiten": 2, "type": "choice", "options": 5, "answer": [4], "figure": false, "statement": "〔第３問〕（配点：２）\n時効に関する次のアからオまでの各記述のうち、判例の趣旨に照らし誤っているものを組み合わせたものは、後記１から５までのうちどれか。\nア．後順位抵当権者は、先順位抵当権の被担保債権の消滅により後順位抵当権者の抵当権の順位が上昇すれば配当額が増加することになるときであっても、先順位抵当権の被担保債権の消滅時効を援用することができない。\nイ．債務者は、債務について消滅時効が完成した後に、時効完成の事実を知らずに債権者に対し債務の承認をしたときであっても、消滅時効を援用することができる。\nウ．抵当権が設定された不動産の第三取得者は、その抵当権の被担保債権の消滅時効を援用することができる。\nエ．同一の当事者間に数個の金銭消費貸借契約に基づく各元本債務が存在する場合において、借主が、弁済を充当すべき債務を指定することなく全債務を完済するのに足りない額の弁済をしたときは、その弁済は、特段の事情のない限り、各元本債務についての承認に当たる。\nオ．自己の所有物については、所有権の取得時効を援用することができない。\n１．アウ\n２．アエ\n３．イウ\n４．イオ\n５．エオ", "source": "https://www.moj.go.jp/content/001443617.pdf", "answerSource": "https://www.moj.go.jp/content/001444174.pdf"}, {"id": "R7-minpo-4", "year": "R7", "yearLabel": "令和7年", "subject": "民法", "qno": 4, "haiten": 2, "type": "choice", "options": 5, "answer": [3], "figure": false, "statement": "〔第４問〕（配点：２）\n不動産物権変動に関する次のアからオまでの各記述のうち、判例の趣旨に照らし正しいものを組み合わせたものは、後記１から５までのうちどれか。\nア．ＡがＡ所有の甲土地をＢに売却し、Ｂがその引渡しを受けた時から１年を経過した後、Ａが甲土地をＣに売却し、Ｃが所有権移転登記を備えたときは、Ｂが主張する所有権の取得時効の期間は、Ｃが所有権移転登記を備えた時から起算する。\nイ．入会権の取得は、入会権が共有の性質を有するかどうかにかかわらず、登記をしないで、第三者に対抗することができる。\nウ．不動産質権の設定は、現実の引渡しがあっても、登記をしなければ、第三者に対抗することができない。\nエ．ＡがＡのＢに対するα債権を担保するため、Ｃ所有の甲土地についてＣから抵当権の設定を受けた後、Ａがその抵当権をＤのＡに対するβ債権の担保とした場合において、ＡがＢに転抵当権の設定を通知したときであっても、ＡがＣに転抵当権の設定を通知せず、かつ、Ｃがこれを承諾しなかったときは、Ｃは、Ｄの同意を得ないでしたα債権の弁済をＤに対抗することができる。\nオ．ＡがＡ所有の甲土地をＢに売却した後、Ａが死亡した場合において、Ａの唯一の相続人Ｃが甲土地をＤに売却したときは、Ｂは、登記を備えないで、甲土地の所有権の取得を第三者Ｄに対抗することができる。\n１．アエ\n２．アオ\n３．イウ\n４．イエ\n５．ウオ", "source": "https://www.moj.go.jp/content/001443617.pdf", "answerSource": "https://www.moj.go.jp/content/001444174.pdf"}, {"id": "R7-minpo-5", "year": "R7", "yearLabel": "令和7年", "subject": "民法", "qno": 5, "haiten": 2, "type": "choice", "options": 5, "answer": [1], "figure": false, "statement": "〔第５問〕（配点：２）\nＡ及びＢが甲土地を共有している場合に関する次のアからオまでの各記述のうち、判例の趣旨に ［No.照らし正しいものを組み合わせたものは、後記１から５までのうちどれか。\nア．Ａが甲土地の管理のために費用を支払った後、Ｂがその持分をＣに譲渡したときは、Ａは、 Ｃに対しても、Ｃの持分に応じてその費用の償還を求めることができる。\nイ．Ａは、甲土地を不法に占有するＤに対し、単独で甲土地全部の明渡しを求めることができない。\nウ．Ａの債権者Ｅは、自己の費用で、甲土地の分割に参加することができる。\nエ．Ｂが甲土地を単独で使用する場合において、ＡとＢとの間の別段の合意がないときは、Ｂは、自己の持分を超える使用について、Ａに対し、その対価の償還の義務を負わない。\nオ．Ａが死亡した場合において、Ａに相続人がないときは、Ａの持分は、国庫に帰属する。\n１．アウ\n２．アオ\n３．イウ\n４．イエ\n５．エオ", "source": "https://www.moj.go.jp/content/001443617.pdf", "answerSource": "https://www.moj.go.jp/content/001444174.pdf"}, {"id": "R7-minpo-6", "year": "R7", "yearLabel": "令和7年", "subject": "民法", "qno": 6, "haiten": 2, "type": "choice", "options": 5, "answer": [5], "figure": false, "statement": "〔第６問〕（配点：２）\n抵当権の効力に関する次のアからオまでの各記述のうち、判例の趣旨に照らし誤っているものを組み合わせたものは、後記１から５までのうちどれか。\nア．建物所有目的で賃貸された土地に築造された建物について抵当権が設定されたときは、その抵当権の効力は、敷地の賃借権に及ぶ。\nイ．抵当権の設定後に抵当地に建物が築造され、抵当権者が土地とともにその建物を競売するときであっても、その優先権は、土地の代価についてのみ行使することができる。\nウ．抵当不動産の第三取得者は、抵当不動産について必要費を支出したときは、抵当不動産の代価から、他の債権者より先にその償還を受けることができる。\nエ．抵当不動産の第三取得者は、被担保債権の連帯保証人であるときであっても、抵当権消滅請求をすることができる。\nオ．抵当不動産の第三取得者は、その競売において買受人となることができない。\n１．アイ\n２．アウ\n３．イエ\n４．ウオ\n５．エオ", "source": "https://www.moj.go.jp/content/001443617.pdf", "answerSource": "https://www.moj.go.jp/content/001444174.pdf"}, {"id": "R7-minpo-7", "year": "R7", "yearLabel": "令和7年", "subject": "民法", "qno": 7, "haiten": 2, "type": "choice", "options": 5, "answer": [3], "figure": false, "statement": "〔第７問〕（配点：２）\n債務不履行に関する次のアからオまでの各記述のうち、判例の趣旨に照らし正しいものを組み合わせたものは、後記１から５までのうちどれか。\nア．特別の事情によって生じた損害については、債務者が債務不履行時にその事情を現に予見していたときに限り、債権者は、債務不履行による損害賠償を請求することができる。\nイ．契約に基づく債務の履行がその契約の成立の時に不能であったことは、その履行の不能によって生じた損害の賠償を請求することを妨げない。\nウ．債権者が債務の履行を受けることができない場合において、履行の提供があった時以後に当事者双方の責めに帰することができない事由によってその債務の履行が不能となったときは、その履行の不能は、債務者の責めに帰すべき事由によるものとみなされる。\nエ．債務不履行による損害賠償は、当事者間で別段の合意がされたときであっても、金銭をもってその額を定める。\nオ．金銭消費貸借契約において返還の時期を定めなかった場合において、貸主が相当の期間を定めずに返還の催告をしたときは、借主は、相当の期間を経過した時から履行遅滞の責任を負う。\n１．アイ\n２．アウ\n３．イオ\n４．ウエ\n５．エオ", "source": "https://www.moj.go.jp/content/001443617.pdf", "answerSource": "https://www.moj.go.jp/content/001444174.pdf"}, {"id": "R7-minpo-8", "year": "R7", "yearLabel": "令和7年", "subject": "民法", "qno": 8, "haiten": 2, "type": "choice", "options": 5, "answer": [1], "figure": false, "statement": "〔第８問〕（配点：２）\nＡのＢに対する貸金債務甲につき、法人でないＣが保証する場合に関する次のアからオまでの各記述のうち、誤っているものを組み合わせたものは、後記１から５までのうちどれか。\nア．ＢＣ間のみならず、ＡＣ間においても連帯の特約がされなければ、Ｃは、連帯保証債務を負担しない。\nイ．Ｃの保証債務が連帯保証債務であり、Ｄも貸金債務甲について連帯保証をしているときは、 ＣのＢに対する連帯保証債務の額は、貸金債務甲の額の２分の１となる。\nウ．Ａが貸金債務甲について有していた期限の利益を喪失したときは、Ｂは、Ｃに対し、その利益の喪失を知った時から法定の期間内に、その旨を通知しなければならない。\nエ．Ｃの保証がＡの委託を受けずにしたものである場合においては、Ｂは、Ｃの請求を受けたときであっても、Ｃに対し、貸金債務甲の元本及び利息について、不履行の有無、残額及び弁済期が到来しているものの額に関する情報を提供する義務を負わない。\nオ．貸金債務甲がＡの事業のために負担するものである場合において、ＡがＣに保証の委託をするときは、Ａは、Ｃに対し、Ａの財産及び収支の状況について情報を提供しなければならない。\n１．アイ\n２．アエ\n３．イウ\n４．ウオ\n５．エオ", "source": "https://www.moj.go.jp/content/001443617.pdf", "answerSource": "https://www.moj.go.jp/content/001444174.pdf"}, {"id": "R7-minpo-9", "year": "R7", "yearLabel": "令和7年", "subject": "民法", "qno": 9, "haiten": 2, "type": "choice", "options": 5, "answer": [1], "figure": false, "statement": "〔第９問〕（配点：２）\n債権の消滅に関する次のアからオまでの各記述のうち、判例の趣旨に照らし誤っているものを組み合わせたものは、後記１から５までのうちどれか。\nア．主たる債務についての弁済の目的物の供託によって保証債務が消滅したときは、供託をした者は、債権者が供託を受諾せず、又は供託を有効と宣告した判決が確定しない間においても、供託物を取り戻すことができない。\nイ．請負人は、注文者に対する請負報酬債権を自働債権とし、注文者の請負人に対する目的物の修補に代わる損害賠償債権を受働債権とする相殺をすることができる。\nウ．ＡのＢに対する身体の侵害による損害賠償債権がＡからＣへと譲渡された場合において、Ｂ がＣに対し貸金債権を有するときは、Ｂは、貸金債権を自働債権とし、ＣがＡから譲り受けた損害賠償債権を受働債権とする相殺をすることができない。\nエ．当事者が従前の債務に代えて、新たな債務であって従前の給付の内容について重要な変更をするものを発生させる契約をしたときは、従前の債務は、消滅する。\nオ．ＡのＢに対する売買代金債権をＣが差し押さえた後にＢがＡを相続したときは、その債権は、消滅しない。\n１．アウ\n２．アエ\n３．イエ\n４．イオ\n５．ウオ", "source": "https://www.moj.go.jp/content/001443617.pdf", "answerSource": "https://www.moj.go.jp/content/001444174.pdf"}, {"id": "R7-minpo-10", "year": "R7", "yearLabel": "令和7年", "subject": "民法", "qno": 10, "haiten": 2, "type": "choice", "options": 5, "answer": [2], "figure": false, "statement": "〔第10問〕（配点：２）\nＡがＡ所有の甲建物をＢに売る契約の解除に関する次のアからオまでの各記述のうち、判例の趣旨に照らし誤っているものを組み合わせたものは、後記１から５までのうちどれか。\nア．Ａが本件契約をＢの債務不履行により解除した場合におけるＡのＢに対する原状回復請求権は、Ａが解除権の発生を知った時から５年間行使しないときは、時効によって消滅する。\nイ．Ｂが本件契約をＡの債務不履行により解除した場合において、ＡがＢに対し代金の返還義務を負うときは、Ａは、代金の受領の時から利息を付さなければならない。\nウ．Ａが本件契約をＢの債務不履行により解除したときは、甲建物の所有権は、遡及的にＡに復帰する。\nエ．Ａが本件契約をＢの債務不履行により解除したときは、Ａは、Ｂに対し、代金債務の履行に代わる損害賠償を請求することができる。\nオ．Ａが本件契約に基づく代金債権をＣに譲渡し、その譲渡について第三者対抗要件が備えられたときは、Ｃは、その後にＢが本件契約をＡの債務不履行により解除したとしても、代金債権を失わない。\n１．アエ\n２．アオ\n３．イウ\n４．イエ\n５．ウオ", "source": "https://www.moj.go.jp/content/001443617.pdf", "answerSource": "https://www.moj.go.jp/content/001444174.pdf"}, {"id": "R7-minpo-11", "year": "R7", "yearLabel": "令和7年", "subject": "民法", "qno": 11, "haiten": 2, "type": "choice", "options": 5, "answer": [1], "figure": false, "statement": "〔第11問〕（配点：２）\n委任に関する次のアからオまでの各記述のうち、判例の趣旨に照らし正しいものを組み合わせたものは、後記１から５までのうちどれか。\nア．受任者は、委任者のために自己の名で取得した権利を委任者に移転しなければならない。\nイ．受任者が委任事務を処理するのに必要と認められる債務を負担した場合において、その債務が弁済期にないときは、受任者は、委任者に対し、相当の担保を供させることができる。\nウ．受任者が委任事務を処理するため自己に過失なく損害を受けた場合には、その損害の発生が委任者の責めに帰すべき事由によるものであるときに限り、受任者は、委任者に対し、その損害の賠償を請求することができる。\nエ．委任者が受任者に不利な時期に委任契約について任意解除をした場合には、やむを得ない事由があったときであっても、委任者は、受任者に対し、その損害を賠償しなければならない。\nオ．委任契約において委任者の死亡によっても契約を終了させない旨の特約をしたときであっても、その特約は、無効である。\n１．アイ\n２．アエ\n３．イウ\n４．ウオ\n５．エオ", "source": "https://www.moj.go.jp/content/001443617.pdf", "answerSource": "https://www.moj.go.jp/content/001444174.pdf"}, {"id": "R7-minpo-12", "year": "R7", "yearLabel": "令和7年", "subject": "民法", "qno": 12, "haiten": 2, "type": "choice", "options": 5, "answer": [2], "figure": false, "statement": "〔第12問〕（配点：２）\n不法行為に関する次のアからオまでの各記述のうち、判例の趣旨に照らし正しいものを組み合わせたものは、後記１から５までのうちどれか。\nア．良好な景観に近接する地域内に居住し、その恵沢を日常的に享受している者は、この者が有する良好な景観の恵沢を享受する利益が違法に侵害されたことをもって、不法行為による損害賠償を請求することができる。\nイ．疾病のため死亡した患者の診療に当たった医師の医療行為が、その過失によって医療水準にかなったものでなかった場合において、医療水準にかなった医療が行われていたとすれば患者がその死亡の時点でなお生存していた相当程度の可能性の存在が証明されたときは、その医療行為と患者の死亡との間における因果関係が肯定される。\nウ．ある事実を基礎としての論評の表明によって他人の名誉を毀損した場合において、その行為が公共の利害に関する事実に係り、かつ、その目的が専ら公益を図ることにあったときは、人身攻撃に及ぶなど論評としての域を逸脱したものでない限り、その行為は、違法でない。\nエ．労働者Ａが、第三者Ｂの過失による事故によって負傷し、この事故を原因として労働者災害補償保険法に基づく保険給付を受けた。この場合におけるＢのＡに対する損害賠償責任について、Ａの過失をもって過失相殺をすべきであり、かつ、Ａが受けた保険給付の価額を控除すべきときは、損害賠償の額は、まず過失相殺による減額をし、その残額から保険給付の価額を控除する方法により算定する。\nオ．人の身体を害する不法行為による損害賠償請求権は、被害者又はその法定代理人が損害及び加害者を知った時から３年間行使しないときは、時効によって消滅する。\n１．アイ\n２．アエ\n３．イオ\n４．ウエ\n５．ウオ", "source": "https://www.moj.go.jp/content/001443617.pdf", "answerSource": "https://www.moj.go.jp/content/001444174.pdf"}, {"id": "R7-minpo-13", "year": "R7", "yearLabel": "令和7年", "subject": "民法", "qno": 13, "haiten": 2, "type": "choice", "options": 5, "answer": [4], "figure": false, "statement": "〔第13問〕（配点：２）\nＡ及びＢの実子Ｃを養子とし、Ｄ及びＥを養親とする特別養子縁組に関する次のアからオまでの各記述のうち、誤っているものを組み合わせたものは、後記１から５までのうちどれか。\nア．Ａ及びＢがＣを悪意で遺棄していたときは、特別養子縁組の成立には、Ａ及びＢの同意を要しない。\nイ．Ｃが１５歳に達しているときであっても、特別養子縁組の成立には、Ｃの同意を要しない。\nウ．ＤとＥとが婚姻していないときは、特別養子縁組は、することができない。\nエ．Ａ及びＢが死亡しているときは、特別養子縁組の離縁は、することができない。\nオ．Ｄ及びＥがＣの親族であるときは、家庭裁判所は、特別養子縁組の成立の審判の時までＤ及びＥがＣを監護したことがなくても、特別養子縁組を成立させることができる。\n１．アウ\n２．アエ\n３．イウ\n４．イオ\n５．エオ", "source": "https://www.moj.go.jp/content/001443617.pdf", "answerSource": "https://www.moj.go.jp/content/001444174.pdf"}, {"id": "R7-minpo-14", "year": "R7", "yearLabel": "令和7年", "subject": "民法", "qno": 14, "haiten": 2, "type": "choice", "options": 5, "answer": [4], "figure": false, "statement": "〔第14問〕（配点：２）\n相続の承認及び放棄に関する次のアからオまでの各記述のうち、正しいものを組み合わせたものは、後記１から５までのうちどれか。\nア．被相続人Ａの子Ｂが相続の放棄をした場合において、Ｂの子ＣがＡの直系卑属であるときは、 Ｃは、Ｂを代襲して相続人となる。\nイ．１５歳に達している未成年者が法定代理人の同意を得ないでした相続の放棄は、取り消すことができない。\nウ．家庭裁判所に申述が受理された相続の放棄は、撤回することができない。\nエ．相続人は、単純承認をしたときは、無限に被相続人の権利義務を承継する。\nオ．相続人Ａが相続の放棄をした場合であっても、次順位の相続人Ｂが相続の承認をした後に、 Ａが相続財産の全部を私に消費したときは、Ａは、単純承認をしたものとみなされる。\n１．アイ\n２．アウ\n３．イオ\n４．ウエ\n５．エオ", "source": "https://www.moj.go.jp/content/001443617.pdf", "answerSource": "https://www.moj.go.jp/content/001444174.pdf"}, {"id": "R7-minpo-15", "year": "R7", "yearLabel": "令和7年", "subject": "民法", "qno": 15, "haiten": 2, "type": "choice", "options": 5, "answer": [3], "figure": false, "statement": "〔第15問〕（配点：２）\n地上権及び土地賃借権に関する次のアからオまでの各記述のうち、判例の趣旨に照らし正しいものを組み合わせたものは、後記１から５までのうちどれか。\nア．地上権者は、地上権に基づく地上権設定登記請求権を有し、土地賃借人は、賃貸借契約に基づく賃借権設定登記請求権を有する。\nイ．地上権者は、土地所有者に対して、地上権に基づき土地を使用に適した状態に置くよう請求する権利を有しないが、土地賃借人は、土地賃貸人に対して、賃貸借契約に基づき土地を使用に適した状態に置くよう請求する権利を有する。\nウ．地上権は、時効によって取得することができるが、土地賃借権は、時効によって取得することができない。\nエ．建物所有を目的とする地上権も、建物所有を目的とする土地賃借権も、それぞれの権利者がそれぞれの権利の目的物である土地の上に登記されている建物を所有するときは、そのことをもって第三者に対抗することができる。\nオ．地上権者は、地上権の目的物である土地の所有者の承諾を得なければ、その土地を第三者に賃貸することができず、土地賃借人も、賃貸人の承諾を得なければ、賃借物である土地を転貸することができない。\n１．アイ\n２．アウ\n３．イエ\n４．ウオ\n５．エオ ［商法］", "source": "https://www.moj.go.jp/content/001443617.pdf", "answerSource": "https://www.moj.go.jp/content/001444174.pdf"}, {"id": "R7-shoho-16", "year": "R7", "yearLabel": "令和7年", "subject": "商法", "qno": 16, "haiten": 2, "type": "choice", "options": 5, "answer": [5], "figure": false, "statement": "〔第16問〕（配点：２）\n株式会社の発起設立に関する次のアからオまでの各記述のうち、誤っているものを組み合わせたものは、後記１から５までのうちどれか。\nア．発起人は、株式会社の成立後は、錯誤を理由として設立時発行株式の引受けの取消しをすることができない。\nイ．株式会社が成立しなかったときは、発起人は、連帯して、株式会社の設立に関して支出した費用を負担する。\nウ．現物出資財産を給付した発起人は、株式会社の成立の時における当該現物出資財産の価額が定款に記載又は記録された当該現物出資財産の価額に著しく不足する場合には、検査役の調査を経たときであっても、当該株式会社に対し、当該不足額を支払う義務を負う。\nエ．発起人は、公証人による定款の認証を受けた後であっても、株式会社の成立の時までに、発起人の全員の同意によって、当該定款を変更して本店の所在地を変更することができる。\nオ．判例の趣旨によれば、定款に記載又は記録しないでされた財産引受けは、成立後の株式会社が追認することにより、遡って有効になる。\n１．アウ\n２．アオ\n３．イウ\n４．イエ\n５．エオ", "source": "https://www.moj.go.jp/content/001443617.pdf", "answerSource": "https://www.moj.go.jp/content/001444174.pdf"}, {"id": "R7-shoho-17", "year": "R7", "yearLabel": "令和7年", "subject": "商法", "qno": 17, "haiten": 2, "type": "choice", "options": 5, "answer": [5], "figure": false, "statement": "〔第17問〕（配点：２）\n異なる種類の株式に関する次のアからオまでの各記述のうち、誤っているものを組み合わせたものは、後記１から５までのうちどれか。\nア．種類株式発行会社でない株式会社は、剰余金の配当に関して内容の異なる２以上の種類の株式を発行する場合には、会社法所定の事項を定款で定めなければならない。\nイ．会社法上の公開会社は、ある種類の株式の種類株主を構成員とする種類株主総会において取締役を選任することを内容とする種類の株式を発行することができない。\nウ．会社法上の公開会社である種類株式発行会社は、議決権制限株式の数が発行済株式の総数の ２分の１を超えるに至ったときは、直ちに、議決権制限株式の数を発行済株式の総数の２分の １以下にするための必要な措置をとらなければならない。\nエ．剰余金の配当に関する優先株式を取得条項付株式として発行することはできるが、その取得の対価を剰余金の配当に関する劣後株式とすることはできない。\nオ．種類株式発行会社が全部取得条項付種類株式の全部を取得する場合において、取得対価が当該全部取得条項付種類株式の株主に特に有利な金額でないときは、取締役は、当該全部取得条項付種類株式の取得に関する決定をする株主総会において、当該全部取得条項付種類株式の全部を取得することを必要とする理由を説明することを要しない。\n１．アイ\n２．アオ\n３．イウ\n４．ウエ\n５．エオ", "source": "https://www.moj.go.jp/content/001443617.pdf", "answerSource": "https://www.moj.go.jp/content/001444174.pdf"}, {"id": "R7-shoho-18", "year": "R7", "yearLabel": "令和7年", "subject": "商法", "qno": 18, "haiten": 2, "type": "choice", "options": 5, "answer": [1], "figure": false, "statement": "〔第18問〕（配点：２）\n募集株式の発行に関する次のアからオまでの各記述のうち、正しいものを組み合わせたものは、後記１から５までのうちどれか。\nア．判例の趣旨によれば、会社法上の公開会社の株主総会は、発行済株式の総数が発行可能株式総数に満たない場合に、新たに募集株式の発行をすることを条件として、その発行後の発行済株式の総数の４倍まで発行可能株式総数を増加する定款の変更をする旨の決議をすることができる。\nイ．会社法上の公開会社は、募集株式の払込金額が当該募集株式を引き受ける者に特に有利な金額である場合には、株主に当該募集株式の割当てを受ける権利を与えるときであっても、株主総会の決議によって募集事項を定めなければならない。\nウ．判例の趣旨によれば、会社法上の公開会社でない株式会社において、株主総会の特別決議を経ないまま、株主に募集株式の割当てを受ける権利を与えることなく募集株式を発行した場合には、当該募集株式の発行には無効原因がある。\nエ．会社法上の公開会社でない取締役会設置会社において、募集株式の払込金額の下限が当該募集株式を引き受ける者に特に有利な金額である場合には、株主総会の特別決議によって当該募集株式に関する募集事項の決定を取締役会に委任することはできない。\nオ．会社法上の公開会社の取締役は、募集株式の発行をする場合において、当該募集株式の発行により当該公開会社の総株主の議決権の２分の１を超える議決権を有することとなる引受人がいるときであっても、事業の継続のため緊急の必要があるときは、株主に対し、当該引受人の氏名又は名称を通知することを要しない。\n１．アウ\n２．アエ\n３．イウ\n４．イオ\n５．エオ", "source": "https://www.moj.go.jp/content/001443617.pdf", "answerSource": "https://www.moj.go.jp/content/001444174.pdf"}, {"id": "R7-shoho-19", "year": "R7", "yearLabel": "令和7年", "subject": "商法", "qno": 19, "haiten": 2, "type": "choice", "options": 5, "answer": [2], "figure": false, "statement": "〔第19問〕（配点：２）\n株式会社（特例有限会社を除く。）の定款の定めに関する次のアからオまでの各記述のうち、正しいものを組み合わせたものは、後記１から５までのうちどれか。\nア．株式会社は、取締役会の決議について、議決に加わることができる取締役の３分の２以上が出席し、その過半数をもって行う旨を定款で定めることができる。\nイ．株式会社は、株主総会の招集を請求することができる株主を総株主の議決権の３分の１以上の議決権を有する株主とする旨を定款で定めることができる。\nウ．株式会社は、株主名簿管理人を置く場合には、株主名簿管理人を置く旨及びその氏名又は名称を定款で定めなければならない。\nエ．種類株式発行会社は、一部の種類の株式についてのみ株券を発行する旨を定款で定めることができる。\nオ．株式会社は、配当財産が金銭である剰余金の配当に関する株主総会の決議の定足数を排除する旨を定款で定めることができる。\n１．アイ\n２．アオ\n３．イウ\n４．ウエ\n５．エオ", "source": "https://www.moj.go.jp/content/001443617.pdf", "answerSource": "https://www.moj.go.jp/content/001444174.pdf"}, {"id": "R7-shoho-20", "year": "R7", "yearLabel": "令和7年", "subject": "商法", "qno": 20, "haiten": 2, "type": "choice", "options": 5, "answer": [5], "figure": false, "statement": "〔第20問〕（配点：２）\n株式会社（特例有限会社を除く。）の株主総会に関する次のアからオまでの各記述のうち、誤っているものを組み合わせたものは、後記１から５までのうちどれか。\nア．会社法上の公開会社は、株主総会の招集の通知を発すべき時を当該株主総会の日の１０日前までとする旨を定款で定めることができない。\nイ．株主総会は、当該株主総会に出席しない株主が書面によって議決権を行使することができることとされた場合には、株主の全員の同意があるときであっても、招集の手続を経ることなく開催することはできない。\nウ．株主が株主総会の日より相当の期間前に当該株主総会において説明を求める特定の事項を株式会社に対して通知した場合には、当該株主総会において当該事項について説明を求められた取締役は、説明をするために調査をすることが必要であることを理由に説明を拒むことができない。\nエ．株主総会参考書類等の内容である情報について電子提供措置をとる旨の定款の定めがある株式会社の株主は、当該株式会社に対し、電子提供措置事項を記載した書面の交付を請求することができない。\nオ．会社法上の公開会社の株主総会は、会社法に規定する事項及び株式会社の組織、運営、管理その他株式会社に関する一切の事項について決議をすることができる。\n１．アウ\n２．アエ\n３．イウ\n４．イオ\n５．エオ", "source": "https://www.moj.go.jp/content/001443617.pdf", "answerSource": "https://www.moj.go.jp/content/001444174.pdf"}, {"id": "R7-shoho-21", "year": "R7", "yearLabel": "令和7年", "subject": "商法", "qno": 21, "haiten": 2, "type": "choice", "options": 5, "answer": [4], "figure": false, "statement": "〔第21問〕（配点：２）\n株式会社（特例有限会社を除く。）の機関に関する次のアからオまでの各記述のうち、正しいものを組み合わせたものは、後記１から５までのうちどれか。\nア．会社法上の公開会社である大会社であって、その発行する株式について有価証券報告書の提出を義務付けられているものは、会社法上、社外取締役を２人以上置かなければならない。\nイ．監査役会設置会社は、取締役会を置かなければならない。\nウ．大会社は、取締役会及び監査役会を置かなければならない。\nエ．指名委員会等設置会社の監査委員は、当該指名委員会等設置会社の執行役を兼ねることができない。\nオ．監査等委員会設置会社は、取締役の過半数が社外取締役でない場合には、取締役会の決議によって重要な業務執行の決定の一部を取締役に委任することができる旨を定款で定めることができない。\n１．アウ\n２．アオ\n３．イウ\n４．イエ\n５．エオ", "source": "https://www.moj.go.jp/content/001443617.pdf", "answerSource": "https://www.moj.go.jp/content/001444174.pdf"}, {"id": "R7-shoho-22", "year": "R7", "yearLabel": "令和7年", "subject": "商法", "qno": 22, "haiten": 2, "type": "choice", "options": 5, "answer": [2], "figure": false, "statement": "〔第22問〕（配点：２）\n株式会社の取締役の選任等に関する次のアからオまでの各記述のうち、誤っているものを組み合わせたものは、後記１から５までのうちどれか。\nア．会社法上の公開会社でない株式会社は、取締役が株主でなければならない旨を定款で定めることができない。\nイ．取締役を選任する株主総会の決議をする場合には、取締役が欠けた場合に備えて補欠の取締役を選任することができる。\nウ．監査等委員会設置会社においては、株主総会の決議による取締役の選任は、監査等委員である取締役とそれ以外の取締役とを区別してしなければならない。\nエ．指名委員会等設置会社の監査委員は、取締役の中から、取締役会の決議によって選定する。\nオ．累積投票によらないで取締役を選任する旨の定款の定めがある監査役設置会社においては、取締役の解任は、株主総会の特別決議によらなければならない。\n１．アイ\n２．アオ\n３．イウ\n４．ウエ\n５．エオ", "source": "https://www.moj.go.jp/content/001443617.pdf", "answerSource": "https://www.moj.go.jp/content/001444174.pdf"}, {"id": "R7-shoho-23", "year": "R7", "yearLabel": "令和7年", "subject": "商法", "qno": 23, "haiten": 2, "type": "choice", "options": 5, "answer": [3], "figure": false, "statement": "〔第23問〕（配点：２）\n株式会社の計算等に関する次のアからオまでの各記述のうち、正しいものを組み合わせたものは、後記１から５までのうちどれか。\nア．募集株式の発行に際して株主となる者が株式会社に対して金銭の払込みをした場合は、当該株式会社は、払い込まれた金額の全部を資本金として計上しなければならない。\nイ．株式会社における資本金の額の減少について承認をしなかった債権者は、資本金の額の減少の無効の訴えを提起することができる。\nウ．株式会社の純資産額が３００万円を下回る場合には、当該株式会社は、剰余金の配当をすることができない。\nエ．株式会社が分配可能額を超えて剰余金の配当をした場合において、当該剰余金の配当を受けた株主が分配可能額を超えることにつき善意でかつ重大な過失がないときは、当該株主は、当該株式会社に対し、交付を受けた配当財産の帳簿価額に相当する金銭を支払う義務を負わない。\nオ．子会社は、その有する親会社の株式について、剰余金の配当を受けることができない。\n１．アイ\n２．アオ\n３．イウ\n４．ウエ\n５．エオ", "source": "https://www.moj.go.jp/content/001443617.pdf", "answerSource": "https://www.moj.go.jp/content/001444174.pdf"}, {"id": "R7-shoho-24", "year": "R7", "yearLabel": "令和7年", "subject": "商法", "qno": 24, "haiten": 2, "type": "choice", "options": 5, "answer": [5], "figure": false, "statement": "〔第24問〕（配点：２）\n持分会社に関する次のアからオまでの各記述のうち、正しいものを組み合わせたものは、後記１から５までのうちどれか。\nア．既に持分会社に出資の履行をした有限責任社員は、当該持分会社の財産に対する強制執行がその効を奏しなかった場合には、連帯して、当該持分会社の債務を弁済する責任を負う。\nイ．無限責任社員が有限責任社員となった場合には、当該有限責任社員となった者は、その旨の登記をする前に生じた持分会社の債務について、無限責任社員として当該債務を弁済する責任を負わない。\nウ．持分会社の無限責任社員は、他の社員の全員の承諾があるときは、その持分の全部又は一部を当該持分会社に譲渡することができる。\nエ．業務を執行しない有限責任社員は、定款に別段の定めがある場合を除き、業務を執行する社員の全員の承諾があるときは、その持分の全部又は一部を他人に譲渡することができる。\nオ．合同会社の社員は、信用をその出資の目的とすることができない。\n１．アイ\n２．アウ\n３．イエ\n４．ウオ\n５．エオ", "source": "https://www.moj.go.jp/content/001443617.pdf", "answerSource": "https://www.moj.go.jp/content/001444174.pdf"}, {"id": "R7-shoho-25", "year": "R7", "yearLabel": "令和7年", "subject": "商法", "qno": 25, "haiten": 2, "type": "choice", "options": 5, "answer": [2], "figure": false, "statement": "〔第25問〕（配点：２）\n組織再編等に関する次のアからオまでの各記述のうち、正しいものを組み合わせたものは、後記 １から５までのうちどれか。\nア．株式会社が他の株式会社にその事業の全部の譲渡をする場合において、譲受会社が譲渡会社の特別支配会社であるときは、当該譲渡会社の株主総会の特別決議によって当該譲渡に係る契約の承認を受けることを要しない。\nイ．株式会社は、合名会社、合資会社又は合同会社に組織変更することができない。\nウ．新設分割設立会社が新設分割計画の定めに従い新設分割会社の債務を免責的に承継するには、当該債務に係る債権者の承諾を要する。\nエ．吸収分割において、吸収分割株式会社が株主総会の決議によって吸収分割契約の承認を受けなければならないときは、当該株主総会において議決権を行使することができない株主は、当該吸収分割株式会社に対し、自己の有する株式を公正な価格で買い取ることを請求することができる。\nオ．株式移転は、株式移転計画において定められた効力発生日に、その効力を生ずる。\n１．アウ\n２．アエ\n３．イウ\n４．イオ\n５．エオ", "source": "https://www.moj.go.jp/content/001443617.pdf", "answerSource": "https://www.moj.go.jp/content/001444174.pdf"}, {"id": "R7-shoho-26", "year": "R7", "yearLabel": "令和7年", "subject": "商法", "qno": 26, "haiten": 2, "type": "choice", "options": 5, "answer": [3], "figure": false, "statement": "〔第26問〕（配点：２）\n株式会社についての訴訟に関する次のアからオまでの各記述のうち、誤っているものを組み合わせたものは、後記１から５までのうちどれか。\nア．株主総会決議不存在確認の訴えに係る請求を認容する確定判決は、第三者に対してもその効力を有する。\nイ．株式会社の取締役が退任した後に当該株式会社の株主となった者は、当該取締役の責任を追及する株主代表訴訟を提起することができない。\nウ．会社法上の公開会社でない株式会社は、株主から取締役の責任を追及する訴えの提起の請求を受けた場合において、当該請求の日から６０日以内に当該訴えを提起しないときであって、当該請求をした株主から請求を受けたときは、当該株主に対し、遅滞なく、当該訴えを提起しない理由を通知しなければならない。\nエ．株主代表訴訟を提起した株主は、当該訴訟の係属中に株式交換により株主でなくなった場合には、当該株式交換により株式交換完全親会社の株式を取得したときであっても、当該訴訟を追行することができない。\nオ．監査役設置会社は、当該監査役設置会社の取締役を補助するため、当該監査役設置会社の株主が提起した当該取締役の責任を追及する株主代表訴訟に参加するには、監査役（監査役が２人以上ある場合にあっては、各監査役）の同意を得なければならない。\n１．アイ\n２．アウ\n３．イエ\n４．ウオ\n５．エオ", "source": "https://www.moj.go.jp/content/001443617.pdf", "answerSource": "https://www.moj.go.jp/content/001444174.pdf"}, {"id": "R7-shoho-27", "year": "R7", "yearLabel": "令和7年", "subject": "商法", "qno": 27, "haiten": 2, "type": "choice", "options": 5, "answer": [1], "figure": false, "statement": "〔第27問〕（配点：２）\n個人商人（小商人に当たる者を除く。）の商業使用人に関する次のアからオまでの各記述のうち、正しいものを組み合わせたものは、後記１から５までのうちどれか。\nア．商人が支配人を選任したときは、その登記をしなければならない。\nイ．支配人は、商人の許可を得なければ、株式会社の取締役となることができない。\nウ．支店長、副支店長その他商人を代理する権限を有するものと認められる名称を付した使用人は、相手方が悪意である場合を除き、当該商人の営業に関し、一切の裁判外の行為をする権限を有するものとみなされる。\nエ．商人の営業に関するある種類又は特定の事項の委任を受けた使用人は、当該事項に関する一切の裁判上又は裁判外の行為をする権限を有する。\nオ．支配人の代理権は、商人の死亡によって、消滅する。\n１．アイ\n２．アエ\n３．イオ\n４．ウエ\n５．ウオ", "source": "https://www.moj.go.jp/content/001443617.pdf", "answerSource": "https://www.moj.go.jp/content/001444174.pdf"}, {"id": "R7-shoho-28", "year": "R7", "yearLabel": "令和7年", "subject": "商法", "qno": 28, "haiten": 2, "type": "choice", "options": 5, "answer": [1], "figure": false, "statement": "〔第28問〕（配点：２）\n代理商、仲立人及び問屋に関する次のアからオまでの各記述のうち、誤っているものを組み合わせたものは、後記１から５までのうちどれか。\nア．物品の販売又はその媒介の委託を受けた代理商は、売買に関する通知を受ける権限を有しない。\nイ．代理商は、やむを得ない事由があるときは、いつでも、当該代理商が商人のためにその平常の営業の部類に属する取引の代理又は媒介をする契約を解除することができる。\nウ．仲立人の報酬は、当事者双方が等しい割合で負担する。\nエ．仲立人は、その媒介に係る商行為について見本を受け取ったときであっても、当該見本を保管する義務を負わない。\nオ．問屋は、委託者のために物品の販売又は買入れをしたときは、遅滞なく、委託者に対し、その旨の通知を発しなければならない。\n１．アエ\n２．アオ\n３．イウ\n４．イオ\n５．ウエ", "source": "https://www.moj.go.jp/content/001443617.pdf", "answerSource": "https://www.moj.go.jp/content/001444174.pdf"}, {"id": "R7-shoho-29", "year": "R7", "yearLabel": "令和7年", "subject": "商法", "qno": 29, "haiten": 2, "type": "choice", "options": 5, "answer": [5], "figure": false, "statement": "〔第29問〕（配点：２）\n商行為に関する次のアからオまでの各記述のうち、誤っているものを組み合わせたものは、後記 １から５までのうちどれか。\nア．個人商人がその営業のために金銭を借り入れる行為は、商行為となる。\nイ．商人間において金銭の消費貸借をした場合において、利息の支払について別段の意思表示がないときは、貸主は、法定利息を請求することができる。\nウ．商人間の売買において、買主がその目的物の受領を拒んだときは、売主は、相当の期間を定めて催告をすることなく、直ちにその物を競売に付することができる。\nエ．商人間の売買において、買主は、その売買の目的物を受領したときは、遅滞なく、その物を検査しなければならない。\nオ．交互計算は、商人間においてのみ、その効力を生ずる。\n１．アウ\n２．アエ\n３．イエ\n４．イオ\n５．ウオ", "source": "https://www.moj.go.jp/content/001443617.pdf", "answerSource": "https://www.moj.go.jp/content/001444174.pdf"}, {"id": "R7-shoho-30", "year": "R7", "yearLabel": "令和7年", "subject": "商法", "qno": 30, "haiten": 2, "type": "choice", "options": 5, "answer": [4], "figure": false, "statement": "〔第30問〕（配点：２）\n手形に関する次のアからオまでの各記述のうち、誤っているものを組み合わせたものは、後記１から５までのうちどれか。\nア．為替手形には、支払人の名称を記載しなければならない。\nイ．為替手形の支払人は、銀行でなければならない。\nウ．為替手形は、振出人の自己宛てで振り出すことができる。\nエ．約束手形の手形保証は、手形保証人が約束手形又は補箋に署名しなければ、することができない。\nオ．約束手形の振出人の手形債務を保証した手形保証人は、振出人が未成年者であることを理由に当該約束手形の振出しに係る意思表示が取り消された場合には、手形金を支払う義務を負わない。\n１．アウ\n２．アエ\n３．イウ\n４．イオ\n５．エオ ［民事訴訟法］", "source": "https://www.moj.go.jp/content/001443617.pdf", "answerSource": "https://www.moj.go.jp/content/001444174.pdf"}, {"id": "R7-minso-31", "year": "R7", "yearLabel": "令和7年", "subject": "民事訴訟法", "qno": 31, "haiten": 2, "type": "choice", "options": 5, "answer": [5], "figure": false, "statement": "〔第31問〕（配点：２）\n移送に関する次のアからオまでの各記述のうち、正しいものを組み合わせたものは、後記１から ５までのうちどれか。\nア．移送を受けた裁判所は、移送を受けた理由となった事由とは別の事由によっても、更に事件を他の裁判所に移送することはできない。\nイ．当事者が特定の裁判所を専属的な管轄裁判所とする合意をした場合には、当事者の一方が他方を被告として他の裁判所に訴えを提起し、被告が管轄違いの抗弁を提出しないで本案について弁論をしたとしても、その裁判所は、当該訴えに係る訴訟を当事者が合意した裁判所に移送しなければならない。\nウ．簡易裁判所は、訴訟がその管轄に属する場合には、訴訟の全部又は一部をその所在地を管轄する地方裁判所に移送することはできない。\nエ．原告が被告に対して不法行為に基づく損害賠償請求として１００万円の支払を求める訴えを簡易裁判所に提起した後に、請求を２００万円に拡張した場合には、その簡易裁判所は、当該訴えに係る訴訟を地方裁判所に移送しなければならない。\nオ．控訴裁判所は、事件が管轄違いであることを理由として第一審判決を取り消すときは、判決で、事件を管轄裁判所に移送しなければならない。\n１．アイ\n２．アエ\n３．イウ\n４．ウオ\n５．エオ", "source": "https://www.moj.go.jp/content/001443617.pdf", "answerSource": "https://www.moj.go.jp/content/001444174.pdf"}, {"id": "R7-minso-32", "year": "R7", "yearLabel": "令和7年", "subject": "民事訴訟法", "qno": 32, "haiten": 2, "type": "choice", "options": 5, "answer": [4], "figure": false, "statement": "〔第32問〕（配点：２）\n当事者適格に関する次のアからオまでの各記述のうち、判例の趣旨に照らし誤っているものを組み合わせたものは、後記１から５までのうちどれか。\nア．給付を請求する権利を有すると主張して給付の訴えを提起する者は、真に当該権利を有しているか否かにかかわらず、当該訴えの原告適格を有する。\nイ．遺産確認の訴えを提起した共同相続人は、提訴後に自己の相続分の全部を譲渡した場合であっても、当該訴えの当事者適格を失わない。\nウ．争いのある筆界を挟んで相隣接する土地の各所有者は、筆界確定の訴えの当事者適格を有する。\nエ．民法上の組合において、組合規約に基づいて、自己の名で組合財産を管理し、対外的業務を執行する権限とともに組合財産に関する訴訟を追行する権限を与えられた業務執行組合員は、特段の事情のない限り、組合財産に関する訴訟の当事者適格を有する。\nオ．遺言で遺言執行者が定められている場合に、特定の不動産の受遺者が原告となって、遺言の執行としての当該不動産の所有権移転登記手続を求める訴えを提起するときは、相続人が当該訴えの被告適格を有する。\n１．アウ\n２．アエ\n３．イエ\n４．イオ\n５．ウオ", "source": "https://www.moj.go.jp/content/001443617.pdf", "answerSource": "https://www.moj.go.jp/content/001444174.pdf"}, {"id": "R7-minso-33", "year": "R7", "yearLabel": "令和7年", "subject": "民事訴訟法", "qno": 33, "haiten": 2, "type": "choice", "options": 5, "answer": [2], "figure": false, "statement": "〔第33問〕（配点：２）\n送達に関する次の１から５までの各記述のうち、判例の趣旨に照らし正しいものはどれか。（解答欄は、 ）\n１．期日の呼出しは、呼出状の送達によらなければならず、その事件について出頭した者に対する期日の告知によってすることはできない。\n２．被告が本案について準備書面を提出した後に、原告が訴えの取下げを書面でした場合には、裁判所は、その訴えの取下げの書面を被告に送達しなければならない。\n３．事件の当事者が書類の送達を受けるべき場所を受訴裁判所に届け出た場合において、裁判所書記官がその事件について出頭した当該当事者に対して自らした送達は無効である。\n４．送達を受けるべき者の住所が知れている場合には、その住所において送達をするのに支障があるときであっても、その者の就業場所においてした送達は無効である。\n５．裁判所書記官が被告の就業場所が不明であると判断して書留郵便に付する送達により訴状を送達した場合において、被告の就業場所の存在が事後に判明したときは、当該書留郵便に付する送達は無効である。", "source": "https://www.moj.go.jp/content/001443617.pdf", "answerSource": "https://www.moj.go.jp/content/001444174.pdf"}, {"id": "R7-minso-34", "year": "R7", "yearLabel": "令和7年", "subject": "民事訴訟法", "qno": 34, "haiten": 2, "type": "choice", "options": 5, "answer": [3], "figure": false, "statement": "〔第34問〕（配点：２）\n訴えに関する次のアからオまでの各記述のうち、誤っているものを組み合わせたものは、後記１から５までのうちどれか。\nア．原告が訴状の送達に必要な費用を予納しない場合には、裁判長は、相当の期間を定め、その期間内に当該費用を予納することを命じなければならない。\nイ．訴状に、請求の趣旨として原告が求める判決の主文の記載があり、請求の原因として請求を特定するのに必要な事実の記載がある場合においても、請求を理由付ける事実の記載が不足しているときは、裁判長は、当該訴状の補正を命じなければならない。\nウ．訴状が被告に送達された後であっても、裁判長は、当該訴状を却下することができる。\nエ．訴状却下命令に対しては、即時抗告をすることができる。\nオ．訴えが不適法でその不備を補正することができないときは、裁判所は、口頭弁論を経ないで、判決で、その訴えを却下することができる。\n１．アイ\n２．アエ\n３．イウ\n４．ウオ\n５．エオ", "source": "https://www.moj.go.jp/content/001443617.pdf", "answerSource": "https://www.moj.go.jp/content/001444174.pdf"}, {"id": "R7-minso-35", "year": "R7", "yearLabel": "令和7年", "subject": "民事訴訟法", "qno": 35, "haiten": 2, "type": "choice", "options": 5, "answer": [4], "figure": false, "statement": "〔第35問〕（配点：２）\n訴えの利益に関する次のアからオまでの各記述のうち、判例の趣旨に照らし誤っているものを組み合わせたものは、後記１から５までのうちどれか。\nア．Ｘは、Ｙを被告として、売買契約に基づき売買代金１０００万円の支払を請求する訴えを提起し、Ｙに同額の支払を命じる判決が確定した。その後、無資力のＹが売買代金を支払わない状態が続き、裁判上の請求以外に消滅時効の完成猶予の方法がなかった。Ｘが、Ｙを被告として、消滅時効が完成する前に、再度、同売買代金の支払を請求する訴えを提起した場合において、当該訴えには、訴えの利益が認められる。\nイ．被相続人Ａが死亡し、その相続人は妻Ｘ、子Ｙ１及び子Ｙ２のみであった。Ｘ、Ｙ１及びＹ ２の間において、Ａ名義の複数の不動産のうち甲土地がＡの遺産に属するか否かの争いがあった。Ｘが、Ｙ１及びＹ２を被告として、甲土地がＡの遺産に属することの確認を求める訴えを提起した場合において、当該訴えには、確認の利益が認められない。\nウ．被相続人Ａが死亡し、その相続人は子Ｘ及び子Ｙのみであった。Ｘ及びＹの間において、相続人の範囲や遺産の範囲については争いがなかったものの、Ｙは、成人してからも全く収入がなく、Ａが死亡するまでの約３０年間にわたって、毎月、Ａから高額の生活費の支払を受けており、これが特別受益財産に当たるか否かの争いがあった。Ｘが、Ｙを被告として、ＡからＹ に支払われた上記生活費が特別受益財産であることの確認を求める訴えを提起した場合において、当該訴えには、確認の利益が認められない。\nエ．甲建物について、ＸからＹに所有権移転登記がされ、更にＹからＺに所有権移転登記がされた。Ｘは、ＸからＹへの所有権移転登記はＸに無断でされたものであり、Ｘが甲建物を所有していると主張して、Ｚを被告とし、ＹからＺへの所有権移転登記の抹消登記手続を求める訴えを提起したものの、Ｘの請求を棄却する判決が確定した。さらに、Ｘが、Ｙを被告として、Ｘ からＹへの所有権移転登記の抹消登記手続を求める訴えを提起した場合において、当該訴えには訴えの利益が認められる。\nオ．甲土地上にはＹが所有する乙建物があるが、Ｘ及びＹの間においては甲土地の所有権をいずれが有しているのかにつき争いがある。Ｘが、Ｙを被告として、甲土地の所有権に基づき、乙建物を収去し甲土地を明け渡すことを求める訴えを提起することができる場合には、ＸがＹを被告として甲土地についてＸの所有権の確認を求める訴えには、確認の利益が認められない。\n１．アウ\n２．アエ\n３．イエ\n４．イオ\n５．ウオ", "source": "https://www.moj.go.jp/content/001443617.pdf", "answerSource": "https://www.moj.go.jp/content/001444174.pdf"}, {"id": "R7-minso-36", "year": "R7", "yearLabel": "令和7年", "subject": "民事訴訟法", "qno": 36, "haiten": 2, "type": "choice", "options": 5, "answer": [3], "figure": false, "statement": "〔第36問〕（配点：２）\n将来給付の訴えに関する次のアからオまでの各記述のうち、判例の趣旨に照らし誤っているものを組み合わせたものは、後記１から５までのうちどれか。\nア．将来給付の訴えにおける請求権としての適格を有しない請求権に基づく将来給付の訴えは、あらかじめその請求をする必要がある場合であっても、不適法なものとして許されない。\nイ．継続的不法行為に基づき、将来発生すべき損害の賠償を請求する将来給付の訴えは、不適法なものとして許されない。\nウ．物の現実の引渡しの請求に併せて、その執行不能の場合における履行に代わる損害賠償を請求する将来給付の訴えは、不適法なものとして許されない。\nエ．Ｘ及びＹが共有する土地につき、Ｙのみが駐車場として賃貸して収益を得ている場合に、Ｘ がＹに対し、事実審の口頭弁論終結後にＹが得る収益のうち、Ｙの持分割合を超える部分について不当利得の返還を請求する将来給付の訴えは、不適法なものとして許されない。\nオ．本来の給付請求に併せて、その執行不能の場合における履行に代わる損害賠償を請求する将来給付の訴えは、本来の給付請求の強制執行が不能となることがあり得ない場合には、不適法なものとして許されない。\n１．アイ\n２．アオ\n３．イウ\n４．ウエ\n５．エオ", "source": "https://www.moj.go.jp/content/001443617.pdf", "answerSource": "https://www.moj.go.jp/content/001444174.pdf"}, {"id": "R7-minso-37", "year": "R7", "yearLabel": "令和7年", "subject": "民事訴訟法", "qno": 37, "haiten": 2, "type": "choice", "options": 5, "answer": [4], "figure": false, "statement": "〔第37問〕（配点：２）\n反訴に関する次のアからオまでの各記述のうち、判例の趣旨に照らし正しいものを組み合わせたものは、後記１から５までのうちどれか。\nア．被告の反訴が本訴の目的である請求又は防御の方法と関連する請求をするものでない場合には、原告が反訴に対して異議を述べずに応訴したとしても、反訴は適法とならない。\nイ．被告が反訴を提起した後に、原告による本訴の取下げがあり、被告がそれに同意した場合には、被告による反訴の取下げがあったものとみなされる。\nウ．第一審において、原告が被告に対して土地の明渡しを請求し、被告がその土地について賃借権を有する旨主張し、その賃借権の存在を認めて原告の請求を棄却する判決がされた場合に、控訴審において、被控訴人となった被告が反訴としてその賃借権存在確認の訴えを提起するには、控訴人となった原告の同意を要しない。\nエ．簡易裁判所において、被告が地方裁判所の管轄に属する請求を目的とする反訴を提起した場合に、原告の申立てがあるときは、簡易裁判所は、本訴及び反訴を地方裁判所に移送しなければならない。\nオ．反訴請求が本訴請求と併合するための要件を欠く場合において、反訴が独立の訴えとしての要件を備えているときには、直ちに反訴を却下してはならず、弁論を分離して反訴につき審理しなければならない。\n１．アイ\n２．アオ\n３．イエ\n４．ウエ\n５．ウオ", "source": "https://www.moj.go.jp/content/001443617.pdf", "answerSource": "https://www.moj.go.jp/content/001444174.pdf"}, {"id": "R7-minso-38", "year": "R7", "yearLabel": "令和7年", "subject": "民事訴訟法", "qno": 38, "haiten": 2, "type": "choice", "options": 5, "answer": [3], "figure": false, "statement": "〔第38問〕（配点：２）\n釈明権の行使に関する次のアからオまでの各記述のうち、判例の趣旨に照らし誤っているものを組み合わせたものは、後記１から５までのうちどれか。\nア．陪席裁判官は、裁判長の許可がなくても、裁判長に告げれば釈明権を行使することができる。\nイ．裁判所が、判決において、原告と被告が共に主張しておらず、従前の訴訟の経過からは予測が困難な法律構成である信義則上の義務違反を認める判断をする場合に、当該信義則上の義務違反を基礎付ける事実が主張されていれば、原告に信義則上の義務違反の点について主張するか否かを明らかにするよう促す措置がとられていなくても、釈明権の行使を怠った違法があるとはいえない。\nウ．原告が主張する請求原因によっては原告の請求を認容することができないが、従前の訴訟の経過や訴訟資料からみて、別個の法律構成に基づく請求原因が主張されれば原告の請求を認容することができるにもかかわらず、原告が明らかに誤解又は不注意によりそのような主張をしていないと認められる場合に、裁判長が原告に対して釈明権の行使としてその別個の法律構成を示唆することは、釈明権行使の範囲を逸脱した違法なものではない。\nエ．当事者は、相手方に対し、直接釈明権を行使することができる。\nオ．釈明権の行使は、口頭弁論の期日又は期日外においてすることができる。\n１．アイ\n２．アウ\n３．イエ\n４．ウオ\n５．エオ", "source": "https://www.moj.go.jp/content/001443617.pdf", "answerSource": "https://www.moj.go.jp/content/001444174.pdf"}, {"id": "R7-minso-39", "year": "R7", "yearLabel": "令和7年", "subject": "民事訴訟法", "qno": 39, "haiten": 2, "type": "choice", "options": 5, "answer": [2], "figure": false, "statement": "〔第39問〕（配点：２）\n証人尋問に関する次のアからオまでの各記述のうち、判例の趣旨に照らし誤っているものを組み合わせたものは、後記１から５までのうちどれか。\nア．裁判所は、職権で、証人の尋問をすることができる。\nイ．電気通信事業法第４条第２項により守秘義務を課されている電気通信事業に従事する者は、民事訴訟法第１９７条第１項第２号の類推適用により、職務上知り得た事実で黙秘すべきものについて証言を拒むことができる。\nウ．民事訴訟法第１９７条第１項第２号の「黙秘すべきもの」とは、一般に知られていない事実のうち、弁護士等に事務を行うこと等を依頼した本人が当該事実を秘匿することについて、単に主観的利益だけでなく、客観的にみて保護に値するような利益を有するものをいう。\nエ．証言拒絶の理由は、証明しなければならない。\nオ．証人は、裁判長の許可を受けたときは、書類に基づいて陳述することができる。\n１．アウ\n２．アエ\n３．イエ\n４．イオ\n５．ウオ（参照条文）民事訴訟法（証言拒絶権）第１９７条次に掲げる場合には、証人は、証言を拒むことができる。一（略）二医師、歯科医師、薬剤師、医薬品販売業者、助産師、弁護士（外国法事務弁護士を含む。）、弁理士、弁護人、公証人、宗教、祈禱若しくは祭祀の職にある者又はこれらの職にあった者がとうし職務上知り得た事実で黙秘すべきものについて尋問を受ける場合三（略） ２（略）（参照条文）電気通信事業法（秘密の保護）第４条電気通信事業者の取扱中に係る通信の秘密は、侵してはならない。 ２電気通信事業に従事する者は、在職中電気通信事業者の取扱中に係る通信に関して知り得た他人の秘密を守らなければならない。その職を退いた後においても、同様とする。", "source": "https://www.moj.go.jp/content/001443617.pdf", "answerSource": "https://www.moj.go.jp/content/001444174.pdf"}, {"id": "R7-minso-40", "year": "R7", "yearLabel": "令和7年", "subject": "民事訴訟法", "qno": 40, "haiten": 2, "type": "choice", "options": 5, "answer": [2], "figure": false, "statement": "〔第40問〕（配点：２）\n文書に関する次のアからオまでの各記述のうち、判例の趣旨に照らし正しいものを組み合わせたものは、後記１から５までのうちどれか。\nア．弁論準備手続の期日においても、文書の証拠調べをすることができる。\nイ．書証の申出は、文書の所持者にその提出を命ずることを申し立ててすることはできない。\nウ．私文書中に顕出されている作成名義人の氏名が記された印影が、当該作成名義人の印章によるものであることが証明された場合には、当該私文書が当該作成名義人を作成者として真正に成立したことを争うことはできない。\nエ．当事者は、口頭弁論の期日において文書を提出して書証の申出をする場合に、あらかじめ裁判所に当該文書の写しを提出しているときでも、口頭弁論の期日において、裁判所に当該文書の原本、正本又は認証のある謄本を提出しなければならない。\nオ．裁判所は、当事者が書証の申出をした場合には、当該申出に係る文書の証拠調べをしなければならない。\n１．アウ\n２．アエ\n３．イエ\n４．イオ\n５．ウオ", "source": "https://www.moj.go.jp/content/001443617.pdf", "answerSource": "https://www.moj.go.jp/content/001444174.pdf"}, {"id": "R7-minso-41", "year": "R7", "yearLabel": "令和7年", "subject": "民事訴訟法", "qno": 41, "haiten": 2, "type": "multi", "options": 5, "answer": [4, 5], "figure": false, "statement": "〔第41問〕（配点：２）\n文書提出命令に関する次の１から５までの各記述のうち、判例の趣旨に照らし誤っているものを ２個選びなさい。\n１．文書提出命令の申立てをする場合において、文書の表示又は文書の趣旨を明らかにすることが著しく困難であるときは、その申立ての時においては、これらに代えて、文書の所持者がその申立てに係る文書を識別することができる事項を明らかにすれば足りる。\n２．警察官が文書提出命令の申立人の住居において行った捜索差押えに係る捜索差押許可状は、当該警察官が所属し当該文書を所持する地方公共団体と挙証者である文書提出命令の申立人との間の法律関係について作成された文書に該当する。\n３．裁判所は、第三者に対して文書の提出を命じようとする場合には、その第三者を審尋しなければならない。\n４．文書の提出を命じられた第三者が文書提出命令に従わない場合には、裁判所は、それにより当該文書の記載に関する文書提出命令の申立人の主張を真実と認めることができる。\n５．原告の申立てにより、第三者に対して文書の提出を命ずる決定がされた場合に、被告は、当該決定に対して、即時抗告をすることができる。", "source": "https://www.moj.go.jp/content/001443617.pdf", "answerSource": "https://www.moj.go.jp/content/001444174.pdf"}, {"id": "R7-minso-42", "year": "R7", "yearLabel": "令和7年", "subject": "民事訴訟法", "qno": 42, "haiten": 2, "type": "choice", "options": 5, "answer": [2], "figure": false, "statement": "〔第42問〕（配点：２）\n証拠保全に関する次のアからオまでの各記述のうち、正しいものを組み合わせたものは、後記１から５までのうちどれか。\nア．裁判所は、訴え提起前であっても、証拠調べをしておかなければその証拠を使用することが困難となる事情があると認めるときは、申立てにより、証拠調べをすることができる。\nイ．証拠保全の申立ては、相手方を指定しないですることはできない。\nウ．証拠保全の決定に対しては、即時抗告をすることができる。\nエ．急速を要する場合には、裁判所は、証拠保全の手続における証拠調べの期日に、申立人及び相手方を呼び出さずに、証拠調べをすることができる。\nオ．裁判所は、訴訟の係属中において、必要があると認める場合であっても、職権で証拠保全の決定をすることはできない。\n１．アイ\n２．アエ\n３．イウ\n４．ウオ\n５．エオ", "source": "https://www.moj.go.jp/content/001443617.pdf", "answerSource": "https://www.moj.go.jp/content/001444174.pdf"}, {"id": "R7-minso-43", "year": "R7", "yearLabel": "令和7年", "subject": "民事訴訟法", "qno": 43, "haiten": 2, "type": "choice", "options": 5, "answer": [1], "figure": false, "statement": "〔第43問〕（配点：２）\n民事訴訟における判決に関する次のアからオまでの各記述のうち、誤っているものを組み合わせたものは、後記１から５までのうちどれか。\nア．裁判所が判決に法令の違反があることを発見し、変更の判決をするときは、口頭弁論を経なければならない。\nイ．判決の更正決定は、当該判決が確定した後にもすることができる。\nウ．裁判所は、財産権上の請求に関する判決について、当事者の申立てがなければ、仮執行をすることができることを宣言することはできない。\nエ．被告が口頭弁論において原告の主張した事実を争わず、その他何らの防御の方法をも提出しない場合において、原告の請求を認容する判決の言渡しは、判決書の原本に基づかないですることができる。\nオ．判決の言渡しは、当事者全員が判決の言渡期日に欠席した場合にもすることができる。\n１．アウ\n２．アオ\n３．イウ\n４．イエ\n５．エオ", "source": "https://www.moj.go.jp/content/001443617.pdf", "answerSource": "https://www.moj.go.jp/content/001444174.pdf"}, {"id": "R7-minso-44", "year": "R7", "yearLabel": "令和7年", "subject": "民事訴訟法", "qno": 44, "haiten": 2, "type": "choice", "options": 5, "answer": [4], "figure": false, "statement": "〔第44問〕（配点：２）\n控訴に関する次のアからオまでの各記述のうち、判例の趣旨に照らし誤っているものを組み合わせたものは、後記１から５までのうちどれか。\nア．第一審判決の取消し又は変更を求める事由は、控訴状の必要的記載事項ではない。\nイ．附帯控訴は、控訴の取下げがあった場合には、控訴の要件を備えるものであっても、その効力を失う。\nウ．控訴の提起は、控訴状を第一審裁判所に提出してしなければならない。\nエ．訴えを却下した第一審判決に対して控訴があった場合において、控訴裁判所は、第一審判決を相当とするときは、控訴を棄却しなければならない。\nオ．筆界確定訴訟において、控訴裁判所は、不服申立ての限度においてのみ、第一審判決の取消し又は変更をすることができる。\n１．アウ\n２．アオ\n３．イエ\n４．イオ\n５．ウエ", "source": "https://www.moj.go.jp/content/001443617.pdf", "answerSource": "https://www.moj.go.jp/content/001444174.pdf"}, {"id": "R7-minso-45", "year": "R7", "yearLabel": "令和7年", "subject": "民事訴訟法", "qno": 45, "haiten": 2, "type": "choice", "options": 5, "answer": [2], "figure": false, "statement": "〔第45問〕（配点：２）\n上告又は上告受理の申立てに関する次のアからオまでの各記述のうち、判例の趣旨に照らし正しいものを組み合わせたものは、後記１から５までのうちどれか。\nア．第一審の終局判決の言渡し後に、当事者双方が共に上告をする権利を留保して控訴をしない旨の合意をし、直ちに上告がされた場合には、上告裁判所は、職権調査事項を除き、事実の確定が法律に違反したことを理由として、原判決を破棄することができない。\nイ．上告裁判所である最高裁判所は、判決に影響を及ぼすことが明らかな法令の違反があることを理由として、原判決を破棄することができない。\nウ．上告受理の申立てがされ、原判決に法令の解釈に関する重要な事項を含むものと認められる場合であっても、最高裁判所は、上告を棄却すべきものと認めるときは、上告受理の決定をすることはできない。\nエ．高等裁判所が上告審としてした終局判決に対して、憲法の違反があることを理由として最高裁判所に特別上告がされた場合には、判決の確定が遮断される。\nオ．上告裁判所は、判決の基本となる口頭弁論に関与していない裁判官が判決をした裁判官として署名押印していることを理由として原判決を破棄し、事件を原審に差し戻す判決をする場合には、口頭弁論を経ないですることができる。\n１．アイ\n２．アオ\n３．イウ\n４．ウエ\n５．エオ", "source": "https://www.moj.go.jp/content/001443617.pdf", "answerSource": "https://www.moj.go.jp/content/001444174.pdf"}, {"id": "R7-keiho-1", "year": "R7", "yearLabel": "令和7年", "subject": "刑法", "qno": 1, "haiten": 2, "type": "choice", "options": 5, "answer": [1], "figure": false, "statement": "〔第１問〕（配点：２）\n学生Ａ、Ｂ及びＣは、【事例】について、【会話】のとおり議論している。\n【会話】中の①から ⑪までの（ ）内に【語句群】から適切なものを入れた場合、正しいものの組合せは１から５までのうちどれか。なお、①から⑪までの（ ）内には、それぞれ異なるものが入る。\n【事例】 甲及び乙は、Ｘに対して傷害を負わせる旨の共謀を遂げ、それぞれ鉄パイプでＸを殴った。甲は、Ｘが反抗的な態度を示したため激高し、Ｘに対する殺意を抱き、傷害の故意にとどまる乙と共にＸに暴行を加えたことにより、Ｘは死亡した。\n【会話】 学生Ａ．共同正犯の本質について（①）に立った場合、共同正犯の成立は（②）ので、【事例】 では（③）ということになりますね。学生Ｂ．その考え方は（④）という問題があるのではないでしょうか。さらに、乙には（⑤）の故意がないのに、（⑤）罪の共同正犯の成立を認めることにも疑問があります。学生Ｃ．共同正犯の本質について（⑥）に立った場合、共同正犯の成立は（⑦）ので、【事例】 では（⑧）ということになりますね。学生Ａ．その考え方を一貫させると（⑨）という問題があるのではないでしょうか。学生Ｂ．共同正犯の本質について（①）に立ちつつ、構成要件が同質的で重なり合う限りにおいて共同正犯の成立を認める見解に立った場合、【事例】では（⑩）ということになりますね。学生Ｃ．その考え方によると、【事例】において、乙の行為から死亡結果が発生した場合、甲に（⑪）罪の単独犯が成立するにとどまってしまうという問題があるのではないでしょうか。\n【語句群】\n  ａ．犯罪共同説\n  ｂ．行為共同説\n  ｃ．同一罪名に限られる\n  ｄ．異なる罪名でも認められる\n  ｅ．甲に殺人罪の共同正犯、乙に傷害致死罪の共同正犯が成立する\n  ｆ．甲及び乙に傷害致死罪の共同正犯が成立し、甲に殺人罪の単独犯が成立する\n  ｇ．甲及び乙に殺人罪の共同正犯が成立し、乙は傷害致死罪の限度で科刑される\n  ｈ．共同正犯の成立範囲が広がりすぎる\n  ｉ．罪名と科刑が分離する\n  ｊ．殺人\n  ｋ．殺人未遂\n  ｌ．傷害致死\n１．①ａ ④ｉ ⑧ｅ ⑩ｆ ⑪ｋ\n２．①ｂ ③ｅ ⑥ａ ⑧ｇ ⑨ｉ\n３．②ｃ ⑤ｊ ⑥ｂ ⑨ｈ ⑪ｌ\n４．②ｄ ④ｈ ⑦ｃ ⑧ｆ ⑩ｅ\n５．③ｇ ⑤ｋ ⑦ｄ ⑩ｆ ⑪ｌ", "source": "https://www.moj.go.jp/content/001443618.pdf", "answerSource": "https://www.moj.go.jp/content/001444175.pdf"}, {"id": "R7-keiho-2", "year": "R7", "yearLabel": "令和7年", "subject": "刑法", "qno": 2, "haiten": 2, "type": "choice", "options": 5, "answer": [5], "figure": false, "statement": "〔第２問〕（配点：２）\n学生Ａ及びＢは、【事例】について、【会話】のとおり議論している。\n【会話】中の①から⑪までの（ ）内に【語句群】から適切なものを入れた場合、正しいものの組合せは１から５までのう ［No.ちどれか。なお、①から⑪までの（ ）内には、それぞれ異なるものが入る。\n【事例】 甲は、乙所有の飼い犬（以下「乙犬」という。）が甲所有の飼い犬（以下「甲犬」という。）に突然襲い掛かったため、甲犬を守る目的で、持っていた甲所有の傘で乙犬を殴り、乙犬に怪我を負わせた。\n【会話】 学生Ａ．乙犬が甲犬に襲い掛かったことについて、乙に故意・過失が（①）場合、甲が乙犬に怪我を負わせた行為に（②）の成立を認めるかが問題になりますね。学生Ｂ．私は、「（③）」は人間の行為に（④）と考えるので、（②）の成立を（⑤）。そのため、（⑥）の成否が問題になります。学生Ａ．（⑦）と（⑧）を必要とする（⑥）の限度でしか対抗できないというのでは、（⑨）の保護が不十分ではないですか。学生Ｂ．乙に故意・過失が（⑩）場合、（②）が成立し得るので、不都合はありません。学生Ａ．（⑥）の法的性格について、どう考えますか。学生Ｂ．（⑥）は、（⑦）を要件としているので、違法性阻却事由であると考えます。学生Ａ．そうすると、（⑥）に当たる行為に対して（②）は（⑪）ことになりますね。\n【語句群】\n  ａ．ある\n  ｂ．ない\n  ｃ．正当防衛\n  ｄ．緊急避難\n  ｅ．不正の侵害\n  ｆ．現在の危難\n  ｇ．限られる\n  ｈ．限られない\n  ｉ．認めます\n  ｊ．認めません\n  ｋ．補充性\n  ｌ．法益均衡\n  ｍ．甲\n  ｎ．乙\n  ｏ．成立し得る\n  ｐ．成立し得ない\n１．①ａ ③ｆ ⑤ｉ ⑨ｎ ⑩ｂ\n２．①ｂ ④ｇ ⑦ｋ ⑧ｌ ⑩ａ\n３．②ｃ ⑤ｊ ⑦ｌ ⑨ｍ ⑪ｏ\n４．②ｄ ④ｈ ⑥ｃ ⑩ｂ ⑪ｏ\n５．③ｅ ⑥ｄ ⑧ｋ ⑩ａ ⑪ｐ", "source": "https://www.moj.go.jp/content/001443618.pdf", "answerSource": "https://www.moj.go.jp/content/001444175.pdf"}, {"id": "R7-keiho-3", "year": "R7", "yearLabel": "令和7年", "subject": "刑法", "qno": 3, "haiten": 2, "type": "choice", "options": 5, "answer": [1], "figure": false, "statement": "〔第３問〕（配点：２）\n学生Ａ、Ｂ及びＣは、【事例】について、【会話】のとおり議論している。\n【会話】中の①から ⑪までの（ ）内に【語句群】から適切なものを入れた場合、正しいものの組合せは１から５までのうちどれか。なお、①から⑪までの（ ）内には、それぞれ異なるものが入る。\n【事例】 甲は、威力を用いて県議会委員会の条例案採決の事務を妨害した。\n【会話】 学生Ａ．甲に（①）が成立するかについては、（②）が（①）の客体である（③）に含まれるかが問題となりますね。学生Ｂ．私は、（③）に（④）との立場から、甲に（①）が（⑤）と考えます。学生Ｃ．（⑥）についてまで（①）の保護対象に含める必要はあるのですか。学生Ａ．私は、（③）に（⑦）との立場から、甲に（①）が（⑧）と考えます。学生Ｃ．Ａさんの立場では、威力を用いて私立高校の入学試験を妨害した場合には（①）が（⑤）のに、公立高校で同じことをしても（①）も（⑨）も（⑧）ことになりかねず、不均衡ではありませんか。私は、（⑥）は（③）に含まれず、それ以外の（②）は（③）に含まれると考えます。\n【事例】における事務は、（⑥）に当たらず、（③）に含まれるので、甲に（①）が（⑤）と考えます。学生Ｂ．Ｃさんの立場では、（⑩）場合、どのように考えるのですか。学生Ｃ．その行為さえなければ遂行されたはずの本来の警察官の（②）が妨害された場合、その妨害された（②）の中に（⑥）が含まれていたとしても、強制力を行使し得る段階に（⑪）ので、その全体について（①）が成立すると考えます。\n【語句群】\n  ａ．業務妨害罪\n  ｂ．公務執行妨害罪\n  ｃ．業務\n  ｄ．公務\n  ｅ．全ての公務が含まれる\n  ｆ．全ての公務が含まれない\n  ｇ．成立する\n  ｈ．成立しない\n  ｉ．強制力を行使する権力的公務\n  ｊ．非権力的公務\n  ｋ．職務質問中の警察官に対して威力を用いて抵抗した\n  ｌ．警察官に対して犯罪予告の虚偽通報がなされた\n  ｍ．ある\n  ｎ．ない\n１．①ａ ③ｃ ⑥ｉ ⑧ｈ ⑩ｌ\n２．①ｂ ④ｅ ⑥ｊ ⑨ａ ⑩ｋ\n３．②ｃ ④ｆ ⑦ｅ ⑨ａ ⑪ｍ\n４．②ｄ ⑤ｇ ⑦ｆ ⑨ｂ ⑪ｍ\n５．③ｄ ⑤ｈ ⑧ｇ ⑩ｋ ⑪ｎ", "source": "https://www.moj.go.jp/content/001443618.pdf", "answerSource": "https://www.moj.go.jp/content/001444175.pdf"}, {"id": "R7-keiho-4", "year": "R7", "yearLabel": "令和7年", "subject": "刑法", "qno": 4, "haiten": 3, "type": "multi", "options": 5, "answer": [2, 5], "figure": false, "statement": "〔第４問〕（配点：３）\n正当防衛に関する１から５までの各記述を判例の立場に従って検討した場合、誤っているものを ２個選びなさい。\n１．正当防衛は、不正の侵害に対して成立するから、正当防衛が成立する行為に対して反撃した場合、正当防衛が成立することはない。\n２．不正の行為により自ら侵害を招き、これに対して反撃した場合、正当防衛が成立することはない。\n３．急迫不正の侵害がないのにあると誤信し、自己の権利を防衛するため、加害行為をした場合、正当防衛が成立することはない。\n４．相手方による侵害を予期している者が、自己の権利を防衛するため、同侵害が間近に押し迫っていないのに相手方に加害行為をした場合、正当防衛が成立することはない。\n５．相手方による侵害に対して反撃した者が、その侵害から予想された被害よりも大きい被害を相手方に与えた場合、正当防衛が成立することはない。", "source": "https://www.moj.go.jp/content/001443618.pdf", "answerSource": "https://www.moj.go.jp/content/001444175.pdf"}, {"id": "R7-keiho-5", "year": "R7", "yearLabel": "令和7年", "subject": "刑法", "qno": 5, "haiten": 2, "type": "choice", "options": 5,
