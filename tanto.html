<!doctype html>
<html lang="ja">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta charset="utf-8">
<title>短答デッキ 自作版</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
  :root{
    --paper:#ECEEF0;--surface:#FCFCFB;--surface-2:#F2F4F6;
    --ink:#1B2027;--ink-soft:#586070;--ink-faint:#8992A0;
    --line:#D8DCE2;--line-soft:#E6E9EE;
    --ai:#2F5D8C;--ai-deep:#234867;--ai-tint:#E4ECF4;
    --ok:#3B6E52;--ok-tint:#E3EDE6;--warn:#B5820F;--warn-tint:#F6ECD4;--ng:#B44A3B;--ng-tint:#F6E3DE;
    --shadow:0 1px 2px rgba(27,32,39,.05),0 8px 24px rgba(27,32,39,.06);--shadow-soft:0 1px 2px rgba(27,32,39,.05);
  }
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
    --paper:#12151A;--surface:#1B1F26;--surface-2:#161A20;
    --ink:#EAEDF1;--ink-soft:#9AA3B2;--ink-faint:#6E7784;
    --line:#2A3039;--line-soft:#222831;
    --ai:#6FA3D6;--ai-deep:#4E82B8;--ai-tint:#1C2836;
    --ok:#7FB89A;--ok-tint:#1E2A24;--warn:#D8B65C;--warn-tint:#2E2716;--ng:#DE8677;--ng-tint:#2E1D19;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);--shadow-soft:0 1px 2px rgba(0,0,0,.3);
  }}
  :root[data-theme="dark"]{
    --paper:#12151A;--surface:#1B1F26;--surface-2:#161A20;--ink:#EAEDF1;--ink-soft:#9AA3B2;--ink-faint:#6E7784;
    --line:#2A3039;--line-soft:#222831;--ai:#6FA3D6;--ai-deep:#4E82B8;--ai-tint:#1C2836;
    --ok:#7FB89A;--ok-tint:#1E2A24;--warn:#D8B65C;--warn-tint:#2E2716;--ng:#DE8677;--ng-tint:#2E1D19;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);--shadow-soft:0 1px 2px rgba(0,0,0,.3);
  }
  *{box-sizing:border-box} html,body{height:100%}
  body{margin:0;background:var(--paper);color:var(--ink);
    font-family:"Zen Kaku Gothic New",-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif;
    font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;overflow:hidden}
  h1,h2,h3{font-family:"Shippori Mincho",serif;font-weight:600;margin:0;text-wrap:balance}
  button{font-family:inherit;cursor:pointer}
  ::selection{background:var(--ai-tint)}
  :focus-visible{outline:2px solid var(--ai);outline-offset:2px;border-radius:4px}
  .eyebrow{font-family:"Shippori Mincho",serif;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-faint);font-weight:600}

  header{display:flex;align-items:center;gap:12px;padding:9px 16px;background:var(--surface);border-bottom:1px solid var(--line);flex:none;z-index:20;box-shadow:var(--shadow-soft);flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:9px;min-width:max-content}
  .seal{font-family:"Shippori Mincho",serif;font-weight:700;font-size:14px;color:#fff;background:var(--ai);width:30px;height:30px;border-radius:6px;display:grid;place-items:center;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
  .brand h1{font-size:16px;font-weight:600}
  .brand small{font-size:10.5px;color:var(--ink-faint);display:block;line-height:1;margin-top:2px}
  .navq{display:flex;align-items:center;gap:6px;flex:1;min-width:220px}
  .navq .cur{flex:1;min-width:0;text-align:left;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:6px 12px;display:flex;flex-direction:column;gap:1px;overflow:hidden}
  .navq .cur:hover{border-color:var(--ink-faint)}
  .navq .cur .k{font-size:10px;color:var(--ai);font-weight:700;font-family:"Shippori Mincho",serif}
  .navq .cur .n{font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .arrow{border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);border-radius:9px;width:32px;height:34px;font-size:15px;flex:none}
  .arrow:hover{border-color:var(--ink-faint);color:var(--ink)}
  .iconbtn{border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);border-radius:9px;height:34px;min-width:34px;padding:0 11px;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
  .iconbtn:hover{border-color:var(--ink-faint);color:var(--ink)}
  .iconbtn.accent{color:var(--ai);border-color:var(--ai)}
  .btnrow{display:flex;gap:6px;flex-wrap:wrap}

  main{flex:1;display:grid;grid-template-columns:54fr 46fr;min-height:0}
  .col{min-height:0;display:flex;flex-direction:column;overflow:hidden}
  .col.question{order:1;border-right:1px solid var(--line)}  /* 左=問題 */
  .col.answer{order:2}                                        /* 右=解答・解説 */
  .panelhead{display:flex;align-items:center;gap:10px;padding:12px 18px 8px;flex:none}
  .panelhead .eyebrow{flex:1}
  .tag{font-size:11px;color:var(--ai);font-weight:700;background:var(--ai-tint);padding:2px 9px;border-radius:20px}
  .scroll{flex:1;overflow-y:auto;padding:4px 18px 26px;scrollbar-width:thin}

  /* question pane */
  .q-meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
  .chip{font-size:11.5px;color:var(--ink-soft);background:var(--surface-2);border:1px solid var(--line);padding:2px 10px;border-radius:20px;font-weight:500}
  .chip.subj{color:var(--ink);font-weight:700}
  .chip.year{color:var(--ai);font-weight:700}
  .chip.pt{color:var(--ink-soft)}
  .q-no{font-size:18px;margin:0 0 10px}
  .figwarn{font-size:12px;color:var(--warn);background:var(--warn-tint);border-radius:9px;padding:8px 12px;margin-bottom:12px;line-height:1.6}
  .figwarn a{color:var(--ai)}
  .statement{font-family:"Zen Kaku Gothic New",-apple-system,sans-serif;font-size:14.5px;line-height:2;white-space:pre-wrap;color:var(--ink);letter-spacing:.01em}
  .srcline{margin-top:16px;font-size:11.5px}
  .srcline a{color:var(--ai);text-decoration:none}
  .srcline a:hover{text-decoration:underline}

  /* answer pane */
  .a-block{margin-bottom:20px}
  .a-block > .lab{font-size:12px;font-weight:700;color:var(--ink-soft);margin-bottom:8px;display:flex;align-items:center;gap:8px}
  .a-block > .lab .hint{font-weight:400;color:var(--ink-faint);font-size:11px}
  .choices{display:flex;flex-wrap:wrap;gap:8px}
  .choice{width:44px;height:44px;border:1.5px solid var(--line);background:var(--surface);border-radius:11px;font-size:16px;font-weight:700;color:var(--ink-soft);font-variant-numeric:tabular-nums}
  .choice:hover{border-color:var(--ai);color:var(--ink)}
  .choice.picked{border-color:var(--ai);background:var(--ai-tint);color:var(--ai-deep)}
  .choice.correct{border-color:var(--ok);background:var(--ok-tint);color:var(--ok)}
  .choice.wrong{border-color:var(--ng);background:var(--ng-tint);color:var(--ng)}
  .revealbtn{margin-top:12px;border:1px solid var(--ai);background:var(--ai);color:#fff;border-radius:10px;padding:10px 18px;font-size:14px;font-weight:600;width:100%}
  .revealbtn:hover{background:var(--ai-deep)}
  .result{border-radius:12px;padding:13px 15px;margin-top:12px;border:1px solid var(--line);background:var(--surface-2)}
  .result .verdict{font-size:15px;font-weight:700;font-family:"Shippori Mincho",serif;display:flex;align-items:center;gap:8px;margin-bottom:6px}
  .result .verdict.ok{color:var(--ok)} .result .verdict.ng{color:var(--ng)}
  .result .ansline{font-size:14px}
  .result .ansline b{color:var(--ai-deep);font-size:17px;font-variant-numeric:tabular-nums}
  .series{display:flex;flex-wrap:wrap;gap:7px;margin-top:6px}
  .series .s{display:flex;align-items:center;gap:5px;font-size:12.5px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:3px 9px}
  .series .s b{font-family:"Shippori Mincho",serif}
  .series .s .v.correct{color:var(--ok);font-weight:700} .series .s .v.wrong{color:var(--ng);font-weight:700}
  textarea{width:100%;font-family:inherit;font-size:14px;line-height:1.8;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;resize:vertical;min-height:96px}
  textarea:focus{outline:none;border-color:var(--ai);background:var(--surface)}
  textarea::placeholder{color:var(--ink-faint)}
  .statusrow{display:flex;gap:8px;flex-wrap:wrap}
  .statusbtn{flex:1;min-width:88px;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:9px 10px;font-size:13px;font-weight:600;color:var(--ink-soft);display:flex;align-items:center;justify-content:center;gap:6px}
  .statusbtn .dot{width:9px;height:9px;border-radius:50%}
  .statusbtn[data-s="ok"] .dot{background:var(--ok)} .statusbtn[data-s="vague"] .dot{background:var(--warn)} .statusbtn[data-s="ng"] .dot{background:var(--ng)}
  .statusbtn.on[data-s="ok"]{border-color:var(--ok);background:var(--ok-tint);color:var(--ok)}
  .statusbtn.on[data-s="vague"]{border-color:var(--warn);background:var(--warn-tint);color:var(--warn)}
  .statusbtn.on[data-s="ng"]{border-color:var(--ng);background:var(--ng-tint);color:var(--ng)}
  .saved{font-size:11px;color:var(--ink-faint);margin-top:10px}
  .saved b{color:var(--ok);font-weight:700}
  .hintcard{font-size:11.5px;color:var(--ink-faint);line-height:1.7;background:var(--surface-2);border-left:2.5px solid var(--ai);border-radius:0 8px 8px 0;padding:9px 13px;margin-bottom:16px}
  .revwarn{font-size:12px;color:var(--warn);background:var(--warn-tint);border-radius:9px;padding:9px 13px;margin-bottom:14px;line-height:1.65}
  .revwarn b{color:var(--warn)}
  .lawnote{font-size:11.5px;color:var(--ink-faint);line-height:1.7;margin-top:8px}
  .lawnote b{color:var(--ink-soft)}
  .nowblock{margin-top:16px;border:1px solid var(--warn);background:var(--warn-tint);border-radius:12px;padding:12px 14px}
  .nowblock .lab{font-size:12px;font-weight:700;color:var(--warn);margin-bottom:6px}
  .nowblock textarea{background:var(--surface);border-color:var(--line);min-height:70px}

  dialog{border:none;border-radius:16px;padding:0;background:var(--surface);color:var(--ink);box-shadow:var(--shadow);max-width:900px;width:calc(100vw - 32px)}
  dialog::backdrop{background:rgba(18,21,26,.5);backdrop-filter:blur(2px)}
  .modal-h{display:flex;align-items:center;gap:10px;padding:16px 22px 8px}
  .modal-h h2{font-size:18px;flex:1}
  .modal-b{padding:6px 22px 18px;max-height:76vh;overflow-y:auto}
  .ghost{border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);border-radius:9px;padding:9px 16px;font-size:13px}
  .ghost:hover{color:var(--ink);border-color:var(--ink-faint)}
  .filterbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:2px 0 14px;position:sticky;top:0;background:var(--surface);padding-bottom:10px;z-index:2}
  select,input[type=text]{font-family:inherit;font-size:13px;padding:8px 11px;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:9px}
  select:focus,input:focus{outline:none;border-color:var(--ai)}
  .filterbar input.q{flex:1;min-width:140px}
  .filterbar .count{font-size:12px;color:var(--ink-faint);margin-left:auto;white-space:nowrap}
  .cardgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
  .qcard{border:1px solid var(--line);border-radius:12px;background:var(--surface-2);padding:11px 12px;text-align:left;display:flex;flex-direction:column;gap:5px;position:relative}
  .qcard:hover{border-color:var(--ai);transform:translateY(-1px);box-shadow:var(--shadow-soft)}
  .qcard.cur{border-color:var(--ai);box-shadow:0 0 0 1px var(--ai)}
  .qcard .ct{display:flex;align-items:center;gap:6px}
  .qcard .cy{font-size:10.5px;color:var(--ai);font-weight:700;font-family:"Shippori Mincho",serif}
  .qcard .cs{font-size:12.5px;font-weight:700}
  .qcard .cno{font-size:11px;color:var(--ink-faint);margin-left:auto}
  .qcard .cv{font-size:11px;color:var(--ink-soft);line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .stat{position:absolute;top:9px;right:9px;width:8px;height:8px;border-radius:50%}
  .stat.ok{background:var(--ok)} .stat.vague{background:var(--warn)} .stat.ng{background:var(--ng)}
  .pilltype{font-size:10px;padding:1px 7px;border-radius:10px;border:1px solid var(--line);color:var(--ink-faint)}

  .trend h3{font-size:15px;margin:18px 0 8px;display:flex;align-items:center;gap:8px}
  .trend h3::before{content:"";width:16px;height:2px;background:var(--ai)}
  .trend p{font-size:13.5px;line-height:1.8;margin:0 0 10px;color:var(--ink-soft)}
  .trend .lead{font-size:14px;color:var(--ink)}
  .bars{display:flex;flex-direction:column;gap:7px;margin:6px 0 14px}
  .bar{display:grid;grid-template-columns:120px 1fr 40px;align-items:center;gap:10px;font-size:12.5px}
  .bar .track{height:16px;background:var(--surface-2);border-radius:5px;overflow:hidden;border:1px solid var(--line-soft)}
  .bar .track i{display:block;height:100%;background:var(--ai)}
  .bar .num{text-align:right;color:var(--ink-soft);font-variant-numeric:tabular-nums}

  .footnote{font-size:11px;color:var(--ink-faint);padding:7px 18px;text-align:center;border-top:1px solid var(--line-soft);background:var(--surface);flex:none;line-height:1.6}
  .footnote b{color:var(--ink-soft);font-weight:700}
  @media (max-width:820px){
    body{overflow:auto}
    main{grid-template-columns:1fr;overflow:visible}
    .col{overflow:visible}
    .col.question{order:1;border-right:none;border-bottom:1px solid var(--line)}  /* 狭い時も問題を上に */
    .col.answer{order:2}
    .scroll{overflow:visible}
    .navq{order:5;flex-basis:100%}
  }
</style>
</head>
<body>


<header>
  <div class="brand"><span class="seal">短</span><div><h1>短答デッキ</h1><small>自作版・隙間時間の令和短答</small></div></div>
  <div class="navq">
    <button class="arrow" id="prevBtn" title="前の問題">◀</button>
    <button class="cur" id="curBtn" title="問題一覧"><span class="k" id="curK"></span><span class="n" id="curN"></span></button>
    <button class="arrow" id="nextBtn" title="次の問題">▶</button>
  </div>
  <div class="btnrow">
    <button class="iconbtn accent" id="listBtn">☰ 一覧</button>
    <button class="iconbtn" id="trendBtn">📈 傾向</button>
    <button class="iconbtn" id="dataBtn" title="バックアップ">⇅</button>
    <button class="iconbtn" id="themeBtn" title="表示モード">◐</button>
  </div>
</header>

<main>
  <!-- 左: 回答・解説 -->
  <section class="col answer">
    <div class="panelhead"><span class="eyebrow">解答・解説 ｜ Answer</span><span class="tag" id="aStatus">未着手</span></div>
    <div class="scroll" id="answerPane"></div>
  </section>
  <!-- 右: 問題 -->
  <section class="col question">
    <div class="panelhead"><span class="eyebrow">問題 ｜ Question</span><span class="tag" id="qTag"></span></div>
    <div class="scroll">
      <div class="q-meta" id="qMeta"></div>
      <h2 class="q-no" id="qNo"></h2>
      <div class="figwarn" id="figWarn" style="display:none"></div>
      <div class="statement" id="qStatement"></div>
      <div class="srcline" id="qSrc"></div>
    </div>
  </section>
</main>

<div class="footnote">令和5〜7年 予備試験 短答式（法律7科目・計<b id="qCount"></b>問）を収録。正解・配点は法務省公表データ準拠。演習状態は<b>この端末のブラウザ内のみ</b>に保存。</div>

<dialog id="listDialog">
  <div class="modal-h"><span class="seal" style="width:26px;height:26px;font-size:12px">選</span><h2>問題一覧</h2><button class="ghost" onclick="this.closest('dialog').close()">閉じる</button></div>
  <div class="modal-b">
    <div class="filterbar">
      <select id="fltSubject"></select>
      <select id="fltYear"></select>
      <select id="fltStatus"></select>
      <input type="text" class="q" id="fltQ" placeholder="🔍 キーワード（論点・条文・事実）">
      <span class="count" id="fltCount"></span>
    </div>
    <div class="cardgrid" id="cardGrid"></div>
  </div>
</dialog>

<dialog id="trendDialog">
  <div class="modal-h"><span class="seal" style="width:26px;height:26px;font-size:12px">傾</span><h2>短答の型と傾向（令和5〜7年）</h2><button class="ghost" onclick="this.closest('dialog').close()">閉じる</button></div>
  <div class="modal-b trend" id="trendBody"></div>
</dialog>

<dialog id="dataDialog"><form method="dialog">
  <div class="modal-h"><span class="seal" style="width:26px;height:26px;font-size:12px">⇅</span><h2>バックアップ</h2></div>
  <div class="modal-b">
    <p style="font-size:12px;color:var(--ink-faint);line-height:1.7">演習状態（解答・メモ・定着度）をJSONで保存/復元。読み込むと現在の状態に<b>上書き</b>されます。</p>
    <textarea id="dataArea" style="min-height:180px;font-family:ui-monospace,Menlo,monospace;font-size:12px;line-height:1.5" spellcheck="false"></textarea>
    <div style="display:flex;gap:9px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap">
      <button type="button" class="ghost" id="copyDataBtn" style="margin-right:auto">コピー</button>
      <button type="submit" value="cancel" class="ghost">閉じる</button>
      <button type="button" class="iconbtn" id="importBtn" style="height:auto;padding:9px 16px">↥ 読み込む</button>
      <button type="button" class="iconbtn accent" id="downloadBtn" style="height:auto;padding:9px 16px">↧ ファイル保存</button>
    </div>
  </div>
</form></dialog>

<script>
const TANTO_SEED = [{"id": "R5-kenpo-1", "year": "R5", "yearLabel": "令和5年", "subject": "憲法", "qno": 1, "haiten": 2, "type": "choice", "options": 8, "answer": [8], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第１問〕（配点：２）\n法の下の平等に関する次のアからウまでの各記述について、最高裁判所の判例の趣旨に照らして、正しいものには○、誤っているものには×を付した場合の組合せを、後記１から８までの中から選びなさい。\nア．憲法第１４条第１項前段の法の下の平等は法適用の平等を意味し、行政府と司法府を拘束するが、同項後段の「人種、信条、性別、社会的身分又は門地」による差別は歴史的に存在した特に不合理な差別として限定的に列挙されたものなので、行政府と司法府のみならず、立法府をも拘束する。\nイ．憲法第９４条で地方公共団体の条例制定権が認められていることに照らすと、地域によって条例による規制内容に差異が生じることは当然に予期されることであるから、ある行為の取締りのために各地方公共団体が各別に条例を制定する結果、その取扱いに差異が生じることがあっても地域差の故に違憲ということはできない。しかし、全国一律の規制になじむ行為を取り締まる場合には、法律で全国一律に規制しなければ、憲法第１４条第１項に違反する。\nウ．選挙権に関しては、憲法第１４条第１項に定める法の下の平等は、国民はすべて政治的価値において平等であるべきとする徹底した平等化を志向するもので、各選挙人の投票の価値の平等も憲法の要求するところであるから、両議院の議員一人当たりの人口が最大の選挙区と最小の選挙区との間で、一票の重みの較差がおおむね２対１以上に開いた場合、投票価値の平等の要請に正面から反し、違憲といわざるを得ない。\n１．ア○ イ○ ウ○\n２．ア○ イ○ ウ×\n３．ア○ イ× ウ○\n４．ア○ イ× ウ×\n５．ア× イ○ ウ○\n６．ア× イ○ ウ×\n７．ア× イ× ウ○\n８．ア× イ× ウ×", "source": "https://www.moj.go.jp/content/001399904.pdf", "answerSource": "https://www.moj.go.jp/content/001400882.pdf"}, {"id": "R5-kenpo-2", "year": "R5", "yearLabel": "令和5年", "subject": "憲法", "qno": 2, "haiten": 2, "type": "choice", "options": 8, "answer": [5], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第２問〕（配点：２）\n表現の自由に関する次のアからウまでの各記述について、最高裁判所の判例の趣旨に照らして、正しいものには○、誤っているものには×を付した場合の組合せを、後記１から８までの中から選びなさい。\nア．ある事実を基礎とする意見を表明する行為が、公共の利害に関する事実に係り、かつ、その目的が専ら公益を図ることにあった場合であっても、意見の前提となる事実がその重要な部分について真実であることの証明がなければ、当該表現行為は、名誉毀損と評価されることとなる。\nイ．ある者が刑事事件について被疑者とされ、被告人として公訴提起されて有罪判決を受け、服役した事実は、その者の名誉あるいは信用に直接に関わる事項であり、その者は、みだりに上記の前科等に関わる事実を公表されないことにつき、法的保護に値する利益を有すると考えられ、この点は、前科等に関わる事実の公表が公的機関によるものであっても、私人又は私的団体によるものであっても違いはない。\nウ．人格権としての個人の名誉を害する内容を含む表現行為の事前差止めは、その対象が公務員や公職選挙の候補者に対する評価、批判等である場合には原則として許されないが、その表現内容が真実でなく、又は専ら公益を図る目的のものでないことが明白であって、かつ、被害者が重大にして著しく回復困難な損害を被るおそれがあるときは、例外的に許される。\n１．ア○ イ○ ウ○\n２．ア○ イ○ ウ×\n３．ア○ イ× ウ○\n４．ア○ イ× ウ×\n５．ア× イ○ ウ○\n６．ア× イ○ ウ×\n７．ア× イ× ウ○\n８．ア× イ× ウ×", "source": "https://www.moj.go.jp/content/001399904.pdf", "answerSource": "https://www.moj.go.jp/content/001400882.pdf"}, {"id": "R5-kenpo-3", "year": "R5", "yearLabel": "令和5年", "subject": "憲法", "qno": 3, "haiten": 2, "type": "choice", "options": 8, "answer": [2], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第３問〕（配点：２）\n集会の自由に関する次のアからウまでの各記述について、最高裁判所の判例の趣旨に照らして、正しいものには○、誤っているものには×を付した場合の組合せを、後記１から８までの中から選びなさい。\nア．集団行進が行われることによって一般交通の用に供せられるべき道路の機能を著しく害するものと認められ、また、条件を付与することによってもかかる事態の発生を阻止することができないと予測される場合には、当該集団行進について不許可処分がなされたとしても憲法第２ １条に反しない。\nイ．公共の秩序を保持し、又は公共の福祉が著しく侵されることを防止するため、特定の場所又は方法につき、合理的かつ明確な基準の下に、集団行進についてあらかじめ許可を受けることを必要とするとの規定を設けたとしても憲法第２１条に反しない。\nウ．皇居外苑などの国民公園は、国が直接公共の用に供した財産であるとしても、集会のために設置されたものではないため、公園を集会に使用するための許可の申請について、公園の管理権者はその許否を自由に決することができ、不許可処分を行っても憲法第２１条に反しない。\n１．ア○ イ○ ウ○\n２．ア○ イ○ ウ×\n３．ア○ イ× ウ○\n４．ア○ イ× ウ×\n５．ア× イ○ ウ○\n６．ア× イ○ ウ×\n７．ア× イ× ウ○\n８．ア× イ× ウ×", "source": "https://www.moj.go.jp/content/001399904.pdf", "answerSource": "https://www.moj.go.jp/content/001400882.pdf"}, {"id": "R5-kenpo-4", "year": "R5", "yearLabel": "令和5年", "subject": "憲法", "qno": 4, "haiten": 3, "type": "series", "options": 2, "answer": [1, 2, 2], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第４問〕（配点：３）\n職業の自由に関する次のアからウまでの各記述について、最高裁判所の判例の趣旨に照らして、それぞれ正しい場合には１を、誤っている場合には２を選びなさい。\nア．職業の自由に対する規制措置が憲法上是認されるかどうかは、具体的な規制措置について、規制の目的、必要性、内容、これによって制限される職業の自由の性質、内容及び制限の程度を検討し、これらを比較考量した上で慎重に決定されなければならず、それは、第一次的には立法府の権限と責務であるから、裁判所としては、規制の目的が公共の福祉に合致するものと認められる以上、立法府の判断がその合理的裁量の範囲にとどまる限り、その判断を尊重すべきである。\nイ．職業の許可制は、単なる職業活動の内容及び態様に対する規制を超えて、狭義における職業の選択の自由そのものに制約を課するもので、職業の自由に対する強力な制限であるから、その合憲性を肯定し得るためには、規制目的が重要な公共の利益のために必要不可欠であり、許可制に比べて職業の自由に対するより緩やかな制限である職業活動の内容及び態様に対する規制によっては立法目的を十分に達成し得ないことを要する。\nウ．酒類販売業免許制は、一部地域における販売店の乱立による過当競争のために経済的基盤の弱い小売商の経営が不安定となることを防止するとともに、酒税の適正かつ確実な賦課徴収を図るという目的で実施されたものであって、その必要性と合理性があり、立法府の政策的、技術的な裁量の範囲を逸脱するもので著しく不合理であるとまでは断定し難いから、憲法第２２条第１項に違反しない。", "source": "https://www.moj.go.jp/content/001399904.pdf", "answerSource": "https://www.moj.go.jp/content/001400882.pdf"}, {"id": "R5-kenpo-5", "year": "R5", "yearLabel": "令和5年", "subject": "憲法", "qno": 5, "haiten": 3, "type": "series", "options": 2, "answer": [1, 2, 1], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第５問〕（配点：３）\n労働基本権に関する次のアからウまでの各記述について、最高裁判所の判例の趣旨に照らして、それぞれ正しい場合には１を、誤っている場合には２を選びなさい。\nア．ユニオン・ショップ協定とは、労働協約において、使用者が従業員のうち労働組合に加入しない者及び労働組合の組合員でなくなった者を解雇する義務を負う定めを置くことをいうが、ユニオン・ショップ協定において、使用者が同協定を締結した組合以外の他の労働組合に加入している者を解雇する義務を負うと定めることは、憲法第２８条が保障する労働者の組合選択の自由及び他の労働組合の団結権を侵害するため許されない。\nイ．労働組合は、憲法第２８条が団結権を保障する効果として、組合員に対する統制権を有するから、労働組合が、地方議会議員の選挙に当たり、統一候補を決定して組合を挙げて選挙運動を推進している場合に、組合の方針に反して立候補しようとする組合員に対し、立候補の取りやめを要求し、これに従わないことを統制違反として処分することは許される。\nウ．憲法第２８条の労働基本権の保障は公務員に対しても及ぶが、国家公務員の従事する職務には公共性がある一方、法律によりその主要な勤務条件が定められ、身分が保障されているほか、適切な代償措置が講じられていることなどからすれば、法律により国家公務員の争議行為を禁止することは、勤労者をも含めた国民全体の共同利益の見地からするとやむを得ない制約というべきであって、憲法第２８条に違反しない。", "source": "https://www.moj.go.jp/content/001399904.pdf", "answerSource": "https://www.moj.go.jp/content/001400882.pdf"}, {"id": "R5-kenpo-6", "year": "R5", "yearLabel": "令和5年", "subject": "憲法", "qno": 6, "haiten": 3, "type": "series", "options": 2, "answer": [1, 2, 2], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第６問〕（配点：３）\n人身の自由に関する次のアからウまでの各記述について、最高裁判所の判例の趣旨に照らして、それぞれ正しい場合には１を、誤っている場合には２を選びなさい。\nア．憲法第３４条前段の弁護人依頼権の規定は、単に被疑者が弁護人を選任することを官憲が妨害してはならないというにとどまるものではなく、弁護人から援助を受ける機会を実質的に保障しているものと解すべきであり、刑事訴訟法第３９条第１項の接見交通権は、憲法第３４条の趣旨にのっとり設けられたものである。\nイ．憲法第３５条の下で令状なく住居に侵入し捜索・押収ができるのは、裁判官が発した令状による逮捕の場合、現行犯逮捕の場合及び緊急逮捕の場合に限られ、現行犯として逮捕する要件は備わっていたが、現実には逮捕しない場合は含まれない。\nウ．交通事故を起こした運転者は、警察官に対し、交通事故発生の日時、場所、死傷者の数などを報告する義務を負うが、道路における危険とこれによる被害の増大を防止し、交通の安全を図るという目的のためには、刑事責任を負うことにつながるような自己に不利益な供述をさせることもやむを得ないから、この報告義務を定めた法律は、憲法第３８条第１項に違反しない。", "source": "https://www.moj.go.jp/content/001399904.pdf", "answerSource": "https://www.moj.go.jp/content/001400882.pdf"}, {"id": "R5-kenpo-7", "year": "R5", "yearLabel": "令和5年", "subject": "憲法", "qno": 7, "haiten": 3, "type": "series", "options": 2, "answer": [1, 2, 2], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第７問〕（配点：３）\n選挙制度に関する次のアからウまでの各記述について、最高裁判所の判例の趣旨に照らして、それぞれ正しい場合には１を、誤っている場合には２を選びなさい。\nア．政党等から名簿登載者の除名届が提出されているにもかかわらず、選挙長ないし選挙会が当該除名の有効性を審査すべきものとすれば、政党等による組織内の自律的運営に属する事項について、その政党等の意思に反して行政権が介入することになる。こうしたことから、公職選挙法は、名簿届出政党等による名簿登載者の除名について、選挙長ないし選挙会の審査の対象を形式的な事項にとどめている。\nイ．戸別訪問の禁止は、意見表明そのものの制約を目的とするものではなく、意見表明の手段方法のもたらす弊害を防止し、もって選挙の自由と公正を確保することを目的としている。こうしたことから、公職選挙法の戸別訪問禁止規定は、公正な選挙の実施に対する明白かつ現在の危険をもたらす戸別訪問のみを禁止する規定として限定して解釈される限りで合憲となる。\nウ．立候補の自由が選挙権の自由な行使と表裏の関係にある重要な基本的人権であることからすると、選挙制度を政党本位のものとするという国会の裁量にも限界がある。こうしたことから、立候補の自由に配慮して、公職選挙法上、衆議院議員選挙における重複立候補者が所属する政治団体については、一定数以上の国会議員を有することを要するといった限定は課されていない。", "source": "https://www.moj.go.jp/content/001399904.pdf", "answerSource": "https://www.moj.go.jp/content/001400882.pdf"}, {"id": "R5-kenpo-8", "year": "R5", "yearLabel": "令和5年", "subject": "憲法", "qno": 8, "haiten": 2, "type": "choice", "options": 8, "answer": [4], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第８問〕（配点：２）\n立法に関する次のアからウまでの各記述について、正しいものには〇、誤っているものには×を付した場合の組合せを、後記１から８までの中から選びなさい。\nア．国会中心立法の原則とは、国の行う立法は、憲法に特別の定めがある場合を除いて、常に国会によってなされなくてはならないという原則であり、憲法に特別の定めがある場合として、両議院の議院規則や最高裁判所規則の制定がある。\nイ．法律は国会の議決のみで成立し、憲法上この点の例外は定められていない。\nウ．憲法第７３条第６号ただし書は委任立法の存在を前提とする規定であり、法律の一般的委任という形をとれば、内閣は政令で新たに国民の権利義務に関する定めをすることができる。\n１．ア〇 イ〇 ウ〇\n２．ア〇 イ〇 ウ×\n３．ア〇 イ× ウ〇\n４．ア〇 イ× ウ×\n５．ア× イ〇 ウ〇\n６．ア× イ〇 ウ×\n７．ア× イ× ウ〇\n８．ア× イ× ウ×", "source": "https://www.moj.go.jp/content/001399904.pdf", "answerSource": "https://www.moj.go.jp/content/001400882.pdf"}, {"id": "R5-kenpo-9", "year": "R5", "yearLabel": "令和5年", "subject": "憲法", "qno": 9, "haiten": 3, "type": "series", "options": 2, "answer": [1, 1, 2], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第９問〕（配点：３）\n内閣に関する次のアからウまでの各記述について、それぞれ正しい場合には１を、誤っている場合には２を選びなさい。\nア．衆議院において内閣不信任決議案が可決されたときは、１０日以内に衆議院が解散されない限り、内閣は総辞職をしなければならないが、参議院における問責決議には、かかる法的効力はない。\nイ．内閣総理大臣は、国会議員でなければならないから、国会議員の当選の効力に関する訴訟の結果、自己の当選が無効となったときは、憲法第７０条の「内閣総理大臣が欠けたとき」に当たり、内閣は、総辞職をしなければならない。\nウ．衆議院議員総選挙又は参議院議員通常選挙の後に初めて国会が召集されたときは、憲法の規定により、内閣は、総辞職をしなければならない。", "source": "https://www.moj.go.jp/content/001399904.pdf", "answerSource": "https://www.moj.go.jp/content/001400882.pdf"}, {"id": "R5-kenpo-10", "year": "R5", "yearLabel": "令和5年", "subject": "憲法", "qno": 10, "haiten": 2, "type": "choice", "options": 8, "answer": [2], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第10問〕（配点：２）\n司法権の範囲ないし限界に関する次のアからウまでの各記述について、最高裁判所の判例の趣旨に照らして、正しいものには〇、誤っているものには×を付した場合の組合せを、後記１から８までの中から選びなさい。\nア．裁判所がその固有の権限に基づいて審判することのできる対象は、裁判所法第３条にいう「法律上の争訟」、すなわち当事者間の具体的な権利義務ないし法律関係の存否に関する紛争であって、かつ、それが法令の適用により終局的に解決することができるものに限られる。したがって、具体的な権利義務ないし法律関係に関する紛争であっても、法令の適用による終局的解決に適しないものは裁判所の司法審査の対象になり得ない。\nイ．特定の者の宗教活動上の地位の存否を審理、判断するにつき、宗教団体の教義ないし信仰の内容に立ち入って審理、判断することが必要不可欠である場合には、裁判所は、その者が宗教活動上の地位にあるか否かを審理、判断することができず、その結果、宗教活動上の地位に基づく宗教法人の代表役員の地位の存否についても審理、判断することができない。この場合には、宗教法人の代表役員の地位の存否の確認を求める訴えは、裁判所法第３条にいう「法律上の争訟」に当たらない。\nウ．大学の単位の授与（認定）という行為は、学生が履修した授業科目について合格したことを確認する教育上の措置であり、卒業の要件をなすものであるから、一般市民法秩序と直接の関係を有するものであることは明らかである。それゆえ、純然たる大学内部の問題とはいえず、大学の自主的、自律的な判断のみに委ねられるべきものではなく、裁判所の司法審査の対象となる。\n１．ア〇 イ〇 ウ〇\n２．ア〇 イ〇 ウ×\n３．ア〇 イ× ウ〇\n４．ア〇 イ× ウ×\n５．ア× イ〇 ウ〇\n６．ア× イ〇 ウ×\n７．ア× イ× ウ〇\n８．ア× イ× ウ×", "source": "https://www.moj.go.jp/content/001399904.pdf", "answerSource": "https://www.moj.go.jp/content/001400882.pdf"}, {"id": "R5-kenpo-11", "year": "R5", "yearLabel": "令和5年", "subject": "憲法", "qno": 11, "haiten": 3, "type": "series", "options": 2, "answer": [1, 1, 2], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第11問〕（配点：３）\n財政に関する次のアからウまでの各記述について、最高裁判所の判例の趣旨に照らして、それぞれ正しい場合には１を、誤っている場合には２を選びなさい。\nア．市町村が行う国民健康保険における保険料は、憲法第８４条に規定する租税には当たらないが、国民健康保険は強制加入とされ、保険料が強制徴収されるものであり、賦課徴収の強制の度合いにおいては租税に類似する性質を有するため、憲法第８４条の趣旨が及ぶ。\nイ．暦年途中の租税法規の変更及びその暦年当初からの適用によって納税者の租税法規上の地位が変更され、課税関係における法的安定に影響が及び得る場合の憲法第８４条適合性については、変更の対象となる納税者の租税法規上の地位の性質、変更の程度及び変更により保護される公益の性質などの諸事情を総合的に勘案して判断すべきである。\nウ．長く課税されることがなかったパチンコ球遊器について、行政の内部命令である通達によって課税の物件たる遊戯具に該当するとして課税の対象とされたことは、通達の内容が法の正しい解釈に合致するものであっても、憲法第８４条に違反する。", "source": "https://www.moj.go.jp/content/001399904.pdf", "answerSource": "https://www.moj.go.jp/content/001400882.pdf"}, {"id": "R5-kenpo-12", "year": "R5", "yearLabel": "令和5年", "subject": "憲法", "qno": 12, "haiten": 2, "type": "choice", "options": 8, "answer": [2], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第12問〕（配点：２）\n条約に関する次のアからウまでの各記述について、正しいものには○、誤っているものには×を付した場合の組合せを、後記１から８までの中から選びなさい。\nア．憲法と条約の関係につき、憲法優位説の立場からは、日本国が締結した条約を誠実に遵守することを必要とする旨規定する憲法第９８条第２項について、有効に成立した条約の国内法的効力を認め、その遵守を強調したものであると考えることになる。\nイ．砂川事件判決（最高裁判所昭和３４年１２月１６日大法廷判決、刑集１３巻１３号３２２５頁）は、日本国とアメリカ合衆国との間の安全保障条約（いわゆる旧日米安全保障条約）につき、一見極めて明白に違憲無効であると認められない限りは裁判所の司法審査権の範囲外であるとしたが、同条約が高度の政治性を有することを理由としており、条約であることを理由にはしていないことを踏まえると、条約について違憲審査の対象となり得るとの見解を採ったものと理解することができる。\nウ．条約の締結には国会の承認が必要であるが、衆議院が承認の議決をし、参議院でこれと異なった議決をした場合には、衆議院で出席議員の３分の２以上の多数で再び承認の議決をしたときは、衆議院の議決が国会の議決となる。\n１．ア○ イ○ ウ○\n２．ア○ イ○ ウ×\n３．ア○ イ× ウ○\n４．ア○ イ× ウ×\n５．ア× イ○ ウ○\n６．ア× イ○ ウ×\n７．ア× イ× ウ○\n８．ア× イ× ウ× ［行政法］", "source": "https://www.moj.go.jp/content/001399904.pdf", "answerSource": "https://www.moj.go.jp/content/001400882.pdf"}, {"id": "R5-gyosei-13", "year": "R5", "yearLabel": "令和5年", "subject": "行政法", "qno": 13, "haiten": 2, "type": "choice", "options": 8, "answer": [4], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第13問〕（配点：２）\n行政行為の効力の消滅に関する次のアからウまでの各記述について、法令又は最高裁判所の判例に照らし、正しいものに○、誤っているものに×を付した場合の組合せを、後記１から８までの中から選びなさい。\nア．処分庁は、自らした行政処分に当該処分成立時から取り消し得べき瑕疵があったことが取消訴訟の出訴期間経過後に判明し、当該処分が訴訟手続によって取り消される余地がなくなった場合でも、当該処分を自ら取り消すことができる。イ. 処分庁が授益的処分の処分成立時からの瑕疵を理由に当該処分を取り消すためには、当該処分の名宛人に対する利益保護の観点から、その取消しを認める旨の法律上の明文の規定が必要である。ウ. 処分庁から人工妊娠中絶を行うことができる医師に指定された開業医が当該指定処分後に虚偽の出生証明書を作成して罰金刑を受けたため、当該処分庁がこれを主な理由として当該指定処分を取り消す行為は、学問上の「職権取消し」に当たる。\n１．ア○ イ○ ウ○\n２．ア○ イ○ ウ×\n３．ア○ イ× ウ○\n４．ア○ イ× ウ×\n５．ア× イ○ ウ○\n６．ア× イ○ ウ×\n７．ア× イ× ウ○\n８．ア× イ× ウ×", "source": "https://www.moj.go.jp/content/001399904.pdf", "answerSource": "https://www.moj.go.jp/content/001400882.pdf"}, {"id": "R5-gyosei-14", "year": "R5", "yearLabel": "令和5年", "subject": "行政法", "qno": 14, "haiten": 3, "type": "series", "options": 2, "answer": [2, 2, 2, 1], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第14問〕（配点：３）\n行政手続法に関する次のアからエまでの各記述について、同法又は最高裁判所の判例に照らし、それぞれ正しい場合には１を、誤っている場合には２を選びなさい。ア. 申請拒否処分については、理由の提示が義務付けられているが、これは行政庁の判断の恣意を抑制するとともに不服申立てに便宜を与えることを目的としているので、行政文書を開示しない決定の取消訴訟において、被告が当該決定の際に提示されていた処分理由とは異なる処分理由を追加して主張することが許されることはない。イ. 不利益処分をしようとする場合の当該不利益処分の名宛人となるべき者についての弁明の機会の付与における弁明は、原則として、弁明書及び証拠書類等の提出並びに口頭での意見陳述により行われる。\nウ．許認可等を後発的事情を理由として取り消す処分は、新たな公益判断を伴うため聴聞の対象となるが、許認可等をその成立当初からの違法を理由として取り消す処分は、聴聞の対象とはならない。エ. 意見公募手続を実施して命令等が定められた場合、当該命令等の公布と同時期に意見公募手続の結果も公示されなければならないが、その際には、意見公募手続の実施段階での命令等の案と公布された命令等との差異を含めて、提出意見を考慮した結果及びその理由が示されなければならない。", "source": "https://www.moj.go.jp/content/001399904.pdf", "answerSource": "https://www.moj.go.jp/content/001400882.pdf"}, {"id": "R5-gyosei-15", "year": "R5", "yearLabel": "令和5年", "subject": "行政法", "qno": 15, "haiten": 2, "type": "choice", "options": 8, "answer": [6], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第15問〕（配点：２）\n公立学校施設の管理者がした目的外使用の許否に係る裁量処分の司法審査に関する最高裁判所平成１８年２月７日第三小法廷判決（民集６０巻２号４０１頁。以下「本判決」という。）の次の判示を読み、本判決に関する後記アからウまでの各記述について、正しいものに○、誤っているものに×を付した場合の組合せを、後記１から８までの中から選びなさい。「管理者の裁量判断は、許可申請に係る使用の日時、場所、目的及び態様、使用者の範囲、使用の必要性の程度、許可をするに当たっての支障又は許可をした場合の弊害若しくは影響の内容及び程度、代替施設確保の困難性など許可をしないことによる申請者側の不都合又は影響の内容及び程度等の諸般の事情を総合考慮してされるものであり、その裁量権の行使が逸脱濫用に当たるか否かの司法審査においては、その判断が裁量権の行使としてされたことを前提とした上で、その判断要素の選択や判断過程に合理性を欠くところがないかを検討し、その判断が、重要な事実の基礎を欠くか、又は社会通念に照らし著しく妥当性を欠くものと認められる場合に限って、裁量権の逸脱又は濫用として違法となるとすべきものと解するのが相当である。」\nア．本判決による審査方法は、裁判所が裁量処分について、全面的にその当否を審査し直し、裁判所が出した結論と行政庁の処分内容とが異なる場合に、当該裁量処分が違法となると判断するもので、これにより密度の高い審査を行うことができるという特徴がある。\nイ．本判決による審査方法については、いかなる判断要素を選択し、その評価をどのように行うのかという点に関し、基準が明確ではないという問題点が指摘できる。\nウ．本判決による審査方法によれば、従来の裁量処分の審査において用いられてきた平等原則や比例原則の観点は、裁量処分の審査に当たり考慮すべき要素にはならない。\n１．ア○ イ○ ウ○\n２．ア○ イ○ ウ×\n３．ア○ イ× ウ○\n４．ア○ イ× ウ×\n５．ア× イ○ ウ○\n６．ア× イ○ ウ×\n７．ア× イ× ウ○\n８．ア× イ× ウ×", "source": "https://www.moj.go.jp/content/001399904.pdf", "answerSource": "https://www.moj.go.jp/content/001400882.pdf"}, {"id": "R5-gyosei-16", "year": "R5", "yearLabel": "令和5年", "subject": "行政法", "qno": 16, "haiten": 2, "type": "choice", "options": 8, "answer": [7], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第16問〕（配点：２）\n行政契約に関する次のアからウまでの各記述について、法令又は最高裁判所の判例に照らし、正しいものに○、誤っているものに×を付した場合の組合せを、後記１から８までの中から選びなさい。\nア．地方公共団体が売買や請負等の契約を締結する場合は、地方自治法上、指名競争入札、一般競争入札、随意契約及びせり売りの方法のうち、機会均等、公正性、透明性及び経済性（価格の有利性）を確保する見地から、指名競争入札の方法で行うことが原則である。\nイ．地方自治法上の指定管理者の指定は、公の施設の設置目的を効果的に達成するため、公の施設の管理に民間手法を活用し、住民サービスの向上と施設管理における費用対効果の向上等を目的とするものであるから、委託契約の形式で行われる。\nウ．地方公共団体が随意契約の制限に関する法令に違反して締結した契約は、当該契約を無効としなければ、随意契約の締結に制限を加える法令の規定の趣旨を没却する結果となる特段の事情が認められる場合に限り、私法上無効になる。\n１．ア○ イ○ ウ○\n２．ア○ イ○ ウ×\n３．ア○ イ× ウ○\n４．ア○ イ× ウ×\n５．ア× イ○ ウ○\n６．ア× イ○ ウ×\n７．ア× イ× ウ○\n８．ア× イ× ウ×", "source": "https://www.moj.go.jp/content/001399904.pdf", "answerSource": "https://www.moj.go.jp/content/001400882.pdf"}, {"id": "R5-gyosei-17", "year": "R5", "yearLabel": "令和5年", "subject": "行政法", "qno": 17, "haiten": 3, "type": "series", "options": 2, "answer": [1, 2, 1, 2], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第17問〕（配点：３）\n行政上の義務の履行確保に関する教員と学生による以下の対話中の次のアからエまでの【 】内の各記述について、法令又は最高裁判所の判例に照らし、それぞれ正しい場合には１を、誤っている場合には２を選びなさい。教員：まず、行政主体が有する金銭債権に行政上の強制徴収の手段が法律で認められている場合、当該行政主体は、当該金銭債権に係る債務の履行を求める民事訴訟を提起することができますか。学生：（ア）【金銭債権に行政上の強制徴収という簡易迅速な手段が認められている以上、その手段によることなく、当該金銭債権に係る債務の履行を求める民事訴訟を提起することは許されないものと解されます。】 教員：では、地方公共団体が、条例に基づく建築工事の中止命令に従わない者に対し、当該工事の続行禁止を求める民事訴訟を提起することはできますか。学生：（イ）【建築工事の中止命令の不履行があったときにこれを強制的に履行させるための手段が当該条例に定められていない場合であれば、当該工事の続行禁止を求める民事訴訟を提起することは許されるものと解されます。】 教員：ところで、建築工事を中止すべき義務のような不作為義務は、行政代執行法による代執行の対象とはなりませんか。学生：（ウ）【代執行の対象となる義務は代替的作為義務に限られますから、不作為義務が対象となることはありません。】 教員：代執行の要件について、行政代執行法ではどのように定められていますか。学生：（エ）【義務者が義務を履行しないというだけでは足りず、他の手段によってその履行を確保することが困難であるか、又はその不履行を放置することが著しく公益に反すると認められることが必要です。】", "source": "https://www.moj.go.jp/content/001399904.pdf", "answerSource": "https://www.moj.go.jp/content/001400882.pdf"}, {"id": "R5-gyosei-18", "year": "R5", "yearLabel": "令和5年", "subject": "行政法", "qno": 18, "haiten": 2, "type": "choice", "options": 8, "answer": [4], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第18問〕（配点：２）\n行政機関の保有する情報の公開に関する法律に関する次のアからウまでの各記述について、正しいものに○、誤っているものに×を付した場合の組合せを、後記１から８までの中から選びなさい。\nア．人の生命、健康、生活又は財産を保護するため、公にすることが必要であると認められる情報については、公にすることにより、法人の権利、競争上の地位その他正当な利益を害するおそれがあるものであっても、行政機関の長は、そのことを理由に当該情報を不開示とすることはできない。\nイ．行政文書の開示請求に対する不開示決定を受けた開示請求者は、行政不服審査法に基づく不服申立てを行わずに、当該不開示決定につき、適法に取消訴訟を提起することはできない。\nウ．行政文書の開示請求は、当該行政文書を保有する行政機関の長に対して書面を提出して行わなければならず、当該書面には開示請求の理由及び目的を記載する必要がある。\n１．ア○ イ○ ウ○\n２．ア○ イ○ ウ×\n３．ア○ イ× ウ○\n４．ア○ イ× ウ×\n５．ア× イ○ ウ○\n６．ア× イ○ ウ×\n７．ア× イ× ウ○\n８．ア× イ× ウ×", "source": "https://www.moj.go.jp/content/001399904.pdf", "answerSource": "https://www.moj.go.jp/content/001400882.pdf"}, {"id": "R5-gyosei-19", "year": "R5", "yearLabel": "令和5年", "subject": "行政法", "qno": 19, "haiten": 2, "type": "choice", "options": 8, "answer": [8], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第19問〕（配点：２）\n原告適格に関する次のアからウまでの各記述について、最高裁判所の判例に照らし、正しいものに○、誤っているものに×を付した場合の組合せを、後記１から８までの中から選びなさい。\nア．森林法に基づく林地開発許可について、同法の規定は、開発区域周辺の土地の所有権等の財産権を個々人の個別的利益として保護すべきものとする趣旨を含むから、開発区域周辺の土地を所有する者は、当該許可の取消しを求める原告適格を有する。\nイ．自転車競技法に基づく場外車券発売施設の設置許可については、同法の規定を受けて、学校その他の文教施設及び病院その他の医療施設（以下、これらを併せて「医療施設等」という。）から相当の距離を有し、文教上又は保健衛生上著しい支障を来すおそれがないことを許可の基準として定めた同法施行規則の規定が、医療施設等の開設者が健全で静穏な環境の下で円滑に業務を行うことのできる利益をその個別的利益として保護する趣旨をも含むと解することはできないから、医療施設等の開設者が、当該許可の取消しを求める原告適格を有することはない。\nウ．風俗営業等の規制及び業務の適正化等に関する法律に基づく風俗営業の許可については、同法の委任を受けて定められた政令が「住居が多数集合しており、住居以外の用途に供される土地が少ない地域」を条例で風俗営業の制限地域とすべき基準として定めており、住民が良好な風俗環境の中で生活する利益をその個別的利益として保護する趣旨を含むと解されるから、当該基準に従って規定された同法の施行条例が定める地域に居住する者は、当該許可の取消しを求める原告適格を有する。\n１．ア○ イ○ ウ○\n２．ア○ イ○ ウ×\n３．ア○ イ× ウ○\n４．ア○ イ× ウ×\n５．ア× イ○ ウ○\n６．ア× イ○ ウ×\n７．ア× イ× ウ○\n８．ア× イ× ウ×", "source": "https://www.moj.go.jp/content/001399904.pdf", "answerSource": "https://www.moj.go.jp/content/001400882.pdf"}, {"id": "R5-gyosei-20", "year": "R5", "yearLabel": "令和5年", "subject": "行政法", "qno": 20, "haiten": 3, "type": "series", "options": 2, "answer": [2, 1, 2, 1], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第20問〕（配点：３）\n抗告訴訟における判決に関する次のアからエまでの各記述について、法令又は最高裁判所の判例に照らし、それぞれ正しい場合には１を、誤っている場合には２を選びなさい。\nア．取消判決の第三者効を定めた行政事件訴訟法第３２条第１項は、差止めの訴えにも準用されるから、Ａが原告として提起したＢの申請に対する許可処分の差止めの訴えに係る請求を認容する判決が確定した場合、当該判決の効力は、Ｂにも及ぶ。\nイ．処分を取り消す判決が確定した場合、その拘束力により、当該処分をした行政庁は、その事件につき当該判決の主文が導き出されるのに必要な事実認定及び法律判断に従って行動すべき義務を負う。\nウ．処分の取消しの訴えについて、裁判所が、当該処分は違法ではあるが、これを取り消すことにより公の利益に著しい障害を生ずる場合において、原告の受ける損害の程度、その損害の賠償又は防止の程度及び方法その他一切の事情を考慮した上、当該処分を取り消すことが公共の福祉に適合しないと認め、請求を棄却する判決をし、当該判決が確定したときは、当該処分が違法であるとの当該判決における判断について既判力は生じない。\nエ．不作為の違法確認の訴えにおける当該不作為の違法性の判断は、事実審の口頭弁論終結時を基準にすべきである。", "source": "https://www.moj.go.jp/content/001399904.pdf", "answerSource": "https://www.moj.go.jp/content/001400882.pdf"}, {"id": "R5-gyosei-21", "year": "R5", "yearLabel": "令和5年", "subject": "行政法", "qno": 21, "haiten": 3, "type": "series", "options": 2, "answer": [2, 1, 2, 2], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第21問〕（配点：３）\n次のアからエまでの各記述について、法令又は最高裁判所の判例に照らし、それぞれ正しい場合には１を、誤っている場合には２を選びなさい。\nア．土地収用法に基づく権利取得裁決がされた場合に従前の土地所有者が起業者を被告として提起する、当該裁決の無効を前提とする土地所有権の確認を求める訴えは、行政事件訴訟法（以下「法」という。）第４条の当事者訴訟のうち、「当事者間の法律関係を確認し又は形成する処分又は裁決に関する訴訟で法令の規定によりその法律関係の当事者の一方を被告とするもの」である。\nイ．公立高等学校の教職員が提起する、校長の職務命令に基づく義務の不存在の確認を求める訴えは、当該職務命令の違反を理由とする行政処分以外の処遇上の不利益の予防を目的とする場合には、法第４条の当事者訴訟のうち、「公法上の法律関係に関する確認の訴えその他の公法上の法律関係に関する訴訟」である。\nウ．国外に居住していて国内の市町村の区域内に住所を有していない日本国民が提起する、衆議院小選挙区選出議員の選挙及び参議院選挙区選出議員の選挙において選挙権を行使する権利を有することの確認を求める訴えは、公職選挙法上の選挙訴訟であって、法第５条の民衆訴訟である。\nエ．地方公共団体の長が情報公開条例に基づいてした自衛隊庁舎の設計図面の公開決定に対して国が提起する、当該決定の取消しを求める訴えは、国が建物の所有者として有する固有の利益が侵害されることを理由とするものであっても、行政主体間の権限の行使に関する紛争に該当し、法第６条の機関訴訟である。", "source": "https://www.moj.go.jp/content/001399904.pdf", "answerSource": "https://www.moj.go.jp/content/001400882.pdf"}, {"id": "R5-gyosei-22", "year": "R5", "yearLabel": "令和5年", "subject": "行政法", "qno": 22, "haiten": 3, "type": "series", "options": 2, "answer": [2, 2, 1, 2], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第22問〕（配点：３）\n行政事件訴訟法上の仮の救済に関する教員と学生による以下の対話中の次のアからエまでの 【 】内の各記述について、それぞれ正しい場合には１を、誤っている場合には２を選びなさい。教員：Ａは、Ｂ市が設置した公の施設で集会を開催することを計画し、Ｂ市の条例に基づき、Ｂ 市長に対して、当該施設の使用許可処分を求める旨の申請をしたところ、Ｂ市長は、当該申請に対して使用不許可処分をしました。Ａとしては、予定する集会の日が近くなっていたため、一刻も早く当該施設を適法に使用できる状態にしたいのですが、司法上の救済の手段として考えられることは何かありますか。学生：（ア）【裁判所に対して、Ｂ市長による当該申請に対する使用不許可処分につき、Ｂ市を被告とする取消訴訟を提起し、当該取消訴訟を本案訴訟として、当該施設の使用許可処分に係る仮の義務付けを申し立て、裁判所による仮の義務付けを認める決定を受けるという方法があります。】 教員：Ａの当該施設の使用許可処分に係る仮の義務付けの申立てが認められるためには、損害や緊急性に関してどのような要件を満たす必要がありますか。学生：（イ）【当該施設の使用許可処分がされないことにより生ずる重大な損害を避けるため緊急の必要があるときという要件を満たす必要があります。】 教員：仮に、集会の予定日が目前に迫っているとしましょう。裁判所としては、特に緊急を要し、意見を聴くいとまがないと認められるときには、Ｂ市の意見を聴くことなく、仮の義務付けを認める決定をすることはできますか。学生：（ウ）【特に緊急を要するような事情があったとしても、裁判所が仮の義務付けを認める決定をするためには、Ｂ市の意見を聴かなければなりません。】 教員：それでは、裁判所により、当該施設の使用許可処分に係る仮の義務付けを認める決定がされた場合、その決定にはどのような効果がありますか。学生：（エ）【暫定的なものではありますが、当該施設の使用許可処分を受けたことになります。】", "source": "https://www.moj.go.jp/content/001399904.pdf", "answerSource": "https://www.moj.go.jp/content/001400882.pdf"}, {"id": "R5-gyosei-23", "year": "R5", "yearLabel": "令和5年", "subject": "行政法", "qno": 23, "haiten": 3, "type": "series", "options": 2, "answer": [1, 2, 2, 1], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第23問〕（配点：３）\n国家賠償法第１条に関する次のアからエまでの各記述について、最高裁判所の判例に照らし、それぞれ正しい場合には１を、誤っている場合には２を選びなさい。\nア．国民に憲法上保障されている権利行使の機会を確保するために所要の立法措置を執ることが必要不可欠であり、それが明白であるにもかかわらず、国会が正当な理由なく長期にわたってこれを怠る場合には、国会議員の立法不作為は、国家賠償法第１条第１項の適用上、違法の評価を受ける。\nイ．国の公権力の行使に当たる複数の公務員による一連の職務上の行為の過程において他人に被害を生じさせた場合であっても、それが具体的にどの公務員のどのような違法行為によるものであるかを特定することができないときは、国が、国家賠償法第１条第１項による損害賠償責任を負うことはない。\nウ．国の公権力の行使に当たる複数の公務員が、その職務を行うについて、共同して故意によって違法に他人に加えた損害につき、国がこれを賠償した場合においては、当該公務員らは、国に対し、当該違法行為に係る各公務員の責任割合に応じた分割債務として、国家賠償法第１条第２項による求償債務を負う。\nエ．税務署長が所得税の更正において所得金額を過大に認定した場合において、当該税務署長が職務上通常尽くすべき注意義務を尽くすことなく漫然と更正をしたと認め得るような事情があるときには、当該更正は、国家賠償法第１条第１項の適用上、違法の評価を受ける。", "source": "https://www.moj.go.jp/content/001399904.pdf", "answerSource": "https://www.moj.go.jp/content/001400882.pdf"}, {"id": "R5-gyosei-24", "year": "R5", "yearLabel": "令和5年", "subject": "行政法", "qno": 24, "haiten": 2, "type": "choice", "options": 8, "answer": [6], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第24問〕（配点：２）\n行政不服審査法（以下「法」という。）に関する次のアからウまでの各記述について、法又は最高裁判所の判例に照らし、正しいものに○、誤っているものに×を付した場合の組合せを、後記１から８までの中から選びなさい。\nア．審査請求の対象である処分には事実上の行為が含まれ、処分である事実上の行為が違法又は不当であり、当該処分である事実上の行為に対する審査請求に理由がある場合には、処分庁の上級行政庁である審査庁は、裁決で、当該処分である事実上の行為の全部若しくは一部を取り消し、又はこれを変更する。\nイ．法第７条第２項に規定する「固有の資格」とは、一般私人とは異なり、国の機関等であるからこそ立ち得る特有の立場をいい、その資格の有無は、処分に係る事務又は事業の実施主体が国の機関等に限られているか否か、また、限られていない場合であっても当該事務又は事業を実施し得る地位の取得について、国の機関等が一般私人に優先するなど特別に取り扱われているか否か等を考慮して判断すべきものである。\nウ．法は、処分に関する不服申立てについて、他の法律に特別の定めがある場合を除くほか、法の定めるところによると規定しているから、条例に基づく処分に対する不服申立てに関し、条例による特別の定めを設けることを認めていない。\n１．ア○ イ○ ウ○\n２．ア○ イ○ ウ×\n３．ア○ イ× ウ○\n４．ア○ イ× ウ×\n５．ア× イ○ ウ○\n６．ア× イ○ ウ×\n７．ア× イ× ウ○\n８．ア× イ× ウ×", "source": "https://www.moj.go.jp/content/001399904.pdf", "answerSource": "https://www.moj.go.jp/content/001400882.pdf"}, {"id": "R5-minpo-1", "year": "R5", "yearLabel": "令和5年", "subject": "民法", "qno": 1, "haiten": 2, "type": "choice", "options": 5, "answer": [2], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第１問〕（配点：２）\n意思能力に関する次のアからオまでの各記述のうち、誤っているものを組み合わせたものは、後記１から５までのうちどれか。\nア．意思能力とは、自己の行為の責任を弁識する能力をいう。\nイ．契約の当事者がその意思表示をした時に意思能力を有しなかったときは、その契約の無効を善意無過失の第三者にも対抗することができる。\nウ．契約の当事者がその意思表示をした時に意思能力を有しなかった場合において、その契約に基づく債務の履行として給付を受けたときは、現に利益を受けている限度において、返還の義務を負う。\nエ．契約の申込者が申込みの通知を発した後に意思能力を有しない常況にある者となった場合において、その相手方が承諾の通知を発するまでにその事実が生じたことを知ったときは、その申込みは、その効力を有しない。\nオ．婚姻の当事者が婚姻届を作成した時に意思能力を有しないことは、婚姻の取消しの原因となる。\n１．アイ\n２．アオ\n３．イウ\n４．ウエ\n５．エオ", "source": "https://www.moj.go.jp/content/001399905.pdf", "answerSource": "https://www.moj.go.jp/content/001400886.pdf"}, {"id": "R5-minpo-2", "year": "R5", "yearLabel": "令和5年", "subject": "民法", "qno": 2, "haiten": 2, "type": "choice", "options": 5, "answer": [1], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第２問〕（配点：２）\n条件に関する次のアからオまでの各記述のうち、正しいものを組み合わせたものは、後記１から ５までのうちどれか。\nア．ＡがＢとの間で、Ｂが一定期間窃盗をしなかったら１０万円をＢに与える旨の贈与契約を締結した場合において、その期間窃盗をしなかったＢがＡに１０万円の支払を請求したときは、 Ａは、これを拒むことができる。\nイ．停止条件付きの動産の贈与契約が締結された場合において、贈与者が信義則に反し故意にその条件の成就を妨げたときは、受贈者は、動産の引渡しを請求することができる。\nウ．互いに同種の目的を有する債務を負担している者の間で、一定の事由が発生したら意思表示を待たずに当然に相殺の効力が生ずる旨の合意をしたとしても、相殺の効力は、その事由の発生によって当然には生じない。\nエ．ＡがＢとの間で、Ｂが甲大学に合格したらＡの所有する動産乙をＢに与える旨の贈与契約を締結した後、合否未定の間にＡが乙を過失により損傷した場合には、Ｂが甲大学に合格しても、 Ａは、Ｂに対し、損害賠償義務を負わない。\nオ．ＡがＢとの間で、Ａの気が向いたらＢに１０万円を与える旨の贈与契約を締結した場合において、ＢがＡに１０万円の支払を請求したときは、Ａは、これを拒むことができない。\n１．アイ\n２．アウ\n３．イオ\n４．ウエ\n５．エオ", "source": "https://www.moj.go.jp/content/001399905.pdf", "answerSource": "https://www.moj.go.jp/content/001400886.pdf"}, {"id": "R5-minpo-3", "year": "R5", "yearLabel": "令和5年", "subject": "民法", "qno": 3, "haiten": 2, "type": "choice", "options": 5, "answer": [4], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第３問〕（配点：２）\n不動産を目的とする権利変動の対抗に関する次のアからオまでの各記述のうち、判例の趣旨に照らし正しいものを組み合わせたものは、後記１から５までのうちどれか。\nア．竹木所有のための地上権を時効取得した者は、登記をしなくても、その後にその地上権の目的土地を購入しその旨の登記をした者に地上権の取得を対抗することができる。\nイ．承役地について地役権設定登記がされている場合において、要役地が譲渡されたときは、譲受人は、要役地の所有権移転登記があれば、第三者に地役権の移転を対抗することができる。\nウ．一般先取特権は、不動産についてその登記がされていなくても、当該不動産上に存する登記がされた抵当権に優先する。\nエ．引渡しにより対抗要件を具備した建物の賃貸借につき、その引渡し前に登記をした抵当権を有する全ての者が同意をしたときは、賃借人は、抵当権の実行により当該建物を買い受けた者に賃借権の設定を対抗することができる。\nオ．永小作権を目的として抵当権を設定した永小作人は、その永小作権を放棄したとしても、その放棄をもって抵当権者に対抗することができない。\n１．アウ\n２．アエ\n３．イウ\n４．イオ\n５．エオ", "source": "https://www.moj.go.jp/content/001399905.pdf", "answerSource": "https://www.moj.go.jp/content/001400886.pdf"}, {"id": "R5-minpo-4", "year": "R5", "yearLabel": "令和5年", "subject": "民法", "qno": 4, "haiten": 2, "type": "choice", "options": 5, "answer": [4], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第４問〕（配点：２）\n相隣関係に関する次のアからオまでの各記述のうち、正しいものを組み合わせたものは、後記１から５までのうちどれか。\nア．土地の所有者が、その所有地の水を通過させるため、高地又は低地の所有者が設けた工作物を使用するには、その所有者の同意を得なければならない。\nイ．土地の所有者は、雨水が隣地に直接注ぐ構造の工作物を設けてはならない。\nウ．土地の所有者は、隣地の竹木の根が境界線を越えるときは、その竹木の所有者の同意を得なければ、その根を切り取ることができない。\nエ．境界標の設置の費用は、相隣者が土地の広狭に応じて分担する。\nオ．土地の所有者がその境界付近に存する建物を修繕するため必要な範囲内で隣地を使用する場合、隣地の所有者は、それにより損害を受けたときは、その償金を請求することができる。\n１．アエ\n２．アオ\n３．イウ\n４．イオ\n５．ウエ", "source": "https://www.moj.go.jp/content/001399905.pdf", "answerSource": "https://www.moj.go.jp/content/001400886.pdf"}, {"id": "R5-minpo-5", "year": "R5", "yearLabel": "令和5年", "subject": "民法", "qno": 5, "haiten": 2, "type": "choice", "options": 5, "answer": [4], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第５問〕（配点：２）\n用益物権に関する次のアからオまでの各記述のうち、判例の趣旨に照らし誤っているものを組み合わせたものは、後記１から５までのうちどれか。\nア．地上権設定契約において地上権の譲渡を禁止する旨が合意された場合であっても、地上権の譲渡は、その効力を妨げられない。\nイ．法定地上権を取得した者は、その地上権の目的である土地の所有者に対して地代を支払うことを要しない。\nウ．無償の永小作権は、設定することができない。\nエ．地役権は、存続期間を定めないで設定することができる。\nオ．入会権の行使を妨害する者に対する妨害排除請求権の行使は、別段の慣習がない限り、入会団体の構成員の全員でしなければならない。\n１．アウ\n２．アエ\n３．イウ\n４．イオ\n５．エオ", "source": "https://www.moj.go.jp/content/001399905.pdf", "answerSource": "https://www.moj.go.jp/content/001400886.pdf"}, {"id": "R5-minpo-6", "year": "R5", "yearLabel": "令和5年", "subject": "民法", "qno": 6, "haiten": 2, "type": "choice", "options": 5, "answer": [5], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第６問〕（配点：２）\n根抵当権に関する次のアからオまでの各記述のうち、誤っているものを組み合わせたものは、後記１から５までのうちどれか。\nア．元本確定期日を定めなかった場合でも、根抵当権の設定は有効である。\nイ．元本の確定前においては、根抵当権者は、根抵当権設定者の承諾を得て、根抵当権を譲渡することができる。\nウ．元本の確定前に根抵当権者から被担保債権を取得した者は、その債権について根抵当権を行使することができない。\nエ．元本の確定前にする根抵当権の被担保債権の範囲の変更は、後順位抵当権者の承諾を得なければ、することができない。\nオ．元本が確定した後は、根抵当権によって担保される利息や損害金は、通算して最後の２年分に限定される。\n１．アウ\n２．アエ\n３．イウ\n４．イオ\n５．エオ", "source": "https://www.moj.go.jp/content/001399905.pdf", "answerSource": "https://www.moj.go.jp/content/001400886.pdf"}, {"id": "R5-minpo-7", "year": "R5", "yearLabel": "令和5年", "subject": "民法", "qno": 7, "haiten": 2, "type": "choice", "options": 5, "answer": [4], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第７問〕（配点：２）\n不動産の譲渡担保に関する次のアからオまでの各記述のうち、判例の趣旨に照らし正しいものを組み合わせたものは、後記１から５までのうちどれか。\nア．設定者は、被担保債権について不履行があった後は、譲渡担保権者に対し、受戻権を放棄することにより、清算金の支払を請求することができる。\nイ．被担保債権について不履行があった後、譲渡担保権者の債権者が目的物を差し押さえ、その旨の登記がされたときは、設定者は、その後に被担保債権を弁済しても、第三者異議の訴えにより強制執行の不許を求めることができない。\nウ．設定者は、被担保債権が弁済されない限り、正当な権原なく目的物を占有する者に対し、その明渡しを請求することができない。\nエ．被担保債権について不履行があった後、譲渡担保権者が譲渡担保権の実行として目的物を譲渡したときは、設定者は、譲受人からの明渡請求に対し、譲渡担保権者に対する清算金支払請求権を被担保債権とする留置権を主張することができない。\nオ．譲渡担保権者は、被担保債権について不履行があったときは、設定者との間で帰属清算の合意がされていたとしても、目的物を処分する権限を取得する。\n１．アエ\n２．アオ\n３．イウ\n４．イオ\n５．ウエ", "source": "https://www.moj.go.jp/content/001399905.pdf", "answerSource": "https://www.moj.go.jp/content/001400886.pdf"}, {"id": "R5-minpo-8", "year": "R5", "yearLabel": "令和5年", "subject": "民法", "qno": 8, "haiten": 2, "type": "choice", "options": 5, "answer": [2], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第８問〕（配点：２）\n履行遅滞に関する次のアからオまでの各記述のうち、判例の趣旨に照らし誤っているものを組み合わせたものは、後記１から５までのうちどれか。\nア．取立債務の履行について確定期限がある場合には、債権者が取立行為をしないときであっても、債務者は、その期限の到来した時から遅滞の責任を負う。\nイ．債務の履行について不確定期限があるときは、債務者は、その期限の到来後に履行の請求を受けた時又はその期限の到来を知った時のいずれか早い時から遅滞の責任を負う。\nウ．返還時期の定めがない消費貸借において、貸主が相当の期間を定めないで催告をしたときは、借主は、その催告後相当の期間を経過した時から遅滞の責任を負う。\nエ．債権者が受益者に対する詐害行為取消請求に係る訴えにおいて受領金の返還を請求したときは、その受領金の返還債務は、その請求を認容する判決の確定時に遅滞に陥る。\nオ．不法行為に基づく損害賠償債務は、催告を要することなく、損害の発生と同時に遅滞に陥る。\n１．アウ\n２．アエ\n３．イウ\n４．イオ\n５．エオ", "source": "https://www.moj.go.jp/content/001399905.pdf", "answerSource": "https://www.moj.go.jp/content/001400886.pdf"}, {"id": "R5-minpo-9", "year": "R5", "yearLabel": "令和5年", "subject": "民法", "qno": 9, "haiten": 2, "type": "choice", "options": 5, "answer": [4], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第９問〕（配点：２）\nＡのＢに対する金銭債権（以下「甲債権」という。）とＢのＡに対する金銭債権（以下「乙債権」という。）との相殺に関する次のアからオまでの各記述のうち、判例の趣旨に照らし誤っているものを組み合わせたものは、後記１から５までのうちどれか。\nア．甲債権が売買代金債権であり、乙債権がＢの所有するパソコンをＡが過失によって損傷したことによる不法行為に基づく損害賠償債権であったときは、Ａは、相殺をもってＢに対抗することができる。\nイ．ＡがＢのＣに対する債務をＢの委託を受けて保証していた場合において、Ｂの債権者Ｄが売買代金債権である乙債権を差し押さえた後、ＡがＣに対する保証債務を履行し、求償権である甲債権を取得したときは、Ａは、相殺をもってＤに対抗することができる。\nウ．甲債権がＡＢ間のパソコンの売買に基づく売買代金債権であったときは、Ａは、Ｂに対してパソコンの引渡しの提供をしていなくても、乙債権との相殺をもってＢに対抗することができる。\nエ．甲債権と乙債権とが相殺適状となった後に甲債権が時効によって消滅した場合において、その後、ＢがＡに対して乙債権の履行を請求したときは、Ａは、相殺をもってＢに対抗することができる。\nオ．甲債権について弁済期が到来していなくても、乙債権について弁済期が到来していれば、Ａ は、相殺をもってＢに対抗することができる。\n１．アイ\n２．アウ\n３．イエ\n４．ウオ\n５．エオ", "source": "https://www.moj.go.jp/content/001399905.pdf", "answerSource": "https://www.moj.go.jp/content/001400886.pdf"}, {"id": "R5-minpo-10", "year": "R5", "yearLabel": "令和5年", "subject": "民法", "qno": 10, "haiten": 2, "type": "choice", "options": 5, "answer": [3], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第10問〕（配点：２）\n契約の解除に関する次のアからオまでの各記述のうち、判例の趣旨に照らし誤っているものを組み合わせたものは、後記１から５までのうちどれか。\nア．債務者が債務の履行をせず、債権者が期間を定めないでその履行の催告をした場合において、その催告の時から相当の期間を経過しても債務が履行されないときは、債権者は、契約を解除することができる。\nイ．債務者が債務の履行をしない場合において、その不履行が債務者の責めに帰することができない事由によるものであるときは、債権者は、契約を解除することができない。\nウ．債務者が債務の履行をせず、債権者が催告をしても契約をした目的を達するのに足りる履行がされる見込みがないことが明らかなときは、債権者は、催告をせずに直ちに契約を解除することができる。\nエ．ＡＢ間で締結された契約に基づき発生したＡのＢに対する債権甲をＡがＣに譲渡し、債務者対抗要件が具備された場合において、その後、ＢがＡの債務不履行により当該契約を解除したときは、Ｃは、Ｂに対し、甲の履行を請求することができる。\nオ．賃借人が死亡し、複数の相続人が賃借権を共同相続した場合、賃貸人が賃貸借契約を解除するには、その相続人全員に対して解除の意思表示をしなければならない。\n１．アイ\n２．アウ\n３．イエ\n４．ウオ\n５．エオ", "source": "https://www.moj.go.jp/content/001399905.pdf", "answerSource": "https://www.moj.go.jp/content/001400886.pdf"}, {"id": "R5-minpo-11", "year": "R5", "yearLabel": "令和5年", "subject": "民法", "qno": 11, "haiten": 2, "type": "choice", "options": 5, "answer": [3], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第11問〕（配点：２）\n売買契約に基づき買主Ａが売主Ｂから引渡しを受けた動産甲の品質が契約の内容に適合しないものである場合に関する次のアからオまでの各記述のうち、誤っているものを組み合わせたものは、後記１から５までのうちどれか。\nア．Ｂは、Ａから甲の修補の請求を受けた場合であっても、Ａに不相当な負担を課するものでないときは、代替物の引渡しによる履行の追完をすることができる。\nイ．不適合が追完不能であるためにＡのＢに対する履行の追完の請求が認められないときは、Ａ は、Ｂに対し、代金の減額を請求することができない。\nウ．不適合がＡの責めに帰すべき事由によるものであるときは、Ａは、Ｂに対し、甲の修補と代金の減額のいずれの請求もすることができない。\nエ．不適合がＡＢ双方の責めに帰することができない事由によるものであるときは、Ａは、Ｂに対し、代金の減額を請求することができない。\nオ．Ｂが引渡し時に不適合を過失なく知らなかった場合において、Ａが不適合を知った時から法定の期間内にその旨をＢに通知しなかったときは、Ａは、Ｂに対し、損害賠償を請求することができない。\n１．アウ\n２．アエ\n３．イエ\n４．イオ\n５．ウオ", "source": "https://www.moj.go.jp/content/001399905.pdf", "answerSource": "https://www.moj.go.jp/content/001400886.pdf"}, {"id": "R5-minpo-12", "year": "R5", "yearLabel": "令和5年", "subject": "民法", "qno": 12, "haiten": 2, "type": "choice", "options": 5, "answer": [4], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第12問〕（配点：２）\n民法上の組合に関する次のアからオまでの各記述のうち、判例の趣旨に照らし誤っているものを組み合わせたものは、後記１から５までのうちどれか。\nア．組合契約の出資は、金銭をその目的とするものに限られない。\nイ．組合員は、組合の債権者に対し、各自の固有財産をもって債務の全部を履行する責任を負う。\nウ．各組合員は、組合の業務の決定及び執行をする権利を有しないときであっても、その業務及び組合財産の状況を検査することができる。\nエ．組合の業務執行者は、組合員の中から選ばなければならない。\nオ．組合契約において、やむを得ない事由があっても任意の脱退を許さない旨の約定がされた場合、その約定は無効である。\n１．アウ\n２．アオ\n３．イウ\n４．イエ\n５．エオ", "source": "https://www.moj.go.jp/content/001399905.pdf", "answerSource": "https://www.moj.go.jp/content/001400886.pdf"}, {"id": "R5-minpo-13", "year": "R5", "yearLabel": "令和5年", "subject": "民法", "qno": 13, "haiten": 2, "type": "choice", "options": 5, "answer": [5], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第13問〕（配点：２）\n不法行為に関する次のアからオまでの各記述のうち、判例の趣旨に照らし正しいものを組み合わせたものは、後記１から５までのうちどれか。\nア．不法行為の被害者は、不法行為に起因する後遺障害による逸失利益について、定期金による賠償を求めることができない。\nイ．被用者が使用者の事業の執行について重大な過失により失火して第三者に損害を加えた場合には、使用者は、被用者の選任監督について重大な過失があるときに限り、損害賠償の責任を負う。\nウ．被用者が、使用者の事業の執行について第三者に損害を加えた場合において、その損害を賠償したときは、被用者は、使用者に対して求償権を行使することができない。\nエ．土地の工作物の設置又は保存に瑕疵があることによって他人に損害を生じた場合において、その工作物の占有者が損害の発生を防止するのに必要な注意をしたときは、その工作物の所有者が損害賠償の責任を負う。\nオ．損害賠償の額を定めるに当たり、被害を受けた未成年者の過失を考慮するためには、その未成年者に事理を弁識するに足りる知能が備わっていれば足りる。\n１．アウ\n２．アエ\n３．イウ\n４．イオ\n５．エオ", "source": "https://www.moj.go.jp/content/001399905.pdf", "answerSource": "https://www.moj.go.jp/content/001400886.pdf"}, {"id": "R5-minpo-14", "year": "R5", "yearLabel": "令和5年", "subject": "民法", "qno": 14, "haiten": 2, "type": "choice", "options": 5, "answer": [5], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第14問〕（配点：２）\n離婚に伴う財産分与に関する次のアからオまでの各記述のうち、判例の趣旨に照らし誤っているものを組み合わせたものは、後記１から５までのうちどれか。\nア．裁判所は、離婚をした者の一方が過当に負担した婚姻費用の清算のための給付を含めて、財産分与の額及び方法を定めることができる。\nイ．離婚に伴う財産分与請求権の具体的内容が協議によって形成された後は、これを被保全債権とする債権者代位権の行使が認められる。\nウ．内縁の妻Ａの死亡により内縁の夫Ｂとの内縁関係が解消した場合には、Ｂは、離婚に伴う財産分与の規定の類推適用により、Ａの相続人に対して財産分与を請求することができる。\nエ．協議上の離婚をした者の一方は、相手方が離婚につき有責でない場合であっても、財産分与を請求することができる。\nオ．離婚した当事者の協議により合意された財産分与は、不相当に過大であっても、詐害行為として取り消されることはない。\n１．アイ\n２．アエ\n３．イオ\n４．ウエ\n５．ウオ", "source": "https://www.moj.go.jp/content/001399905.pdf", "answerSource": "https://www.moj.go.jp/content/001400886.pdf"}, {"id": "R5-minpo-15", "year": "R5", "yearLabel": "令和5年", "subject": "民法", "qno": 15, "haiten": 2, "type": "choice", "options": 5, "answer": [4], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第15問〕（配点：２）\n相続の承認及び放棄に関する次のアからオまでの各記述のうち、誤っているものを組み合わせたものは、後記１から５までのうちどれか。\nア．他の共同相続人に強迫されて相続の放棄をした者が相続の放棄の取消しをしようとするときは、その旨を家庭裁判所に申述しなければならない。\nイ．相続人は、相続の承認又は放棄をするまでの間、その固有財産におけるのと同一の注意をもって、相続財産を管理しなければならない。\nウ．相続の放棄をした者は、その放棄の時に相続財産に属する財産を現に占有しているときは、善良な管理者の注意をもって、その財産を管理しなければならない。\nエ．相続人Ａが相続の放棄をしたことにより相続人となったＢが相続の承認をした場合には、Ａ は、その後に相続財産の一部を私に消費したとしても、単純承認をしたものとはみなされない。\nオ．限定承認者は、受遺者に弁済した後でなければ、相続債権者に弁済することができない。\n１．アイ\n２．アウ\n３．イエ\n４．ウオ\n５．エオ ［商法］", "source": "https://www.moj.go.jp/content/001399905.pdf", "answerSource": "https://www.moj.go.jp/content/001400886.pdf"}, {"id": "R5-shoho-16", "year": "R5", "yearLabel": "令和5年", "subject": "商法", "qno": 16, "haiten": 2, "type": "choice", "options": 5, "answer": [5], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第16問〕（配点：２）\n株式会社の発起設立に関する次のアからオまでの各記述のうち、正しいものを組み合わせたものは、後記１から５までのうちどれか。\nア．定款の作成時に発起人が２人以上いなければ、株式会社を設立することはできない。\nイ．発起人は、成立後の株式会社の資本金及び資本準備金の額を定款に記載又は記録しなければならない。\nウ．Ａ株式会社を設立するに当たり、Ｂ株式会社は、その発起人となることができる。\nエ．設立時発行株式の引受人から、その株主となる権利を譲り受けた者がいる場合には、成立後の株式会社は、当該譲受人を株主として取り扱うことはできない。\nオ．発起人Ｃが、割当てを受ける設立時発行株式について、金銭ではなく暗号資産を出資する場合には、Ｃの氏名、当該暗号資産及びその価額並びにＣに対して割り当てる設立時発行株式の数を定款に記載又は記録する必要がある。\n１．アイ\n２．アオ\n３．イエ\n４．ウエ\n５．ウオ", "source": "https://www.moj.go.jp/content/001399905.pdf", "answerSource": "https://www.moj.go.jp/content/001400886.pdf"}, {"id": "R5-shoho-17", "year": "R5", "yearLabel": "令和5年", "subject": "商法", "qno": 17, "haiten": 2, "type": "choice", "options": 5, "answer": [1], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第17問〕（配点：２）\n株主名簿に関する次のアからオまでの各記述のうち、誤っているものを組み合わせたものは、後記１から５までのうちどれか。\nア．株式会社は、株主名簿に株主が株式を取得した日を記載又は記録することを要しない。\nイ．株式会社は、株主名簿管理人を置く旨を定款で定め、株主名簿の作成及び備置きその他の株主名簿に関する事務を行うことを委託することができる。\nウ．株式会社は、株主から株主名簿の閲覧の請求があった場合において、当該請求を行う株主が当該株式会社の業務と実質的に競争関係にある事業を営み、又はこれに従事する者であるときは、当該請求を拒むことができる。\nエ．株主が別に通知を受ける場所又は連絡先を株式会社に通知していないときは、当該株式会社が当該株主に対してする通知は、株主名簿に記載又は記録された当該株主の住所に宛てて発すれば足りる。\nオ．株式会社は、一定の日を定めて、当該日において株主名簿に記載又は記録されている株主をその権利を行使することができる者と定めることができる。\n１．アウ\n２．アエ\n３．イウ\n４．イオ\n５．エオ", "source": "https://www.moj.go.jp/content/001399905.pdf", "answerSource": "https://www.moj.go.jp/content/001400886.pdf"}, {"id": "R5-shoho-18", "year": "R5", "yearLabel": "令和5年", "subject": "商法", "qno": 18, "haiten": 2, "type": "choice", "options": 5, "answer": [3], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第18問〕（配点：２）\n自己株式に関する次のアからオまでの各記述のうち、正しいものを組み合わせたものは、後記 １から５までのうちどれか。\nア．株式会社は、自己株式を相当の時期に処分しなければならない。\nイ．株式会社は、自己株式について、株主総会における議決権、剰余金の配当を受ける権利及び募集株式の割当てを受ける権利のいずれも有しない。\nウ．株式会社が行う事業の全部の譲渡に反対する株主が株式買取請求を行ったことにより、当該株式会社が当該株主の保有する株式を買い取る場合において、当該株式会社から当該買取りに際して当該株主に交付される金銭の額は、当該買取りの日における分配可能額を超えてはならない。\nエ．株券発行会社が自己株式の処分により行う株式の譲渡は、当該株式に係る株券を交付しなくても、その効力を生ずる。\nオ．株式会社が自己株式を消却した場合には、発行可能株式総数についての定款の変更をしなくても、消却された自己株式の数だけ発行可能株式総数が減少する。\n１．アイ\n２．アオ\n３．イエ\n４．ウエ\n５．ウオ", "source": "https://www.moj.go.jp/content/001399905.pdf", "answerSource": "https://www.moj.go.jp/content/001400886.pdf"}, {"id": "R5-shoho-19", "year": "R5", "yearLabel": "令和5年", "subject": "商法", "qno": 19, "haiten": 2, "type": "choice", "options": 5, "answer": [2], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第19問〕（配点：２）\n株主総会に関する次のアからオまでの各記述のうち、正しいものを組み合わせたものは、後記 １から５までのうちどれか。\nア．判例の趣旨によれば、会社法上の公開会社でない取締役会設置会社は、取締役会の決議によるほか株主総会の決議によっても代表取締役を選定することができる旨を定款で定めることができる。\nイ．株式会社は、株主総会の場所に存しない株主を、映像と音声の送受信により相手の状態を相互に認識しながら通話をすることができる方法によって、当該株主総会に出席させることはできない。\nウ．判例の趣旨によれば、定款に株主総会で議決権を行使する代理人を株主に限定する旨の定めがある場合には、法人である株主は、その従業員であって株主でない者に株主総会における議決権を代理行使させることができない。\nエ．株式会社は、取締役を選任する株主総会の決議について、定足数をなくし、出席した株主の議決権の過半数をもって行うこととする旨を定款で定めることができる。\nオ．監査役会設置会社は、取締役の選任について、株主からの請求があるときであっても累積投票によらない旨を定款で定めることができる。\n１．アウ\n２．アオ\n３．イウ\n４．イエ\n５．エオ", "source": "https://www.moj.go.jp/content/001399905.pdf", "answerSource": "https://www.moj.go.jp/content/001400886.pdf"}, {"id": "R5-shoho-20", "year": "R5", "yearLabel": "令和5年", "subject": "商法", "qno": 20, "haiten": 2, "type": "choice", "options": 5, "answer": [3], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第20問〕（配点：２）\n取締役会設置会社における株主提案権に関する次のアからオまでの各記述のうち、正しいものを組み合わせたものは、後記１から５までのうちどれか。\nア．議案Ａと実質的に同一の議案Ｂが２年前の株主総会において総株主（議案Ｂについて議決権を行使することができない株主を除く。）の議決権の５分の１の賛成を得られたにとどまるときは、株主は、株主総会において、議案Ａを提出することができない。\nイ．監査役会設置会社の株主が提出しようとする議案の要領を株主に通知することを請求する場合には、当該請求との関係では、監査等委員会を設置する旨の定款変更の議案と監査役及び監査役会を廃止する旨の定款変更の議案は、１つの議案とみなされる。\nウ．会社法上の公開会社においては、総株主の議決権の１００分の１以上の議決権又は３００個以上の議決権を６か月前から引き続き有する株主に限り、株主総会において、株主総会の目的である事項につき議案を提出することができる。\nエ．株主が提出しようとする複数の取締役の選任に関する議案の要領を株主に通知することを請求する場合には、当該請求との関係では、当該議案は、候補者の数にかかわらず１つの議案とみなされる。\nオ．１０を超える数の議案の要領を株主に通知することを請求した株主が当該請求と併せて当該議案相互間の優先順位を定めている場合であっても、取締役は、その裁量により、当該通知の対象から除外する議案を定めることができる。\n１．アイ\n２．アオ\n３．イエ\n４．ウエ\n５．ウオ", "source": "https://www.moj.go.jp/content/001399905.pdf", "answerSource": "https://www.moj.go.jp/content/001400886.pdf"}, {"id": "R5-shoho-21", "year": "R5", "yearLabel": "令和5年", "subject": "商法", "qno": 21, "haiten": 2, "type": "choice", "options": 5, "answer": [4], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第21問〕（配点：２）\n取締役会設置会社（指名委員会等設置会社を除く。）における代表取締役でない取締役に関する次の１から５までの各記述のうち、正しいものはどれか。\n１．業務執行取締役は、取締役会から委任された業務の執行の決定を使用人に再委任することはできない。\n２．社外取締役でない取締役は、当然に業務執行取締役となり、一定の業務執行権限を有する。\n３．判例の趣旨によれば、業務執行取締役は、代表取締役及び他の業務執行取締役を監視する義務を負わない。\n４．取締役がある業務を執行することにつき取締役会設置会社と当該取締役との利益が相反する状況にあるときは、取締役会の決議によって当該業務の執行を委託された社外取締役が当該業務を執行しても、当該業務の執行が業務執行取締役の指揮命令によるものでなければ、当該社外取締役は、社外取締役の要件を欠くことにはならない。\n５．判例の趣旨によれば、使用人として受ける給与の体系が明確に確立されている場合であっても、使用人兼務取締役について、別に使用人として給与を受けることを予定しつつ、取締役として給与を受ける報酬額のみを株主総会で決議することはできない。", "source": "https://www.moj.go.jp/content/001399905.pdf", "answerSource": "https://www.moj.go.jp/content/001400886.pdf"}, {"id": "R5-shoho-22", "year": "R5", "yearLabel": "令和5年", "subject": "商法", "qno": 22, "haiten": 2, "type": "choice", "options": 5, "answer": [2], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第22問〕（配点：２）\n指名委員会等設置会社に関する次のアからオまでの各記述のうち、正しいものを組み合わせたものは、後記１から５までのうちどれか。\nア．会社法上の公開会社である指名委員会等設置会社の取締役会は、取締役会の決議によって定めることができる事項のうち、募集株式の発行、多額の借財並びに支配人その他の重要な使用人の選任及び解任の各決定を、その決議によって執行役に委任することができる。\nイ．指名委員会等設置会社の取締役は、当該指名委員会等設置会社の執行役又は支配人その他の使用人を兼ねることができない。\nウ．指名委員会等設置会社の指名委員会は、会社法上、執行役の選任及び解任を決定する権限を有する。\nエ．指名委員会等設置会社における取締役の個人別の報酬の内容については、報酬委員会が決定し、株主総会の決議によって定めることを要しない。\nオ．会社法上の公開会社ではなく、かつ、大会社でもない指名委員会等設置会社は、会計監査人を置くことを要しない。\n１．アイ\n２．アエ\n３．イウ\n４．ウオ\n５．エオ", "source": "https://www.moj.go.jp/content/001399905.pdf", "answerSource": "https://www.moj.go.jp/content/001400886.pdf"}, {"id": "R5-shoho-23", "year": "R5", "yearLabel": "令和5年", "subject": "商法", "qno": 23, "haiten": 2, "type": "choice", "options": 5, "answer": [1], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第23問〕（配点：２）\n社債に関する次のアからオまでの各記述のうち、正しいものを組み合わせたものは、後記１から５までのうちどれか。なお、社債、株式等の振替に関する法律の適用がある場合は、考慮しないものとする。\nア．持分会社は、社債を発行することができる。\nイ．無記名社債については、社債券を発行しなければならない。\nウ．新株予約権付社債については、新株予約権又は社債の一方を他方から分離して譲渡することができる。\nエ．監査等委員会設置会社の取締役の過半数が社外取締役である場合であっても、当該監査等委員会設置会社の取締役会は、その決議によって、募集社債の募集事項の決定を取締役に委任することができない。\nオ．募集社債の申込者のうち、募集社債の割当てを受けた者は、募集社債と引換えにする金銭の払込みの期日に、各募集社債の払込金額を払い込むことにより、払込みをした募集社債の社債権者となる。\n１．アイ\n２．アエ\n３．イウ\n４．ウオ\n５．エオ", "source": "https://www.moj.go.jp/content/001399905.pdf", "answerSource": "https://www.moj.go.jp/content/001400886.pdf"}, {"id": "R5-shoho-24", "year": "R5", "yearLabel": "令和5年", "subject": "商法", "qno": 24, "haiten": 2, "type": "choice", "options": 5, "answer": [4], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第24問〕（配点：２）\n株式交換及び株式移転に関する次のアからオまでの各記述のうち、正しいものを組み合わせたものは、後記１から５までのうちどれか。\nア．株式交換及び株式移転のいずれも、一の株式会社が当該株式会社の株式を取得する会社との間でその旨の契約を締結しなければ、することができない。\nイ．株式交換完全親会社及び株式移転設立完全親会社のいずれも、株式会社であることを要する。\nウ．株式移転設立完全親会社が株式移転完全子会社の発行済株式の一部のみを取得することとなる株式移転を行うことはできない。\nエ．株式交換をする場合、株式交換完全親会社は、株式交換完全子会社の株主に対し、株式交換完全親会社の株式を交付しないこととすることができるが、株式移転をする場合、株式移転設立完全親会社は、株式移転完全子会社の株主に対し、株式移転設立完全親会社の株式を交付しなければならない。\nオ．株式交換完全子会社の新株予約権付社債についての社債権者は、株式交換に際して株式交換完全親会社の新株予約権の交付を受ける場合には、当該株式交換について異議を述べることはできない。\n１．アイ\n２．アオ\n３．イエ\n４．ウエ\n５．ウオ", "source": "https://www.moj.go.jp/content/001399905.pdf", "answerSource": "https://www.moj.go.jp/content/001400886.pdf"}, {"id": "R5-shoho-25", "year": "R5", "yearLabel": "令和5年", "subject": "商法", "qno": 25, "haiten": 2, "type": "choice", "options": 5, "answer": [5], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第25問〕（配点：２）\n株式会社についての訴訟に関する次の１から５までの各記述のうち、正しいものはどれか。\n１．株主総会決議取消しの訴えは、当該株主総会決議の日から１年以内に提起することができる。\n２．株主総会決議不存在確認の訴えは、当該決議の存在を主張している株主を被告として提起することができる。\n３．株主総会決議無効確認の訴えは、被告となる株式会社の支店の所在地を管轄する地方裁判所にも提起することができる。\n４．株主代表訴訟は、会社法第４２３条第１項に基づく株式会社の役員等に対する損害賠償請求権を訴訟物とするものでなければならない。\n５．会社法上の公開会社である監査役設置会社が取締役であった者に対して貸金返還請求の訴えを提起する場合には、監査役が当該監査役設置会社を代表する。（参照条文）会社法（役員等の株式会社に対する損害賠償責任）第４２３条取締役、会計参与、監査役、執行役又は会計監査人（以下この章において「役員等」という。）は、その任務を怠ったときは、株式会社に対し、これによって生じた損害を賠償する責任を負う。 ２～４（略）", "source": "https://www.moj.go.jp/content/001399905.pdf", "answerSource": "https://www.moj.go.jp/content/001400886.pdf"}, {"id": "R5-shoho-26", "year": "R5", "yearLabel": "令和5年", "subject": "商法", "qno": 26, "haiten": 2, "type": "choice", "options": 5, "answer": [3], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第26問〕（配点：２）\n株式会社に関する次のアからオまでの各事項のうち、登記することを要しないものを組み合わせたものは、後記１から５までのうちどれか。\nア．発行可能株式総数\nイ．取締役の個人別の報酬等の内容についての決定に関する方針\nウ．代表取締役（指名委員会設置会社であるときは代表執行役）の氏名及び住所\nエ．会計監査人設置会社の会計監査人の氏名又は名称\nオ．親会社の名称\n１．アイ\n２．アエ\n３．イオ\n４．ウエ\n５．ウオ", "source": "https://www.moj.go.jp/content/001399905.pdf", "answerSource": "https://www.moj.go.jp/content/001400886.pdf"}, {"id": "R5-shoho-27", "year": "R5", "yearLabel": "令和5年", "subject": "商法", "qno": 27, "haiten": 2, "type": "choice", "options": 5, "answer": [1], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第27問〕（配点：２）\n商業登記に関する次のアからオまでの各記述のうち、判例の趣旨に照らし正しいものを組み合わせたものは、後記１から５までのうちどれか。\nア．株式会社の代表取締役は、代表取締役である旨の登記がされているか否かにかかわらず、当該株式会社を代表して取引先である会社に対する売買代金請求の訴えを提起することができる。\nイ．株式会社の取締役として選任されていない者は、自己を取締役として登記することについて承諾し、その旨の登記がされた場合であっても、積極的に取締役として対外的又は内部的な行為をしない限り、会社法第４２９条第１項の役員等としての責任を負わない。\nウ．会社法の規定により登記すべき事項について、登記の申請がされたものの、登記官の過誤により当該登記がされなかった場合には、当該登記の申請者は、当該事項を善意の第三者に対抗することができない。\nエ．会社法の規定により登記すべき事項が登記された後であっても、過失なく負傷したため登記簿を閲覧することができなかったことにより、その登記があることを知らなかった者に対しては、当該事項を対抗することができない。\nオ．申請された登記事項について登記官の過誤により誤った内容が登記された場合には、当該登記の申請者は、当該事項が不実であることを善意の第三者に対抗することができない。\n１．アウ\n２．アオ\n３．イウ\n４．イエ\n５．エオ（参照条文）会社法（役員等の第三者に対する損害賠償責任）第４２９条役員等がその職務を行うについて悪意又は重大な過失があったときは、当該役員等は、これによって第三者に生じた損害を賠償する責任を負う。 ２（略）", "source": "https://www.moj.go.jp/content/001399905.pdf", "answerSource": "https://www.moj.go.jp/content/001400886.pdf"}, {"id": "R5-shoho-28", "year": "R5", "yearLabel": "令和5年", "subject": "商法", "qno": 28, "haiten": 2, "type": "choice", "options": 5, "answer": [5], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第28問〕（配点：２）\n商人及び商行為に関する次の１から５までの各記述のうち、誤っているものはどれか。\n１．商人がその営業の範囲内において他人のために行為をしたときは、相当な報酬を請求することができる。\n２．商人が平常取引をする者からその営業の部類に属する契約の申込みを受けた場合において、当該契約の申込みに対する諾否の通知を遅滞なく発することを怠ったときは、当該商人は、当該契約の申込みを承諾したものとみなされる。\n３．自己の営業として婚姻の媒介をする行為は、商行為となる。\n４．判例の趣旨によれば、商行為の代理人が本人のためにすることを示さないでこれをした場合であって、相手方が、代理人が本人のためにすることを知らず、そのことにつき過失もないときには、相手方は、本人との間の法律関係と代理人との間の法律関係のいずれかを選択することができる。\n５．商行為によって生じた債務の履行をすべき場所がその行為の性質又は当事者の意思表示によって定まらないときは、不特定物の引渡しは、債務者の現在の営業所においてしなければならない。", "source": "https://www.moj.go.jp/content/001399905.pdf", "answerSource": "https://www.moj.go.jp/content/001400886.pdf"}, {"id": "R5-shoho-29", "year": "R5", "yearLabel": "令和5年", "subject": "商法", "qno": 29, "haiten": 2, "type": "choice", "options": 5, "answer": [4], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第29問〕（配点：２）\nホテルを経営するＡの宿泊客Ｂに対する責任に関する次のアからオまでの各記述のうち、誤っているものを組み合わせたものは、後記１から５までのうちどれか。\nア．Ａは、Ｂからバッグを預かるに当たってバッグの中に１億円相当の宝石が入っていることを告げられていなかった場合において、その宝石の存在を知ることができず、かつ、その宝石の滅失につき悪意も重大な過失もないときは、その宝石の滅失によって生じた損害を賠償する責任を負わない。\nイ．ＡがＢから預かったバッグが滅失したときは、Ａは、その保管につき注意を怠らなかったことを証明することにより、Ｂのバッグの滅失によって生じた損害を賠償する責任を免れることができる。\nウ．Ａが注意を怠らなかったにもかかわらず、Ｂの宿泊部屋内に置かれていたＢのバッグが滅失した場合には、Ａは、Ｂのバッグの滅失によって生じた損害を賠償する責任を負わない。\nエ．Ａは、「当ホテルは、フロントへお預けいただいていない携帯品の滅失又は損傷の損害については、いかなる責任も負いません。」とホテルの正面玄関に掲示していたときは、宿泊中のホテル内におけるＢのバッグの滅失によって生じた損害を賠償する責任を免れることができる。\nオ．ＡがＢから預かったバッグが損傷した場合におけるＢのＡに対する場屋営業者の責任に係る債権は、ＢがＡからバッグを返還された時から１年間行使しないときは、Ａがバッグの損傷につき悪意でなければ、時効によって消滅する。\n１．アウ\n２．アオ\n３．イウ\n４．イエ\n５．エオ", "source": "https://www.moj.go.jp/content/001399905.pdf", "answerSource": "https://www.moj.go.jp/content/001400886.pdf"}, {"id": "R5-shoho-30", "year": "R5", "yearLabel": "令和5年", "subject": "商法", "qno": 30, "haiten": 2, "type": "choice", "options": 5, "answer": [4], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第30問〕（配点：２）\nＡがＢに対して振り出した約束手形に関する次のアからオまでの各記述のうち、判例の趣旨に照らし正しいものを組み合わせたものは、後記１から５までのうちどれか。\nア．ＡがＢの強迫を理由に当該約束手形の振出しに係る意思表示を取り消した場合において、 Ｂがそのことにつき善意のＣに対して当該約束手形を裏書譲渡したときは、Ａは、Ｃからの当該約束手形に係る手形金請求を拒むことができる。\nイ．ＡＢ間の当該約束手形振出しの原因関係上の債務と当該約束手形上の債務が併存する場合において、当該原因関係上の債務が履行されたときは、Ａは、Ｂからの当該約束手形に係る手形金請求を拒むことができる。\nウ．ＡＢ間の当該約束手形振出しの原因関係上の債務が当該約束手形の振出しによって消滅するか否かについての当事者の意思が明らかでない場合には、当該約束手形の振出しは、当該原因関係上の債務の支払に代えてされたものと推定される。\nエ．ＡＢ間の当該約束手形振出しの原因関係上の債務と当該約束手形上の債務が併存する場合には、Ａは、Ｂからの当該原因関係上の債務の履行の請求について、当該原因関係上の債務の履行は当該約束手形の返還と引換えにする旨を主張することができない。\nオ．Ｂが、ＡのＢに対する人的抗弁につき善意のＣに対して当該約束手形を裏書譲渡し、Ｃ が、当該人的抗弁につき悪意のＤに対して当該約束手形を裏書譲渡した場合には、Ａは、Ｄ からの当該約束手形に係る手形金請求を拒むことができない。\n１．アウ\n２．アエ\n３．イウ\n４．イオ\n５．エオ ［民事訴訟法］", "source": "https://www.moj.go.jp/content/001399905.pdf", "answerSource": "https://www.moj.go.jp/content/001400886.pdf"}, {"id": "R5-minso-31", "year": "R5", "yearLabel": "令和5年", "subject": "民事訴訟法", "qno": 31, "haiten": 2, "type": "choice", "options": 5, "answer": [3], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第31問〕（配点：２）\n管轄に関する次の１から５までの各記述のうち、正しいものはどれか。\n１．貸金１００万円の返還を求める訴えについて、大阪簡易裁判所を専属管轄とする合意があるにもかかわらず、大阪地方裁判所に訴えが提起された場合には、大阪地方裁判所は、訴訟を大阪簡易裁判所に移送しなければならない。\n２．インターネットを利用して売買契約が締結された場合において、東京簡易裁判所を管轄裁判所とする合意が、ウェブ上の申込みフォームによってされたときは、当該合意があることを理由として東京簡易裁判所に当該売買契約に関する訴えを提起することはできない。\n３．不法行為に基づき損害賠償を求める訴えについては、原告の住所地を管轄する裁判所に提起することができる。\n４．離婚の訴えが名古屋地方裁判所に提起された場合には、名古屋地方裁判所は、訴訟を名古屋家庭裁判所に移送することはできず、当該訴えを却下しなければならない。\n５．被告が管轄違いの抗弁を記載せず本案についての主張を記載した答弁書を裁判所に提出した場合には、その時点で、応訴管轄が生じ、管轄違いを理由とする移送の申立てをすることはできない。", "source": "https://www.moj.go.jp/content/001399905.pdf", "answerSource": "https://www.moj.go.jp/content/001400886.pdf"}, {"id": "R5-minso-32", "year": "R5", "yearLabel": "令和5年", "subject": "民事訴訟法", "qno": 32, "haiten": 2, "type": "choice", "options": 5, "answer": [4], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第32問〕（配点：２）\n選定当事者に関する次の１から５までの各記述のうち、判例の趣旨に照らし誤っているものはどれか。\n１．選定者と選定当事者は、ともに「共同の利益を有する多数の者」に属することが必要であり、訴訟の目的である権利が同一の事実上及び法律上の原因に基づき、かつ、主要な攻撃防御方法を共通にするときは、「共同の利益を有する多数の者」と認められる。\n２．第三者が係属中の訴訟の原告を選定当事者として選定した場合には、選定当事者は、口頭弁論の終結に至るまで、選定者となった当該第三者のために請求の追加をすることができる。\n３．選定当事者が訴訟係属中に死亡した場合において、訴訟代理人が選任されておらず、かつ、他の選定当事者がいないときは、訴訟手続は中断する。\n４．選定者が選定当事者を選定するに際して、選定当事者が訴訟上の和解をすることを禁止する旨の制限をしたにもかかわらず、選定当事者が訴訟上の和解をした場合には、当該和解は無効である。\n５．選定者が選定当事者の選定を取り消した場合であっても、相手方に通知するまでは、取消しの効力は生じない。", "source": "https://www.moj.go.jp/content/001399905.pdf", "answerSource": "https://www.moj.go.jp/content/001400886.pdf"}, {"id": "R5-minso-33", "year": "R5", "yearLabel": "令和5年", "subject": "民事訴訟法", "qno": 33, "haiten": 2, "type": "multi", "options": 5, "answer": [1, 5], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第33問〕（配点：２）\n共同訴訟に関する次の１から５までの各記述のうち、判例の趣旨に照らし誤っているものを２個選びなさい。\n１．甲土地を共有するＸ１、Ｘ２及びＸ３全員が原告となって、共有権（数人が共同して有する一個の所有権）に基づき所有権移転登記手続を求めた訴訟の係属中に、Ｘ１が訴えの取下げをしても、その取下げの効力は取下げをしたＸ１にしか及ばず、Ｘ２及びＸ３には効力を生じない。\n２．ある土地が複数の入会権者の総有に属することの確認を求める訴訟において、原告である共同訴訟人の一人が死亡した場合には、その者に訴訟代理人がいるときを除き、訴訟手続は、共同訴訟人の全員について中断する。\n３．共同相続人間における遺産確認の訴えにおいて、口頭弁論期日に共同原告のうち一人が欠席した場合であっても、被告は、準備書面に記載していない事実を主張することができる。\n４．Ａを養母とし、Ｙを養子とする養子縁組が無効であるとして、Ａの子であるＸ１及びＸ２が Ｙに対して提起した養子縁組無効の訴えにおいてされた控訴審の判決に対して、Ｘ１が上告を提起した後に、Ｘ２が上告を提起することは、不適法なものとして許されない。\n５．甲土地の所有者Ｘが、甲土地上にある建物を共同で相続したＹ１及びＹ２のうち、Ｙ１のみに対して、土地所有権に基づき建物収去土地明渡しを求める訴えを提起することは、不適法なものとして許されない。", "source": "https://www.moj.go.jp/content/001399905.pdf", "answerSource": "https://www.moj.go.jp/content/001400886.pdf"}, {"id": "R5-minso-34", "year": "R5", "yearLabel": "令和5年", "subject": "民事訴訟法", "qno": 34, "haiten": 2, "type": "choice", "options": 5, "answer": [4], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第34問〕（配点：２）\n専門委員に関する次のアからオまでの各記述のうち、正しいものを組み合わせたものは、後記１から５までのうちどれか。\nア．裁判所は、当事者の同意を得たとしても、和解を試みる期日において、専門委員を手続に関与させることはできない。\nイ．裁判所が専門委員を手続に関与させる決定をした後に、当事者双方から当該決定の取消しの申立てがあった場合には、裁判所は当該決定を取り消さなければならない。\nウ．受命裁判官が弁論準備手続で争点の整理を行う場合に、受命裁判官の命令によっては、専門委員を手続に関与させることはできない。\nエ．裁判長は、証拠調べ手続に関与させた専門委員に、当事者の同意を得た上で、証人に対して直接に問いを発することを許すことができる。\nオ．裁判所は、専ら訴訟手続の円滑な進行を図るためとして、専門委員を手続に関与させる決定をすることはできない。\n１．アエ\n２．アオ\n３．イウ\n４．イエ\n５．ウオ", "source": "https://www.moj.go.jp/content/001399905.pdf", "answerSource": "https://www.moj.go.jp/content/001400886.pdf"}, {"id": "R5-minso-35", "year": "R5", "yearLabel": "令和5年", "subject": "民事訴訟法", "qno": 35, "haiten": 2, "type": "choice", "options": 5, "answer": [2], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第35問〕（配点：２）\n送達に関する次のアからオまでの各記述のうち、判例の趣旨に照らし正しいものを組み合わせたものは、後記１から５までのうちどれか。\nア．書類の受領について相当のわきまえのある同居者が受送達者宛ての訴訟関係書類の交付を受けた場合には、当該同居者と受送達者との間にその訴訟に関して事実上の利害関係の対立があるときであっても、受送達者に対する送達の効力が生ずる。\nイ．書留郵便等に付する送達の方法により受送達者の住民票上の住所に宛てて訴訟関係書類を発送した場合には、実際には発送時に既に受送達者が当該住所から転居していたときであっても、受送達者に対する送達の効力が生ずる。\nウ．一人の当事者について委任による訴訟代理人が数人あるときは、訴訟関係書類の送達は、その全員にしなければならない。\nエ．公示送達は、申立てにより、裁判長の許可の裁判を得て、裁判所書記官が行う。\nオ．少額訴訟において、公示送達によらなければ被告に対する最初にすべき口頭弁論の期日の呼出しをすることができないときは、裁判所は、訴訟を通常の手続により審理及び裁判をする旨の決定をしなければならない。\n１．アエ\n２．アオ\n３．イウ\n４．イエ\n５．ウオ", "source": "https://www.moj.go.jp/content/001399905.pdf", "answerSource": "https://www.moj.go.jp/content/001400886.pdf"}, {"id": "R5-minso-36", "year": "R5", "yearLabel": "令和5年", "subject": "民事訴訟法", "qno": 36, "haiten": 2, "type": "choice", "options": 5, "answer": [2], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第36問〕（配点：２）\n確定判決の効力に関する次のアからオまでの各記述のうち、判例の趣旨に照らし誤っているものを組み合わせたものは、後記１から５までのうちどれか。\nア．ＸがＹに対して、ＸＹ間の売買契約が通謀虚偽表示により無効であることを理由として、土地の所有権に基づき所有権移転登記の抹消登記手続を求める訴えを提起し、Ｘの請求を認容する判決が確定したが、Ｙが事実審の口頭弁論の終結後に、通謀虚偽表示について善意無過失の Ｚに当該土地を売却し、Ｚへの所有権移転登記手続をしていた場合に、この判決の効力は、Ｚ にも及び、ＺはＸに対して善意無過失の第三者であることを主張することはできない。\nイ．ＸがＹに対して、売買契約に基づき甲土地の所有権移転登記手続を求める訴えを提起し、Ｘ の請求を認容する判決が確定したが、Ｙが事実審の口頭弁論の終結前に、Ｚとの通謀虚偽表示による贈与契約に基づき、Ｚへの甲土地の所有権移転登記手続をしていた場合に、この判決の効力は、Ｚにも及ぶ。\nウ．破産管財人ＸがＹに対して、破産財団に属する破産者ＺのＹに対する不当利得返還請求権について、Ｚに代わって訴えを提起し、Ｘの請求を棄却する判決が確定した場合に、この判決の効力は、Ｚにも及ぶ。\nエ．ＸがＹに対して、売買契約に基づき動産の引渡しを求める訴えを提起し、Ｘの請求を認容する判決が確定したが、Ｙが事実審の口頭弁論の終結前に、寄託契約に基づき、Ｚへ当該動産を引き渡し、占有を移転していた場合に、この判決の効力は、Ｚには及ばない。\nオ．Ｘが、自ら認知した子であるＹを被告として、認知無効の訴えを提起し、Ｘの請求を棄却する判決が確定した場合に、この判決の効力は、Ｘの推定相続人であるＺにも及ぶ。\n１．アウ\n２．アエ\n３．イウ\n４．イオ\n５．エオ", "source": "https://www.moj.go.jp/content/001399905.pdf", "answerSource": "https://www.moj.go.jp/content/001400886.pdf"}, {"id": "R5-minso-37", "year": "R5", "yearLabel": "令和5年", "subject": "民事訴訟法", "qno": 37, "haiten": 2, "type": "choice", "options": 5, "answer": [5], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第37問〕（配点：２）\n訴状に関する次のアからオまでの各記述のうち、判例の趣旨に照らし正しいものを組み合わせたものは、後記１から５までのうちどれか。\nア．給付を求める訴えにおいて、請求を特定するのに必要な事実の記載はあるものの、請求を理由付ける事実の記載を欠く訴状の送達を受けた被告が、答弁書その他の準備書面を提出せず、口頭弁論期日に出頭しない場合には、裁判所は、直ちに原告の請求を認容する判決をすることができる。\nイ．訴状において、被告の現住所の記載を欠くものの、旧住所の記載によって被告の特定ができる場合には、被告の現住所が明らかでないことにより訴状を被告に送達することができなかったとしても、裁判長は、補正を命ずることはできない。\nウ．原告が、貸金１００万円のうち被告から弁済を受けた７０万円を控除した残額である３０万円の返還を求める訴えを提起する場合には、原告は、請求を特定するために、訴状において、 ７０万円の弁済を受けたとの事実を記載しなければならない。\nエ．裁判長が訴状の補正を命じた場合に、原告は、その補正命令に対して不服を申し立てることができない。\nオ．訴え提起の手数料の納付を命ずる補正命令を受けた者が、当該命令において定められた期間内にこれを納付しなかった場合であっても、訴状却下命令が発せられる前にこれを納付したときは、裁判長は、訴状を却下することはできない。\n１．アイ\n２．アウ\n３．イエ\n４．ウオ\n５．エオ", "source": "https://www.moj.go.jp/content/001399905.pdf", "answerSource": "https://www.moj.go.jp/content/001400886.pdf"}, {"id": "R5-minso-38", "year": "R5", "yearLabel": "令和5年", "subject": "民事訴訟法", "qno": 38, "haiten": 2, "type": "choice", "options": 5, "answer": [2], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第38問〕（配点：２）\n訴訟行為と条件に関する次のアからオまでの各記述のうち、判例の趣旨に照らし正しいものを組み合わせたものは、後記１から５までのうちどれか。\nア．原告が被告に対して、主位的に売買契約に基づき代金の支払を求めるとともに、売買契約が無効であると判断される場合に備えて、主位的請求が認容されることを解除条件として、予備的に所有権に基づき目的物の返還を求めた場合には、裁判所は、目的物の返還請求権の存否に先立って、売買代金の支払請求権の存否について判断しなければならない。\nイ．原告が被告に対して貸金の返還を求める訴えにおいて、被告が、弁済の抗弁を主張するとともに、弁済の抗弁が認められることを解除条件として消滅時効の抗弁を主張した場合には、裁判所は、消滅時効の抗弁の判断に先立って弁済の抗弁について判断をしなければならない。\nウ．原告が被告に対して、所有権に基づき機械の引渡しを求めるとともに、強制執行が功を奏しない場合に備えてあらかじめ目的物の時価相当額の代償金の支払を求める場合には、機械の引渡請求を主位的請求とし、代償金の支払請求を予備的請求としなければならない。\nエ．本訴及び反訴の係属中に、本訴原告（反訴被告）が、本訴の訴訟物である債権が時効により消滅したと判断されることを停止条件として、反訴において、当該債権を自働債権として相殺の抗弁を主張することは許されない。\nオ．所有権に基づき抵当権設定登記の抹消登記手続を求める訴えにおいて、原告が当該抵当権設定登記の抹消登記がされることを停止条件として訴えを取り下げることは、不適法なものとして訴訟上許されない。\n１．アイ\n２．アオ\n３．イエ\n４．ウエ\n５．ウオ", "source": "https://www.moj.go.jp/content/001399905.pdf", "answerSource": "https://www.moj.go.jp/content/001400886.pdf"}, {"id": "R5-minso-39", "year": "R5", "yearLabel": "令和5年", "subject": "民事訴訟法", "qno": 39, "haiten": 2, "type": "multi", "options": 5, "answer": [1, 5], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第39問〕（配点：２）\n次の〔事例〕を前提とし、弁論主義及び職権探知主義に関する次の１から５までの各記述のうち、判例の趣旨に照らし誤っているものを２個選びなさい。 〔事例〕 Ｘは、Ｙに対し、３００万円を貸し付けたと主張して、消費貸借契約に基づく貸金返還請求として３００万円の支払を求める訴えを甲裁判所に提起した（以下、この消費貸借契約を「本件消費貸借契約」といい、この訴えを「本件訴え」という。）。 １. 口頭弁論期日において、Ｙが貸付けの事実を認める陳述をしたが、甲裁判所は、証拠調べの結果、貸付けの事実が認められないと判断した場合には、貸付けの事実が存在しないことを理由として、Ｘの請求を棄却することができる。 ２. 口頭弁論期日において、Ｙが貸付けの事実を認める陳述をした上で、既に全額弁済したと主張し、弁済に際してＸから交付されたものであるとする領収証を証拠として提出した。Ｘがその領収証の成立の真正を認める旨の陳述をした場合であっても、甲裁判所は、その領収証がＸ によって作成されたものではないと判断したときは、その領収証が真正に成立したものではないと認めることができる。\n３．Ｘは、Ｙが貸付けの事実を認めた上で、消滅時効の抗弁を主張したため、時効の更新の再抗弁として、Ｙから３００万円のうち１００万円の弁済を受けた事実を主張したところ、Ｙはこの弁済の事実を否認した。Ｘが当初の３００万円の貸金返還請求を維持している場合において、甲裁判所は、証拠調べの結果、１００万円の弁済の事実が認められると判断したときは、 Ｘの請求について、２００万円の支払を求める限度で認容し、その余を棄却することができる。\n４．Ｘが、乙裁判所にも、Ｙを被告とする本件消費貸借契約に基づく３００万円の貸金の返還を求める訴えを提起し、その訴訟が係属中であるにもかかわらず、更に本件訴えを提起したことが判明した場合には、甲裁判所は、Ｘ及びＹが乙裁判所に本件消費貸借契約に基づく貸金返還訴訟が先に係属していた事実を主張していないときであっても、本件訴えを却下することができる。\n５．Ｘが、本件訴えの提起に先立ち、乙裁判所にも、Ｙを被告とする本件消費貸借契約に基づく ３００万円の貸金の返還を求める訴えを提起したが、貸付けの事実が認められないとして、請求を全部棄却する判決を受け、これが確定していることが判明した場合でも、甲裁判所は、Ｘ 及びＹが乙裁判所の確定判決の存在を主張していないときは、乙裁判所の確定判決の既判力の存在を判決の基礎とすることはできない。", "source": "https://www.moj.go.jp/content/001399905.pdf", "answerSource": "https://www.moj.go.jp/content/001400886.pdf"}, {"id": "R5-minso-40", "year": "R5", "yearLabel": "令和5年", "subject": "民事訴訟法", "qno": 40, "haiten": 2, "type": "choice", "options": 5, "answer": [4], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第40問〕（配点：２）\n調査の嘱託に関する次のアからオまでの各記述のうち、判例の趣旨に照らし誤っているものを組み合わせたものは、後記１から５までのうちどれか。\nア．裁判所は、当事者からの申立てがない場合でも、職権で調査の嘱託をすることができる。\nイ．調査の嘱託は、会社等の営利を目的とする私的団体に対してはすることができない。\nウ．訴訟係属中に、調査の嘱託がされた場合において、嘱託先から回答がされ、裁判所がこれを口頭弁論に提示して当事者に意見陳述の機会を与え、弁論に顕出されたときは、当事者の援用がなくても、この回答を証拠資料にすることができる。\nエ．弁論準備手続を行う受命裁判官は、調査の嘱託についての裁判をすることができない。\nオ．提訴前に、提訴予告通知者の申立てに基づき、裁判所が必要な調査を官公署等に嘱託をし、それに基づいて調査結果の報告がされたときは、申立人及び相手方にその旨を通知しなければならない。\n１．アエ\n２．アオ\n３．イウ\n４．イエ\n５．ウオ", "source": "https://www.moj.go.jp/content/001399905.pdf", "answerSource": "https://www.moj.go.jp/content/001400886.pdf"}, {"id": "R5-minso-41", "year": "R5", "yearLabel": "令和5年", "subject": "民事訴訟法", "qno": 41, "haiten": 2, "type": "choice", "options": 5, "answer": [5], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第41問〕（配点：２）\n争点整理手続に関する次のアからオまでの各記述のうち、誤っているものを組み合わせたものは、後記１から５までのうちどれか。\nア．裁判所は、弁論準備手続の期日において、訴訟関係を明瞭にするため、当事者のため事務を処理し、又は補助する者で裁判所が相当と認めるものに陳述をさせることができる。\nイ．裁判長は、書面による準備手続を終結するに当たり、当事者に書面による準備手続における争点及び証拠の整理の結果を要約した書面を提出させることができる。\nウ．裁判所は、当事者双方から弁論準備手続に付する裁判を取り消すよう申立てがあっても、相当と認めるときは、引き続き弁論準備手続を行うことができる。\nエ．裁判所は、当事者が期日に出頭しないときであっても、当事者の不出頭を理由として弁論準備手続を終結することはできない。\nオ．弁論準備手続の終結後に攻撃防御方法を提出した当事者は、相手方の求めがあるときは、相手方に対し、弁論準備手続の終結前にこれを提出することができなかった理由を説明しなければならない。\n１．アウ\n２．アオ\n３．イエ\n４．イオ\n５．ウエ", "source": "https://www.moj.go.jp/content/001399905.pdf", "answerSource": "https://www.moj.go.jp/content/001400886.pdf"}, {"id": "R5-minso-42", "year": "R5", "yearLabel": "令和5年", "subject": "民事訴訟法", "qno": 42, "haiten": 2, "type": "choice", "options": 5, "answer": [1], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第42問〕（配点：２）\n裁判官に専門知識を提供する民事訴訟法上の手段に関する次のアからオまでの各記述のうち、誤っているものを組み合わせたものは、後記１から５までのうちどれか。\nア．裁判所が、気象台に対して特定の日及び地域の気象情報を明らかにするよう依頼する場合には、調査の嘱託によることはできない。\nイ．裁判所は、当事者から書証として提出された設計図面の意味内容について、専門委員から専門的な知見に基づく説明を受けることはできない。\nウ．当事者は、学識経験ある第三者を任意に選択して、専門家としての判断を依頼し、その報告書を書証として裁判所に提出することができる。\nエ．裁判所は、工業製品の化学的性質を明らかにする必要があると認めるときは、相当の設備を有する法人に対して鑑定を嘱託することができる。\nオ．当事者は、土地の貸主が賃料増額請求をしたことにより増額された賃料額の確認を求める訴訟において、裁判所に対し、鑑定を求める事項をその土地の相当賃料額の算定として、鑑定の申出をすることができる。\n１．アイ\n２．アエ\n３．イオ\n４．ウエ\n５．ウオ", "source": "https://www.moj.go.jp/content/001399905.pdf", "answerSource": "https://www.moj.go.jp/content/001400886.pdf"}, {"id": "R5-minso-43", "year": "R5", "yearLabel": "令和5年", "subject": "民事訴訟法", "qno": 43, "haiten": 2, "type": "choice", "options": 5, "answer": [3], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第43問〕（配点：２）\n証拠調べに関する次のアからオまでの各記述のうち、正しいものを組み合わせたものは、後記１から５までのうちどれか。\nア．証人による証言拒絶を理由がないとする裁判が確定した後に、その証人が正当な理由なく証言を拒む場合でも、裁判所は、その証人を過料に処することはできない。\nイ．当事者本人を尋問する場合において、その当事者が正当な理由なく尋問の期日に出頭しなかったときでも、裁判所は、その当事者の勾引を命ずることはできない。\nウ．当事者が相手方の使用を妨げる目的で提出の義務がある文書を滅失させた場合でも、裁判所は、当該文書の記載に関する相手方の主張を真実と認めることはできない。\nエ．第三者が正当な理由なくその所持する文書についての送付嘱託の決定に従わない場合でも、裁判所は、その第三者を過料に処することはできない。\nオ．第三者が正当な理由なく検証の目的物の提示命令に従わない場合でも、裁判所は、その第三者を過料に処することはできない。\n１．アイ\n２．アオ\n３．イエ\n４．ウエ\n５．ウオ", "source": "https://www.moj.go.jp/content/001399905.pdf", "answerSource": "https://www.moj.go.jp/content/001400886.pdf"}, {"id": "R5-minso-44", "year": "R5", "yearLabel": "令和5年", "subject": "民事訴訟法", "qno": 44, "haiten": 2, "type": "multi", "options": 5, "answer": [2, 5], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第44問〕（配点：２）\n上告又は上告受理に関する次の１から５までの各記述のうち、判例の趣旨に照らし誤っているものを２個選びなさい。\n１．原判決が、判決の基本となる口頭弁論に関与していない裁判官によってなされたことは、上告理由に当たる。\n２．上告受理の申立てがされた場合において、当該申立てに係る事件が、法令の解釈に関する重要な事項を含むものと認められる事件に当たらないときは、原裁判所は、自ら上告受理の申立てを却下することができる。\n３．上告裁判所が、不適法でその不備を補正できない訴えについてなされた原審の本案判決を破棄し、訴えを却下する判決をする場合には、口頭弁論を経ないですることができる。\n４．上告裁判所が、職権調査事項について一定の事実上の判断をし、それを理由として原判決を破棄し、事件を原裁判所に差し戻した場合には、当該事実上の判断は、差戻しを受けた裁判所を拘束する。\n５．第一審の終局判決の言渡し前に、当事者双方が共に上告をする権利を留保して控訴をしない旨の合意をしたときは、この合意は有効である。", "source": "https://www.moj.go.jp/content/001399905.pdf", "answerSource": "https://www.moj.go.jp/content/001400886.pdf"}, {"id": "R5-minso-45", "year": "R5", "yearLabel": "令和5年", "subject": "民事訴訟法", "qno": 45, "haiten": 2, "type": "choice", "options": 5, "answer": [1], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第45問〕（配点：２）\n裁判所の職権行使の可否に関する次のアからオまでの各記述のうち、正しいものを組み合わせたものは、後記１から５までのうちどれか。\nア．裁判所は、専属管轄に関する事項について、職権で、証拠調べをすることができる。\nイ．訴訟の係属中第三者がその訴訟の目的である義務の全部又は一部を承継したときは、裁判所は、職権で、その第三者に訴訟を引き受けさせることができる。\nウ．裁判所は、職権で、当事者本人を尋問することができる。\nエ．財産権上の請求に関する判決について、裁判所は、職権で、仮執行の宣言をすることはできない。\nオ．判決に計算違い、誤記その他これらに類する明白な誤りがあるときであっても、裁判所は、職権で、更正決定をすることはできない。\n１．アウ\n２．アオ\n３．イウ\n４．イエ\n５．エオ", "source": "https://www.moj.go.jp/content/001399905.pdf", "answerSource": "https://www.moj.go.jp/content/001400886.pdf"}, {"id": "R5-keiho-1", "year": "R5", "yearLabel": "令和5年", "subject": "刑法", "qno": 1, "haiten": 2, "type": "choice", "options": 5, "answer": [4], "figure": false, "revision": false, "rev
