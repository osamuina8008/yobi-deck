個選びなさい。\n１．訴訟代理人のない選定当事者が追行する訴訟の係属中に選定者の全員が死亡したときは、訴訟手続は中断する。\n２．訴訟係属中に原告が死亡した場合において、訴訟物である権利が原告の一身専属権であるときは、訴訟手続は、当然に終了する。\n３．訴訟手続の中断中においては、中断前に口頭弁論が終結していた場合であっても、判決の言渡しをすることができない。\n４．訴訟代理人のない法人が追行する訴訟の係属中にその代表者の代表権が消滅した場合において、その代表権の消滅が公知の事実であるときは、相手方にその旨の通知がなくとも、代表権の消滅があった時点で訴訟手続は中断する。\n５．訴訟手続が中断した場合には、裁判所は、当事者が受継の申立てをしなくても、職権で、訴訟手続の続行を命ずることができる。", "source": "https://www.moj.go.jp/content/001421752.pdf", "answerSource": "https://www.moj.go.jp/content/001422570.pdf"}, {"id": "R6-minso-37", "year": "R6", "yearLabel": "令和6年", "subject": "民事訴訟法", "qno": 37, "haiten": 2, "type": "choice", "options": 5, "answer": [3], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第37問〕（配点：２）\n民事訴訟に関する異議権（責問権）に関する次のアからオまでの各記述のうち、判例の趣旨に照らし誤っているものを組み合わせたものは、後記１から５までのうちどれか。\nア．被告に送達されるべき訴状を被告と同居する受送達権限を欠く者が受領した場合であっても、被告が委任した訴訟代理人が最初にすべき口頭弁論の期日に出頭し異議なく弁論をしたときは、その瑕疵は、異議権の喪失によって治癒される。\nイ．宣誓させるべき証人に宣誓させないで尋問がされた場合において、当事者がそのことを知りながら遅滞なく異議を述べないときであっても、その瑕疵は、異議権の喪失によっては治癒されない。\nウ．訴えの変更が書面によってされず、被告への送達もされなかった場合において、被告がそのことを知りながら遅滞なく異議を述べないときであっても、その瑕疵は、異議権の喪失によっては治癒されない。\nエ．判決言渡期日として口頭弁論終結の日から２か月を超えた日が指定された場合であっても、当事者は、これに対する異議権はない。\nオ．口頭弁論に関与していない裁判官が判決をした場合において、当事者がそのことを知りながら遅滞なく異議を述べないときであっても、その瑕疵は、異議権の喪失によっては治癒されない。\n１．アエ\n２．アオ\n３．イウ\n４．イオ\n５．ウエ", "source": "https://www.moj.go.jp/content/001421752.pdf", "answerSource": "https://www.moj.go.jp/content/001422570.pdf"}, {"id": "R6-minso-38", "year": "R6", "yearLabel": "令和6年", "subject": "民事訴訟法", "qno": 38, "haiten": 2, "type": "choice", "options": 5, "answer": [3], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第38問〕（配点：２）\n訴訟行為の時期に関する次の１から５までの各記述のうち、判例の趣旨に照らし正しいものはどれか。\n１．本案について口頭弁論をした後においては、訴訟要件を欠く旨の主張をすることはできない。\n２．弁論準備手続の終結後においては、新たな攻撃防御方法を提出することはできない。\n３．証人の尋問が終了した後においては、当該証人の尋問の申出を撤回することはできない。\n４．第一審判決が言い渡された後においては、その確定前であっても、第一審裁判所で訴訟上の和解をすることはできない。\n５．控訴審においては、相手方の同意があっても、反訴を提起することはできない。", "source": "https://www.moj.go.jp/content/001421752.pdf", "answerSource": "https://www.moj.go.jp/content/001422570.pdf"}, {"id": "R6-minso-39", "year": "R6", "yearLabel": "令和6年", "subject": "民事訴訟法", "qno": 39, "haiten": 2, "type": "choice", "options": 5, "answer": [3], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第39問〕（配点：２）\n証拠の収集又は証拠調べに関する次のアからオまでの各記述のうち、正しいものを組み合わせたものは、後記１から５までのうちどれか。\nア．訴えの提起前における証拠保全の手続においては、証人の尋問をすることはできない。\nイ．裁判所は、必要があると認めるときは、提出された文書の原本を書証として取り調べた後も、これを留め置くことができる。\nウ．検証の申出は、期日前においてはすることはできない。\nエ．文書の所持者が、その文書につき文書提出義務を負うときであっても、当該所持者に対して当該文書の送付の嘱託をすることができる。\nオ．訴えの提起前における証拠収集の処分においては、調査の嘱託をすることはできない。\n１．アエ\n２．アウ\n３．イエ\n４．イオ\n５．ウオ", "source": "https://www.moj.go.jp/content/001421752.pdf", "answerSource": "https://www.moj.go.jp/content/001422570.pdf"}, {"id": "R6-minso-40", "year": "R6", "yearLabel": "令和6年", "subject": "民事訴訟法", "qno": 40, "haiten": 2, "type": "choice", "options": 5, "answer": [5], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第40問〕（配点：２）\n鑑定に関する次のアからオまでの各記述のうち、正しいものを組み合わせたものは、後記１から ５までのうちどれか。\nア．鑑定人に対する質問は、順序の変更をしない限り、鑑定の申出をした当事者、他の当事者、裁判長の順序でする。\nイ．裁判所は、映像と音声の送受信により相手の状態を相互に認識しながら通話をすることができる方法によっては、鑑定人に口頭で意見を述べさせることはできない。\nウ．裁判所は、鑑定人が書面で意見を述べた後は、その鑑定人に更に意見を述べさせることはできない。\nエ．裁判所は、同一の鑑定事項について、同時に複数の鑑定人を指定して、意見を述べさせることができる。\nオ．裁判所は、弁論準備手続の期日において、鑑定のために必要な事項について、当事者及び鑑定人と協議をすることができる。\n１．アウ\n２．アオ\n３．イウ\n４．イエ\n５．エオ", "source": "https://www.moj.go.jp/content/001421752.pdf", "answerSource": "https://www.moj.go.jp/content/001422570.pdf"}, {"id": "R6-minso-41", "year": "R6", "yearLabel": "令和6年", "subject": "民事訴訟法", "qno": 41, "haiten": 2, "type": "choice", "options": 5, "answer": [5], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第41問〕（配点：２）\n訴えの取下げに関する次のアからオまでの各記述のうち、判例の趣旨に照らし正しいものを組み合わせたものは、後記１から５までのうちどれか。\nア．和解の期日においては、訴えの取下げを口頭ですることはできない。\nイ．訴えの取下げは、口頭弁論期日が開かれた後は、相手方が訴えの却下を求め、その理由のみを主張している場合であっても、相手方の同意を得なければ、その効力を生じない。\nウ．当事者双方が、連続して２回、口頭弁論期日に出頭しなかったときは、被告の同意を得なくても、訴えの取下げの効力を生ずる。\nエ．判決言渡期日の前日に訴えの取下げが書面でされた場合において、訴えの取下げに相手方が異議を述べるかどうかが判明していないときは、裁判所は予定していた判決言渡期日において、判決を言い渡すことができない。\nオ．終局判決があった後に訴えの取下げをした当事者は、新たな訴えの利益又は必要性が存するときは、前訴と当事者及び訴訟物を同一とする訴えを提起することができる。\n１．アウ\n２．アエ\n３．イエ\n４．イオ\n５．ウオ", "source": "https://www.moj.go.jp/content/001421752.pdf", "answerSource": "https://www.moj.go.jp/content/001422570.pdf"}, {"id": "R6-minso-42", "year": "R6", "yearLabel": "令和6年", "subject": "民事訴訟法", "qno": 42, "haiten": 2, "type": "choice", "options": 5, "answer": [4], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第42問〕（配点：２）\n確定判決の既判力に関する次のアからオまでの各記述のうち、判例の趣旨に照らし誤っているものを組み合わせたものは、後記１から５までのうちどれか。\nア．買主Ｘが売主Ｙに対し、売買契約により建物の所有権を取得したとして所有権の確認を求める訴えを提起し、請求を認容する判決が確定した後、ＹがＸに対し、同一の建物について所有権の確認を求めて訴えを提起し、その訴状において上記売買契約を詐欺により取り消すとの意思表示をした場合には、後訴裁判所がＹの主張を認めてＹの請求を認容する判決をすることは、前訴の確定判決の既判力に反し許されない。\nイ．土地の賃貸人Ｘが、その土地上に建物を所有する賃借人Ｙに対し、賃貸借契約の終了に基づき、建物を収去して土地を明け渡すことを求める訴えを提起し、請求を認容する判決が確定した後、ＹがＸに対し、請求異議の訴えを提起し、その訴状において建物買取請求権を行使するとの意思表示をした場合には、後訴裁判所が建物買取請求権行使の効果を異議の事由として認めてＹの請求を認容する判決をすることは、前訴の確定判決の既判力に反し許されない。\nウ．受贈者Ｘが贈与者Ｙに対し、贈与契約に基づく土地の引渡しを求める訴えを提起し、請求を認容する判決が確定した後、ＹがＸに対し、請求異議の訴えを提起し、その訴状において上記贈与契約は書面によらないものであるとして解除するとの意思表示をした場合には、後訴裁判所が解除の効果を異議の事由として認めてＹの請求を認容する判決をすることは、前訴の確定判決の既判力に反し許されない。\nエ．売主Ｘが買主Ｙに対し、絵画の売買契約が無効であったと主張して、所有権に基づく絵画の引渡しを求める訴えを提起し、請求を棄却する判決が確定した後、ＸがＹに対し、再び所有権に基づく同一の絵画の引渡しを求める訴えを提起し、その訴状においてＹが前訴判決の確定後も代金を支払わないとして上記売買契約を解除するとの意思表示をした場合に、後訴裁判所が Ｘの主張を認めてＸの請求を認容する判決をすることは、前訴の確定判決の既判力に反しない。\nオ．貸主Ｘが借主Ｙに対し、消費貸借契約に基づく貸金の返還を求める訴えを提起し、請求を認容する判決が確定した後、ＹがＸに対し、請求異議の訴えを提起し、その訴状において、前訴における事実審の口頭弁論終結前から存在し、かつ相殺適状にあったＸに対する反対債権をもって相殺する旨の意思表示をした場合には、後訴裁判所が相殺の意思表示の効果を異議の事由として認めてＹの請求を認容する判決をすることは、前訴の確定判決の既判力に反し許されない。\n１．アウ\n２．アエ\n３．イエ\n４．イオ\n５．ウオ", "source": "https://www.moj.go.jp/content/001421752.pdf", "answerSource": "https://www.moj.go.jp/content/001422570.pdf"}, {"id": "R6-minso-43", "year": "R6", "yearLabel": "令和6年", "subject": "民事訴訟法", "qno": 43, "haiten": 2, "type": "choice", "options": 5, "answer": [3], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第43問〕（配点：２）\n多数当事者訴訟に関する次のアからオまでの各記述のうち、判例の趣旨に照らし正しいものを組み合わせたものは、後記１から５までのうちどれか。\nア．Ｘの所有する甲土地上に乙建物を所有していたＡが死亡し、Ｙ１とＹ２がＡを相続した。この場合において、ＸがＹ１のみを被告として乙建物を収去して甲土地を明け渡すことを求める訴えを提起したときは、裁判所は、この訴えを不適法なものとして却下しなければならない。\nイ．鉄道事故の被害者Ｘが、鉄道会社Ｙを被告として不法行為に基づき損害賠償を求める訴えを提起した。この場合において、同一事故の別の被害者Ｚは、Ｙに対して不法行為に基づく損害賠償を求めるため、Ｘを被参加人として、上記訴訟に共同訴訟参加をすることはできない。\nウ．株式会社Ｙの株主Ｘが、Ｙを被告として、Ｚを取締役に選任した株主総会決議の取消しを求める訴えを提起したところ、ＺがＹを被参加人として補助参加をした。この訴訟につき、第一審裁判所がＸの請求を認容する判決をした場合において、Ｙの控訴期間が経過した後であっても、Ｚが判決書の送達を受けた日から２週間以内に控訴を提起したときは、Ｚによる控訴は適法である。\nエ．ＸがＹを被告として甲土地の所有権の確認を求める訴えを提起し、その係属中に、Ｙは、Ｚ に対して甲土地を譲渡した。その後、Ｚにこの訴訟を引き受けさせる決定があった場合においては、Ｚを除いてＸとＹとの間で訴訟上の和解をすることはできない。\nオ．債権者Ｘが、主債務者Ｙとその連帯保証人Ｚを共同被告とし、Ｙに対して貸金の返還を、Ｚ に対して連帯保証債務の履行を求める訴えを提起した。この訴訟において、Ｙが自己による弁済の事実を主張し、Ｚが当該弁済の事実を主張せず、Ｘが当該弁済の事実を争った場合でも、裁判所は、審理の結果、当該弁済の事実が認められるとの心証に至ったときは、当該弁済を理由として、ＸのＺに対する請求を棄却する旨の判決をすることができる。\n１．アイ\n２．アオ\n３．イウ\n４．ウエ\n５．エオ", "source": "https://www.moj.go.jp/content/001421752.pdf", "answerSource": "https://www.moj.go.jp/content/001422570.pdf"}, {"id": "R6-minso-44", "year": "R6", "yearLabel": "令和6年", "subject": "民事訴訟法", "qno": 44, "haiten": 2, "type": "choice", "options": 5, "answer": [2], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第44問〕（配点：２）\n控訴に関する次のアからオまでの各記述のうち、判例の趣旨に照らし正しいものを組み合わせたものは、後記１から５までのうちどれか。\nア．控訴が不適法でその不備を補正することができないことが明らかであるときは、第一審裁判所は、決定で、控訴を却下しなければならない。\nイ．明示的一部請求を認容した第一審判決に対して被告のみが控訴し、控訴審において新たに主張された相殺の抗弁に理由がある場合に、控訴裁判所が、債権の総額を確定し、その額から自働債権の額を控除した残存額が第一審で認容された一部請求の額を超えるとして控訴を棄却することは、不利益変更禁止の原則に反して許されない。\nウ．附帯控訴の提起は、附帯控訴状を第一審裁判所に提出してしなければならない。\nエ．控訴人は、被控訴人が附帯控訴をしているときであっても、被控訴人の同意を得ずに、控訴を取り下げることができる。\nオ．当事者の一方が控訴審の第１回口頭弁論期日に欠席したときは、その期日に出頭した当事者に、欠席した当事者に係る第一審における口頭弁論の結果を陳述させることはできない。\n１．アイ\n２．アエ\n３．イオ\n４．ウエ\n５．ウオ", "source": "https://www.moj.go.jp/content/001421752.pdf", "answerSource": "https://www.moj.go.jp/content/001422570.pdf"}, {"id": "R6-minso-45", "year": "R6", "yearLabel": "令和6年", "subject": "民事訴訟法", "qno": 45, "haiten": 2, "type": "multi", "options": 5, "answer": [2, 5], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第45問〕（配点：２）\n民事訴訟法上の制裁に関する次の１から５までの各記述のうち、誤っているものを２個選びなさい。\n１．控訴裁判所は、第一審判決を相当として控訴を棄却する場合において、控訴人が訴訟の完結を遅延させることのみを目的として控訴を提起したものと認めるときは、控訴人に対し、控訴の提起の手数料として納付すべき金額の１０倍以下の金銭の納付を命ずることができる。\n２．裁判所は、訴状の送達に必要な費用の予納を相当の期間を定めて原告に命じたにもかかわらず、その予納がないときは、決定で、訴状を却下しなければならない。\n３．裁判長が、当事者の一方に対し、特定の事項に関する主張を記載した準備書面の提出期間を定めたにもかかわらず、当事者がその責めに帰すべき事由により提出期間内に準備書面を提出しなかったために訴訟を遅滞させたときは、裁判所は、その当事者に、その当事者が勝訴する場合であっても、遅滞によって生じた訴訟費用の全部を負担させることができる。\n４．第三者が文書提出命令に従わないときは、裁判所は、決定で、過料に処する。\n５．攻撃又は防御の方法でその趣旨が明瞭でないものについて当事者が必要な釈明をしない場合であっても、裁判所は、これにより訴訟の完結を遅延させることとなると認めたときでなければ、当該攻撃又は防御の方法について却下の決定をすることができない。", "source": "https://www.moj.go.jp/content/001421752.pdf", "answerSource": "https://www.moj.go.jp/content/001422570.pdf"}, {"id": "R6-keiho-1", "year": "R6", "yearLabel": "令和6年", "subject": "刑法", "qno": 1, "haiten": 3, "type": "multi", "options": 5, "answer": [3, 4], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第１問〕（配点：３）\n業務妨害罪に関する次の１から５までの各記述を判例の立場に従って検討した場合、正しいものを２個選びなさい。\n１．業務妨害罪における「業務」は、適法なものであることを要するから、行政上の許可を受けていない営業行為や行政取締法規に違反する営業行為は、同罪で保護されることはない。\n２．業務妨害罪における「業務」は、職業その他継続して従事する事務又は事業をいい、営利を目的とするものであることを要する。\n３．甲は、利用客のキャッシュカードの暗証番号等を盗撮する目的で、２台の現金自動預払機が設置されている銀行の無人出張所において、一方の現金自動預払機にビデオカメラを設置し、同現金自動預払機に客を誘導する意図で、一般の利用客を装い、もう一方の現金自動預払機を ２時間にわたり占拠した。この場合、甲に偽計業務妨害罪が成立する。\n４．以前Ａ高校に勤務していた甲は、同校卒業式の開式直前に、式典会場である体育館において、予定された式典の進行を止めさせる目的で、参列の保護者らに対して大声で騒ぎ立て、これを制止しようとした教頭に怒号するなどして同会場を喧騒状態に陥れた。この場合、甲に威力業務妨害罪が成立する。\n５．甲は、弁護士Ａの弁護士としての活動を困難にする目的で、Ａが携行していた弁護士業務にとって重要な書類が在中するかばんを奪い取って自宅に隠匿した。この場合、甲に偽計業務妨害罪が成立する。", "source": "https://www.moj.go.jp/content/001421753.pdf", "answerSource": "https://www.moj.go.jp/content/001422571.pdf"}, {"id": "R6-keiho-2", "year": "R6", "yearLabel": "令和6年", "subject": "刑法", "qno": 2, "haiten": 2, "type": "choice", "options": 5, "answer": [3], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第２問〕（配点：２）\n次のアからオまでの各記述を判例の立場に従って検討した場合、正しいものの組合せは、後記１から５までのうちどれか。\nア．甲は、真冬の深夜、甲から暴行を受けて衰弱したＡを河川堤防上に連れて行き、未必の殺意をもって、Ａを脅迫して護岸際まで追い詰め、さらに、Ａに対して殴りかかる態度を示したため、逃げ場を失ったＡが足を滑らせて堤防から３メートル下の川に転落して溺死した。この場合、甲に殺人罪は成立しない。\nイ．非科学的な力による難病治療を標ぼうしていた甲は、小児Ａがインスリンを定期的に摂取しなければ死亡する現実的な危険性がある重度の糖尿病患者であることを認識しながら、甲を信頼するＡの母親Ｂに対し、Ａへのインスリンの不投与を執ようかつ強度に働き掛けた。Ｂは、 Ａを完治させるためには甲の指導に従う以外に方法はないといちずに考え、Ａへのインスリンの投与という期待された作為に出ることができない精神状態に陥り、甲から言われるがままＡ へのインスリン投与を中止したため、Ａはその後間もなく死亡した。この場合、甲に殺人罪が成立する。\nウ．甲は、Ａの殺害を企て、致死量の毒物を混入した砂糖を、情を知らない郵便配達員を介して、贈答品を装ってＡに郵送し、Ａがこれを受領したが、Ａは、毒物の混入に気付いたため、同砂糖を食用に供することはなかった。この場合、甲に殺人未遂罪が成立する。\nエ．甲は、Ａに成り済ましてＡの管理する資材置場に保管されていたＡ所有の建設機械を自己の所有物であるかのように装って中古機械業者Ｂに売却し、甲をＡと思い込んでいたＢが甲との約定に基づき同建設機械を同置場から搬出した。この場合、甲にＡに対する窃盗罪は成立しない。\nオ．医師ではない甲は、妊婦であるＡから依頼を受けてＡの堕胎手術を開始したが、医術により胎児を排出しなければＡの生命に危険を及ぼすおそれが生じたため、医師であるＢに胎児の排出を求めた。Ｂは、Ａの生命に対する危険を避けるため胎児をＡの母体外に排出させた。Ｂに緊急避難が成立する場合、甲に同意堕胎罪は成立しない。\n１．アイ\n２．アオ\n３．イウ\n４．ウエ\n５．エオ", "source": "https://www.moj.go.jp/content/001421753.pdf", "answerSource": "https://www.moj.go.jp/content/001422571.pdf"}, {"id": "R6-keiho-3", "year": "R6", "yearLabel": "令和6年", "subject": "刑法", "qno": 3, "haiten": 2, "type": "choice", "options": 5, "answer": [4], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第３問〕（配点：２）\n脅迫の罪に関する次の１から５までの各記述を判例の立場に従って検討した場合、正しいものはどれか。\n１．甲は、Ａに対し、「お前の家に火をつけてやる。」と告げたが、Ａは畏怖しなかった。この場合、甲にはＡに対する脅迫罪は成立しない。\n２．甲は、Ａに対し、「お前の親友のＢを殺すぞ。」と告げた。この場合、甲にはＡに対する脅迫罪が成立する。\n３．傷害事件の被害者であった甲は、加害者であったＡを告訴する意思はなかったが、単にＡを畏怖させようと考え、Ａに対し、「よくも俺に怪我をさせたな。告訴してやる。」と告げた。この場合、甲にはＡに対する脅迫罪は成立しない。\n４．甲は、Ａに対し、「あなたの家を見付けました。これから殺しに行きます。」旨記載した電子メールを送信したが、同メールは迷惑メールに振り分けられ、Ａは同メールの存在に気付かなかった。この場合、甲にはＡに対する脅迫罪は成立しない。\n５．甲は、Ａに告訴を思いとどまらせようと考え、Ａに対し、「警察に届け出たら無事でいられると思うなよ。告訴するなよ。」と告げたが、Ａは、警察官に告訴をした。この場合、甲には Ａに対する脅迫罪が成立し、Ａに対する強要未遂罪は成立しない。", "source": "https://www.moj.go.jp/content/001421753.pdf", "answerSource": "https://www.moj.go.jp/content/001422571.pdf"}, {"id": "R6-keiho-4", "year": "R6", "yearLabel": "令和6年", "subject": "刑法", "qno": 4, "haiten": 2, "type": "choice", "options": 5, "answer": [3], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第４問〕（配点：２）\n学生Ａ及びＢは、次の【事例】における甲の罪責について、後記の【会話】のとおり議論している。\n【会話】中の①から⑥までの（ ）内に後記【語句群】から適切なものを入れた場合、正しいものの組合せは、後記１から５までのうちどれか。なお、①から⑥までの（ ）内にはそれぞれ異なるものが入る。\n【事例】 甲は、返還期限を１年後と定めて甲所有の絵画を乙に無償で貸与したが、同期限経過後に、甲が何度も返還を求めても、乙は同絵画を返還しなかった。そのため、甲は、乙に対し、「俺をなめているのか。あの絵を返さないのなら殺すぞ。」などと言って脅し、乙は畏怖して上記絵画を甲に返還した。\n【会話】 学生Ａ．甲に恐喝罪が成立するか否かは、刑法第２５１条で準用される同法第２４２条の他人の「（①）」の解釈が問題になりますね。私は、他人の「（①）」は（②）と考えます。学生Ｂ．私は、他人の「（①）」は（③）と考えます。Ａさんの立場からすると、（④）ことから、乙の（①）は他人の「（①）」に該当せず、甲の行為は、恐喝罪の構成要件に該当しないことになりますね。学生Ａ．そのとおりです。ただ、（⑤）が成立する余地はあります。Ｂさんの立場からすると、乙の（①）は他人の「（①）」に該当し、甲の行為は、恐喝罪の構成要件に該当することになりますが、その結論は絵画の返還請求権を有する甲にとって酷ではありませんか。学生Ｂ．私の立場からも、権利実現のために実力行使に出る必要性、緊急性、手段の相当性の要件を満たすときは、（⑥）として違法性が阻却される余地があるので、酷ではないと考えます。\n【語句群】\nア．財物\nイ．占有\nウ．権原に基づくものに限られる\nエ．事実上の所持で足りる\nオ．絵画の返還期限が経過している\nカ．絵画の平穏な占有が継続している\nキ．恐喝未遂罪\nク．脅迫罪ケ．正当防衛コ．自救行為\n１．①ア ③ウ ④カ\n２．①イ ③エ ⑤キ\n３．②ウ ③エ ⑤ク\n４．②ウ ④オ ⑥ケ\n５．②エ ④カ ⑥コ", "source": "https://www.moj.go.jp/content/001421753.pdf", "answerSource": "https://www.moj.go.jp/content/001422571.pdf"}, {"id": "R6-keiho-5", "year": "R6", "yearLabel": "令和6年", "subject": "刑法", "qno": 5, "haiten": 2, "type": "choice", "options": 5, "answer": [4], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第５問〕（配点：２）\n共犯に関する次の１から５までの各記述を判例の立場に従って検討した場合、正しいものはどれか。\n１．甲及び乙は、強盗を共謀し、甲がＡ方の外で見張りをしている間に乙がＡ方に侵入したが、犯行の発覚を恐れた甲が、乙に対して電話で「人が集まっているから、早く止めた方がいい。俺は先に帰る。」と告げてその場から逃走した。乙は、甲の逃走を認識したが、Ａ方内においてＡに暴行を加えて現金を強取した。乙が強盗行為に着手する前に甲の逃走を認識した以上、甲及び乙に強盗罪の共同正犯は成立しない。\n２．甲及び乙は、危険な作業を共同して行う過程において、Ａが負傷する事故を防止するための共同の業務上の注意義務に共同して違反し、Ａに傷害を負わせた。甲と乙の間にＡの傷害発生についての共謀がなかった以上、甲及び乙に業務上過失致傷罪の共同正犯は成立しない。\n３．甲は、乙からＡを殺害するための毒物の入手を頼まれ、入手した毒物を乙に渡したが、結局、乙は、これを用いず、Ａに睡眠薬を服用させた上でＡを絞殺した。甲が乙に渡した毒物が利用されていないので、甲に殺人予備罪の共同正犯は成立しない。\n４．甲は、乙がホテルの一室において賭博場を開張して利得を得るつもりでいることを知りながら、乙のためにＡ及びＢを同室に誘い、賭博をさせた。甲と乙との間に意思連絡がなくとも、甲に賭博場開張図利罪の幇助犯が成立する。\n５．甲は、劇場の責任者の立場にあったが、出演者乙の公然わいせつ行為を目撃しながら、乙に軽く注意をしたものの、公演を止めず、同行為の継続を容易にした。甲が乙に注意をした以上、甲に公然わいせつ罪の共犯は成立しない。", "source": "https://www.moj.go.jp/content/001421753.pdf", "answerSource": "https://www.moj.go.jp/content/001422571.pdf"}, {"id": "R6-keiho-6", "year": "R6", "yearLabel": "令和6年", "subject": "刑法", "qno": 6, "haiten": 2, "type": "choice", "options": 5, "answer": [1], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第６問〕（配点：２）\n財産罪の客体に関して、学生Ａ及びＢが次の【会話】のとおり議論している。\n【会話】中の①から⑥までの（ ）内から適切なものを選んだ場合、正しいものの組合せは、後記１から５までのうちどれか。\n【会話】 学生Ａ．私は、財産罪の客体となる「財物」の意義について、①（\n  ａ．一定の空間を占める物体 ・\n  ｂ．人が管理し得る対象）を意味すると考えますので、電気を盗む行為は、刑法第２４ ５条があって初めて処罰できることになると考えます。学生Ｂ．Ａさんは、同条を②（\n  ｃ．注意規定・\n  ｄ．処罰創設規定）と考えるわけですね。それでは、Ａさんは、甲が名簿業者に販売する目的で、勤務先会社の書庫において、同所で管理されていた同社従業員名簿を管理権者の許可なく、自分の携帯電話機で撮影し、その画像データを保存した同携帯電話機を社外に持ち出した事案について、甲の窃盗罪の成否をどう考えますか。学生Ａ．私は、甲に窃盗罪が③（\n  ｅ．成立する・\n  ｆ．成立しない）と考えます。学生Ｂ．Ａさんは、「財物」の財産的価値についてどう考えますか。学生Ａ．私は、判例と同じく、財産罪の客体としての「財物」には、金銭的・経済的価値を④ （\n  ｇ．要する・\n  ｈ．要しない）と考えます。この点、判例は、再利用する目的で使用済みの収入印紙を持ち出した事案について窃盗罪の財物性を⑤（\n  ｉ．肯定・\n  ｊ．否定）しています。学生Ｂ．ところで、詐欺罪の客体である「財物」に関して、判例は、不動産を含むと解していますよね。それでは、乙が代金を支払う意思も能力もないのに、これらがあるように装って、不動産の所有者丙に同不動産の購入を申し込み、同不動産を乙に売却する契約を締結させ、その後、乙名義に所有権移転登記をさせた事案について、刑法第２４６条第１項の詐欺罪の既遂時期をいつと考えますか。学生Ａ．私は、判例と同様、⑥（\n  ｋ．所有権移転の意思表示があった時点・\n  ｌ．現実に占有移転させ、又は所有権取得の登記を経た時点）で既遂となると考えます。\n１．①ａ ③ｆ ⑥ｌ\n２．①ｂ ②ｃ ⑤ｉ\n３．②ｄ ④ｇ ⑥ｋ\n４．③ｅ ④ｈ ⑤ｉ\n５．③ｆ ⑤ｊ ⑥ｌ （参照条文）刑法第２４５条この章の罪については、電気は、財物とみなす。", "source": "https://www.moj.go.jp/content/001421753.pdf", "answerSource": "https://www.moj.go.jp/content/001422571.pdf"}, {"id": "R6-keiho-7", "year": "R6", "yearLabel": "令和6年", "subject": "刑法", "qno": 7, "haiten": 3, "type": "multi", "options": 5, "answer": [2, 4], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第７問〕（配点：３）\n罪数に関する次の１から５までの各記述を判例の立場に従って検討した場合、正しいものを２個選びなさい。\n１．甲は、転売目的でＡ所有のバッグを盗み、自宅に持ち帰ったが、転売先が見付からなかったため、同バッグを焼却した。この場合、甲に窃盗罪及び器物損壊罪が成立し、両罪は併合罪となる。\n２．甲は、乙に対し、「バッグを盗んできたら売却してやる。」などと言って窃盗を教唆し、乙が盗んだバッグを受け取り、同バッグの売却をあっせんした。この場合、甲に窃盗教唆罪及び盗品等有償処分あっせん罪が成立し、両罪は併合罪となる。\n３．甲は、当初より代金を支払う意思も能力もないのに、これらがあるように装って、民宿において朝食付きの宿泊利用を申し込み、同民宿に宿泊し、かつ、同民宿で朝食の提供を受けた。この場合、甲に刑法第２４６条第１項の詐欺罪及び同条第２項の詐欺罪が成立し、両罪は併合罪となる。\n４．甲は、真実は募金を災害復興支援のために使うつもりはなく、自己のために費消するつもりであるのにこれを隠して、事情を知らない多数のアルバイトの募金活動員に、連日、駅前で募金箱を持たせ、「災害復興支援のために募金をお願いします。」と連呼させ、多数回にわたり、不特定多数の通行人からそれぞれ少額の現金を募金箱に投入させてだまし取った。この場合、甲に詐欺罪の包括一罪が成立する。\n５．甲は、他人から盗んだクレジットカードを使用して商品をだまし取ろうと考え、Ａ名義のクレジットカードを窃取し、家電量販店において、店員に対し、Ａに成り済まして同クレジットカードを提示して商品の購入を申し込んだが、同店員に盗難カードであることを見破られたため、商品を手に入れることができなかった。この場合、甲に窃盗罪及び詐欺未遂罪が成立し、両罪は牽連犯となる。", "source": "https://www.moj.go.jp/content/001421753.pdf", "answerSource": "https://www.moj.go.jp/content/001422571.pdf"}, {"id": "R6-keiho-8", "year": "R6", "yearLabel": "令和6年", "subject": "刑法", "qno": 8, "haiten": 2, "type": "choice", "options": 5, "answer": [4], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第８問〕（配点：２）\n中止犯における中止行為の任意性の判断基準に関する次の各【見解】についての後記アからオまでの各【記述】のうち、正しいものの組合せは、後記１から５までのうちどれか。\n【見解】 Ａ説：行為者が、やろうと思えばできたが中止した場合を中止犯とし、やろうと思ってもできなかった場合は中止犯としない。 Ｂ説：犯罪を中止した原因が社会通念に照らして犯罪続行の障害と考えられる事情かどうかによって任意性を判断し、社会通念に照らして一般人であれば中止しないのが通例であると考えられるにもかかわらず、中止した場合を中止犯とする。\n【記述】\nア．Ａ説の立場からは、中止行為が反省・悔悟等の自己の行為に対する否定的な感情に基づく場合に限り、中止犯が成立する。\nイ．Ａ説の立場からは、中止犯が成立するためには、行為者が犯罪意思を完全に放棄する必要があり、犯罪に着手し、そのまま遂行可能であったが、他の機会を待つことが得策だと考えて中止した場合に中止犯が成立することはない。\nウ．建物に放火しようと考え媒介物に火を放ったが、犯行の発覚を恐れて焼損に至る前にその火を消した場合に、犯行の発覚を恐れることが一般に犯罪の遂行を妨げる事情たり得るとして中止犯の成立を否定する考え方は、Ｂ説と親和的である。\nエ．Ｂ説は、中止犯の刑の減免の根拠について責任が減少すると考える見解からは支持することができない。\nオ．Ｂ説に対しては、任意性の判断は行為者の主観を問題とするのであるから、妥当ではないとの批判がある。\n１．アイ\n２．アエ\n３．イウ\n４．ウオ\n５．エオ", "source": "https://www.moj.go.jp/content/001421753.pdf", "answerSource": "https://www.moj.go.jp/content/001422571.pdf"}, {"id": "R6-keiho-9", "year": "R6", "yearLabel": "令和6年", "subject": "刑法", "qno": 9, "haiten": 2, "type": "choice", "options": 5, "answer": [4], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第９問〕（配点：２）\n秘密を侵す罪に関する次の１から５までの各記述を判例の立場に従って検討した場合、正しいものはどれか。\n１．信書開封罪は、信書に記載された人の秘密を保護法益とするため、正当な理由なく、封をしてある信書を開けたとしても、信書の内容を確認しなかった場合には成立しない。\n２．秘密漏示罪は、医師や弁護士など人の秘密を知りやすい職にある者を主体とする犯罪であり、かつて同職にあったが、既に同職にない者については、同罪の主体とはならない。\n３．秘密漏示罪の「人の秘密」には、精神科の医師が医学的判断を内容とする精神鑑定を行う過程で知った鑑定対象者本人の秘密は含まれるが、同過程で知った同人以外の者の秘密は含まれない。\n４．弁護士が、正当な理由なく、業務上取り扱ったことについて知り得た人の秘密を漏らしたときには秘密漏示罪が成立するが、弁護士が業務とは無関係に偶然知った人の秘密を漏らしたとしても、同罪は成立しない。\n５．弁護士が、正当な理由なく、業務上取り扱ったことについて知り得た人の秘密を特定かつ少数の人に漏らした場合、その者らを通じて不特定又は多数の人へと秘密が漏れなければ、秘密漏示罪は成立しない。", "source": "https://www.moj.go.jp/content/001421753.pdf", "answerSource": "https://www.moj.go.jp/content/001422571.pdf"}, {"id": "R6-keiho-10", "year": "R6", "yearLabel": "令和6年", "subject": "刑法", "qno": 10, "haiten": 2, "type": "choice", "options": 5, "answer": [5], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第10問〕（配点：２）\n学生Ａ及びＢは、次の【事例】に関して、後記【会話】のとおり議論している。学生Ａ及びＢが後記【会話】の後も議論を続けた場合、後記１から５までの各【発言】のうち、学生Ａの発言であると考えられるものを選びなさい。\n【事例】 甲は、酒の力を借りて妻Ｖを殺害しようと決意し、心神喪失状態に陥る可能性があることを認識しながら、自宅において手元に包丁を用意して大量に飲酒し、その結果、心神喪失状態に陥り、計画どおり同包丁でＶを刺突して殺害した。\n【会話】 学生Ａ．私は、【事例】について飲酒行為を実行行為と捉え、甲に殺人罪が成立し、完全な刑事責任を問うことができると考えます。学生Ｂ．私も、【事例】の甲に殺人罪が成立し、完全な刑事責任を問うことができると考えますが、Ａさんの見解とは異なり、刺突行為を実行行為と捉えます。\n【発言】\n１．あなたの見解によると、結果発生の危険との関連性が希薄な行為を実行行為と捉えることになってしまいませんか。\n２．私は、実行行為が完全な責任能力のある原因行為時における意思決定の実現であるといえれば、完全な刑事責任を問うことは可能であると考え、実行行為の時点で責任能力が存在することは必要ないと考えます。\n３．あなたの見解は、【事例】の甲は責任能力のない自己を道具のように利用して殺人を実行したと考えるのですね。\n４．あなたの見解によると、仮に【事例】の甲が飲酒して眠り込んでしまい、刺突行為を全く行わなかったとしても、殺人未遂罪が成立し得ることになりますが、それは不当ではないですか。\n５．私の見解によれば、実行行為の時点で責任能力が存在しなければならないとしつつ、【事例】の甲の可罰性を説明できます。", "source": "https://www.moj.go.jp/content/001421753.pdf", "answerSource": "https://www.moj.go.jp/content/001422571.pdf"}, {"id": "R6-keiho-11", "year": "R6", "yearLabel": "令和6年", "subject": "刑法", "qno": 11, "haiten": 2, "type": "choice", "options": 5, "answer": [3], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第11問〕（配点：２）\n学生Ａ、Ｂ及びＣは、急迫不正の侵害に対してやむを得ずにした反撃行為（第１暴行）に続けて、侵害終了後も継続して追撃行為（第２暴行）に及んだ事例に関して、次の各【見解】のうち、いずれか異なる見解を採り、後記【会話】のとおり議論している。学生Ａ、Ｂ及びＣの採る見解として正しいものの組合せは、後記１から５までのうちどれか。\n【見解】\nア．防衛の意思が継続している限りで、侵害現在時の第１暴行と侵害終了後の第２暴行を一体的に評価し、１個の過剰防衛の成立を認める。\nイ．防衛の意思が継続しているか否かにかかわらず、第１暴行については正当防衛の成立を認め、第２暴行については単なる違法行為として扱う。\nウ．防衛の意思が継続している限りで、第１暴行については正当防衛の成立を認め、第２暴行については過剰防衛の成立を認める。\n【会話】 学生Ａ．第１暴行から傷害結果が発生した場合、第１暴行を単独で評価すれば正当防衛となり、相手方に対する傷害結果は適法とされるはずなのに、Ｂさんの見解だと、同じ傷害結果を違法と評価することになってしまい不都合ですよね。学生Ｂ．そうでしょうか。むしろ、私は、社会的にひとまとまりのエピソードとみられる事態については、１個の法的評価を与えるべきだと考えます。私の見解によれば、第１暴行と第 ２暴行のどちらから結果が生じたのかが分からない場合であっても、生じた結果に対する責任を問うことができます。学生Ｃ．正当防衛から生じた可能性のある結果に責任を問うのは不当ではありませんか。学生Ａ．その点はＣさんに賛成です。しかし、私は、第２暴行については、違法性の減少を認めることができないので、Ｃさんと同じ見解は採りません。学生Ｃ．私は、追撃行為についても、防衛行為としての性格をなお肯定できる限りで、過剰防衛を認めてよいだけの責任減少があると考えます。\n１．Ａ－ア Ｂ－イ Ｃ－ウ\n２．Ａ－ア Ｂ－ウ Ｃ－イ\n３．Ａ－イ Ｂ－ア Ｃ－ウ\n４．Ａ－イ Ｂ－ウ Ｃ－ア\n５．Ａ－ウ Ｂ－ア Ｃ－イ", "source": "https://www.moj.go.jp/content/001421753.pdf", "answerSource": "https://www.moj.go.jp/content/001422571.pdf"}, {"id": "R6-keiho-12", "year": "R6", "yearLabel": "令和6年", "subject": "刑法", "qno": 12, "haiten": 2, "type": "choice", "options": 5, "answer": [4], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第12問〕（配点：２）\n次のアからオまでの各記述を判例の立場に従って検討した場合、正しいものの組合せは、後記１から５までのうちどれか。\nア．甲は、恐喝事件の被疑者としてＡに逮捕状が発せられていると知りながら、Ａが犯人ではないと信じてＡを自宅にかくまったが、その後、Ａが逮捕され、Ａに対する有罪判決が確定した。この場合、Ａが犯人蔵匿罪の「罪を犯した者」ではないと甲が誤信していたから、甲に同罪は成立しない。\nイ．甲は、Ａが窃盗事件の犯人であると知りながら、甲が所有する船舶にＡを乗船させてかくまった。この場合、甲が窃盗罪の法定刑が罰金以上の刑であることを認識していなくても、甲に犯人蔵匿罪が成立する。\nウ．甲は、Ａを被疑者とする覚醒剤取締法違反事件の参考人として警察官の取調べを受け、真実はＡが覚醒剤を所持したことがなかったのに、それを警察官に隠してＡが覚醒剤を所持していたとの虚偽の内容の供述をして、それを信じた警察官に同内容の供述調書を作成させ、同調書に署名押印した。この場合、甲が虚偽の供述調書を作成させた以上、甲に証拠偽造罪が成立する。\nエ．甲は、Ａを被疑者とする殺人未遂事件につき、Ｂが必要な知識を有する参考人として警察官の取調べを受ける可能性があることを察知し、知人宅にＢをかくまった。この場合、Ｂが捜査段階における参考人であったとしても、甲に証拠隠滅罪が成立する。\nオ．甲は、Ａを被告人とする恐喝事件の公判に証人として出廷したＢの証言後、Ｂに対し、同公判係属中、同証言をしたことに対して報復する旨の脅迫文言を記載した文書を郵送して閲読させた。この場合、Ｂが証言を終えているから、甲に証人威迫罪は成立しない。\n１．アウ\n２．アオ\n３．イウ\n４．イエ\n５．エオ", "source": "https://www.moj.go.jp/content/001421753.pdf", "answerSource": "https://www.moj.go.jp/content/001422571.pdf"}, {"id": "R6-keiho-13", "year": "R6", "yearLabel": "令和6年", "subject": "刑法", "qno": 13, "haiten": 4, "type": "series", "options": 2, "answer": [2, 2, 2, 1, 2], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第13問〕（配点：４）\n次の【事例】に関する後記アからオまでの各【記述】を判例の立場に従って検討し、正しい場合には１を、誤っている場合には２を選びなさい。\n【事例】 保険会社の従業員である甲は、顧客Ａが独りで住んでいる一戸建て家屋に多額の現金が保管されていることを知り、Ａを殺害した上で同現金を手に入れようと計画した。甲は、その計画に従い、某月１日午後４時頃、Ａを戸外に連れ出し、麻酔薬を吸引させて気絶させた上、自動車の後部座席にＡを押し込み、同車を運転してＡを山奥まで運んだ。さらに、甲は、同日午後６時頃、気絶していたＡを車外に引っ張り出した上、自殺に見せ掛けるため、大木の枝に縛り付けた縄で Ａの頸部をくくり、そのままＡをつり下げて窒息死させた。甲は、Ａが持っていたＡ方の鍵を入手した上で、その場にＡの死体を放置して上記自動車を運転してＡ方に向かった。甲は、同日午後８時５０分頃、上記鍵を使用してＡ方内に立ち入り、同所に保管されていた現金５００万円を自己のかばんに入れて上記計画を完遂した。甲は、Ａ方を燃やして犯行を隠蔽しようと考え、同日午後９時頃、Ａ方居室の畳に火を放って Ａ方を出た。その直後、付近住民が異変に気付いてＡ方内に立ち入り、上記畳を取り外して屋外に投げ捨てたため、同畳以外は焼損しなかった。甲は、同月５日、逮捕され、その後の弁解録取手続において、自暴自棄になり、警察官Ｂが甲の弁解を記載した弁解録取書を手で破り捨てた。 Ａには死亡事故を起こしたことによる前科があり、乙は、かつてＡから同前科があることを聞いていた。乙は、Ａが死亡したことを知り、同月７日、インターネットの掲示板に「Ａは、事故を起こして人を死なせた前科がある。」と書き込み、インターネットを利用する不特定多数の者が閲覧可能な状態にした。\n【記述】\nア．甲がＡを殺害してＡ方で現金５００万円を手に入れた行為について、甲の計画を踏まえて甲の行為を全体的に考察すれば、生前のＡの財物に対する占有を侵害しているから、甲に殺人罪及び窃盗罪が成立し、強盗殺人罪は成立しない。\nイ．甲がＡを殺した後にその場にＡの死体を放置した行為について、甲にはＡの葬祭義務がないものの、甲がＡを殺した犯人である以上、甲に不作為による死体遺棄罪が成立する。\nウ．甲が焼損させたＡ方居室の畳は建造物の付属物であるから、甲が同畳を焼損させた行為について、甲に非現住建造物等放火既遂罪が成立する。\nエ．甲が弁解録取書を手で破り捨てた行為について、同弁解録取書に甲及びＢの署名押印がなかったとしても、甲に公用文書毀棄罪が成立する。\nオ．乙がインターネットの掲示板に書き込んだ行為について、乙が摘示した事実が真実であったとしても、乙に名誉毀損罪が成立する。 ［刑事訴訟法］", "source": "https://www.moj.go.jp/content/001421753.pdf", "answerSource": "https://www.moj.go.jp/content/001422571.pdf"}, {"id": "R6-keiso-14", "year": "R6", "yearLabel": "令和6年", "subject": "刑事訴訟法", "qno": 14, "haiten": 2, "type": "choice", "options": 5, "answer": [4], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第14問〕（配点：２）\n犯罪の証明に関する次のアからオまでの各記述のうち、誤っているものの組合せは、後記１から ５までのうちどれか。ただし、判例がある場合には、それに照らして考えるものとする。\nア．刑事裁判における有罪認定に必要とされる「合理的な疑いを差し挟む余地のない程度の立証」とは、反対事実が存在する疑いを全く残さない場合をいうものではなく、反対事実が存在するとの疑いをいれる余地があっても、健全な社会常識に照らして、その疑いに合理性がないと一般的に判断される場合には、有罪認定を可能とする趣旨である。\nイ．情況証拠は、一般的に、目撃供述や被告人の自白といった直接証拠に比べて証明力が低いから、情況証拠によって事実を認定すべき場合には、直接証拠によって事実を認定すべき場合よりも証明の程度が高度である必要がある。\nウ．証拠の証明力は、裁判官の自由な判断に委ねられるが、裁判官の恣意的な判断を許すものではないから、その判断は、論理則や経験則に照らし合理的なものでなければならない。\nエ．略式手続は、公判を開くことなく書面審理によって行われる簡易な手続であるから、犯罪の証明の程度は、証拠の優越で足りる。\nオ．共謀共同正犯における共謀の事実は、共謀共同正犯における「罪となるべき事実」に含まれるから、刑事訴訟法の規定により証拠能力が認められ、かつ、公判廷における適式な証拠調べを経た証拠による証明を要する。\n１．アウ\n２．アオ\n３．イウ\n４．イエ\n５．エオ", "source": "https://www.moj.go.jp/content/001421753.pdf", "answerSource": "https://www.moj.go.jp/content/001422571.pdf"}, {"id": "R6-keiso-15", "year": "R6", "yearLabel": "令和6年", "subject": "刑事訴訟法", "qno": 15, "haiten": 2, "type": "choice", "options": 5, "answer": [5], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第15問〕（配点：２）\n公判前整理手続に関する次のアからオまでの各記述のうち、正しいものの組合せは、後記１から ５までのうちどれか。\nア．検察官又は弁護人は、裁判所に対し、公判前整理手続に付すことを請求できない。\nイ．検察官は、証人の尋問を請求する場合、争点及び証拠の整理のために、その者の供述録取書等のうち、その者が公判期日において供述すると思料する内容が明らかになるものを裁判所に提出しなければならない。\nウ．弁護人は、公判前整理手続に付された事件の公判において被告人の行為が正当防衛に該当するとの主張を行う予定がある場合、公判前整理手続において、裁判所及び検察官に対し、これを明らかにする必要がある。\nエ．公判前整理手続に付された事件の公判では、検察官、被告人及び弁護人が公判前整理手続において取調べを請求しなかった証拠について、裁判所が職権で証拠調べをすることはできない。\nオ．裁判所は、公判前整理手続において鑑定を行うことを決定した場合、鑑定の結果の報告がなされるまでに相当の期間を要すると認めるときには、公判前整理手続内において、鑑定人に鑑定の手続の一部を行わせることができる。\n１．アイ\n２．アエ\n３．イオ\n４．ウエ\n５．ウオ", "source": "https://www.moj.go.jp/content/001421753.pdf", "answerSource": "https://www.moj.go.jp/content/001422571.pdf"}, {"id": "R6-keiso-16", "year": "R6", "yearLabel": "令和6年", "subject": "刑事訴訟法", "qno": 16, "haiten": 2, "type": "choice", "options": 5, "answer": [4], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第16問〕（配点：２）\n次のアからオまでの各記述のうち、正しいものの組合せは、後記１から５までのうちどれか。\nア．弁護人は、検察官から取調べの請求がなされた書証について、被告人の明示した意思に反して、それを証拠とすることに同意することができる。\nイ．控訴審では、被告人自身が弁論をすることはできず、控訴趣意書を被告人が差し出した場合でも、それに基づく弁論は弁護人が行う。\nウ．弁護人は、あらかじめ証拠を保全しておかなければその証拠を使用することが困難な事情があるときは、公訴の提起前に限り、裁判官に押収、捜索、検証、証人の尋問又は鑑定の処分を請求することができる。\nエ．原審における弁護人は、被告人の明示した意思に反して、被告人のため上訴をすることができない。\nオ．弁護人は、捜査機関が令状の発付を受けて行う捜索差押えに立ち会う権利を有する。\n１．アエ\n２．アオ\n３．イウ\n４．イエ\n５．ウオ", "source": "https://www.moj.go.jp/content/001421753.pdf", "answerSource": "https://www.moj.go.jp/content/001422571.pdf"}, {"id": "R6-keiso-17", "year": "R6", "yearLabel": "令和6年", "subject": "刑事訴訟法", "qno": 17, "haiten": 3, "type": "series", "options": 2, "answer": [2, 2, 1, 2, 1], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第17問〕（配点：３）\n次の【事例】で、Ｘの公判において、以下の各供述録取書を証拠として用いる場合（刑事訴訟法第３２６条及び同法第３２８条の場合を除く。）、その証拠能力について述べた後記アからオまでの【記述】のうち、正しいものには１を、誤っているものには２を選びなさい。\n【事例】 Ｘは、令和５年５月１日午後１１時頃、甲市内の路上で、帰宅途中の女性の横をバイクで通り過ぎる際に、その腕からハンドバッグをひったくったという窃盗の被疑事実で逮捕された。逮捕直後の警察官による取調べにおいて、Ｘは、上記の犯行が行われたとされる日は、午後７時に帰宅して以降、外出しておらず、本件犯行は自分が行ったものではない旨供述し、それが書面に録取された（供述録取書①）。しかし、その後の取調べで、警察官が、犯行現場付近に設置された防犯カメラに、同日午後１０時５８分にその場を通り過ぎるＸのバイクが映っていることを告げると、Ｘは、同日午後１１時頃に、酒を買うために犯行現場付近にあるコンビニエンスストアに出かけたことを失念しており、その際に犯行現場である道路をバイクで通ったことを思い出したが、本件犯行は自分が行ったものではない旨供述を変更し、それが書面に録取された（供述録取書②）。さらに、数日後の取調べにおいて、警察官から、上記のコンビニエンスストアの防犯カメラの同年５月１日夜の録画記録にはＸは全く映っていなかったことを告げられると、Ｘは観念した様子で、上記のひったくりを行ったことを認める供述をした。そこで、警察官はその供述を書面に録取した（供述録取書③）。\n【記述】\nア．Ｘが起訴され、公判期日において供述した場合、供述録取書①の証拠能力が認められることはない。\nイ．供述録取書①については、Ｘの供述の任意性に疑いがなければ、証拠能力が認められる。\nウ．供述録取書②については、供述録取書③と同じ要件の下で、証拠能力が認められる。\nエ．供述録取書③については、刑事訴訟法第３１９条第１項は適用されず、同法第３２２条第１項ただし書が適用される。\nオ．供述録取書③が、検察官による取調べにおいて作成された場合であっても、証拠能力が認められる要件は同じである。", "source": "https://www.moj.go.jp/content/001421753.pdf", "answerSource": "https://www.moj.go.jp/content/001422571.pdf"}, {"id": "R6-keiso-18", "year": "R6", "yearLabel": "令和6年", "subject": "刑事訴訟法", "qno": 18, "haiten": 2, "type": "choice", "options": 6, "answer": [2], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第18問〕（配点：２）\n接見交通権に関する次のアからオまでの各記述のうち、誤っているものは幾つあるか。後記１から６までのうちから選びなさい。ただし、判例がある場合には、それに照らして考えるものとする。\nア．接見交通権は、身体の拘束を受けている被告人又は被疑者が弁護人と相談し、その助言を受けるなど弁護人から援助を受ける機会を確保する目的で設けられたものであり、憲法の保障に由来するものである。\nイ．刑事訴訟法第３９条第３項の「捜査のため必要があるとき」とは、接見等を認めると取調べの中断等により捜査に顕著な支障が生ずる場合に限られるところ、捜査機関が弁護人から身体の拘束を受けている被疑者との接見の申出を受けた時に、現に被疑者を取調べ中である場合や実況見分、検証等に立ち会わせている場合、また、間近い時に取調べ等をする確実な予定があって、弁護人の申出に沿った接見を認めたのでは、取調べ等が予定どおり開始できなくなるおそれがある場合などは、原則として取調べの中断等により捜査に顕著な支障が生ずる場合に当たる。\nウ．弁護人を選任することができる者の依頼により弁護人となろうとする者と被疑者との逮捕直後の初回の接見は、これを速やかに行うことが被疑者の防御の準備のために特に重要であるので、捜査機関は、現に被疑者を取調べ中であって、弁護人の申出に沿った即時の接見を認めると捜査に顕著な支障が生じる場合であっても、直ちに取調べを中断して、接見させなければならない。\nエ．勾留されている被告人が同時に余罪の被疑者として勾留されている場合、検察官は、その余罪である被疑事件の捜査のため必要があるときは、被告事件についての防御権の不当な制限にわたらない限り、被告事件の弁護人と被告人との接見に関し、その日時等を指定することができる。\nオ．検察官が検察庁の庁舎内に接見設備のある部屋等が存在しないことを理由として接見の申出を拒否したにもかかわらず、弁護人がなお同庁舎内における即時の接見を求め、即時に接見する必要性が認められる場合には、検察官は、例えば立会人のいる部屋での短時間の接見などのように、いわゆる秘密交通権が十分に保障されないような態様の短時間の接見であってもよいかどうかという点につき、弁護人の意向を確かめ、弁護人がそのような接見であっても差し支えないとの意向を示したときは、それができるように特別の配慮をすべき義務がある。\n１．０個\n２．１個\n３．２個\n４．３個\n５．４個\n６．５個", "source": "https://www.moj.go.jp/content/001421753.pdf", "answerSource": "https://www.moj.go.jp/content/001422571.pdf"}, {"id": "R6-keiso-19", "year": "R6", "yearLabel": "令和6年", "subject": "刑事訴訟法", "qno": 19, "haiten": 3, "type": "choice", "options": 6, "answer": [1], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第19問〕（配点：３）\n私人による現行犯逮捕に関する次のアからオまでの各記述のうち、正しいものは幾つあるか。後記１から６までのうちから選びなさい。ただし、判例がある場合には、それに照らして考えるものとする。\nア．私人は、急速を要する場合に限り、その理由を告げた上で現行犯人を逮捕することができる。\nイ．司法警察員は、私人から現行犯人の引渡しを受けた場合、直ちに裁判官の逮捕状を求める手続をしなければならない。\nウ．私人が現行犯逮捕する場合には、その私人が犯行を現に目撃していなければならない。\nエ．司法警察員は、私人から現行犯人の引渡しを受け、留置の必要があると思料する場合、逮捕された時からではなく、その者を受け取った時から、４８時間以内に検察官に送致する手続をしなければならない。\nオ．現行犯人を逮捕した私人は、逮捕の現場で令状によらずに捜索差押えをすることができる。\n１．０個\n２．１個\n３．２個\n４．３個\n５．４個\n６．５個", "source": "https://www.moj.go.jp/content/001421753.pdf", "answerSource": "https://www.moj.go.jp/content/001422571.pdf"}, {"id": "R6-keiso-20", "year": "R6", "yearLabel": "令和6年", "subject": "刑事訴訟法", "qno": 20, "haiten": 3, "type": "series", "options": 2, "answer": [1, 1, 2, 1, 2], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第20問〕（配点：３）\n次の【見解】は、刑事訴訟法第３２８条の趣旨及び同条によって許容される証拠の範囲に関するものである。後記アからオまでの【証拠】のうち、【見解】に照らし、同条によって許容される証拠に当たるものには１を、当たらないものには２を選びなさい。なお、被告人ＡがⅤを包丁で刺して殺害したとする殺人被告事件の公判期日において、本件犯行当日に犯行を目撃したとするＷが、「Ｖを包丁で刺したのはＡでした。」と証言しているものとする。また、いずれの証拠との関係でも、同法第３２６条の同意はなされていないものとする。\n【見解】 「刑事訴訟法第３２８条は、公判準備又は公判期日における被告人、証人その他の者の供述が、別の機会にしたその者の供述と矛盾する場合に、矛盾する供述をしたこと自体の立証を許すことにより、公判準備又は公判期日におけるその者の供述の信用性の減殺を図ることを許容する趣旨のものであり、別の機会に矛盾する供述をしたという事実の立証については、同法が定める厳格な証明を要する趣旨であると解するのが相当である。そうすると、同条により許容される証拠は、信用性を争う供述をした者のそれと矛盾する内容の供述が、同人の供述書、供述を録取した書面（同法が定める要件を満たすものに限る。）又は同人の供述を聞いたとする者の公判期日の供述の中に現れている部分に限られるというべきである。」 【証拠】\nア．Ｗの知人Ｚによる、「Ｗは、本件の翌日に、『私は昨日ＢがⅤを包丁で刺すのを見た。』と言っていた。」とする公判期日の供述\nイ．本件当日の日付のＷの日記で、「今日ＢがⅤを包丁で刺すのを見てしまった。」との記載があるもの\nウ．Ｗが本件の捜査段階において司法警察員Ｋの聞き込みに応じてした「私はＢがⅤを包丁で刺すのを見た。」という供述が記載されている、Ｋ作成に係る捜査報告書で、Ｗの署名及び押印がないもの\nエ．Ｗが本件の捜査段階において司法警察員の取調べを受けてした「私はＢがⅤを包丁で刺すのを見た。」という供述を録取した書面で、Ｗの署名及び押印があるもの\nオ．Ｗとは別の地点から本件を目撃したとするＹが本件の捜査段階において検察官の取調べを受けてした「私はＢがⅤを包丁で刺すのを見た。」という供述を録取した書面で、Ｙの署名及び押印があるもの", "source": "https://www.moj.go.jp/content/001421753.pdf", "answerSource": "https://www.moj.go.jp/content/001422571.pdf"}, {"id": "R6-keiso-21", "year": "R6", "yearLabel": "令和6年", "subject": "刑事訴訟法", "qno": 21, "haiten": 2, "type": "choice", "options": 5, "answer": [3], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第21問〕（配点：２）\n被疑者の勾留に関する次のアからオまでの各記述のうち、正しいものの組合せは、後記１から５までのうちどれか。ア. 裁判官は、勾留の請求を受けて被疑者に被疑事件を告げる際、被疑者が既に弁護人を選任している場合でも、弁護人選任権を告げる必要がある。イ. ３０万円以下の罰金に当たる刑法の罪に係る事件については、被疑者が罪を犯したと疑うに足りる相当な理由があり、かつ、逃亡すると疑うに足りる相当な理由がある場合であっても、被疑者の住居が不定でなければ被疑者を勾留することはできない。ウ. 検察官から勾留の請求があった翌日に裁判官が被疑者を勾留する旨の裁判をした場合、その勾留期間は、同裁判があった日から起算する。エ. 勾留されている被疑者について、裁判官が接見禁止の裁判をした場合、被疑者の弁護人であっても、被疑者と接見することはできない。オ. 勾留されている被疑者に対する接見禁止の裁判は、検察官の請求がなくとも、裁判官が職権ですることができる。\n１．アイ\n２．アウ\n３．イオ\n４．ウエ\n５．エオ", "source": "https://www.moj.go.jp/content/001421753.pdf", "answerSource": "https://www.moj.go.jp/content/001422571.pdf"}, {"id": "R6-keiso-22", "year": "R6", "yearLabel": "令和6年", "subject": "刑事訴訟法", "qno": 22, "haiten": 2, "type": "choice", "options": 5, "answer": [1], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第22問〕（配点：２）\n次の【事例】について述べた後記アからオまでの【記述】のうち、正しいものの組合せは、後記 １から５までのうちどれか。ただし、判例がある場合には、それに照らして考えるものとする。\n【事例】 司法警察員Ｘは、甲が自宅において覚醒剤を密売しているとの被疑事実により、捜索すべき場所を甲宅、差し押さえるべき物を覚醒剤、パソコン等とする捜索差押許可状（以下「本件許可状」という。）の発付を受けて、甲宅に赴いた。甲宅には、甲のみが在宅していたところ、Ｘは、甲に本件許可状を呈示した上で、甲宅に立ち入り、日没前から①甲を立会人として捜索を開始した。甲宅の捜索を実施中、甲と同居する母親Ａが帰宅したため、②Ｘは、Ａが許可なく甲宅へ立ち入ることを禁止した。Ｘは、甲が覚醒剤密売の顧客リストをパソコンに保存しているとの情報を基に捜索を進めていたところ、甲宅リビングルームのテーブルの上にパソコン１台を発見したことから、③同パソコンを差し押さえた。その後もＸは、捜索の必要があると判断し、④本件許可状に「夜間でも執行することができる」旨の記載がなかったものの、日没後も捜索を継続した。その後、宅配便の配達員によって甲宛の小包が配達されたことから、甲は、甲宅内でこれを受領した。Ｘは、甲に対して開封を求めたが、甲がこれを拒否したため、⑤Ｘにおいて同小包を開封したところ、覚醒剤が発見されたことから、これを差し押さえた。\n【記述】\nア．下線部①につき、仮に甲宅に誰も在宅していなかった場合でも、甲宅の隣人を立会人として捜索することができる。\nイ．下線部②につき、Ａは甲宅の居住者であるため、Ａが許可なく甲宅に立ち入るのを禁止することは違法である。\nウ．下線部③につき、当該パソコンに覚醒剤密売の顧客リストが記録されている蓋然性があり、その場で確認していたのではその情報を損壊される危険があると認められる場合は、内容を確認することなく当該パソコンを差し押さえることも許される。\nエ．下線部④につき、本件許可状に「夜間でも執行することができる」旨の記載がないことから、日没後に捜索を継続することは違法である。\nオ．下線部⑤につき、本件許可状の効力はその呈示後に甲宅に搬入された物品には及ばないため、当該小包を開封したことは違法である。\n１．アウ\n２．アオ\n３．イエ\n４．イオ\n５．ウエ", "source": "https://www.moj.go.jp/content/001421753.pdf", "answerSource": "https://www.moj.go.jp/content/001422571.pdf"}, {"id": "R6-keiso-23", "year": "R6", "yearLabel": "令和6年", "subject": "刑事訴訟法", "qno": 23, "haiten": 2, "type": "choice", "options": 5, "answer": [5], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第23問〕（配点：２）\n取調べに関する次のアからオまでの各記述のうち、正しいものの組合せは、後記１から５までのうちどれか。\nア．検察官又は検察事務官は、裁判員の参加する合議体で取り扱うべき事件について逮捕又は勾留されている被疑者を取り調べるときは、被疑者の供述及びその状況を録音及び録画を同時に行う方法により記録媒体に必ず記録しておかなければならない。\nイ．検察官は、被疑者以外の者が取調べに対して出頭を拒否した場合、その者が犯罪の捜査にどの程度関連した知識を有しているか明らかでなくとも、第１回の公判期日前であれば、その者の証人尋問を裁判官に請求することができる。\nウ．司法警察職員は、被疑者の供述録取書につき、これを被疑者に閲覧させ、又は読み聞かせて、誤りがないかどうかを問い、被疑者が増減変更の申立てをしたときは、その供述を調書に記載しなければならず、被疑者が調書に誤りのないことを申し立てたときは、これに署名押印することを求めることができる。\nエ．逮捕又は勾留されていない被疑者は、司法警察職員から出頭を求められた場合、これを拒むことができるが、検察官又は検察事務官から出頭を求められた場合、これを拒むことはできない。\nオ．司法警察職員は、日本語に通じない被疑者を通訳を介して取り調べる場合、その供述録取書を日本語で作成しても違法ではない。\n１．アイ\n２．アエ\n３．イオ\n４．ウエ\n５．ウオ", "source": "https://www.moj.go.jp/content/001421753.pdf", "answerSource": "https://www.moj.go.jp/content/001422571.pdf"}, {"id": "R6-keiso-24", "year": "R6", "yearLabel": "令和6年", "subject": "刑事訴訟法", "qno": 24, "haiten": 3, "type": "choice", "options": 5, "answer": [5], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第24問〕（配点：３）\n以下のⅠからⅢまでの【結論】は、次の①及び②の【設問】に関するものである。\n【結論】に関する後記アからオまでの【記述】のうち、正しいものの組合せは、後記１から５までのうちどれか。\n【設問】 ① 被告人が犯行を否認している場合、被告人と共に犯行を行った旨の共犯者の自白のみで被告人を有罪とすることが許されるか。 ② 共犯者だけでなく、被告人も犯行を行ったことを認めている場合、共犯者の自白で被告人の自白を補強して被告人を有罪とすることが許されるか。\n【結論】 Ⅰ．①及び②のいずれの場合も、被告人を有罪とすることが許されない。 Ⅱ．①の場合には、被告人を有罪とすることが許されないが、②の場合には、被告人を有罪とすることが許される。 Ⅲ．①及び②のいずれの場合も、被告人を有罪とすることが許される。\n【記述】\nア．共犯者に対しては反対尋問が可能であり、反対尋問を経ない被告人の自白より反対尋問を経た共犯者の自白の証明力が強いのは当然であると考えると、結論Ⅰに結び付きやすい。\nイ．刑事訴訟法第３１９条第２項の規定は、自由心証主義の例外であるから限定的に解すべきであると考えると、結論Ⅰに結び付きやすい。\nウ．結論Ⅱとする立場は、憲法第３８条第３項の「本人の自白」に共犯者の自白も含まれるのは、被告人が否認し、共犯者が自白している場合に限られると考えることになる。\nエ．自白の証明力の過大評価を防止するという刑事訴訟法第３１９条第２項の規定の趣旨からすれば、被告人の自白と共犯者の自白を区別する理由がないと考えると、結論Ⅲに結び付きやすい。\nオ．結論Ⅲとする立場に対しては、ほかに補強証拠がない限り、否認した被告人が有罪、自白した共犯者が無罪になるという非常識な結論が生じかねないとの批判がある。\n１．アイ\n２．アオ\n３．イエ\n４．ウエ\n５．ウオ", "source": "https://www.moj.go.jp/content/001421753.pdf", "answerSource": "https://www.moj.go.jp/content/001422571.pdf"}, {"id": "R6-keiso-25", "year": "R6", "yearLabel": "令和6年", "subject": "刑事訴訟法", "qno": 25, "haiten": 2, "type": "choice", "options": 5, "answer": [4], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第25問〕（配点：２）\n起訴状一本主義に関する次のアからオまでの各記述のうち、誤っているものの組合せは、後記１から５までのうちどれか。ただし、判例がある場合には、それに照らして考えるものとする。\nア．起訴状一本主義に違反した公訴提起の手続は無効であり、裁判所は、判決で公訴を棄却しなければならない。\nイ．前科の事実を手段・方法として恐喝したという事実で公訴を提起する場合には、公訴事実中に被告人の前科を記載することも許される。\nウ．刑事訴訟法第２５６条第６項により、起訴状には裁判官に事件につき予断を生じさせるおそれのある書類その他の物を添付することが禁止されているので、検察官が勾留されている被疑者について公訴を提起する際に、裁判所に起訴状を提出すると同時に、被告人の逮捕状や勾留状をその裁判所の裁判官に差し出すことは許されない。\nエ．公判審理を担当する裁判所は、証拠開示に関する裁定のためであっても、第１回公判期日前には証拠の提示を求めることはできない。\nオ．略式命令を請求する場合において、その請求と同時に検察官が立証に必要があると思料する書類及び証拠物を裁判所に差し出しても、刑事訴訟法第２５６条第６項に反しない。\n１．アイ\n２．アオ\n３．イエ\n４．ウエ\n５．ウオ", "source": "https://www.moj.go.jp/content/001421753.pdf", "answerSource": "https://www.moj.go.jp/content/001422571.pdf"}, {"id": "R6-keiso-26", "year": "R6", "yearLabel": "令和6年", "subject": "刑事訴訟法", "qno": 26, "haiten": 2, "type": "choice", "options": 5, "answer": [5], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第26問〕（配点：２）\n強制採尿に関する次のアからオまでの各記述のうち、正しいものの組合せは、後記１から５までのうちどれか。ただし、判例がある場合には、それに照らして考えるものとする。\nア．膀胱にたまっている尿は物ではなく身体の一部であるから、捜索差押許可状によって、強制採尿を行うことはできない。\nイ．強制採尿は、尿道にカテーテルを挿入するという身体への侵襲を伴うから、鑑定処分許可状が必要である。\nウ．強制採尿が現行法上の強制処分として認められる以上、それが尿を獲得するための最終的手段でなくとも、裁判官はそのための令状を発付することができる。\nエ．被疑者から尿を採取するに当たり、被疑者が錯乱状態に陥っていて任意の尿の提出が期待できない状況にあるときは、任意提出の機会を提供せずに、令状によって強制採尿を行うことができる。\nオ．裁判官は、強制採尿のための令状を発付するに当たり、医師をして医学的に相当と認められる方法により行わせなければならない旨の条件を付さなければならない。\n１．アイ\n２．アウ\n３．イエ\n４．ウオ\n５．エオ", "source": "https://www.moj.go.jp/content/001421753.pdf", "answerSource": "https://www.moj.go.jp/content/001422571.pdf"}, {"id": "R7-kenpo-1", "year": "R7", "yearLabel": "令和7年", "subject": "憲法", "qno": 1, "haiten": 3, "type": "series", "options": 2, "answer": [1, 2, 1], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第１問〕（配点：３）\n「公共の福祉」に関する次のアからウまでの各記述について、ｂの見解がａの見解の批判となっている場合には１を、そうでない場合には２を選びなさい。\nア．\n  ａ．憲法第１２条・第１３条の「公共の福祉」は、人権の外にあって、それを制約することのできる一般的な原理であり、憲法第２２条・第２９条が「公共の福祉」を掲げたことに特別な意味はない。\n  ｂ．「公共の福祉」を「公益」や「公共の安寧秩序」と言い換えたところで、極めて抽象的な概念であることは変わらないので、結果として、「公共の福祉」が明治憲法下の法律の留保のような機能を実質的に果たすおそれがある。\nイ．\n  ａ．憲法第２２条・第２９条の「公共の福祉」は経済的・社会的な政策的人権制約の根拠となるが、憲法第１２条・第１３条の「公共の福祉」はそのような制約の根拠とはならず、人権の内在的制約のみを意味する。\n  ｂ．憲法第１２条・第１３条を倫理的・訓示的規定として解釈すると、新しい人権を基礎付ける包括的な人権条項として憲法第１３条を活用することができなくなる。\nウ．\n  ａ．「公共の福祉」とは人権相互の矛盾・衝突を調整するための実質的公平の原理であり、この意味での「公共の福祉」は、憲法規定にかかわらず全ての人権に論理必然的に内在している。\n  ｂ．人権に対する制約を全て人権の内在的制約として説明する考え方は、論理的に殺人の自由や強盗の自由をも一旦憲法の保障する人権に含めた上で、その制約の可否を議論することになるので、人権に関する一般的な理解や説明と整合しない。", "source": "https://www.moj.go.jp/content/001443616.pdf", "answerSource": "https://www.moj.go.jp/content/001444173.pdf"}, {"id": "R7-kenpo-2", "year": "R7", "yearLabel": "令和7年", "subject": "憲法", "qno": 2, "haiten": 2, "type": "choice", "options": 8, "answer": [8], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第２問〕（配点：２）\n法の下の平等に関する次のアからウまでの各記述について、最高裁判所の判例の趣旨に照らして、正しいものには○、誤っているものには×を付した場合の組合せを、後記１から８までの中から選びなさい。\nア．本邦に在留する外国人で、在留期間の更新又は変更を受けないで在留期間を経過して本邦に残留する者（不法残留者）を生活保護法による保護の対象としないことは、外国人を日本人と区別して取り扱うもので、憲法第１４条第１項に違反する。\nイ．女性についてのみ前婚の解消又は取消しの日から一定期間、再婚を禁止することは、再婚をする際の要件に関し男性と女性とを区別するものであるから、女性についてのみ再婚禁止期間を設けること自体が、憲法第１４条第１項に違反する。\nウ．尊属に対する尊重報恩は、旧家族制度的倫理観に基づくもので合理的とはいえないから、子が親を殺害した殺人事件において、被害者が尊属であることを犯情の一つとして具体的事件の量刑上重視することは、憲法第１４条第１項に違反する。\n１．ア○ イ○ ウ○\n２．ア○ イ○ ウ×\n３．ア○ イ× ウ○\n４．ア○ イ× ウ×\n５．ア× イ○ ウ○\n６．ア× イ○ ウ×\n７．ア× イ× ウ○\n８．ア× イ× ウ×", "source": "https://www.moj.go.jp/content/001443616.pdf", "answerSource": "https://www.moj.go.jp/content/001444173.pdf"}, {"id": "R7-kenpo-3", "year": "R7", "yearLabel": "令和7年", "subject": "憲法", "qno": 3, "haiten": 2, "type": "choice", "options": 8, "answer": [4], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第３問〕（配点：２）\n次の対話は、政教分離に関する教授と学生の対話である。教授の各質問に対する次のアからウまでの学生の各回答について、正しいものには○、誤っているものには×を付した場合の組合せを、後記１から８までの中から選びなさい。教授．憲法第２０条第１項の「宗教団体」、憲法第８９条前段の「宗教上の組織若しくは団体」の意味について、最高裁判所はどう解していますか。\nア．これらは同義であり、特定の宗教の信仰、礼拝又は普及等の宗教的活動を行うことを本来の目的とする組織ないし団体と解しています。教授．では、神社に対する玉串料としての県による公金支出が問題となった事案では、最高裁判所は、これが憲法第２０条第３項の「宗教的活動」に当たるか否かについて、どのような判断をしましたか。\nイ．靖国神社及び護国神社が挙行した例大祭等への玉串料等の奉納は、県が特定の宗教団体の挙行する重要な宗教上の祭祀に関わり合いを持ったことは否定できないが、遺族援護行政の一環として、戦没者の慰霊及び遺族の慰謝という世俗的な目的で行われた社会的儀礼にすぎないものであるから、宗教的活動には当たらないと判断しました。教授．市が市有地を無償で宗教的施設の敷地としての利用に供している行為について、憲法第８ ９条違反が問題となった事案では、最高裁判所はどのような判断をしましたか。\nウ．宗教的施設への市有地の利用提供行為は、市が特定の宗教上の組織との間にのみ意識的に特別の関わり合いを持つものであり、一般人に対し市が特定の宗教に特別の便宜を与えているとの印象をもたらすものであるから、その行為の目的及び効果に鑑み、憲法第８９条に違反すると判断しました。\n１．ア○ イ○ ウ○\n２．ア○ イ○ ウ×\n３．ア○ イ× ウ○\n４．ア○ イ× ウ×\n５．ア× イ○ ウ○\n６．ア× イ○ ウ×\n７．ア× イ× ウ○\n８．ア× イ× ウ×", "source": "https://www.moj.go.jp/content/001443616.pdf", "answerSource": "https://www.moj.go.jp/content/001444173.pdf"}, {"id": "R7-kenpo-4", "year": "R7", "yearLabel": "令和7年", "subject": "憲法", "qno": 4, "haiten": 3, "type": "series", "options": 2, "answer": [2, 1, 2], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第４問〕（配点：３）\n表現の自由に関する次のアからウまでの各記述について、最高裁判所の判例の趣旨に照らして、それぞれ正しい場合には１を、誤っている場合には２を選びなさい。\nア．憲法第２１条第２項前段にいう「検閲」とは、公権力が主体となって、思想内容等の表現物を対象とし、その全部又は一部の発表の禁止を目的として、対象とされる一定の表現物につき網羅的一般的に、発表前にその内容を審査した上、不適当と認めるものの発表を禁止することを、その特質として備えるものを指す。\nイ．表現物に対する税関検査は、表現の事前規制たる側面を有するものの、検査対象となる表現物は、一般に、国外においては既に発表済みで、輸入が禁止されるだけで、発表の機会が全面的に奪われてしまうものでもなく、また、税関は特に思想内容等を対象として規制することを独自の使命とするものではないから、憲法第２１条第２項前段にいう「検閲」には当たらない。\nウ．公立図書館において、図書館資料の選択は職員の専門的な判断に委ねられており、職員が閲覧に供されている図書を著作者の思想や信条を理由に廃棄したとしても、当該著作者はその思想、意見等をその著作物によって公衆に伝達する機会を完全に奪われたわけではないから、その廃棄行為は国家賠償法上違法とはならない。", "source": "https://www.moj.go.jp/content/001443616.pdf", "answerSource": "https://www.moj.go.jp/content/001444173.pdf"}, {"id": "R7-kenpo-5", "year": "R7", "yearLabel": "令和7年", "subject": "憲法", "qno": 5, "haiten": 2, "type": "choice", "options": 8, "answer": [7], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第５問〕（配点：２）\n旭川学力テスト事件判決（最高裁判所昭和５１年５月２１日大法廷判決、刑集３０巻５号６１５頁）に関する次のアからウまでの各記述について、当該判決の趣旨に照らして、正しいものには○、誤っているものには×を付した場合の組合せを、後記１から８までの中から選びなさい。\nア．親は、子どもに対する自然的関係により、子どもの教育に対する一定の支配権を有すると認められるが、このような親の教育の自由は、主として家庭教育等、学校外の教育において現れるものの、そこに学校選択の自由は含まれない。\nイ．普通教育における教師は、子どもの教育が教師と子どもとの間の直接の人格的接触を通じ、その個性に応じて行われなければならないという本質的要請に照らし、教授の具体的内容及び方法について完全に自由な裁量を有する。\nウ．国は、国政の一部として広く適切な教育政策を樹立、実施し得る者として、憲法上、子ども自身の利益の擁護等のため、必要かつ相当と認められる範囲において、教育内容につき決定する権能を有する。\n１．ア○ イ○ ウ○\n２．ア○ イ○ ウ×\n３．ア○ イ× ウ○\n４．ア○ イ× ウ×\n５．ア× イ○ ウ○\n６．ア× イ○ ウ×\n７．ア× イ× ウ○\n８．ア× イ× ウ×", "source": "https://www.moj.go.jp/content/001443616.pdf", "answerSource": "https://www.moj.go.jp/content/001444173.pdf"}, {"id": "R7-kenpo-6", "year": "R7", "yearLabel": "令和7年", "subject": "憲法", "qno": 6, "haiten": 3, "type": "series", "options": 2, "answer": [2, 2, 1], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第６問〕（配点：３）\n労働基本権に関する次のアからウまでの各記述について、それぞれ正しい場合には１を、誤っている場合には２を選びなさい。\nア．憲法第２８条に規定される労働基本権は、憲法第２５条の生存権の保障を基本理念として、勤労者に対して人間に値する生存を保障すべきものとする見地に立ち、憲法第２７条の定める勤労の権利及び勤労条件に関する基準の法定の保障とあいまって、勤労者の経済的地位の向上のための手段として、団結権、団体交渉権、争議権等を保障しようとするものであって、社会権的性質を有する権利であり、自由権としての側面はない。\nイ．基本的人権の規定は、公権力との関係で国民の権利・自由を保護するものであると考えられており、労働基本権も、国家との関係での権利保障が本質であって、使用者対労働者という関係においては、私法の一般規定に憲法第２８条の趣旨を取り込んで解釈・適用することによって間接的に適用され、その結果、正当な争議行為に対する損害賠償からの民事免責が認められる。\nウ．全農林警職法事件判決（最高裁判所昭和４８年４月２５日大法廷判決、刑集２７巻４号５４ ７頁）は、争議行為を禁止し、そのあおり行為を処罰の対象としていた国家公務員法に関し、公務員が行う争議行為を違法性の有無及び強弱によって区別し、違法性の強い争議行為を、違法性の強い又は社会的許容性のない行為によりあおるなどした場合に限って刑事制裁を科すべき趣旨であると解釈することについて、犯罪構成要件の明確性を要請する憲法第３１条に違反する疑いがあることなどを理由として、否定している。", "source": "https://www.moj.go.jp/content/001443616.pdf", "answerSource": "https://www.moj.go.jp/content/001444173.pdf"}, {"id": "R7-kenpo-7", "year": "R7", "yearLabel": "令和7年", "subject": "憲法", "qno": 7, "haiten": 3, "type": "series", "options": 2, "answer": [2, 2, 1], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第７問〕（配点：３）\n憲法の意味や分類に関する次のアからウまでの各記述について、ｂの見解がａの見解の根拠とな ［No.っている場合には１を、そうでない場合には２を選びなさい。\nア．\n  ａ．日本国憲法は、形式的意味での憲法に該当する。\n  ｂ．日本国憲法は、権力分立や権利保障に関する諸規定を有している。\nイ．\n  ａ．日本国憲法は、立憲的意味の憲法あるいは近代的意味の憲法に該当する。\n  ｂ．日本国憲法の下には、国会が制定する皇室典範、国会法、内閣法、公職選挙法といった憲法附属法が存在している。\nウ．\n  ａ．日本国憲法は、硬性憲法に該当する。\n  ｂ．日本国憲法第９６条第１項前段は、「この憲法の改正は、各議院の総議員の三分の二以上の賛成で、国会が、これを発議し、国民に提案してその承認を経なければならない。」と規定する。", "source": "https://www.moj.go.jp/content/001443616.pdf", "answerSource": "https://www.moj.go.jp/content/001444173.pdf"}, {"id": "R7-kenpo-8", "year": "R7", "yearLabel": "令和7年", "subject": "憲法", "qno": 8, "haiten": 3, "type": "series", "options": 2, "answer": [2, 1, 2], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第８問〕（配点：３）\n主権に関する次のアからウまでの各記述について、ｂの見解がａの見解の批判となっている場合 ［No.には１を、そうでない場合には２を選びなさい。\nア．\n  ａ．国民主権に基づく憲法において、独裁制を規定することは可能である。\n  ｂ．国民主権とは、国家権力の正当性の根拠は国民にあるとする原理である。\nイ．\n  ａ．国民主権原理にいう「国民」とは、観念的抽象的に想定される全国民という統一体のことである。\n  ｂ．国民主権原理は、代表民主制の下でも、直接民主制的制度をできる限り求める原理と捉えるべきである。\nウ．\n  ａ．日本国憲法制定に先立ち、日本によるポツダム宣言の受諾により主権の所在が天皇から国民へと変更され、法的意味での革命があったとみることができる。\n  ｂ．憲法改正には限界があり、主権の所在等の基本原理は憲法改正手続では変更できないと解釈すべきである。", "source": "https://www.moj.go.jp/content/001443616.pdf", "answerSource": "https://www.moj.go.jp/content/001444173.pdf"}, {"id": "R7-kenpo-9", "year": "R7", "yearLabel": "令和7年", "subject": "憲法", "qno": 9, "haiten": 3, "type": "series", "options": 2, "answer": [1, 2, 2], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第９問〕（配点：３）\n皇室の財産に関する次のアからウまでの各記述について、それぞれ正しい場合には１を、誤っている場合には２を選びなさい。\nア．皇室の財産授受は国会の議決に基づかなければならないと定めている憲法第８条の趣旨に照らすと、外国交際のための儀礼上の贈答に係る授受については、その度ごとに国会の議決を経る必要はない。\nイ．憲法第８８条前段は、全て皇室財産は国に属すると規定しており、この「皇室財産」とは天皇及び皇族の財産を意味しているため、天皇及び皇族が私有財産を保有することは認められない。\nウ．憲法第８８条後段では、全て皇室の費用は国会の議決を経なければならないと規定されているが、その議決の方法については規定されていないため、参議院が、衆議院よりも先に、皇室の費用について審議することも許される。", "source": "https://www.moj.go.jp/content/001443616.pdf", "answerSource": "https://www.moj.go.jp/content/001444173.pdf"}, {"id": "R7-kenpo-10", "year": "R7", "yearLabel": "令和7年", "subject": "憲法", "qno": 10, "haiten": 2, "type": "choice", "options": 8, "answer": [3], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第10問〕（配点：２）\n選挙権及び選挙制度に関する次のアからウまでの各記述について、正しいものには○、誤ってい ［No.るものには×を付した場合の組合せを、後記１から８までの中から選びなさい。\nア．最高裁判所は、国民の選挙権行使の制限は原則として許されず、国には、国民が選挙権を行使できない場合、そのような制限なしには選挙の公正の確保に留意しつつ選挙権行使を認めることが事実上不可能ないし著しく困難でない限り、選挙権行使を可能にするための所要の措置を執るべき責務があるというべきであり、このことは、精神的原因によって投票所に行くことが困難な有権者の選挙権についても当てはまるとした。\nイ．最高裁判所は、政見放送は民主政治の根幹をなす政治上の表現の自由に基づくものであり、いかなる政見放送であってもそのまま放送されるべきであるから、放送事業者が政見放送において用いられた差別的言動を削除したことは、当然に不法行為法上、法的利益の侵害に当たるとした。\nウ．最高裁判所は、１人別枠方式の意義は、衆議院議員選挙制度の変更に伴い、国政における安定性、連続性の確保を図るための暫定的な措置であるということにあると解されるから、その合理性には時間的な限界があり、新しい選挙制度である小選挙区比例代表並立制が定着し、安定した運用がされるようになった段階ではその合理性が失われるとした。\n１．ア○ イ○ ウ○\n２．ア○ イ○ ウ×\n３．ア○ イ× ウ○\n４．ア○ イ× ウ×\n５．ア× イ○ ウ○\n６．ア× イ○ ウ×\n７．ア× イ× ウ○\n８．ア× イ× ウ×", "source": "https://www.moj.go.jp/content/001443616.pdf", "answerSource": "https://www.moj.go.jp/content/001444173.pdf"}, {"id": "R7-kenpo-11", "year": "R7", "yearLabel": "令和7年", "subject": "憲法", "qno": 11, "haiten": 2, "type": "choice", "options": 8, "answer": [2], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第11問〕（配点：２）\n衆議院の解散に関する次のアからウまでの各記述について、正しいものには○、誤っているものには×を付した場合の組合せを、後記１から８までの中から選びなさい。\nア．衆議院が解散決議をして自律的に解散することはできないとする見解は、自律的解散を認めると、衆議院の多数派の意思によって少数派の議員たる地位を奪うことが可能になることや、自律的解散について憲法に明文の規定がないことをその根拠としている。\nイ．衆議院の解散に係る天皇の国事行為を定める憲法第７条第３号に、内閣の衆議院解散権の根拠を求める見解に対しては、最初から形式的行為にすぎない天皇の国事行為に対する内閣の助言と承認を、衆議院解散の実質的決定権の根拠とすることはできないとの批判がある。\nウ．最高裁判所は、衆議院の解散は憲法第８１条にいう「処分」であって、裁判所の違憲審査の対象となるが、極めて政治性の高い国家統治の基本に関する行為であるから、その法律上の有効無効を審査することは裁判所の権限の外にあるものとした。\n１．ア○ イ○ ウ○\n２．ア○ イ○ ウ×\n３．ア○ イ× ウ○\n４．ア○ イ× ウ×\n５．ア× イ○ ウ○\n６．ア× イ○ ウ×\n７．ア× イ× ウ○\n８．ア× イ× ウ×", "source": "https://www.moj.go.jp/content/001443616.pdf", "answerSource": "https://www.moj.go.jp/content/001444173.pdf"}, {"id": "R7-kenpo-12", "year": "R7", "yearLabel": "令和7年", "subject": "憲法", "qno": 12, "haiten": 2, "type": "choice", "options": 8, "answer": [3], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第12問〕（配点：２）\n次の対話は、地方自治に関する教授と学生の対話である。教授の各質問に対する次のアからウまでの学生の各回答について、正しいものには○、誤っているものには×を付した場合の組合せを、後記１から８までの中から選びなさい。教授．憲法は、国会が国権の最高機関であることを定めるとともに、内閣総理大臣は国会議員の中から選出され、国務大臣の過半数は国会議員の中から選ばなければならないと定めていますが、地方公共団体における議会と首長の関係はどのようなものですか。\nア．地方公共団体においては、議会の議員だけでなく、首長も住民による直接選挙によって選出され、法律上、議会の議員と首長との兼職が禁止されています。また、国会が国権の最高機関であるのと異なり、地方公共団体においては、議会が自治権の最高機関たる地位にあるものではありません。教授．同じく国会と内閣の関係に関し、憲法は、内閣が衆議院を解散できると定めていますが、この点につき、地方公共団体における議会と首長の関係ではどうですか。\nイ．法律上、地方公共団体では、首長も住民による直接選挙によって選出され、議会と首長は独立対等の関係とされていますので、首長に議会の解散権は認められていません。教授．議員の地位に関し、国会議員には、憲法上、発言・表決に対する免責特権と会期中の不逮捕特権が保障されており、その地位が厚く保護されていますが、この点につき、地方公共団体の議会の議員はどうですか。\nウ．地方公共団体の議会の議員は、憲法上、免責特権も不逮捕特権も保障されておらず、法律上、住民による解職請求が認められています。\n１．ア○ イ○ ウ○\n２．ア○ イ○ ウ×\n３．ア○ イ× ウ○\n４．ア○ イ× ウ×\n５．ア× イ○ ウ○\n６．ア× イ○ ウ×\n７．ア× イ× ウ○\n８．ア× イ× ウ× ［行政法］", "source": "https://www.moj.go.jp/content/001443616.pdf", "answerSource": "https://www.moj.go.jp/content/001444173.pdf"}, {"id": "R7-gyosei-13", "year": "R7", "yearLabel": "令和7年", "subject": "行政法", "qno": 13, "haiten": 3, "type": "series", "options": 2, "answer": [2, 2, 1, 2], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第13問〕（配点：３）\n行政行為に関する次のアからエまでの各記述について、法令又は最高裁判所の判例に照らし、それぞれ正しい場合には１を、誤っている場合には２を選びなさい。\nア．行政行為は、その要件が充足され、行政庁が意思決定をして、これを表示することによって成立し、同時にその効力が発生する。\nイ．授益的な行政行為の職権取消しは、私人が既に有している権利や法的地位を変動させる行政行為であるから、これを行う場合には、取消しを認める旨の法律上の明文の規定が必要である。\nウ．行政行為の附款は、法律で規定された事項以外の内容を付加して、行政行為の効果を制限したり、特別な義務を課したりするものであるが、附款を付し得ることが法律に明記されていない場合であっても、法律が当該行政行為について裁量を認めている場合には、その範囲内で附款を付すことができる。\nエ．行政庁は、行政行為が当初から不当であっても、違法ではない場合には、職権取消しを適法に行うことはできない。", "source": "https://www.moj.go.jp/content/001443616.pdf", "answerSource": "https://www.moj.go.jp/content/001444173.pdf"}, {"id": "R7-gyosei-14", "year": "R7", "yearLabel": "令和7年", "subject": "行政法", "qno": 14, "haiten": 2, "type": "choice", "options": 8, "answer": [4], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第14問〕（配点：２）\n行政手続法上の不利益処分に関する次のアからウまでの各記述について、正しいものに〇、誤っているものに×を付した場合の組合せを、後記１から８までの中から選びなさい。\nア．申請により求められた許認可等を拒否する処分は、行政手続法上の不利益処分には当たらない。\nイ．原子炉設置許可により原子炉が設置されると、原子炉事故が起こったときに原子炉施設の周辺住民はその生命、身体等に直接的かつ重大な被害を受けるものと想定されるから、原子炉設置許可は行政手続法上の不利益処分に当たる。\nウ．単一の許認可等を複数の者が申請するいわゆる競願関係においては、競願者Ａに対する許可処分は、他の競願者Ｂとの関係では行政手続法上の不利益処分に当たる。\n１．ア○ イ○ ウ○\n２．ア○ イ○ ウ×\n３．ア○ イ× ウ○\n４．ア○ イ× ウ×\n５．ア× イ○ ウ○\n６．ア× イ○ ウ×\n７．ア× イ× ウ○\n８．ア× イ× ウ×", "source": "https://www.moj.go.jp/content/001443616.pdf", "answerSource": "https://www.moj.go.jp/content/001444173.pdf"}, {"id": "R7-gyosei-15", "year": "R7", "yearLabel": "令和7年", "subject": "行政法", "qno": 15, "haiten": 3, "type": "series", "options": 2, "answer": [2, 1, 1, 1], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第15問〕（配点：３）\n行政裁量に関する教員と学生による以下の対話中の次のアからエまでの【 】内の各記述について、法令又は最高裁判所の判例に照らし、それぞれ正しい場合には１を、誤っている場合には２を選びなさい。教員：行政裁量とは何ですか。学生：立法者が行政機関に対して認めた判断の余地のことです。教員：行政庁の裁量処分について、行政内部で裁量権行使の基準、つまり裁量基準を設けることがありますが、そのことに関し、行政手続法にはどのような定めがありますか。学生：（ア）【申請に対する処分については、審査基準の設定及び公表が努力義務とされ、不利益処分については、処分基準の設定及び公表が義務付けられています。】 教員：では、処分が裁量基準に違背してされた場合、その処分は違法となりますか。学生：裁量基準は、飽くまで行政の内部基準にすぎず、法規としての性質を有しないことから、（イ）【処分が裁量基準に違背してされたとしても、当然に違法となるものではありません。】 教員：逆に、裁量基準に従ってされた処分が違法と判断されることはありますか。学生：例えば、（ウ）【個別の事情を考慮することなく、裁量基準を機械的に適用して処分がされた場合には、その処分は違法と判断されることがあります。】 教員：ところで、行政事件訴訟と行政不服審査とで、裁量処分の審査の在り方に違いはありますか。学生：行政事件訴訟と異なり、（エ）【行政不服審査においては、裁量権の範囲内の当不当の問題についても審査することができます。】", "source": "https://www.moj.go.jp/content/001443616.pdf", "answerSource": "https://www.moj.go.jp/content/001444173.pdf"}, {"id": "R7-gyosei-16", "year": "R7", "yearLabel": "令和7年", "subject": "行政法", "qno": 16, "haiten": 2, "type": "choice", "options": 8, "answer": [3], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第16問〕（配点：２）\n行政指導に関する次のアからウまでの各記述について、行政手続法に照らし、正しいものに○、誤っているものに×を付した場合の組合せを、後記１から８までの中から選びなさい。\nア．地方公共団体は、行政指導に関する手続について、行政手続法の規定の趣旨にのっとり、行政運営における公正の確保と透明性の向上を図るため必要な措置を講ずるよう努めなければならない。\nイ．行政指導が口頭でされた場合において、その相手方以外の利害関係人から、当該行政指導の趣旨及び内容並びに責任者を記載した書面の交付を求められたときは、当該行政指導に携わる者は、行政上特別の支障がない限り、これを交付しなければならない。\nウ．行政手続法第３２条第２項は、行政指導に携わる者は、その相手方が行政指導に従わなかったことを理由として、不利益な取扱いをしてはならないと定めているが、法律上、相手方が行政指導に協力しないときに氏名等の公表を行うことができる旨の規定が存在する場合に、行政指導に協力しなかった相手方の氏名等の公表を行ったとしても、同項違反の問題は生じない。\n１．ア○ イ○ ウ○\n２．ア○ イ○ ウ×\n３．ア○ イ× ウ○\n４．ア○ イ× ウ×\n５．ア× イ○ ウ○\n６．ア× イ○ ウ×\n７．ア× イ× ウ○\n８．ア× イ× ウ×", "source": "https://www.moj.go.jp/content/001443616.pdf", "answerSource": "https://www.moj.go.jp/content/001444173.pdf"}, {"id": "R7-gyosei-17", "year": "R7", "yearLabel": "令和7年", "subject": "行政法", "qno": 17, "haiten": 3, "type": "series", "options": 2, "answer": [1, 2, 2, 2], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第17問〕（配点：３）\n行政機関の保有する情報の公開に関する法律（以下「情報公開法」という。）及びその適用に関する次のアからエまでの各記述について、同法又は最高裁判所の判例に照らし、それぞれ正しい場 ［№合には１を、誤っている場合には２を選びなさい。\nア．情報公開法第５条第１号が不開示情報として規定する「個人に関する情報（事業を営む個人の当該事業に関する情報を除く。）であって、当該情報に含まれる氏名、生年月日その他の記述等（中略）により特定の個人を識別することができるもの」には、開示請求者自身を識別することができる情報も含まれる。\nイ．行政機関の長は、国、独立行政法人等、地方公共団体、地方独立行政法人及び開示請求者以外の者（以下「第三者」という。）に関する情報が記録されている行政文書を情報公開法第７条の規定により開示しようとするときは、その裁量により、所在の判明している第三者に対し、意見書を提出する機会を与えることができる。\nウ．行政機関の長は、開示請求に係る行政文書が存在しているか否かを答えるだけで、不開示情報を開示することとなる場合であっても、開示請求に係る行政文書の一部に不開示情報が記録されており、不開示情報が記録されている部分を容易に区分して除くことができるときは、当該部分を除いた部分につき開示しなければならない。\nエ．開示請求の対象とされた行政文書を行政機関が保有していないことを理由とする不開示決定の取消訴訟においては、被告が、当該不開示決定時に当該行政機関が当該行政文書を保有していなかったことについて主張立証責任を負う。（参照条文）情報公開法第７条行政機関の長は、開示請求に係る行政文書に不開示情報（第５条第１号の２に掲げる情報を除く。）が記録されている場合であっても、公益上特に必要があると認めるときは、開示請求者に対し、当該行政文書を開示することができる。", "source": "https://www.moj.go.jp/content/001443616.pdf", "answerSource": "https://www.moj.go.jp/content/001444173.pdf"}, {"id": "R7-gyosei-18", "year": "R7", "yearLabel": "令和7年", "subject": "行政法", "qno": 18, "haiten": 2, "type": "choice", "options": 8, "answer": [3], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第18問〕（配点：２）\n処分性に関する次のアからウまでの各記述について、最高裁判所の判例に照らし、正しいものに ○、誤っているものに×を付した場合の組合せを、後記１から８までの中から選びなさい。（解答欄は、 ）\nア．出生した子につき住民票の記載を求める親からの申出に対し市町村長がした当該記載をしない旨の応答には、処分性が認められない。\nイ．出入国管理及び難民認定法に基づく在留期間の更新申請に対し法務大臣がした当該申請を拒否する旨の応答には、処分性が認められない。\nウ．私的独占の禁止及び公正取引の確保に関する法律第４５条第１項に基づく措置要求に対し公正取引委員会がした当該要求に応じない旨の応答には、処分性が認められない。（参照条文）私的独占の禁止及び公正取引の確保に関する法律第４５条何人も、この法律の規定に違反する事実があると思料するときは、公正取引委員会に対し、その事実を報告し、適当な措置をとるべきことを求めることができる。 ２前項に規定する報告があつたときは、公正取引委員会は、事件について必要な調査をしなければならない。 ３第１項の規定による報告が、公正取引委員会規則で定めるところにより、書面で具体的な事実を摘示してされた場合において、当該報告に係る事件について、適当な措置をとり、又は措置をとらないこととしたときは、公正取引委員会は、速やかに、その旨を当該報告をした者に通知しなければならない。 ４（略）\n１．ア○ イ○ ウ○\n２．ア○ イ○ ウ×\n３．ア○ イ× ウ○\n４．ア○ イ× ウ×\n５．ア× イ○ ウ○\n６．ア× イ○ ウ×\n７．ア× イ× ウ○\n８．ア× イ× ウ×", "source": "https://www.moj.go.jp/content/001443616.pdf", "answerSource": "https://www.moj.go.jp/content/001444173.pdf"}, {"id": "R7-gyosei-19", "year": "R7", "yearLabel": "令和7年", "subject": "行政法", "qno": 19, "haiten": 2, "type": "choice", "options": 8, "answer": [4], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第19問〕（配点：２）\n原告適格に関する次のアからウまでの各記述について、最高裁判所の判例に照らし、正しいものに○、誤っているものに×を付した場合の組合せを、後記１から８までの中から選びなさい。（解答欄は、 ）\nア．医療法（平成１８年法律第８４号による改正前のもの）に基づく病院の開設許可処分について、当該開設許可処分によって都道府県における医療を提供する体制の確保に関する計画が定める基準病床数を超過する結果となったとしても、当該病院の開設地の付近において医療施設を開設する医療法人には、当該開設許可処分の取消しを求める原告適格は認められない。\nイ．里道の用途廃止処分について、里道は近隣住民に個別具体的な利益をもたらすものではないから、その用途廃止により当該住民の生活に著しい支障が生じるとしても、当該住民には当該廃止処分の取消しを求める原告適格は認められない。\nウ．滞納者と他の者との共有に係る不動産につき滞納者の持分が国税徴収法に基づいて差押えを受けた場合、当該不動産の他の共有者には、当該差押処分の法的効果による権利の制限を受けるとしても、当該差押処分の取消しを求める原告適格は認められない。\n１．ア○ イ○ ウ○\n２．ア○ イ○ ウ×\n３．ア○ イ× ウ○\n４．ア○ イ× ウ×\n５．ア× イ○ ウ○\n６．ア× イ○ ウ×\n７．ア× イ× ウ○\n８．ア× イ× ウ×", "source": "https://www.moj.go.jp/content/001443616.pdf", "answerSource": "https://www.moj.go.jp/content/001444173.pdf"}, {"id": "R7-gyosei-20", "year": "R7", "yearLabel": "令和7年", "subject": "行政法", "qno": 20, "haiten": 3, "type": "series", "options": 2, "answer": [1, 2, 1, 2], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第20問〕（配点：３）\n抗告訴訟における判決に関する次のアからエまでの各記述について、行政事件訴訟法に照らし、それぞれ正しい場合には１を、誤っている場合には２を選びなさい。\nア．処分の取消しの訴えといわゆる申請型義務付けの訴えに係る弁論及び裁判は、分離しないでしなければならないが、裁判所は、審理の状況その他の事情を考慮して、処分の取消しの訴えについてのみ終局判決をすることがより迅速な争訟の解決に資すると認めるときは、処分の取消しの訴えについてのみ終局判決をすることができる。\nイ．申請を認容した処分につき第三者が取消しを求める訴えを提起し、同処分が判決により手続に違法があることを理由として取り消されたときは、その処分をした行政庁は、判決の趣旨に従い、違法とされた手続を改めて履践した上で、申請を認容する処分をしなければならない。\nウ．処分の取消しの訴えにおいて、処分が違法ではあるが、これを取り消すことにより公の利益に著しい障害を生ずる場合において、原告の受ける損害の程度、その損害の賠償又は防止の程度及び方法その他一切の事情を考慮した上、処分を取り消すことが公共の福祉に適合しないと認められるとして、裁判所が、処分が違法であることを宣言し、請求を棄却する旨の判決をしたときは、原告及び被告のいずれも控訴することができる。\nエ．処分の取消しの訴えにおいて、請求を棄却する判決が確定した場合、当該判決は、第三者に対しても効力を有する。", "source": "https://www.moj.go.jp/content/001443616.pdf", "answerSource": "https://www.moj.go.jp/content/001444173.pdf"}, {"id": "R7-gyosei-21", "year": "R7", "yearLabel": "令和7年", "subject": "行政法", "qno": 21, "haiten": 3, "type": "series", "options": 2, "answer": [1, 2, 2, 1], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第21問〕（配点：３）\n抗告訴訟に関する次のアからエまでの各記述について、行政事件訴訟法（以下「法」という。）又は最高裁判所の判例に照らし、それぞれ正しい場合には１を、誤っている場合には２を選びなさい。\nア．法第３条第６項第１号の義務付けの訴え（いわゆる非申請型義務付けの訴え）は、行政庁が一定の処分をすべき旨を命ずることを求めるにつき法律上の利益を有する者に限り、適法に提起することができる。\nイ．法第３条第６項第２号の義務付けの訴え（いわゆる申請型義務付けの訴え）は、一定の処分がされないことにより重大な損害を生ずるおそれがあり、かつ、その損害を避けるため他に適当な方法がないときに限り、適法に提起することができる。\nウ．自衛隊機の運航の差止めを求める訴えについては、法第３条第７項の差止めの訴えの対象となる「一定の処分」を観念することができないから、無名抗告訴訟として適法とされる余地があるかどうかはともかく、同項の差止めの訴えとしては不適法である。\nエ．将来の不利益処分の予防を目的として当該処分の前提となる公的義務の不存在確認を求める無名抗告訴訟は、法第３条第７項の差止めの訴えの訴訟要件である「行政庁によって一定の処分がされる蓋然性があること」を満たさない場合には、不適法である。", "source": "https://www.moj.go.jp/content/001443616.pdf", "answerSource": "https://www.moj.go.jp/content/001444173.pdf"}, {"id": "R7-gyosei-22", "year": "R7", "yearLabel": "令和7年", "subject": "行政法", "qno": 22, "haiten": 2, "type": "choice", "options": 8, "answer": [7], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第22問〕（配点：２）\n行政事件訴訟法上の仮の救済に関する次のアからウまでの各記述について、同法に照らし、正しいものに○、誤っているものに×を付した場合の組合せを、後記１から８までの中から選びなさい。\nア．仮の義務付けの決定が、当該決定に対する即時抗告についての裁判により取り消されたときは、行政庁が当該決定に基づいてした処分は、当然にその効力を失うから、当該行政庁は、当該処分を取り消す必要はない。\nイ．裁判所は、仮の差止めの決定前に仮の差止めの申立人の意見を聴いているから、事情変更による仮の差止めの決定の取消決定をする場合、仮の差止めの申立人の意見を改めて聴く必要はない。\nウ．裁判所は、本案について理由があるとみえるときでなければ、仮の義務付けの決定をすることができない。\n１．ア○ イ○ ウ○\n２．ア○ イ○ ウ×\n３．ア○ イ× ウ○\n４．ア○ イ× ウ×\n５．ア× イ○ ウ○\n６．ア× イ○ ウ×\n７．ア× イ× ウ○\n８．ア× イ× ウ×", "source": "https://www.moj.go.jp/content/001443616.pdf", "answerSource": "https://www.moj.go.jp/content/001444173.pdf"}, {"id": "R7-gyosei-23", "year": "R7", "yearLabel": "令和7年", "subject": "行政法", "qno": 23, "haiten": 3, "type": "series", "options": 2, "answer": [2, 2, 2, 1], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第23問〕（配点：３）\n国家賠償に関する次のアからエまでの各記述について、法令又は最高裁判所の判例に照らし、それぞれ正しい場合には１を、誤っている場合には２を選びなさい。\nア．市区町村長が弁護士法第２３条の２に基づく照会に応じて前科及び犯罪経歴を報告することは、国家賠償法第１条第１項にいう「公権力の行使」に該当しない。\nイ．国又は公共団体の公権力の行使に当たる公務員が、その職務を行うについて、故意又は重大な過失によって違法に他人に損害を加えたときは、その公務員も損害を被った者に対する直接の賠償責任を負う。\nウ．行政処分が違法であることを理由として国家賠償請求をするには、あらかじめ当該処分について取消し又は無効等確認の判決を得るか、当該処分の取消しの訴え又は無効等確認の訴えを併合して提起することを要する。\nエ．市議会議員が議会内における一般質問の際に行った発言は、その発言内容にかかわらず、国家賠償法第１条第１項にいう「その職務を行うについて」されたものに該当する。", "source": "https://www.moj.go.jp/content/001443616.pdf", "answerSource": "https://www.moj.go.jp/content/001444173.pdf"}, {"id": "R7-gyosei-24", "year": "R7", "yearLabel": "令和7年", "subject": "行政法", "qno": 24, "haiten": 2, "type": "choice", "options": 8, "answer": [8], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第24問〕（配点：２）\n行政不服審査法に関する次のアからウまでの各記述について、同法に照らし、正しいものに〇、誤っているものに×を付した場合の組合せを、後記１から８までの中から選びなさい。\nア．行政庁の処分につき、法律に再調査の請求をすることができる旨の定めがある場合には、当該処分に不服がある者は、原則として、審査請求をする前に、再調査の請求をしなければならない。\nイ．処分についての審査請求書に審査請求の趣旨が記載されていない場合であっても、審査庁は、不備を補正すべきことを命じる義務を負わない。\nウ．事実上の行為は審査請求の対象となる処分から除外されているので、事実上の行為についての審査請求は不適法である。\n１．ア○ イ○ ウ○\n２．ア○ イ○ ウ×\n３．ア○ イ× ウ○\n４．ア○ イ× ウ×\n５．ア× イ○ ウ○\n６．ア× イ○ ウ×\n７．ア× イ× ウ○\n８．ア× イ× ウ×", "source": "https://www.moj.go.jp/content/001443616.pdf", "answerSource": "https://www.moj.go.jp/content/001444173.pdf"}, {"id": "R7-minpo-1", "year": "R7", "yearLabel": "令和7年", "subject": "民法", "qno": 1, "haiten": 2, "type": "choice", "options": 5, "answer": [1], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第１問〕（配点：２）\n意思表示等に関する次のアからオまでの各記述のうち、判例の趣旨に照らし正しいものを組み合わせたものは、後記１から５までのうちどれか。\nア．意思表示の相手方が意思表示を受けた時点において保佐開始の審判を受けていたときであっても、表意者は、その意思表示をもってその相手方に対抗することができる。\nイ．意思表示の相手方が意思表示を受けた時点において未成年者であったときでも、その法定代理人がその意思表示を知った後は、表意者は、その意思表示をもってその相手方に対抗することができる。\nウ．債権譲渡通知は、債権の譲渡人が債務者の所在を知ることができないときであっても、公示の方法によってすることができない。\nエ．解除の意思表示を含む内容証明郵便が、その意思表示の相手方である受取人が不在のため一定期間郵便局に留置された後に差出人に返送された場合において、その受取人がその内容証明郵便の内容を十分に推知することができなかったとしても、留置期間内に容易にそれを受領することができたときは、その意思表示は、到達したものと認められる。\nオ．意思表示の相手方が正当な理由なくその意思表示の通知が到達することを妨げたときは、その通知は、相手方がその到達を妨げた時に到達したものとみなされる。\n１．アイ\n２．アエ\n３．イウ\n４．ウオ\n５．エオ", "source": "https://www.moj.go.jp/content/001443617.pdf", "answerSource": "https://www.moj.go.jp/content/001444174.pdf"}, {"id": "R7-minpo-2", "year": "R7", "yearLabel": "令和7年", "subject": "民法", "qno": 2, "haiten": 2, "type": "choice", "options": 5, "answer": [2], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第２問〕（配点：２）\nＡは、自己に代理権がないことを知りながら、Ｂの代理人としてＣと契約を締結した。Ｃは、契約当時、Ａに代理権がないことを知らなかった。この事例に関する次のアからオまでの各記述のうち、判例の趣旨に照らし正しいものを組み合わせたものは、後記１から５までのうちどれか。（解答欄は、 ）\nア．Ａがした契約をＢが追認しない間は、Ｃは、その契約を取り消すことができる。\nイ．ＣがＢに対し、相当の期間を定めて、その期間内にＡがした契約を追認するかどうかを確答すべき旨の催告をした場合において、Ｂがその期間内に確答をしないときは、その契約を追認したものとみなされる。\nウ．ＣがＡに代理権がなかったことを過失によって知らなかったときは、Ａは、Ｃに対して無権代理人の責任を負わない。\nエ．ＢがＡのした契約について追認を拒絶したときは、その後ＡがＢを相続したとしても、その契約が有効になるものではない。\nオ．Ｃから無権代理人の責任として契約の履行を求められたＡは、その履行に代えて、損害の賠償をすることができる。\n１．アウ\n２．アエ\n３．イウ\n４．イオ\n５．エオ", "source": "https://www.moj.go.jp/content/001443617.pdf", "answerSource": "https://www.moj.go.jp/content/001444174.pdf"}, {"id": "R7-minpo-3", "year": "R7", "yearLabel": "令和7年", "subject": "民法", "qno": 3, "haiten": 2, "type": "choice", "options": 5, "answer": [4], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第３問〕（配点：２）\n時効に関する次のアからオまでの各記述のうち、判例の趣旨に照らし誤っているものを組み合わせたものは、後記１から５までのうちどれか。\nア．後順位抵当権者は、先順位抵当権の被担保債権の消滅により後順位抵当権者の抵当権の順位が上昇すれば配当額が増加することになるときであっても、先順位抵当権の被担保債権の消滅時効を援用することができない。\nイ．債務者は、債務について消滅時効が完成した後に、時効完成の事実を知らずに債権者に対し債務の承認をしたときであっても、消滅時効を援用することができる。\nウ．抵当権が設定された不動産の第三取得者は、その抵当権の被担保債権の消滅時効を援用することができる。\nエ．同一の当事者間に数個の金銭消費貸借契約に基づく各元本債務が存在する場合において、借主が、弁済を充当すべき債務を指定することなく全債務を完済するのに足りない額の弁済をしたときは、その弁済は、特段の事情のない限り、各元本債務についての承認に当たる。\nオ．自己の所有物については、所有権の取得時効を援用することができない。\n１．アウ\n２．アエ\n３．イウ\n４．イオ\n５．エオ", "source": "https://www.moj.go.jp/content/001443617.pdf", "answerSource": "https://www.moj.go.jp/content/001444174.pdf"}, {"id": "R7-minpo-4", "year": "R7", "yearLabel": "令和7年", "subject": "民法", "qno": 4, "haiten": 2, "type": "choice", "options": 5, "answer": [3], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第４問〕（配点：２）\n不動産物権変動に関する次のアからオまでの各記述のうち、判例の趣旨に照らし正しいものを組み合わせたものは、後記１から５までのうちどれか。\nア．ＡがＡ所有の甲土地をＢに売却し、Ｂがその引渡しを受けた時から１年を経過した後、Ａが甲土地をＣに売却し、Ｃが所有権移転登記を備えたときは、Ｂが主張する所有権の取得時効の期間は、Ｃが所有権移転登記を備えた時から起算する。\nイ．入会権の取得は、入会権が共有の性質を有するかどうかにかかわらず、登記をしないで、第三者に対抗することができる。\nウ．不動産質権の設定は、現実の引渡しがあっても、登記をしなければ、第三者に対抗することができない。\nエ．ＡがＡのＢに対するα債権を担保するため、Ｃ所有の甲土地についてＣから抵当権の設定を受けた後、Ａがその抵当権をＤのＡに対するβ債権の担保とした場合において、ＡがＢに転抵当権の設定を通知したときであっても、ＡがＣに転抵当権の設定を通知せず、かつ、Ｃがこれを承諾しなかったときは、Ｃは、Ｄの同意を得ないでしたα債権の弁済をＤに対抗することができる。\nオ．ＡがＡ所有の甲土地をＢに売却した後、Ａが死亡した場合において、Ａの唯一の相続人Ｃが甲土地をＤに売却したときは、Ｂは、登記を備えないで、甲土地の所有権の取得を第三者Ｄに対抗することができる。\n１．アエ\n２．アオ\n３．イウ\n４．イエ\n５．ウオ", "source": "https://www.moj.go.jp/content/001443617.pdf", "answerSource": "https://www.moj.go.jp/content/001444174.pdf"}, {"id": "R7-minpo-5", "year": "R7", "yearLabel": "令和7年", "subject": "民法", "qno": 5, "haiten": 2, "type": "choice", "options": 5, "answer": [1], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第５問〕（配点：２）\nＡ及びＢが甲土地を共有している場合に関する次のアからオまでの各記述のうち、判例の趣旨に ［No.照らし正しいものを組み合わせたものは、後記１から５までのうちどれか。\nア．Ａが甲土地の管理のために費用を支払った後、Ｂがその持分をＣに譲渡したときは、Ａは、 Ｃに対しても、Ｃの持分に応じてその費用の償還を求めることができる。\nイ．Ａは、甲土地を不法に占有するＤに対し、単独で甲土地全部の明渡しを求めることができない。\nウ．Ａの債権者Ｅは、自己の費用で、甲土地の分割に参加することができる。\nエ．Ｂが甲土地を単独で使用する場合において、ＡとＢとの間の別段の合意がないときは、Ｂは、自己の持分を超える使用について、Ａに対し、その対価の償還の義務を負わない。\nオ．Ａが死亡した場合において、Ａに相続人がないときは、Ａの持分は、国庫に帰属する。\n１．アウ\n２．アオ\n３．イウ\n４．イエ\n５．エオ", "source": "https://www.moj.go.jp/content/001443617.pdf", "answerSource": "https://www.moj.go.jp/content/001444174.pdf"}, {"id": "R7-minpo-6", "year": "R7", "yearLabel": "令和7年", "subject": "民法", "qno": 6, "haiten": 2, "type": "choice", "options": 5, "answer": [5], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第６問〕（配点：２）\n抵当権の効力に関する次のアからオまでの各記述のうち、判例の趣旨に照らし誤っているものを組み合わせたものは、後記１から５までのうちどれか。\nア．建物所有目的で賃貸された土地に築造された建物について抵当権が設定されたときは、その抵当権の効力は、敷地の賃借権に及ぶ。\nイ．抵当権の設定後に抵当地に建物が築造され、抵当権者が土地とともにその建物を競売するときであっても、その優先権は、土地の代価についてのみ行使することができる。\nウ．抵当不動産の第三取得者は、抵当不動産について必要費を支出したときは、抵当不動産の代価から、他の債権者より先にその償還を受けることができる。\nエ．抵当不動産の第三取得者は、被担保債権の連帯保証人であるときであっても、抵当権消滅請求をすることができる。\nオ．抵当不動産の第三取得者は、その競売において買受人となることができない。\n１．アイ\n２．アウ\n３．イエ\n４．ウオ\n５．エオ", "source": "https://www.moj.go.jp/content/001443617.pdf", "answerSource": "https://www.moj.go.jp/content/001444174.pdf"}, {"id": "R7-minpo-7", "year": "R7", "yearLabel": "令和7年", "subject": "民法", "qno": 7, "haiten": 2, "type": "choice", "options": 5, "answer": [3], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第７問〕（配点：２）\n債務不履行に関する次のアからオまでの各記述のうち、判例の趣旨に照らし正しいものを組み合わせたものは、後記１から５までのうちどれか。\nア．特別の事情によって生じた損害については、債務者が債務不履行時にその事情を現に予見していたときに限り、債権者は、債務不履行による損害賠償を請求することができる。\nイ．契約に基づく債務の履行がその契約の成立の時に不能であったことは、その履行の不能によって生じた損害の賠償を請求することを妨げない。\nウ．債権者が債務の履行を受けることができない場合において、履行の提供があった時以後に当事者双方の責めに帰することができない事由によってその債務の履行が不能となったときは、その履行の不能は、債務者の責めに帰すべき事由によるものとみなされる。\nエ．債務不履行による損害賠償は、当事者間で別段の合意がされたときであっても、金銭をもってその額を定める。\nオ．金銭消費貸借契約において返還の時期を定めなかった場合において、貸主が相当の期間を定めずに返還の催告をしたときは、借主は、相当の期間を経過した時から履行遅滞の責任を負う。\n１．アイ\n２．アウ\n３．イオ\n４．ウエ\n５．エオ", "source": "https://www.moj.go.jp/content/001443617.pdf", "answerSource": "https://www.moj.go.jp/content/001444174.pdf"}, {"id": "R7-minpo-8", "year": "R7", "yearLabel": "令和7年", "subject": "民法", "qno": 8, "haiten": 2, "type": "choice", "options": 5, "answer": [1], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第８問〕（配点：２）\nＡのＢに対する貸金債務甲につき、法人でないＣが保証する場合に関する次のアからオまでの各記述のうち、誤っているものを組み合わせたものは、後記１から５までのうちどれか。\nア．ＢＣ間のみならず、ＡＣ間においても連帯の特約がされなければ、Ｃは、連帯保証債務を負担しない。\nイ．Ｃの保証債務が連帯保証債務であり、Ｄも貸金債務甲について連帯保証をしているときは、 ＣのＢに対する連帯保証債務の額は、貸金債務甲の額の２分の１となる。\nウ．Ａが貸金債務甲について有していた期限の利益を喪失したときは、Ｂは、Ｃに対し、その利益の喪失を知った時から法定の期間内に、その旨を通知しなければならない。\nエ．Ｃの保証がＡの委託を受けずにしたものである場合においては、Ｂは、Ｃの請求を受けたときであっても、Ｃに対し、貸金債務甲の元本及び利息について、不履行の有無、残額及び弁済期が到来しているものの額に関する情報を提供する義務を負わない。\nオ．貸金債務甲がＡの事業のために負担するものである場合において、ＡがＣに保証の委託をするときは、Ａは、Ｃに対し、Ａの財産及び収支の状況について情報を提供しなければならない。\n１．アイ\n２．アエ\n３．イウ\n４．ウオ\n５．エオ", "source": "https://www.moj.go.jp/content/001443617.pdf", "answerSource": "https://www.moj.go.jp/content/001444174.pdf"}, {"id": "R7-minpo-9", "year": "R7", "yearLabel": "令和7年", "subject": "民法", "qno": 9, "haiten": 2, "type": "choice", "options": 5, "answer": [1], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第９問〕（配点：２）\n債権の消滅に関する次のアからオまでの各記述のうち、判例の趣旨に照らし誤っているものを組み合わせたものは、後記１から５までのうちどれか。\nア．主たる債務についての弁済の目的物の供託によって保証債務が消滅したときは、供託をした者は、債権者が供託を受諾せず、又は供託を有効と宣告した判決が確定しない間においても、供託物を取り戻すことができない。\nイ．請負人は、注文者に対する請負報酬債権を自働債権とし、注文者の請負人に対する目的物の修補に代わる損害賠償債権を受働債権とする相殺をすることができる。\nウ．ＡのＢに対する身体の侵害による損害賠償債権がＡからＣへと譲渡された場合において、Ｂ がＣに対し貸金債権を有するときは、Ｂは、貸金債権を自働債権とし、ＣがＡから譲り受けた損害賠償債権を受働債権とする相殺をすることができない。\nエ．当事者が従前の債務に代えて、新たな債務であって従前の給付の内容について重要な変更をするものを発生させる契約をしたときは、従前の債務は、消滅する。\nオ．ＡのＢに対する売買代金債権をＣが差し押さえた後にＢがＡを相続したときは、その債権は、消滅しない。\n１．アウ\n２．アエ\n３．イエ\n４．イオ\n５．ウオ", "source": "https://www.moj.go.jp/content/001443617.pdf", "answerSource": "https://www.moj.go.jp/content/001444174.pdf"}, {"id": "R7-minpo-10", "year": "R7", "yearLabel": "令和7年", "subject": "民法", "qno": 10, "haiten": 2, "type": "choice", "options": 5, "answer": [2], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第10問〕（配点：２）\nＡがＡ所有の甲建物をＢに売る契約の解除に関する次のアからオまでの各記述のうち、判例の趣旨に照らし誤っているものを組み合わせたものは、後記１から５までのうちどれか。\nア．Ａが本件契約をＢの債務不履行により解除した場合におけるＡのＢに対する原状回復請求権は、Ａが解除権の発生を知った時から５年間行使しないときは、時効によって消滅する。\nイ．Ｂが本件契約をＡの債務不履行により解除した場合において、ＡがＢに対し代金の返還義務を負うときは、Ａは、代金の受領の時から利息を付さなければならない。\nウ．Ａが本件契約をＢの債務不履行により解除したときは、甲建物の所有権は、遡及的にＡに復帰する。\nエ．Ａが本件契約をＢの債務不履行により解除したときは、Ａは、Ｂに対し、代金債務の履行に代わる損害賠償を請求することができる。\nオ．Ａが本件契約に基づく代金債権をＣに譲渡し、その譲渡について第三者対抗要件が備えられたときは、Ｃは、その後にＢが本件契約をＡの債務不履行により解除したとしても、代金債権を失わない。\n１．アエ\n２．アオ\n３．イウ\n４．イエ\n５．ウオ", "source": "https://www.moj.go.jp/content/001443617.pdf", "answerSource": "https://www.moj.go.jp/content/001444174.pdf"}, {"id": "R7-minpo-11", "year": "R7", "yearLabel": "令和7年", "subject": "民法", "qno": 11, "haiten": 2, "type": "choice", "options": 5, "answer": [1], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第11問〕（配点：２）\n委任に関する次のアからオまでの各記述のうち、判例の趣旨に照らし正しいものを組み合わせたものは、後記１から５までのうちどれか。\nア．受任者は、委任者のために自己の名で取得した権利を委任者に移転しなければならない。\nイ．受任者が委任事務を処理するのに必要と認められる債務を負担した場合において、その債務が弁済期にないときは、受任者は、委任者に対し、相当の担保を供させることができる。\nウ．受任者が委任事務を処理するため自己に過失なく損害を受けた場合には、その損害の発生が委任者の責めに帰すべき事由によるものであるときに限り、受任者は、委任者に対し、その損害の賠償を請求することができる。\nエ．委任者が受任者に不利な時期に委任契約について任意解除をした場合には、やむを得ない事由があったときであっても、委任者は、受任者に対し、その損害を賠償しなければならない。\nオ．委任契約において委任者の死亡によっても契約を終了させない旨の特約をしたときであっても、その特約は、無効である。\n１．アイ\n２．アエ\n３．イウ\n４．ウオ\n５．エオ", "source": "https://www.moj.go.jp/content/001443617.pdf", "answerSource": "https://www.moj.go.jp/content/001444174.pdf"}, {"id": "R7-minpo-12", "year": "R7", "yearLabel": "令和7年", "subject": "民法", "qno": 12, "haiten": 2, "type": "choice", "options": 5, "answer": [2], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第12問〕（配点：２）\n不法行為に関する次のアからオまでの各記述のうち、判例の趣旨に照らし正しいものを組み合わせたものは、後記１から５までのうちどれか。\nア．良好な景観に近接する地域内に居住し、その恵沢を日常的に享受している者は、この者が有する良好な景観の恵沢を享受する利益が違法に侵害されたことをもって、不法行為による損害賠償を請求することができる。\nイ．疾病のため死亡した患者の診療に当たった医師の医療行為が、その過失によって医療水準にかなったものでなかった場合において、医療水準にかなった医療が行われていたとすれば患者がその死亡の時点でなお生存していた相当程度の可能性の存在が証明されたときは、その医療行為と患者の死亡との間における因果関係が肯定される。\nウ．ある事実を基礎としての論評の表明によって他人の名誉を毀損した場合において、その行為が公共の利害に関する事実に係り、かつ、その目的が専ら公益を図ることにあったときは、人身攻撃に及ぶなど論評としての域を逸脱したものでない限り、その行為は、違法でない。\nエ．労働者Ａが、第三者Ｂの過失による事故によって負傷し、この事故を原因として労働者災害補償保険法に基づく保険給付を受けた。この場合におけるＢのＡに対する損害賠償責任について、Ａの過失をもって過失相殺をすべきであり、かつ、Ａが受けた保険給付の価額を控除すべきときは、損害賠償の額は、まず過失相殺による減額をし、その残額から保険給付の価額を控除する方法により算定する。\nオ．人の身体を害する不法行為による損害賠償請求権は、被害者又はその法定代理人が損害及び加害者を知った時から３年間行使しないときは、時効によって消滅する。\n１．アイ\n２．アエ\n３．イオ\n４．ウエ\n５．ウオ", "source": "https://www.moj.go.jp/content/001443617.pdf", "answerSource": "https://www.moj.go.jp/content/001444174.pdf"}, {"id": "R7-minpo-13", "year": "R7", "yearLabel": "令和7年", "subject": "民法", "qno": 13, "haiten": 2, "type": "choice", "options": 5, "answer": [4], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第13問〕（配点：２）\nＡ及びＢの実子Ｃを養子とし、Ｄ及びＥを養親とする特別養子縁組に関する次のアからオまでの各記述のうち、誤っているものを組み合わせたものは、後記１から５までのうちどれか。\nア．Ａ及びＢがＣを悪意で遺棄していたときは、特別養子縁組の成立には、Ａ及びＢの同意を要しない。\nイ．Ｃが１５歳に達しているときであっても、特別養子縁組の成立には、Ｃの同意を要しない。\nウ．ＤとＥとが婚姻していないときは、特別養子縁組は、することができない。\nエ．Ａ及びＢが死亡しているときは、特別養子縁組の離縁は、することができない。\nオ．Ｄ及びＥがＣの親族であるときは、家庭裁判所は、特別養子縁組の成立の審判の時までＤ及びＥがＣを監護したことがなくても、特別養子縁組を成立させることができる。\n１．アウ\n２．アエ\n３．イウ\n４．イオ\n５．エオ", "source": "https://www.moj.go.jp/content/001443617.pdf", "answerSource": "https://www.moj.go.jp/content/001444174.pdf"}, {"id": "R7-minpo-14", "year": "R7", "yearLabel": "令和7年", "subject": "民法", "qno": 14, "haiten": 2, "type": "choice", "options": 5, "answer": [4], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第14問〕（配点：２）\n相続の承認及び放棄に関する次のアからオまでの各記述のうち、正しいものを組み合わせたものは、後記１から５までのうちどれか。\nア．被相続人Ａの子Ｂが相続の放棄をした場合において、Ｂの子ＣがＡの直系卑属であるときは、 Ｃは、Ｂを代襲して相続人となる。\nイ．１５歳に達している未成年者が法定代理人の同意を得ないでした相続の放棄は、取り消すことができない。\nウ．家庭裁判所に申述が受理された相続の放棄は、撤回することができない。\nエ．相続人は、単純承認をしたときは、無限に被相続人の権利義務を承継する。\nオ．相続人Ａが相続の放棄をした場合であっても、次順位の相続人Ｂが相続の承認をした後に、 Ａが相続財産の全部を私に消費したときは、Ａは、単純承認をしたものとみなされる。\n１．アイ\n２．アウ\n３．イオ\n４．ウエ\n５．エオ", "source": "https://www.moj.go.jp/content/001443617.pdf", "answerSource": "https://www.moj.go.jp/content/001444174.pdf"}, {"id": "R7-minpo-15", "year": "R7", "yearLabel": "令和7年", "subject": "民法", "qno": 15, "haiten": 2, "type": "choice", "options": 5, "answer": [3], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第15問〕（配点：２）\n地上権及び土地賃借権に関する次のアからオまでの各記述のうち、判例の趣旨に照らし正しいものを組み合わせたものは、後記１から５までのうちどれか。\nア．地上権者は、地上権に基づく地上権設定登記請求権を有し、土地賃借人は、賃貸借契約に基づく賃借権設定登記請求権を有する。\nイ．地上権者は、土地所有者に対して、地上権に基づき土地を使用に適した状態に置くよう請求する権利を有しないが、土地賃借人は、土地賃貸人に対して、賃貸借契約に基づき土地を使用に適した状態に置くよう請求する権利を有する。\nウ．地上権は、時効によって取得することができるが、土地賃借権は、時効によって取得することができない。\nエ．建物所有を目的とする地上権も、建物所有を目的とする土地賃借権も、それぞれの権利者がそれぞれの権利の目的物である土地の上に登記されている建物を所有するときは、そのことをもって第三者に対抗することができる。\nオ．地上権者は、地上権の目的物である土地の所有者の承諾を得なければ、その土地を第三者に賃貸することができず、土地賃借人も、賃貸人の承諾を得なければ、賃借物である土地を転貸することができない。\n１．アイ\n２．アウ\n３．イエ\n４．ウオ\n５．エオ ［商法］", "source": "https://www.moj.go.jp/content/001443617.pdf", "answerSource": "https://www.moj.go.jp/content/001444174.pdf"}, {"id": "R7-shoho-16", "year": "R7", "yearLabel": "令和7年", "subject": "商法", "qno": 16, "haiten": 2, "type": "choice", "options": 5, "answer": [5], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第16問〕（配点：２）\n株式会社の発起設立に関する次のアからオまでの各記述のうち、誤っているものを組み合わせたものは、後記１から５までのうちどれか。\nア．発起人は、株式会社の成立後は、錯誤を理由として設立時発行株式の引受けの取消しをすることができない。\nイ．株式会社が成立しなかったときは、発起人は、連帯して、株式会社の設立に関して支出した費用を負担する。\nウ．現物出資財産を給付した発起人は、株式会社の成立の時における当該現物出資財産の価額が定款に記載又は記録された当該現物出資財産の価額に著しく不足する場合には、検査役の調査を経たときであっても、当該株式会社に対し、当該不足額を支払う義務を負う。\nエ．発起人は、公証人による定款の認証を受けた後であっても、株式会社の成立の時までに、発起人の全員の同意によって、当該定款を変更して本店の所在地を変更することができる。\nオ．判例の趣旨によれば、定款に記載又は記録しないでされた財産引受けは、成立後の株式会社が追認することにより、遡って有効になる。\n１．アウ\n２．アオ\n３．イウ\n４．イエ\n５．エオ", "source": "https://www.moj.go.jp/content/001443617.pdf", "answerSource": "https://www.moj.go.jp/content/001444174.pdf"}, {"id": "R7-shoho-17", "year": "R7", "yearLabel": "令和7年", "subject": "商法", "qno": 17, "haiten": 2, "type": "choice", "options": 5, "answer": [5], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第17問〕（配点：２）\n異なる種類の株式に関する次のアからオまでの各記述のうち、誤っているものを組み合わせたものは、後記１から５までのうちどれか。\nア．種類株式発行会社でない株式会社は、剰余金の配当に関して内容の異なる２以上の種類の株式を発行する場合には、会社法所定の事項を定款で定めなければならない。\nイ．会社法上の公開会社は、ある種類の株式の種類株主を構成員とする種類株主総会において取締役を選任することを内容とする種類の株式を発行することができない。\nウ．会社法上の公開会社である種類株式発行会社は、議決権制限株式の数が発行済株式の総数の ２分の１を超えるに至ったときは、直ちに、議決権制限株式の数を発行済株式の総数の２分の １以下にするための必要な措置をとらなければならない。\nエ．剰余金の配当に関する優先株式を取得条項付株式として発行することはできるが、その取得の対価を剰余金の配当に関する劣後株式とすることはできない。\nオ．種類株式発行会社が全部取得条項付種類株式の全部を取得する場合において、取得対価が当該全部取得条項付種類株式の株主に特に有利な金額でないときは、取締役は、当該全部取得条項付種類株式の取得に関する決定をする株主総会において、当該全部取得条項付種類株式の全部を取得することを必要とする理由を説明することを要しない。\n１．アイ\n２．アオ\n３．イウ\n４．ウエ\n５．エオ", "source": "https://www.moj.go.jp/content/001443617.pdf", "answerSource": "https://www.moj.go.jp/content/001444174.pdf"}, {"id": "R7-shoho-18", "year": "R7", "yearLabel": "令和7年", "subject": "商法", "qno": 18, "haiten": 2, "type": "choice", "options": 5, "answer": [1], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第18問〕（配点：２）\n募集株式の発行に関する次のアからオまでの各記述のうち、正しいものを組み合わせたものは、後記１から５までのうちどれか。\nア．判例の趣旨によれば、会社法上の公開会社の株主総会は、発行済株式の総数が発行可能株式総数に満たない場合に、新たに募集株式の発行をすることを条件として、その発行後の発行済株式の総数の４倍まで発行可能株式総数を増加する定款の変更をする旨の決議をすることができる。\nイ．会社法上の公開会社は、募集株式の払込金額が当該募集株式を引き受ける者に特に有利な金額である場合には、株主に当該募集株式の割当てを受ける権利を与えるときであっても、株主総会の決議によって募集事項を定めなければならない。\nウ．判例の趣旨によれば、会社法上の公開会社でない株式会社において、株主総会の特別決議を経ないまま、株主に募集株式の割当てを受ける権利を与えることなく募集株式を発行した場合には、当該募集株式の発行には無効原因がある。\nエ．会社法上の公開会社でない取締役会設置会社において、募集株式の払込金額の下限が当該募集株式を引き受ける者に特に有利な金額である場合には、株主総会の特別決議によって当該募集株式に関する募集事項の決定を取締役会に委任することはできない。\nオ．会社法上の公開会社の取締役は、募集株式の発行をする場合において、当該募集株式の発行により当該公開会社の総株主の議決権の２分の１を超える議決権を有することとなる引受人がいるときであっても、事業の継続のため緊急の必要があるときは、株主に対し、当該引受人の氏名又は名称を通知することを要しない。\n１．アウ\n２．アエ\n３．イウ\n４．イオ\n５．エオ", "source": "https://www.moj.go.jp/content/001443617.pdf", "answerSource": "https://www.moj.go.jp/content/001444174.pdf"}, {"id": "R7-shoho-19", "year": "R7", "yearLabel": "令和7年", "subject": "商法", "qno": 19, "haiten": 2, "type": "choice", "options": 5, "answer": [2], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第19問〕（配点：２）\n株式会社（特例有限会社を除く。）の定款の定めに関する次のアからオまでの各記述のうち、正しいものを組み合わせたものは、後記１から５までのうちどれか。\nア．株式会社は、取締役会の決議について、議決に加わることができる取締役の３分の２以上が出席し、その過半数をもって行う旨を定款で定めることができる。\nイ．株式会社は、株主総会の招集を請求することができる株主を総株主の議決権の３分の１以上の議決権を有する株主とする旨を定款で定めることができる。\nウ．株式会社は、株主名簿管理人を置く場合には、株主名簿管理人を置く旨及びその氏名又は名称を定款で定めなければならない。\nエ．種類株式発行会社は、一部の種類の株式についてのみ株券を発行する旨を定款で定めることができる。\nオ．株式会社は、配当財産が金銭である剰余金の配当に関する株主総会の決議の定足数を排除する旨を定款で定めることができる。\n１．アイ\n２．アオ\n３．イウ\n４．ウエ\n５．エオ", "source": "https://www.moj.go.jp/content/001443617.pdf", "answerSource": "https://www.moj.go.jp/content/001444174.pdf"}, {"id": "R7-shoho-20", "year": "R7", "yearLabel": "令和7年", "subject": "商法", "qno": 20, "haiten": 2, "type": "choice", "options": 5, "answer": [5], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第20問〕（配点：２）\n株式会社（特例有限会社を除く。）の株主総会に関する次のアからオまでの各記述のうち、誤っているものを組み合わせたものは、後記１から５までのうちどれか。\nア．会社法上の公開会社は、株主総会の招集の通知を発すべき時を当該株主総会の日の１０日前までとする旨を定款で定めることができない。\nイ．株主総会は、当該株主総会に出席しない株主が書面によって議決権を行使することができることとされた場合には、株主の全員の同意があるときであっても、招集の手続を経ることなく開催することはできない。\nウ．株主が株主総会の日より相当の期間前に当該株主総会において説明を求める特定の事項を株式会社に対して通知した場合には、当該株主総会において当該事項について説明を求められた取締役は、説明をするために調査をすることが必要であることを理由に説明を拒むことができない。\nエ．株主総会参考書類等の内容である情報について電子提供措置をとる旨の定款の定めがある株式会社の株主は、当該株式会社に対し、電子提供措置事項を記載した書面の交付を請求することができない。\nオ．会社法上の公開会社の株主総会は、会社法に規定する事項及び株式会社の組織、運営、管理その他株式会社に関する一切の事項について決議をすることができる。\n１．アウ\n２．アエ\n３．イウ\n４．イオ\n５．エオ", "source": "https://www.moj.go.jp/content/001443617.pdf", "answerSource": "https://www.moj.go.jp/content/001444174.pdf"}, {"id": "R7-shoho-21", "year": "R7", "yearLabel": "令和7年", "subject": "商法", "qno": 21, "haiten": 2, "type": "choice", "options": 5, "answer": [4], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第21問〕（配点：２）\n株式会社（特例有限会社を除く。）の機関に関する次のアからオまでの各記述のうち、正しいものを組み合わせたものは、後記１から５までのうちどれか。\nア．会社法上の公開会社である大会社であって、その発行する株式について有価証券報告書の提出を義務付けられているものは、会社法上、社外取締役を２人以上置かなければならない。\nイ．監査役会設置会社は、取締役会を置かなければならない。\nウ．大会社は、取締役会及び監査役会を置かなければならない。\nエ．指名委員会等設置会社の監査委員は、当該指名委員会等設置会社の執行役を兼ねることができない。\nオ．監査等委員会設置会社は、取締役の過半数が社外取締役でない場合には、取締役会の決議によって重要な業務執行の決定の一部を取締役に委任することができる旨を定款で定めることができない。\n１．アウ\n２．アオ\n３．イウ\n４．イエ\n５．エオ", "source": "https://www.moj.go.jp/content/001443617.pdf", "answerSource": "https://www.moj.go.jp/content/001444174.pdf"}, {"id": "R7-shoho-22", "year": "R7", "yearLabel": "令和7年", "subject": "商法", "qno": 22, "haiten": 2, "type": "choice", "options": 5, "answer": [2], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第22問〕（配点：２）\n株式会社の取締役の選任等に関する次のアからオまでの各記述のうち、誤っているものを組み合わせたものは、後記１から５までのうちどれか。\nア．会社法上の公開会社でない株式会社は、取締役が株主でなければならない旨を定款で定めることができない。\nイ．取締役を選任する株主総会の決議をする場合には、取締役が欠けた場合に備えて補欠の取締役を選任することができる。\nウ．監査等委員会設置会社においては、株主総会の決議による取締役の選任は、監査等委員である取締役とそれ以外の取締役とを区別してしなければならない。\nエ．指名委員会等設置会社の監査委員は、取締役の中から、取締役会の決議によって選定する。\nオ．累積投票によらないで取締役を選任する旨の定款の定めがある監査役設置会社においては、取締役の解任は、株主総会の特別決議によらなければならない。\n１．アイ\n２．アオ\n３．イウ\n４．ウエ\n５．エオ", "source": "https://www.moj.go.jp/content/001443617.pdf", "answerSource": "https://www.moj.go.jp/content/001444174.pdf"}, {"id": "R7-shoho-23", "year": "R7", "yearLabel": "令和7年", "subject": "商法", "qno": 23, "haiten": 2, "type": "choice", "options": 5, "answer": [3], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第23問〕（配点：２）\n株式会社の計算等に関する次のアからオまでの各記述のうち、正しいものを組み合わせたものは、後記１から５までのうちどれか。\nア．募集株式の発行に際して株主となる者が株式会社に対して金銭の払込みをした場合は、当該株式会社は、払い込まれた金額の全部を資本金として計上しなければならない。\nイ．株式会社における資本金の額の減少について承認をしなかった債権者は、資本金の額の減少の無効の訴えを提起することができる。\nウ．株式会社の純資産額が３００万円を下回る場合には、当該株式会社は、剰余金の配当をすることができない。\nエ．株式会社が分配可能額を超えて剰余金の配当をした場合において、当該剰余金の配当を受けた株主が分配可能額を超えることにつき善意でかつ重大な過失がないときは、当該株主は、当該株式会社に対し、交付を受けた配当財産の帳簿価額に相当する金銭を支払う義務を負わない。\nオ．子会社は、その有する親会社の株式について、剰余金の配当を受けることができない。\n１．アイ\n２．アオ\n３．イウ\n４．ウエ\n５．エオ", "source": "https://www.moj.go.jp/content/001443617.pdf", "answerSource": "https://www.moj.go.jp/content/001444174.pdf"}, {"id": "R7-shoho-24", "year": "R7", "yearLabel": "令和7年", "subject": "商法", "qno": 24, "haiten": 2, "type": "choice", "options": 5, "answer": [5], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第24問〕（配点：２）\n持分会社に関する次のアからオまでの各記述のうち、正しいものを組み合わせたものは、後記１から５までのうちどれか。\nア．既に持分会社に出資の履行をした有限責任社員は、当該持分会社の財産に対する強制執行がその効を奏しなかった場合には、連帯して、当該持分会社の債務を弁済する責任を負う。\nイ．無限責任社員が有限責任社員となった場合には、当該有限責任社員となった者は、その旨の登記をする前に生じた持分会社の債務について、無限責任社員として当該債務を弁済する責任を負わない。\nウ．持分会社の無限責任社員は、他の社員の全員の承諾があるときは、その持分の全部又は一部を当該持分会社に譲渡することができる。\nエ．業務を執行しない有限責任社員は、定款に別段の定めがある場合を除き、業務を執行する社員の全員の承諾があるときは、その持分の全部又は一部を他人に譲渡することができる。\nオ．合同会社の社員は、信用をその出資の目的とすることができない。\n１．アイ\n２．アウ\n３．イエ\n４．ウオ\n５．エオ", "source": "https://www.moj.go.jp/content/001443617.pdf", "answerSource": "https://www.moj.go.jp/content/001444174.pdf"}, {"id": "R7-shoho-25", "year": "R7", "yearLabel": "令和7年", "subject": "商法", "qno": 25, "haiten": 2, "type": "choice", "options": 5, "answer": [2], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第25問〕（配点：２）\n組織再編等に関する次のアからオまでの各記述のうち、正しいものを組み合わせたものは、後記 １から５までのうちどれか。\nア．株式会社が他の株式会社にその事業の全部の譲渡をする場合において、譲受会社が譲渡会社の特別支配会社であるときは、当該譲渡会社の株主総会の特別決議によって当該譲渡に係る契約の承認を受けることを要しない。\nイ．株式会社は、合名会社、合資会社又は合同会社に組織変更することができない。\nウ．新設分割設立会社が新設分割計画の定めに従い新設分割会社の債務を免責的に承継するには、当該債務に係る債権者の承諾を要する。\nエ．吸収分割において、吸収分割株式会社が株主総会の決議によって吸収分割契約の承認を受けなければならないときは、当該株主総会において議決権を行使することができない株主は、当該吸収分割株式会社に対し、自己の有する株式を公正な価格で買い取ることを請求することができる。\nオ．株式移転は、株式移転計画において定められた効力発生日に、その効力を生ずる。\n１．アウ\n２．アエ\n３．イウ\n４．イオ\n５．エオ", "source": "https://www.moj.go.jp/content/001443617.pdf", "answerSource": "https://www.moj.go.jp/content/001444174.pdf"}, {"id": "R7-shoho-26", "year": "R7", "yearLabel": "令和7年", "subject": "商法", "qno": 26, "haiten": 2, "type": "choice", "options": 5, "answer": [3], "figure": false, "revision": false, "revisionNote": "", "statement": "〔第26問〕（配点：２）\n株式会社についての訴訟に関する次のアからオまでの各記述のうち、誤っているものを組み合わせたものは、後記１から５までのうちどれか。\nア．株主総会決議不存在確認の訴えに係る請求を認容する確定判決は、第三者に対してもその効力を有する。\nイ．株式会社の取締役が退任した後に当該株式会社の株主となった者は、当該取締役の責任を追及する株主代表訴訟を提起することがで
