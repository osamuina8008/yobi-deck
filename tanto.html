 "answer": [4], "figure": false, "statement": "〔第５問〕（配点：２）\n名誉毀損罪に関するアからオまでの各記述を判例の立場に従って検討した場合、誤っているものの個数を１から５までの中から選びなさい。\nア．摘示した事実が真実であった場合、名誉毀損罪が成立することはない。\nイ．特定かつ少数の者に事実を摘示した場合、その内容が拡散する可能性があったとしても、名誉毀損罪が成立することはない。\nウ．法人の名誉を毀損した場合、名誉毀損罪が成立することはない。\nエ．名誉毀損罪が成立するためには、社会的評価を害するおそれのある状態を生じさせるだけでは足りず、現実に社会的評価が低下したことを要する。\nオ．名誉毀損罪は、告訴がなければ公訴を提起することができない。\n１．１個\n２．２個\n３．３個\n４．４個\n５．５個", "source": "https://www.moj.go.jp/content/001443618.pdf", "answerSource": "https://www.moj.go.jp/content/001444175.pdf"}, {"id": "R7-keiho-6", "year": "R7", "yearLabel": "令和7年", "subject": "刑法", "qno": 6, "haiten": 2, "type": "choice", "options": 5, "answer": [2], "figure": false, "statement": "〔第６問〕（配点：２）\n放火及び失火の罪に関するアからオまでの各記述を検討した場合、正しいものの組合せは１から ５までのうちどれか。\nア．甲は、自己所有の家屋に一人で居住していたが、同家屋に掛けた火災保険の保険金をだまし取ろうと考え、同家屋に放火して全焼させ、公共の危険を生じさせた。この場合、甲に他人所有非現住建造物等放火罪が成立する。\nイ．甲は、自己所有の無人倉庫に放火しようと考え、同倉庫に置かれた新聞紙に火をつけたが、同新聞紙が燃えたにとどまり、同倉庫は焼損しなかった。この場合、甲に自己所有非現住建造物等放火罪の未遂罪が成立する。\nウ．甲は、Ａ所有の自動車に放火しようと考え、同放火に使用するガソリンとライターを持って同車に近づいたが、甲に不審を抱いた警察官から職務質問を受けたため、同車に放火するに至らなかった。この場合、甲に放火予備罪が成立する。\nエ．甲は、自己所有の無人倉庫を失火により焼損し、それによって公共の危険を生じさせた。この場合、甲に失火罪が成立する。\nオ．甲は、Ａが居住するＡ所有の家屋に放火しようと考え、同家屋近くの消火栓から放水できないように同消火栓を損壊したが、放火するに至らなかった。この場合、甲に消火妨害罪が成立する。\n１．アイ\n２．アエ\n３．イウ\n４．ウオ\n５．エオ（参照条文）刑法第１１２条第１０８条及び第１０９条第１項の罪の未遂は、罰する。第１１３条第１０８条又は第１０９条第１項の罪を犯す目的で、その予備をした者は、２年以下の懲役に処する。ただし、情状により、その刑を免除することができる。第１１４条火災の際に、消火用の物を隠匿し、若しくは損壊し、又はその他の方法により、消火を妨害した者は、１年以上１０年以下の懲役に処する。第１１５条第１０９条第１項及び第１１０条第１項に規定する物が自己の所有に係るものであっても、差押えを受け、物権を負担し、賃貸し、配偶者居住権が設定され、又は保険に付したものである場合において、これを焼損したときは、他人の物を焼損した者の例による。第１１６条失火により、第１０８条に規定する物又は他人の所有に係る第１０９条に規定する物を焼損した者は、５０万円以下の罰金に処する。 ２失火により、第１０９条に規定する物であって自己の所有に係るもの又は第１１０条に規定する物を焼損し、よって公共の危険を生じさせた者も、前項と同様とする。", "source": "https://www.moj.go.jp/content/001443618.pdf", "answerSource": "https://www.moj.go.jp/content/001444175.pdf"}, {"id": "R7-keiho-7", "year": "R7", "yearLabel": "令和7年", "subject": "刑法", "qno": 7, "haiten": 2, "type": "choice", "options": 5, "answer": [3], "figure": false, "statement": "〔第７問〕（配点：２）\n学生Ａ及びＢは、【会話】のとおり議論している。\n【会話】中の①から⑧までの（ ）内に【語句群】から適切なものを入れた場合、正しいものの組合せは１から５までのうちどれか。なお、① から⑧までの（ ）内には、それぞれ異なるものが入る。\n【会話】 学生Ａ．支払意思・能力がないことを秘して飲食店で注文し、飲食物の提供を受けた無銭飲食の事案について、詐欺罪は成立しますか。学生Ｂ．私は、判例と同様に、（①）といえ、（②）に当たるので、詐欺罪が成立すると考えます。学生Ａ．約款により暴力団関係者の施設利用を拒絶しているゴルフ場において、暴力団関係者がその旨を申告することなく施設利用をした場合はどう考えますか。学生Ｂ．私は、判例と同様に、事案によっては詐欺罪が成立しない場合もあると考えます。詐欺罪が成立するとした判例では、（②）を認定できる事情がありました。一方、詐欺罪が成立しないとした判例では、ゴルフ場側が（③）するなどして、暴力団関係者による施設利用を（④）する意向を示していたものの、それ以上に（⑤）する措置は講じていなかったという事情がありました。また、（③）している周辺のゴルフ場において、暴力団関係者の施設利用を（⑥）する例が多数あったことなど、（②）を認定することが困難な事情がありました。そのため、暴力団関係者であることを申告せずに施設利用を申し込んだとしても、（⑦）ので、（⑧）としました。\n【語句群】\n  ａ．飲食後、直ちに代金を支払う意思・能力がないことを告知する義務があるのに、その義務に違反して真実を告げていない\n  ｂ．飲食店における注文は、暗黙の前提として、飲食後、直ちに代金を支払う意思・能力があるとの意思表示を内包している\n  ｃ．挙動による欺罔行為\n  ｄ．不作為による欺罔行為\n  ｅ．利用客に対して暴力団関係者でないことを確認\n  ｆ．暴力団関係者の施設利用を拒絶する旨の立看板を設置\n  ｇ．許可・黙認\n  ｈ．拒絶\n  ｉ．利用客は正規の利用料金を支払っており、ゴルフ場に経済的な不利益はない\n  ｊ．申込者が当然に暴力団関係者でないことまで表しているとは認められない\n  ｋ．財産的損害が発生していない\n  ｌ．欺罔行為に当たらない\n１．①ａ ③ｅ ⑤ｆ ⑦ｉ\n２．①ｂ ④ｇ ⑥ｈ ⑦ｊ\n３．②ｃ ④ｈ ⑥ｇ ⑧ｌ\n４．②ｄ ⑤ｆ ⑥ｈ ⑧ｋ\n５．③ｆ ⑤ｅ ⑦ｉ ⑧ｋ", "source": "https://www.moj.go.jp/content/001443618.pdf", "answerSource": "https://www.moj.go.jp/content/001444175.pdf"}, {"id": "R7-keiho-8", "year": "R7", "yearLabel": "令和7年", "subject": "刑法", "qno": 8, "haiten": 2, "type": "choice", "options": 5, "answer": [1], "figure": false, "statement": "〔第８問〕（配点：２）\n学生Ａ及びＢは、【会話】のとおり議論している。\n【会話】中の①から⑧までの（ ）内に、 【語句群】から適切なものを入れた場合、正しいものの組合せは１から５までのうちどれか。なお、 ①から⑧までの（ ）内には、それぞれ異なるものが入る。\n【会話】 学生Ａ．判例は、複写機による公文書のコピーについて、公文書偽造罪の客体になり得ることを（①）し、その場合の名義人を（②）としていますね。学生Ｂ．その判例に対しては、（③）という批判があります。学生Ａ．市長の代決者である課長を補助する係長など補助公務員にも市長名義の公文書の作成権限が認められる場合があるかについて、（④）とした判例がありますね。学生Ｂ．その判例に対しては、（⑤）という批判があります。学生Ａ．補助公務員が職務上起案を担当する文書につき虚偽のものを起案し、事情を知らない作成権限者である上司を利用して同文書を作成させた場合、判例は、（⑥）罪の間接正犯は（⑦）としていますね。学生Ｂ．公務員でない者が虚偽の申立てをして、事情を知らない公務員を利用して虚偽の公文書を作成させた場合、判例は、（⑧）罪の場合以外は（⑥）罪の間接正犯は処罰しないのが刑法の趣旨であると解するのが相当としていますね。\n【語句群】\n  ａ．肯定\n  ｂ．否定\n  ｃ．原本作成名義人\n  ｄ．コピー作成者\n  ｅ．原本のコピーは、写しとはいえ、原本と同一の意識内容を保有し、証明文書として原本と同様の社会的機能と信用性を有するものと認められるので、公文書偽造罪の客体とすべきである\n  ｆ．コピーそれ自体を原本として行使する場合を除き、コピーの作成名義人はコピー作成者であり、コピーにはその記載を欠くので文書偽造罪にいう文書ということはできない\n  ｇ．補助公務員である以上、一律に作成権限を有することはない\n  ｈ．公文書の内容の正確性を確保することなど、その者への授権を基礎付ける一定の基本的な条件に従う限度において作成権限を有している\n  ｉ．作成権限に一定の条件を付することは可能である\n  ｊ．刑法が公文書偽造と虚偽公文書作成を区別している以上、文書の内容が正確ならば作成権限があるという解釈は、その建前に反する\n  ｋ．虚偽公文書作成\n  ｌ．公正証書原本不実記載等\n  ｍ．成立し得る\n  ｎ．成立し得ない\n１．①ａ ④ｈ ⑥ｋ ⑦ｍ\n２．①ｂ ③ｅ ⑤ｉ ⑦ｎ\n３．②ｃ ⑤ｊ ⑥ｌ ⑧ｋ\n４．②ｄ ④ｇ ⑦ｎ ⑧ｋ\n５．③ｆ ⑤ｉ ⑥ｋ ⑧ｌ", "source": "https://www.moj.go.jp/content/001443618.pdf", "answerSource": "https://www.moj.go.jp/content/001444175.pdf"}, {"id": "R7-keiho-9", "year": "R7", "yearLabel": "令和7年", "subject": "刑法", "qno": 9, "haiten": 2, "type": "choice", "options": 5, "answer": [5], "figure": false, "statement": "〔第９問〕（配点：２）\n学生Ａ及びＢは、【事例】について、【会話】のとおり議論している。\n【会話】中の①から⑨までの（ ）内に【語句群】から適切なものを入れた場合、正しいものの組合せは１から５までのう ［ No.ちどれか。なお、①から⑨までの（ ）内には、それぞれ異なるものが入る。\n【事例】 甲は、殺人事件を目撃し、その犯人はＸに見えたという記憶であるが、大人しいＸが殺人事件を起こすはずがなく、真実はＸとよく似たＹが犯人であると考え、Ｘを被告人とする殺人事件の公判廷において、宣誓の上、「犯人はＹである。」と自己の記憶に反する証言をした。客観的な真実としては、上記殺人事件の犯人はＹではなくＸであった。\n【会話】 学生Ａ．甲に偽証罪が成立するか否かは、刑法第１６９条の「虚偽」の解釈によりますね。私は、証人が経験した内容を正確に反映することが刑事司法にとって重要であると考えるので、「虚偽」とは（①）ことであると考えます。学生Ｂ．私は、Ａさんとは異なり、「虚偽」とは（②）ことであると考えます。学生Ａ．私の立場からすると、（③）ので、甲の証言は「虚偽」に当たります。甲は、（④）ので、（⑤）。学生Ｂ．私の立場からすると、（⑥）ので、甲の証言は「虚偽」に当たります。甲は、（⑦）ので、（⑧）。学生Ａ．判例は、（⑨）と同様の立場に立っていますね。\n【語句群】\n  ａ．客観的真実に反する\n  ｂ．証人の記憶に反する\n  ｃ．客観的にはＸが犯人である\n  ｄ．甲の記憶ではＸが犯人である\n  ｅ．自己の記憶に反する証言をしていると認識しており、故意も認められる\n  ｆ．真実を証言していると認識している以上、故意が認められない\n  ｇ．偽証罪が成立します\n  ｈ．偽証罪は成立しません\n  ｉ．Ｂさん\n  ｊ．私\n１．①ａ ③ｃ ⑥ｄ ⑧ｈ\n２．①ｂ ④ｅ ⑥ｃ ⑧ｇ\n３．②ａ ④ｆ ⑦ｅ ⑨ｉ\n４．②ｂ ⑤ｈ ⑦ｆ ⑨ｉ\n５．③ｄ ⑤ｇ ⑦ｆ ⑨ｊ", "source": "https://www.moj.go.jp/content/001443618.pdf", "answerSource": "https://www.moj.go.jp/content/001444175.pdf"}, {"id": "R7-keiho-10", "year": "R7", "yearLabel": "令和7年", "subject": "刑法", "qno": 10, "haiten": 3, "type": "multi", "options": 5, "answer": [1, 5], "figure": false, "statement": "〔第10問〕（配点：３）\n１から５までの各記述を判例の立場に従って検討した場合、正しいものを２個選びなさい。（解答欄は、 、順不同）\n１．甲は、乙がＡ及びＢを木刀で順次殴打して両名を負傷させる犯行に及んだ際、これに先立ち、乙の意図を知りながら、凶器として同木刀を乙に手渡し、これらの犯行を幇助した。この場合、甲に２個の傷害罪の幇助犯が成立し、これらは観念的競合となる。\n２．甲は、Ａを監禁することを目的として、Ａの手足をロープで縛り付けて逮捕し、これに引き続き自宅にＡを監禁した。この場合、甲に逮捕罪及び監禁罪が成立し、これらは牽連犯となる。\n３．甲は、自宅でＡを殺害し、その死体を自宅の庭に埋めて遺棄した。この場合、甲に殺人罪及び死体遺棄罪が成立し、これらは牽連犯となる。\n４．甲は、火災保険金をだまし取ろうと考え、同居していた妻が不在の間に、自宅に放火して全焼させ、その後に火災原因を偽って火災保険金の支払を受けた。この場合、甲に現住建造物等放火罪及び詐欺罪が成立し、これらは牽連犯となる。\n５．甲は、Ａ名義で預金口座を開設する目的で、Ａに成り済ましてＡ名義で口座開設申込書を作成し、これを銀行の係員に提出して、Ａ名義の預金通帳の交付を受けた。この場合、甲に有印私文書偽造罪、同行使罪及び詐欺罪が成立し、これらは牽連犯となる。", "source": "https://www.moj.go.jp/content/001443618.pdf", "answerSource": "https://www.moj.go.jp/content/001444175.pdf"}, {"id": "R7-keiho-11", "year": "R7", "yearLabel": "令和7年", "subject": "刑法", "qno": 11, "haiten": 2, "type": "choice", "options": 5, "answer": [5], "figure": false, "statement": "〔第11問〕（配点：２）\n住居侵入等罪に関する１から５までの各記述を判例の立場に従って検討した場合、正しいものはどれか。\n１．住居侵入等罪（刑法第１３０条）の客体は、人の住居若しくは邸宅又は人の看守する建造物若しくは艦船である。\n２．住居権者の同意に基づいてその者の住居に立ち入った場合、住居侵入罪の構成要件に該当するが、違法性が阻却される。\n３．住居侵入罪が成立するには、居住者が法律上正当な権限に基づいて居住する住居に侵入する必要がある。\n４．正当な理由がないのに建造物に侵入した後、同建造物の管理者から退去の要求を受けたにもかかわらず退去しなかった場合、建造物侵入罪だけでなく、不退去罪も成立する。\n５．「建造物」に含まれる囲繞地というには、その土地が建物に接してその周辺に存在し、かつ、管理者が外部との境界に囲障を設置することにより、建物の附属地として、建物利用のために供されるものであることが明示されていれば足りる。", "source": "https://www.moj.go.jp/content/001443618.pdf", "answerSource": "https://www.moj.go.jp/content/001444175.pdf"}, {"id": "R7-keiho-12", "year": "R7", "yearLabel": "令和7年", "subject": "刑法", "qno": 12, "haiten": 2, "type": "choice", "options": 5, "answer": [4], "figure": false, "statement": "〔第12問〕（配点：２）\nアからオまでの各記述を判例の立場に従って検討した場合、誤っているものの個数を１から５までの中から選びなさい。\nア．甲は、Ａ株式会社の代表取締役である実母Ｂが管理するＡ社所有の絵画を窃取した。この場合、甲に窃盗罪が成立するが、上記絵画の占有者Ｂは甲の実母であり、刑法第２４４条第１項が適用されるから、その刑は免除される。\nイ．甲は、家庭裁判所から孫Ａの未成年後見人に選任されたが、後見の事務として業務上預かり保管中のＡの預金を引き出して自己の借金の返済に充てた。この場合、甲に業務上横領罪が成立するが、Ａは甲の直系血族であり、刑法第２４４条第１項が準用されるから、その刑は免除される。\nウ．甲は、祖父Ａが所有し、管理している現金をＡから強取した。この場合、甲に強盗罪が成立するが、刑法第２４４条第１項は強盗罪にも適用されるから、その刑は免除される。\nエ．甲は、留守中のＡ方に侵入して窃盗の実行に着手したが、Ａが帰宅したため、Ａから金品を強取しようと考え、反抗を抑圧するに足りる程度の暴行をＡに加え、Ａ方内にある現金を奪った。この場合、甲はＡに対する暴行を加える前に窃盗の実行に着手しているから、甲に事後強盗罪が成立する。\nオ．甲は、留守中のＡ方に侵入して窃盗の実行に着手したが、金品を領得する前にＡが帰宅したため、逮捕を免れる目的で、反抗を抑圧するに足りる程度の暴行をＡに加え、逃走した。この場合、甲は金品を領得していないから、甲に事後強盗未遂罪が成立する。\n１．１個\n２．２個\n３．３個\n４．４個\n５．５個", "source": "https://www.moj.go.jp/content/001443618.pdf", "answerSource": "https://www.moj.go.jp/content/001444175.pdf"}, {"id": "R7-keiho-13", "year": "R7", "yearLabel": "令和7年", "subject": "刑法", "qno": 13, "haiten": 4, "type": "series", "options": 2, "answer": [2, 2, 2, 2, 2], "figure": false, "statement": "〔第13問〕（配点：４）\n【事例】に関するアからオまでの各【記述】を判例の立場に従って検討し、正しい場合には１を、誤っている場合には２を選びなさい。\n【事例】 甲は、乙から現金をだまし取ろうと考え、某月１日、不正な細工を施した花札を用いて賭博の初心者である乙を負けさせ、乙に３００万円の債務を負担させた。（①）乙は、同月２日、賭博の常習者である丙に相談したところ、丙は、乙に対し、再び賭博をするよう教唆した。乙は、再び賭博をすることを決意し、同月３日、別の賭博場で賭博をしたが負けたため、更に３００万円の債務を負った。（②）乙は、同月５日、高額収入が得られる旨をうたう求人サイトに応募したところ、同サイトを運営していた丁から、不正に入手したクレジットカードの名義人Ａを装って電子マネーの購入手続をするよう依頼されてこれに応じ、インターネットを介して、Ａの氏名やカード番号等の情報をクレジットカード決済代行会社が使用する電子計算機に送信し、同電子計算機に接続されたハードディスクにＡが１０万円相当の電子マネーを購入した旨の電磁的記録を作成して同電子マネーの利用権を取得した。（③）丁は、不特定多数の者に電話をかけ、真実は違約金を支払う必要がないのに、これを支払う必要がある旨のうそを告げ、某所に現金を送付させて詐取することを繰り返していた。丁は、乙の応募に先立つ同月４日、Ｂに電話をかけ、前同様のうそを告げ、現金を某所に送付するよう指示した。Ｂは、うそを見破って警察官に通報したところ、警察官から丁の上記指示に従ったふりをするよう依頼され、同月５日、模造紙幣が入った荷物を某所に発送した。乙は、同月６日、丁から、上記指示内容について説明を受けるとともに上記荷物を受領して丁に届けるよう依頼され、同荷物が詐欺の被害金であると認識した上でこれに応じ、いわゆるだまされたふり作戦の開始を認識しないまま某所で宅配業者から同荷物を受領したが、その場で警察官に逮捕された。（④）丁は、乙が逮捕されたことを知り、同月７日、知人の戊に対し、自己の逃走資金の提供を依頼した。戊は、同日、丁が現金の詐取を繰り返していたことを認識した上で、逃走資金として現金 １００万円を丁に手渡した。（⑤） 【記述】\nア．①につき、甲は、公序良俗に反する無効な行為を原因として乙に債務を負担させているので、甲に詐欺罪は成立しない。\nイ．②につき、正犯である乙に単純賭博罪が成立するにすぎないので、丙が賭博の常習者であったとしても、丙に単純賭博罪の教唆犯が成立するにとどまる。\nウ．③につき、乙が上記電子計算機に送信したＡの氏名やカード番号等はいずれも真正なものであり、「虚偽の情報」に当たらないので、乙及び丁に電子計算機使用詐欺罪の共同正犯は成立しない。\nエ．④につき、乙は、だまされたふり作戦の開始後に加功しているので、乙の加功前になされた欺罔行為を含む詐欺未遂罪の共同正犯は成立しない。\nオ．⑤につき、犯人が他人を教唆して自己を隠避させることは定型的に期待可能性がないので、丁に犯人隠避罪の教唆犯は成立しない。 ［刑事訴訟法］", "source": "https://www.moj.go.jp/content/001443618.pdf", "answerSource": "https://www.moj.go.jp/content/001444175.pdf"}, {"id": "R7-keiso-14", "year": "R7", "yearLabel": "令和7年", "subject": "刑事訴訟法", "qno": 14, "haiten": 2, "type": "choice", "options": 6, "answer": [5], "figure": false, "statement": "〔第14問〕（配点：２）\n捜査の端緒に関する次のアからオまでの各記述のうち、刑事訴訟法の規定上、正しいものは幾つあるか。後記１から６までのうちから選びなさい。\nア．告発は、書面又は口頭で、検察官又は司法警察員にしなければならない。\nイ．被害者の法定代理人は、被害者と独立して告訴をすることができる。\nウ．司法警察員は、口頭による自首を受けたときは調書を作らなければならない。\nエ．変死者又は変死の疑いのある死体が発見された場合、検察官は、検視を行わなければならないが、検察事務官又は司法警察員にこれをさせることができる。\nオ．検視を行うに当たっては、令状なくして、対象となる死体を切開して胃の内容物を採取することができる。\n１．０個\n２．１個\n３．２個\n４．３個\n５．４個\n６．５個", "source": "https://www.moj.go.jp/content/001443618.pdf", "answerSource": "https://www.moj.go.jp/content/001444175.pdf"}, {"id": "R7-keiso-15", "year": "R7", "yearLabel": "令和7年", "subject": "刑事訴訟法", "qno": 15, "haiten": 3, "type": "series", "options": 2, "answer": [2, 2, 1, 1, 2], "figure": true, "statement": "〔第15問〕（配点：３）\n次の【事例】について述べた後記アからオまでの【記述】のうち、正しいものには１を、誤っているものには２を選びなさい。ただし、判例がある場合には、それに照らして考えるものとする。\n【事例】 被告人甲は、自宅において、同居の妻である被害者Ｖに対し、「殺してやる。」と言いながらその胸部を果物ナイフで刺突して殺害しようとしたが傷害を負わせたにとどまったという殺人未遂の事実について起訴された。検察官は、①犯行現場の実況見分調書、②Ｖによる被害再現状況を撮影した写真が添付された捜査報告書、③犯行現場で押収された果物ナイフ、④Ｖの怪我の状況を撮影した写真が添付された実況見分調書の証拠調べを請求するとともに、あらかじめ弁護人にこれらを閲覧する機会を与えた。弁護人は、①について同意、②及び④について不同意、③について証拠調べに異議がない旨の意見を述べ、裁判所は、①及び③を証拠として採用し、証拠調べを行った。その後、検察官の請求によりＶの証人尋問が実施され、Ｖは、自宅にあった果物ナイフで甲から胸部を刺された被害状況やその際の甲・Ｖの位置関係について②の捜査報告書に添付された被害再現写真と同趣旨の内容を具体的に証言したが、犯行時の甲の発言については「よく覚えていない。」旨証言した。また、検察官の請求により、④を作成した警察官Ｘの証人尋問が実施された。\n【記述】\nア．検察官は、犯行時の甲・Ｖの位置関係に関するＶの供述を明確にするため必要がある場合において、弁護人に異議がないときに限り、下線部①の実況見分調書に添付された現場見取図を Ｖに示して尋問することができる。\nイ．検察官は、「殺してやる。」という甲の発言に関するＶの記憶を喚起するため必要がある場合であっても、主尋問において誘導尋問をしてはならない。\nウ．検察官は、被害状況に関するＶの供述を明確にするため必要がある場合において、裁判長の許可を受けて、下線部②の捜査報告書に添付された被害再現写真をＶに示すことができる。\nエ．検察官は、下線部③の果物ナイフにつき、犯行に使用された果物ナイフとの同一性をＶに尋問する場合において必要があるときは、裁判長の許可を受けずにこれを示すことができる。\nオ．検察官は、証拠調べが終わっていない下線部④の実況見分調書をＸに示して、その成立の真正について尋問することは許されない。", "source": "https://www.moj.go.jp/content/001443618.pdf", "answerSource": "https://www.moj.go.jp/content/001444175.pdf"}, {"id": "R7-keiso-16", "year": "R7", "yearLabel": "令和7年", "subject": "刑事訴訟法", "qno": 16, "haiten": 2, "type": "choice", "options": 5, "answer": [3], "figure": false, "statement": "〔第16問〕（配点：２）\n次のⅠないしⅢの【見解】は、逮捕・勾留の要件が備わらないＡ事実での逮捕・勾留に先立って、逮捕・勾留の要件が備わっているＢ事実で逮捕・勾留する場合の適法性に関するものである。\n【見解】に関する後記アからオまでの【記述】のうち、誤っているものの組合せは、後記１から５までのうちどれか。\n【見解】 Ⅰ．Ｂ事実について逮捕・勾留の要件が備わっていたとしても、捜査機関がＢ事実による逮捕・勾留を専ら又は主としてＡ事実の捜査に利用する意図である場合には、Ｂ事実による逮捕・勾留は実質的にＡ事実による逮捕・勾留と評価され、違法となる。 Ⅱ．Ｂ事実について逮捕・勾留の要件が備わっているか否かを基準に適法性を判断すべきであり、 Ｂ事実について逮捕・勾留の要件が備わっている限り、Ｂ事実による逮捕・勾留は適法である。 Ⅲ．Ｂ事実によって逮捕・勾留された後の身体拘束期間が主としてＡ事実の捜査のために利用されるに至った場合には、それ以降の身体拘束は、Ｂ事実による逮捕・勾留としての実体を喪失し、Ａ事実による身体拘束となっていると評価され、違法となる。\n【記述】\nア．Ⅰの見解でも、Ｂ事実による身体拘束期間にＢ事実の取調べと並行してＡ事実の取調べを行った場合、その身体拘束が違法にならないことがある。\nイ．Ⅱの見解では、Ｂ事実による身体拘束が適法に行われたものである以上、仮にその身体拘束期間中に専らＡ事実の取調べが行われており、Ｂ事実の取調べが全く行われていないような場合でも、Ａ事実の取調べが違法となることはない。\nウ．Ⅲの見解は、逮捕・勾留期間につき、その理由とされた被疑事実について被疑者の逃亡・罪証隠滅を防止した状態で起訴・不起訴の決定に向けた捜査を行う期間であると捉える考えと整合しない。\nエ．Ⅰの見解に対しては、逮捕・勾留の場面において、裁判官が捜査機関の意図・目的を審査することは現実的には容易ではないとの批判がある。\nオ．Ⅱの見解に対しては、捜査機関による身体拘束の濫用という問題の本質を無視する考え方であるとの批判がある。\n１．アイ\n２．アエ\n３．イウ\n４．ウオ\n５．エオ", "source": "https://www.moj.go.jp/content/001443618.pdf", "answerSource": "https://www.moj.go.jp/content/001444175.pdf"}, {"id": "R7-keiso-17", "year": "R7", "yearLabel": "令和7年", "subject": "刑事訴訟法", "qno": 17, "haiten": 3, "type": "choice", "options": 6, "answer": [6], "figure": false, "statement": "〔第17問〕（配点：３）\n次の【判例】は、窃盗被疑事実の嫌疑に基づいて逮捕（以下「本件逮捕」という。）された被疑者からその日のうちに任意で尿が採取され（以下「本件採尿」という。）、その尿についての鑑定書（以下「本件鑑定書」という。）が覚醒剤自己使用の事実を立証するための証拠として提出された事案において、その証拠能力を否定した最高裁判所の判例（覚せい剤取締法違反等被告事件に係る最高裁判所平成１５年２月１４日第二小法廷判決・刑集５７巻２号１２１頁）を抜粋したものである。後記アからオまでの【記述】のうち、【判例】に整合しないものは幾つあるか。後記１から ６までのうちから選びなさい。\n【判例】 「本件逮捕には、逮捕時に逮捕状の呈示がなく、逮捕状の緊急執行もされていない（中略）という手続的な違法があるが、それにとどまらず、警察官は、その手続的な違法を糊塗するため、（中略）逮捕状へ虚偽事項を記入し、内容虚偽の捜査報告書を作成し、更には、公判廷において事実と反する証言をしているのであって、本件の経緯全体を通して表れたこのような警察官の態度を総合的に考慮すれば、本件逮捕手続の違法の程度は、令状主義の精神を潜脱し、没却するような重大なものであると評価されてもやむを得ないものといわざるを得ない。そして、このような違法な逮捕に密接に関連する証拠を許容することは、将来における違法捜査抑制の見地からも相当でないと認められるから、その証拠能力を否定すべきである（中略）。」「本件採尿は、本件逮捕の当日にされたものであり、その尿は、上記のとおり重大な違法があると評価される本件逮捕と密接な関連を有する証拠であるというべきである。また、その鑑定書も、同様な評価を与えられるべきものである。」 【記述】\nア．本件逮捕は窃盗被疑事実の嫌疑に基づくものである一方で、本件採尿やその尿の鑑定は覚醒剤自己使用の被疑事実の嫌疑に基づくもので、本件鑑定書は後者の事実の立証に用いられるものであるから、本件逮捕の違法が、本件鑑定書の証拠能力に影響を及ぼすことはない。\nイ．違法収集証拠排除法則によって証拠が排除されるための要件である「違法の重大性」と「排除相当性」のうち、「違法の重大性」は、手続の客観的な違法の程度に着目するものであるから、その要件を充足するか否かの判断に際して、捜査機関側の主観的事情が考慮されることはない。\nウ．本件逮捕の違法を糊塗する目的でされた逮捕状への虚偽記載や公判廷での事実に反する証言等は、本件逮捕後にされたものであるから、これらの行為の存在が本件逮捕自体の違法性の程度に影響を及ぼすことはない。\nエ．違法な手続と最終的に獲得された証拠との間の因果性（関連性）の程度は、「違法の重大性」の判断における考慮要素であり、「排除相当性」の判断においては考慮されないから、本件逮捕と本件鑑定書との間の因果性（関連性）の程度が、本件鑑定書の「排除相当性」の判断に影響を及ぼすことはない。\nオ．鑑定は専門家によって客観的になされるものであり、その結果を記載した鑑定書は定型的に高度の信頼性を有する証拠といえるから、鑑定の対象となる尿が本件のように逮捕当日に被疑者から任意提出されたもので、重大な違法を伴う逮捕と密接に関連するものであったとしても、そのことが、尿の鑑定書の証拠能力に影響を及ぼすことはない。\n１．０個\n２．１個\n３．２個\n４．３個\n５．４個\n６．５個", "source": "https://www.moj.go.jp/content/001443618.pdf", "answerSource": "https://www.moj.go.jp/content/001444175.pdf"}, {"id": "R7-keiso-18", "year": "R7", "yearLabel": "令和7年", "subject": "刑事訴訟法", "qno": 18, "haiten": 2, "type": "choice", "options": 5, "answer": [3], "figure": false, "statement": "〔第18問〕（配点：２）\n公判前整理手続に関する次のアからオまでの各記述のうち、誤っているものの組合せは、後記１から５までのうちどれか。\nア．被告人は、裁判員裁判の対象事件ではない事件について、事件を公判前整理手続に付することを求めることができる。\nイ．裁判所は、裁判員裁判の対象事件ではない事件について、検察官と弁護人の双方が公判前整理手続に付することを求めている場合には、事件を公判前整理手続に付さなければならない。\nウ．検察官は、公判前整理手続に付された事件において、検察官請求証拠の開示をした後、被告人又は弁護人から請求があったときは、速やかに、被告人又は弁護人に対し、検察官が保管する証拠の一覧表の交付をしなければならない。\nエ．検察官は、公判前整理手続において取調べを請求した証人について、被告人又は弁護人に対し、同証人が公判期日において供述すると思料する内容が明らかになる書面等を閲覧する機会を与えなければならない。\nオ．裁判所は、公判前整理手続において検察官及び弁護人が行った証拠調べの請求の全てについて、同手続終結までに、証拠調べをする決定又は証拠調べの請求を却下する決定をしなければならない。\n１．アイ\n２．アウ\n３．イオ\n４．ウエ\n５．エオ", "source": "https://www.moj.go.jp/content/001443618.pdf", "answerSource": "https://www.moj.go.jp/content/001444175.pdf"}, {"id": "R7-keiso-19", "year": "R7", "yearLabel": "令和7年", "subject": "刑事訴訟法", "qno": 19, "haiten": 2, "type": "choice", "options": 5, "answer": [1], "figure": false, "statement": "〔第19問〕（配点：２）\n次の【事例】について述べた後記アからオまでの【記述】のうち、誤っているものの組合せは、後記１から５までのうちどれか。\n【事例】 Ｈ県Ｉ警察署の司法警察員Ｘは、同県内の時計店で発生した高級腕時計を被害品とする窃盗事件について捜査に従事していたところ、令和６年７月１５日午後１時頃、Ｉ市内の飲食店で無銭飲食があったとの通報を受けて同店に急行し、同日午後１時１５分、同店内にいた甲を詐欺罪の現行犯人として逮捕した。甲は、逮捕後の取調べにおいて、逮捕時に所持していたショルダーバッグ内に入っていた新品の高級腕時計について、「これは趣味で集めている時計で、海外で自分で買ったものだ。」と供述した。Ｘは、前記窃盗事件及び前記詐欺事件について、それぞれ被害店舗の実況見分や被害店舗従業員らの取調べを行った上で、同月１７日午後１時に詐欺罪の事実で甲をＨ地方検察庁検察官に送致する手続をした。同日午後１時３０分に甲の送致を受けたＨ地方検察庁検察官Ｙ は、甲に弁解の機会を与え、留置の必要があると判断したので、同月１８日正午、Ｈ地方裁判所裁判官に、詐欺罪の事実で甲の勾留を請求し、同裁判所裁判官Ｚは、同日午後３時、被疑者を甲、罪名を詐欺とする勾留状を発付した。これを受けて、司法警察員Ｘは、同日午後４時、同勾留状を執行した。その後、甲の勾留期間は延長されなかった。\n【記述】\nア．検察官Ｙは、令和６年７月１８日正午に勾留を請求しているが、同日午後１時３０分までに勾留を請求すれば足りる。\nイ．検察官Ｙは、裁判官Ｚが、罪証を隠滅すると疑うに足りる相当な理由がないことを理由として勾留請求を却下した場合、これに不服があるときでも、Ｈ地方裁判所に対し、その裁判を取り消して甲を勾留するよう請求することは許されない。\nウ．詐欺罪の事実について勾留の理由又は必要がなくなった場合、検察官Ｙは、窃盗罪の事実について捜査の必要があることを理由として甲の勾留を継続することは許されない。\nエ．検察官Ｙが、窃盗罪の事実について甲を逮捕しないまま、詐欺罪の事実に窃盗罪の事実を併せて勾留を請求した場合、勾留請求を受けた裁判官は、詐欺及び窃盗のいずれについても勾留の理由及び必要性が認められると判断したとき、両罪について勾留状を発付することができる。\nオ．甲の勾留期間の満了日は、令和６年７月２７日である。\n１．アイ\n２．アウ\n３．イオ\n４．ウエ\n５．エオ", "source": "https://www.moj.go.jp/content/001443618.pdf", "answerSource": "https://www.moj.go.jp/content/001444175.pdf"}, {"id": "R7-keiso-20", "year": "R7", "yearLabel": "令和7年", "subject": "刑事訴訟法", "qno": 20, "haiten": 3, "type": "choice", "options": 5, "answer": [1], "figure": false, "statement": "〔第20問〕（配点：３）\n次の【事例】について述べた後記アからオまでの【記述】のうち、正しいものは幾つあるか。後記１から６までのうちから選びなさい。\n【事例】 令和７年２月１日午前１時５０分頃、司法警察員Ｘは、近隣住民から「Ｔ公園で男性が血を流して倒れている。」との通報を受け、Ｔ公園に向かい、同日午前２時頃、頭から血を流して倒れているＶを発見した。Ｖは、Ｘに「男に金属バットで頭を殴られ、迷彩柄の財布を奪われた。」と説明した。そこで、Ｖを被害者とする強盗傷人事件の捜査が開始された。 Ｘは、同日午前３時頃、Ｔ公園内の人気のない草むらで、血痕が付着した金属バットを発見し、 ①その場でこれを押収した。また、ＸがＴ公園内に設置された防犯カメラの映像を確認したところ、同日午前１時頃に金属バットを手に持っている男（甲）が映っていた。 Ｘは、同日午前５時頃、Ｔ公園から約１キロメートル離れた公道上を歩いている甲を見付け、② 甲の尾行を開始した。その尾行中、Ｘは、甲が迷彩柄の財布を上着のポケットから取り出し、再び同ポケットに戻したことを確認したため、甲に声を掛け、自らが警察官であることを告げた上で、所持品を見せるよう求めた。すると、甲は、上着のポケットから何かを取り出そうとしたが、その際、透明のポリ袋を路上に落とした。Ｘは、甲の同意を得て同ポリ袋を拾い、中に白色粉末が入っていることを確認した。Ｘは、同粉末について、③覚醒剤の予試験を実施したところ、覚醒剤であるとの試験結果が得られた。そこで、Ｘは、④甲を覚醒剤取締法違反（所持）の被疑事実で逮捕し、 ⑤同ポリ袋とともに、甲の上着のポケット内にあった迷彩柄の財布を押収した。\n【記述】\nア．下線部①につき、Ｘは、金属バットを押収するに当たり、裁判官による令状の発付を受ける必要がある。\nイ．下線部②につき、Ｘは、甲を尾行するに当たり、裁判官による令状の発付を受ける必要がある。\nウ．下線部③につき、Ｘは、予試験を実施するに当たり、甲が同意しているか否かを問わず、裁判官による令状の発付を受ける必要がある。\nエ．下線部④につき、Ｘは、甲を逮捕するに当たり、裁判官による令状の発付を受ける必要がある。\nオ．下線部⑤につき、Ｘは、証拠物を押収するに当たり、ポリ袋と財布のいずれについても、裁判官による令状の発付を受ける必要がある。\n１．０個\n２．１個\n３．２個\n４．３個\n５．４個\n６．５個", "source": "https://www.moj.go.jp/content/001443618.pdf", "answerSource": "https://www.moj.go.jp/content/001444175.pdf"}, {"id": "R7-keiso-21", "year": "R7", "yearLabel": "令和7年", "subject": "刑事訴訟法", "qno": 21, "haiten": 2, "type": "choice", "options": 5, "answer": [5], "figure": false, "statement": "〔第21問〕（配点：２）\n弁護人に関する次のアからオまでの各記述のうち、正しいものの組合せは、後記１から５までの ［№うちどれか。ただし、判例がある場合には、それに照らして考えるものとする。\nア．裁判所は、被告人の私選弁護人の数を制限することはできない。\nイ．勾留を請求された被疑者は、国選弁護人の選任を請求するに当たり、その資力のいかんを問わず、あらかじめ、その勾留の請求を受けた裁判官の所属する裁判所の所在地を管轄する地方裁判所の管轄区域内に在る弁護士会に私選弁護人の選任の申出をしていなければならない。\nウ．特定の被疑事実について裁判官に選任された被疑者の国選弁護人は、当該被疑事実についての勾留が取り消され、被疑者が釈放されたとしても、当該被疑事実について検察官の終局処分がされるまでは、被疑者の国選弁護人としての地位を失うことはない。\nエ．被告人に氏名を記載することができない合理的な理由がないのに、被告人の署名のない弁護人選任届によってした私選弁護人の選任は無効である。\nオ．被告人又は被疑者の法定代理人、保佐人、配偶者、直系の親族及び兄弟姉妹は、独立して私選弁護人を選任することができる。\n１．アイ\n２．アウ\n３．イオ\n４．ウエ\n５．エオ", "source": "https://www.moj.go.jp/content/001443618.pdf", "answerSource": "https://www.moj.go.jp/content/001444175.pdf"}, {"id": "R7-keiso-22", "year": "R7", "yearLabel": "令和7年", "subject": "刑事訴訟法", "qno": 22, "haiten": 2, "type": "choice", "options": 5, "answer": [4], "figure": false, "statement": "〔第22問〕（配点：２）\n控訴に関する次のアからオまでの各記述のうち、正しいものの組合せは、後記１から５までのう ［№32ちどれか。ただし、判例がある場合には、それに照らして考えるものとする。\nア．控訴をするには、申立書を控訴裁判所に差し出さなければならない。\nイ．控訴裁判所は、被告人のみが控訴をした事件につき、原判決の刑より重い刑を言い渡すことができる。\nウ．控訴の取下げをした者は、その事件について更に控訴をすることができない。\nエ．控訴審は事後審であるから、控訴裁判所は、第一審判決後に生じた刑の量定に影響を及ぼす情状について取り調べることはできない。\nオ．控訴審における事実誤認の審査は、第一審判決が行った証拠の信用性評価や証拠の総合判断が論理則、経験則等に照らして不合理といえるかという観点から行うべきである。\n１．アイ\n２．アウ\n３．イエ\n４．ウオ\n５．エオ", "source": "https://www.moj.go.jp/content/001443618.pdf", "answerSource": "https://www.moj.go.jp/content/001444175.pdf"}, {"id": "R7-keiso-23", "year": "R7", "yearLabel": "令和7年", "subject": "刑事訴訟法", "qno": 23, "haiten": 2, "type": "choice", "options": 5, "answer": [1], "figure": false, "statement": "〔第23問〕（配点：２）\n次の【事例】について述べた後記アからオまでの【記述】のうち、誤っているものの組合せは、後記１から５までのうちどれか。\n【事例】 甲は、「令和６年１１月８日午後１１時頃、Ｈ市内の路上において、Ｖをナイフで刺して殺害した」との殺人の事実により、Ｈ地方裁判所に起訴された。公判において、甲は、本件殺人事件について犯人ではないと否認し、甲の知人Ａ、犯行を目撃したＶの知人Ｂ、甲と同居する甲の父親Ｃの証人尋問が、それぞれ実施された。 Ａは、「令和６年１１月７日午後５時頃、甲が私に電話してきて『①明日Ｖを殺そうと思う。手伝ってくれないか。』と言ってきたが、断った。すると、甲は、『それならば一人でやるしかない。 ②ナイフを用意した。これでＶを刺す。』と言ってきた。また、同月９日午前８時頃、再び甲が私に電話してきて『予定どおりやってやった。③昨晩、Ｈ市内の路上にＶを呼び出し、ナイフで刺して逃げてきた。』と言ってきた。」と証言した。 Ｂは、「令和６年１１月８日午後１１時頃、Ｈ市内の路上でＶを見掛け、声を掛けようとしたところ、知らない男がＶに近付いた。Ｖは、その男に向かって『④甲、何の用だ。』と言った。その直後、その男がＶに刃物のようなものを突き刺して逃げていった。」と証言した。 Ｃは、「令和６年１１月９日午前１０時頃、自宅において、甲から『⑤昨日午後１１時頃は、俺はＩ市内をドライブしていた。』と言われた。」と証言した。\n【記述】\nア．Ａの証言中の下線部①は、要証事実を「甲がＡにＶの殺害を手伝うよう言ったこと」とした場合、伝聞証拠に当たる。\nイ．Ａの証言中の下線部②は、要証事実を「甲が凶器としてナイフを用意していたこと」とした場合、伝聞証拠に当たる。\nウ．Ａの証言中の下線部③は、要証事実を「Ｖを殺したのが甲であったこと」とした場合、伝聞証拠に当たる。\nエ．Ｂの証言中の下線部④は、要証事実を「犯人がＶから甲と呼ばれていたこと」とした場合、伝聞証拠に当たる。\nオ．Ｃの証言中の下線部⑤は、要証事実を「事件発生時、甲が事件現場から離れた場所にいたこと」とした場合、伝聞証拠に当たる。\n１．アエ\n２．アオ\n３．イウ\n４．イエ\n５．ウオ", "source": "https://www.moj.go.jp/content/001443618.pdf", "answerSource": "https://www.moj.go.jp/content/001444175.pdf"}, {"id": "R7-keiso-24", "year": "R7", "yearLabel": "令和7年", "subject": "刑事訴訟法", "qno": 24, "haiten": 2, "type": "choice", "options": 5, "answer": [5], "figure": false, "statement": "〔第24問〕（配点：２）\n捜査機関の権限行使に関する次のアからオまでの各記述のうち、適法となる余地のないものの組合せは、後記１から５までのうちどれか。\nア．司法巡査が、私人から現行犯人を受け取り、これを司法警察員に引致した。\nイ．検察事務官が、緊急逮捕状を請求した。\nウ．司法巡査が、被疑者を逮捕した後、弁解録取手続を行った。\nエ．検察事務官が、捜索差押許可状を請求した。\nオ．司法警察員が、第１回公判期日前に証人尋問を請求した。\n１．アイ\n２．アオ\n３．イエ\n４．ウエ\n５．ウオ", "source": "https://www.moj.go.jp/content/001443618.pdf", "answerSource": "https://www.moj.go.jp/content/001444175.pdf"}, {"id": "R7-keiso-25", "year": "R7", "yearLabel": "令和7年", "subject": "刑事訴訟法", "qno": 25, "haiten": 2, "type": "choice", "options": 6, "answer": [1], "figure": false, "statement": "〔第25問〕（配点：２）\n刑事訴訟法第３２１条第１項の書面に関する次のアからオまでの各記述のうち、正しいものは幾つあるか。後記１から６までのうちから選びなさい。ただし、判例がある場合には、それに照らして考えるものとする。\nア．同項第１号の「裁判官の面前における供述を録取した書面」は、当該事件に関して作成されたものに限られ、被告人以外の者に対する事件の公判廷における同人の被告人としての供述を録取したものは含まれない。\nイ．共同被告人の検察官に対する供述調書は、共同被告人が被害者その他の純然たる証人とその本質を異にするから、同項第２号の「検察官の面前における供述を録取した書面」に当たらない。\nウ．証人が公判廷において証言を拒否した場合、同項第２号前段の「公判期日において供述することができないとき」に該当し、期日を改めて期間をおけば証言が得られる見込みがあったことを考慮する余地はない。\nエ．同項第２号ただし書の「前の供述を信用すべき特別の情況」（相対的特信情況）は、供述がなされた際の外部的・付随的情況を指すから、その存否を判断する際に供述内容自体を考慮することはできない。\nオ．被告人以外の者の司法警察員に対する供述調書で供述者の署名又は押印のあるものは、供述者の供述不能の要件が存在し、かつ、その供述が特に信用すべき情況（絶対的特信情況）の下にされたものであることが認められれば、同項第３号により証拠能力が認められる。\n１．０個\n２．１個\n３．２個\n４．３個\n５．４個\n６．５個", "source": "https://www.moj.go.jp/content/001443618.pdf", "answerSource": "https://www.moj.go.jp/content/001444175.pdf"}, {"id": "R7-keiso-26", "year": "R7", "yearLabel": "令和7年", "subject": "刑事訴訟法", "qno": 26, "haiten": 3, "type": "series", "options": 2, "answer": [1, 1, 1, 1, 2], "figure": false, "statement": "〔第26問〕（配点：３）\n次のⅠないしⅢの【見解】は、刑事訴訟法第３１９条第１項で任意にされたものでない疑いのある自白（不任意自白）を証拠とすることができないと定められている根拠に関するものである。\n【見解】に関する後記アからオまでの【記述】のうち、正しいものには１を、誤っているものには ２を選びなさい。\n【見解】 Ｉ．任意にされたものでない疑いのある自白は、黙秘権を保障するため排除されるべきとする見解 Ⅱ．任意にされたものでない疑いのある自白は、その内容が虚偽であるおそれがあり、誤判防止のため排除されるべきとする見解 Ⅲ．任意にされたものでない疑いのある自白は、違法な手続により得られた結果として排除されるべきとする見解 【記述】\nア．Ⅰの見解に対しては、黙秘権を侵害して得られた自白の証拠能力が否定されるのは黙秘権保障の内容そのものであり、黙秘権と自白法則を混同しているという批判がある。\nイ．Ⅱの見解によったとしても、不任意自白に基づき発見された物は、関連性が不任意自白によらなければ証明されない場合、証拠として許容されない。\nウ．Ⅱの見解によれば、強制、拷問又は脅迫による自白、不当に長く抑留又は拘禁された後の自白は、不任意自白の例示とみることができる。\nエ．Ⅲの見解に対しては、違法な手続により得られた自白の全てが任意にされたものでない疑いがあるとはいえないから、そのような自白が全て刑事訴訟法第３１９条第１項により排除されるとするのであれば、規定の文言上無理があるという批判がある。\nオ．Ⅲの見解によれば、取調官が偽計を用いて得た供述は、供述者の主観的な心理状態に影響を及ぼした疑いがある場合に限り、証拠能力が否定される。", "source": "https://www.moj.go.jp/content/001443618.pdf", "answerSource": "https://www.moj.go.jp/content/001444175.pdf"}];

</script>
<script>
"use strict";
const SUBJECTS=["憲法","行政法","民法","商法","民事訴訟法","刑法","刑事訴訟法"];
const KEY="tantoDeck.v1";
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const KANA=["ア","イ","ウ","エ","オ","カ","キ","ク","ケ","コ"];

let db=load();
function load(){try{const r=JSON.parse(localStorage.getItem(KEY));if(r&&r.work)return fix(r);}catch(e){}
  return {work:{},ui:{current:TANTO_SEED[0].id,flt:{subject:"",status:"",q:""},theme:"system"}};}
function fix(r){if(!r.ui)r.ui={current:TANTO_SEED[0].id,flt:{subject:"",status:"",q:""},theme:"system"};
  if(!r.ui.flt)r.ui.flt={subject:"",status:"",q:""};if(!r.work)r.work={};
  if(!TANTO_SEED.find(p=>p.id===r.ui.current))r.ui.current=TANTO_SEED[0].id;return r;}
function save(){localStorage.setItem(KEY,JSON.stringify(db));}
function P(id){return TANTO_SEED.find(p=>p.id===id);}
function cur(){return P(db.ui.current)||TANTO_SEED[0];}
function W(id){if(!db.work[id])db.work[id]={guess:null,revealed:false,memo:"",status:"",last:null};return db.work[id];}
function pname(p){return `${p.yearLabel}・${p.subject} 第${p.qno}問`;}

function applyTheme(){const t=db.ui.theme;if(t==="system")document.documentElement.removeAttribute("data-theme");else document.documentElement.setAttribute("data-theme",t);}
$("#themeBtn").onclick=()=>{const o=["system","light","dark"];db.ui.theme=o[(o.indexOf(db.ui.theme)+1)%3];applyTheme();save();};

/* ---------- question pane ---------- */
function renderQuestion(){
  const p=cur();
  $("#qTag").textContent=p.subject;
  $("#curK").textContent=`${p.yearLabel} 予備 短答`;
  $("#curN").textContent=`${p.subject} 第${p.qno}問`;
  let meta=`<span class="chip year">${p.yearLabel}</span><span class="chip subj">${p.subject}</span>`;
  if(p.haiten)meta+=`<span class="chip pt">配点 ${p.haiten}</span>`;
  meta+=`<span class="chip pt">${p.type==="series"?"正誤（ア〜オ）":p.type==="multi"?"複数選択（順不同）":(p.options+"択")}</span>`;
  $("#qMeta").innerHTML=meta;
  $("#qNo").textContent=`第${p.qno}問`;
  const fw=$("#figWarn");
  if(p.figure){fw.style.display="";fw.innerHTML=`※ この問題は図・別紙を含む可能性があります。図はテキスト化できていないので、必要に応じて <a href="${esc(p.source)}" target="_blank" rel="noopener noreferrer">公式PDF↗</a> をご確認ください。`;}
  else fw.style.display="none";
  $("#qStatement").textContent=p.statement;
  $("#qSrc").innerHTML=`出典：<a href="${esc(p.source)}" target="_blank" rel="noopener noreferrer">問題PDF↗</a> ／ <a href="${esc(p.answerSource)}" target="_blank" rel="noopener noreferrer">正解PDF↗</a>`;
}

/* ---------- answer pane ---------- */
function renderAnswer(){
  const p=cur(),w=W(p.id),host=$("#answerPane");host.innerHTML="";
  // status tag
  const stTag=$("#aStatus");const stmap={ok:["できた","ok"],vague:["曖昧","vague"],ng:["できない","ng"]};
  if(w.status&&stmap[w.status]){stTag.textContent=stmap[w.status][0];stTag.style.color="";}
  else stTag.textContent=w.revealed?"確認済":"未着手";

  host.appendChild(el(`<div class="hintcard">まず頭の中で解いてから <b>正解を表示</b>。隙間時間に1問ずつでOK。曖昧・できないは一覧で絞り込めます。</div>`));

  // 自分の解答
  const ab=document.createElement("div");ab.className="a-block";
  if(p.type==="series"||p.type==="multi"){
    ab.innerHTML=`<div class="lab">自分の判定 <span class="hint">${p.type==="series"?"ア〜オを頭で（正=1／誤=2）":"正しいものを頭で選ぶ（順不同）"}</span></div>`;
    const memoNote=document.createElement("div");memoNote.style.cssText="font-size:12px;color:var(--ink-faint)";
    memoNote.textContent="※ この型は組合せなので、頭で判定してから正解を開いてください。";
    ab.appendChild(memoNote);
  }else{
    ab.innerHTML=`<div class="lab">自分の解答 <span class="hint">1つ選ぶ</span></div>`;
    const ch=document.createElement("div");ch.className="choices";
    for(let i=1;i<=p.options;i++){const b=document.createElement("button");b.className="choice"+(w.guess===i?" picked":"");b.textContent=i;
      b.onclick=()=>{w.guess=(w.guess===i?null:i);touch();renderAnswer();};ch.appendChild(b);}
    ab.appendChild(ch);
  }
  host.appendChild(ab);

  // reveal / result
  if(!w.revealed){
    const rb=document.createElement("button");rb.className="revealbtn";rb.textContent="正解を表示";
    rb.onclick=()=>{w.revealed=true;touch();renderAnswer();};
    host.appendChild(rb);
  }else{
    host.appendChild(renderResult(p,w));
  }

  // 解説メモ
  const mb=document.createElement("div");mb.className="a-block";mb.style.marginTop="20px";
  mb.innerHTML=`<div class="lab">解説メモ <span class="hint">なぜその答えか・条文・キーワード</span></div>`;
  const t=document.createElement("textarea");t.value=w.memo||"";t.placeholder="例）◯◯条。判例は△△。ここを間違えた／覚え違い…";
  t.addEventListener("input",()=>{w.memo=t.value;touch();});mb.appendChild(t);host.appendChild(mb);

  // 定着度
  const sb=document.createElement("div");sb.className="a-block";
  sb.innerHTML=`<div class="lab">定着度 <span class="hint">一覧の絞り込みに使えます</span></div>`;
  const row=document.createElement("div");row.className="statusrow";
  [["ok","できた"],["vague","曖昧"],["ng","できない"]].forEach(([s,lab])=>{
    const b=document.createElement("button");b.className="statusbtn"+(w.status===s?" on":"");b.dataset.s=s;
    b.innerHTML=`<span class="dot"></span>${lab}`;b.onclick=()=>{w.status=(w.status===s?"":s);touch();renderAnswer();renderQuestion();};row.appendChild(b);});
  sb.appendChild(row);host.appendChild(sb);

  const sv=document.createElement("div");sv.className="saved";sv.id="svTag";host.appendChild(sv);updateSaved();
}
function renderResult(p,w){
  const box=document.createElement("div");box.className="result";
  if(p.type==="series"){
    const parts=p.answer.map((v,i)=>`<div class="s"><b>${KANA[i]||("#"+(i+1))}</b><span class="v ${v===1?'correct':'wrong'}">${v===1?"正":"誤"}</span></div>`).join("");
    box.innerHTML=`<div class="verdict">正解（ア〜オ）</div><div class="series">${parts}</div>
      <div class="ansline" style="margin-top:8px;color:var(--ink-soft);font-size:12.5px">正しい場合＝1／誤り＝2。${p.haiten?`配点 ${p.haiten}。`:""}</div>`;
  }else if(p.type==="multi"){
    box.innerHTML=`<div class="verdict">正解（順不同）</div><div class="ansline">正しいのは <b>${p.answer.join("・")}</b>（${p.answer.length}つ）${p.haiten?`　／ 配点 ${p.haiten}`:""}</div>`;
  }else{
    const correct=p.answer[0];const ok=w.guess!=null&&w.guess===correct;
    let head="";
    if(w.guess!=null)head=`<div class="verdict ${ok?"ok":"ng"}">${ok?"◎ 正解":"× 不正解"}</div>`;
    else head=`<div class="verdict">正解</div>`;
    box.innerHTML=`${head}<div class="ansline">正解は <b>${correct}</b>${w.guess!=null?`　（あなた：${w.guess}）`:""}${p.haiten?`　／ 配点 ${p.haiten}`:""}</div>`;
    // color the choice buttons
    setTimeout(()=>{document.querySelectorAll("#answerPane .choice").forEach((b,i)=>{const n=i+1;
      if(n===correct)b.classList.add("correct");else if(w.guess===n)b.classList.add("wrong");});},0);
  }
  return box;
}
function el(html){const d=document.createElement("div");d.innerHTML=html;return d.firstElementChild;}

let tmr=null;
function touch(){W(db.ui.current).last=Date.now();clearTimeout(tmr);tmr=setTimeout(()=>{save();updateSaved(true);},350);}
function updateSaved(js){const el=$("#svTag");if(!el)return;const w=W(db.ui.current);
  if(w.last){const d=new Date(w.last);el.innerHTML=(js?'<b>保存済</b> ':'')+`最終更新 ${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;}else el.textContent="";}

/* ---------- navigation ---------- */
function statusOf(id){const w=db.work[id];return w&&w.status?w.status:(w&&w.revealed?"done":"");}
function filtered(){const {subject,status,q}=db.ui.flt;const kw=(q||"").trim().toLowerCase();
  return TANTO_SEED.filter(p=>{
    if(subject&&p.subject!==subject)return false;
    if(status){const s=statusOf(p.id);
      if(status==="todo"){if(s!=="")return false;}
      else if(s!==status)return false;}
    if(kw&&!(p.statement+" "+p.subject+" 第"+p.qno+"問").toLowerCase().includes(kw))return false;
    return true;});}
function gotoRel(d){const l=filtered();if(!l.length)return;let i=l.findIndex(p=>p.id===db.ui.current);if(i<0)i=0;
  i=(i+d+l.length)%l.length;db.ui.current=l[i].id;save();renderAll();}
$("#prevBtn").onclick=()=>gotoRel(-1);$("#nextBtn").onclick=()=>gotoRel(1);

/* ---------- 一覧 ---------- */
const listDlg=$("#listDialog");
function initFilters(){
  const s=$("#fltSubject");s.innerHTML='<option value="">全科目</option>'+SUBJECTS.map(x=>`<option${db.ui.flt.subject===x?" selected":""}>${x}</option>`).join("");
  const st=$("#fltStatus");const opts=[["","全状態"],["todo","未着手"],["ng","できない"],["vague","曖昧"],["ok","できた"],["done","確認済"]];
  st.innerHTML=opts.map(([v,l])=>`<option value="${v}"${db.ui.flt.status===v?" selected":""}>${l}</option>`).join("");
  $("#fltQ").value=db.ui.flt.q||"";
  s.onchange=()=>{db.ui.flt.subject=s.value;save();renderCards();};
  st.onchange=()=>{db.ui.flt.status=st.value;save();renderCards();};
  $("#fltQ").oninput=()=>{db.ui.flt.q=$("#fltQ").value;save();renderCards();};
}
function renderCards(){const l=filtered(),g=$("#cardGrid");g.innerHTML="";$("#fltCount").textContent=`${l.length} 問`;
  l.forEach(p=>{const s=statusOf(p.id);const prev=p.statement.replace(/〔第\d+問〕（[^）]*）/,"").replace(/\s+/g," ").trim().slice(0,72);
    const c=document.createElement("button");c.className="qcard"+(p.id===db.ui.current?" cur":"");
    const stCls=(s==="ok"||s==="vague"||s==="ng")?s:"";
    c.innerHTML=`${stCls?`<span class="stat ${stCls}"></span>`:(s==="done"?'<span class="stat" style="background:var(--ink-faint)"></span>':"")}
      <div class="ct"><span class="cy">${p.yearLabel}</span><span class="cs">${p.subject}</span><span class="cno">第${p.qno}問</span></div>
      <div class="cv">${esc(prev)}</div>
      <div><span class="pilltype">${p.type==="series"?"正誤ア〜オ":p.type==="multi"?"複数選択":p.options+"択"}</span></div>`;
    c.onclick=()=>{db.ui.current=p.id;save();listDlg.close();renderAll();};g.appendChild(c);});
  if(!l.length)g.innerHTML='<p style="color:var(--ink-faint);font-size:13px">該当なし。</p>';}
$("#listBtn").onclick=$("#curBtn").onclick=()=>{initFilters();renderCards();listDlg.showModal();};

/* ---------- 傾向 ---------- */
function renderTrend(){
  const bySub={},byType={series:0,choice:0},byOpt={};
  TANTO_SEED.forEach(p=>{bySub[p.subject]=(bySub[p.subject]||0)+1;byType[p.type]++;
    if(p.type==="choice")byOpt[p.options]=(byOpt[p.options]||0)+1;});
  const max=Math.max(...Object.values(bySub));
  const bars=SUBJECTS.map(s=>`<div class="bar"><span>${s}</span><div class="track"><i style="width:${(bySub[s]||0)/max*100}%"></i></div><span class="num">${bySub[s]||0}</span></div>`).join("");
  const total=TANTO_SEED.length;
  $("#trendBody").innerHTML=`
  <p class="lead">令和7年 予備試験 短答式（法律7科目 計${total}問）を、隙間時間に俯瞰するための整理です。数をこなすより<b>「型」と「弱点科目」を掴む</b>のが狙い。</p>
  <h3>1. 科目ごとの問題数（配点の重み）</h3>
  <div class="bars">${bars}</div>
  <p>民法・商法・民訴が各15問と重く、憲法・行政法が各12問、刑法・刑訴が各13問。<b>点の稼ぎどころは民事系</b>で、時間配分もここが軸になります。</p>
  <h3>2. 出題の「型」は主に3つ</h3>
  <p>短答は知識そのものより<b>「型に慣れているか」</b>で速さが決まります。令和7年の内訳：</p>
  <table style="width:100%;border-collapse:collapse;font-size:13px;margin-bottom:12px">
   <tr><td style="padding:6px 4px"><b>単純択一（1つ選ぶ）</b></td><td style="padding:6px 4px;color:var(--ink-soft)">${byType.choice}問。5択が基本、一部は「正しいものは幾つあるか」の<b>個数型</b>（6択）。</td></tr>
   <tr><td style="padding:6px 4px"><b>正誤ア〜オ</b></td><td style="padding:6px 4px;color:var(--ink-soft)">${byType.series}問。各記述を正(1)／誤(2)で判定。部分点・4問正解型もある。</td></tr>
   <tr><td style="padding:6px 4px"><b>組合せ・語句穴埋め</b></td><td style="padding:6px 4px;color:var(--ink-soft)">会話文の（ ）に語句群を入れて正しい組合せを選ぶ型。学説対立の整理が問われる。</td></tr>
  </table>
  <p><b>個数型・組合せ型は“1つの誤りで全体が崩れる”</b>ので、消去法が効きにくい。逆に正誤ア〜オは部分的に確実な肢から詰められます。型ごとに解き方を変えるのがコツ。</p>
  <h3>3. 隙間時間の回し方</h3>
  <p>① まず<b>「できない」科目だけ</b>を一覧で絞って1問。② 頭で解いて<b>正解を表示</b>→「できた/曖昧/できない」を付ける。③ 次の隙間で<b>「曖昧・できない」だけ</b>を回す。これだけで、苦手が自然に上に溜まって消えていきます。</p>
  <p style="font-size:11.5px;color:var(--ink-faint)">※ 図・別紙を含む問題（現在 ${TANTO_SEED.filter(p=>p.figure).length} 問）は図がテキスト化できないため、公式PDFリンクを併記しています。</p>`;
}
$("#trendBtn").onclick=()=>{renderTrend();$("#trendDialog").showModal();};

/* ---------- backup ---------- */
const dataDlg=$("#dataDialog");
$("#dataBtn").onclick=()=>{$("#dataArea").value=JSON.stringify(db);dataDlg.showModal();};
$("#copyDataBtn").onclick=async()=>{try{await navigator.clipboard.writeText($("#dataArea").value);$("#copyDataBtn").textContent="コピー✓";setTimeout(()=>$("#copyDataBtn").textContent="コピー",1400);}catch(e){$("#dataArea").select();document.execCommand("copy");}};
$("#downloadBtn").onclick=async()=>{const fn=`tanto-deck_${new Date().toISOString().slice(0,10)}.json`,j=JSON.stringify(db),btn=$("#downloadBtn");
  try{const d=window.claude&&claude.use?await claude.use("downloads"):null;if(d){await d.save({filename:fn,data:j});btn.textContent="保存✓";setTimeout(()=>btn.textContent="↧ ファイル保存",1500);return;}}catch(e){if(e&&e.code==="declined")return;}
  try{const b=new Blob([j],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=fn;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);}catch(e){alert("保存不可の環境です。コピーを使ってください。");}};
$("#importBtn").onclick=()=>{try{const r=JSON.parse($("#dataArea").value);if(!r||!r.work)throw 0;if(!confirm("現在の状態を上書きします。よろしいですか？"))return;db=fix(r);save();applyTheme();dataDlg.close();renderAll();}catch(e){alert("JSONを読み取れませんでした。");}};

/* ---------- render ---------- */
function renderAll(){renderQuestion();renderAnswer();}
$("#qCount").textContent=TANTO_SEED.length;
applyTheme();renderAll();
</script>

</body>
</html>
